largos tramos.","Amarillo: hasta 1 cm y calzada siempre transitable sin afección; rojo: exclusivamente cuando cualquier vehículo ya queda inmovilizado."],"answer":2,"explanation":"El amarillo aparece cuando la calzada comienza a cubrirse, con unos 2 a 5 cm o menos si empieza a estar deslizante. El rojo describe circulación difícil con nieve que continúa, 5 cm o más, o menor espesor si nieva intensamente o afecta a largos tramos. Son descripciones operativas que contemplan excepciones al espesor, no umbrales rígidos que permitan ignorar la adherencia, intensidad o extensión.","source":{"page":144,"additionalPages":[146],"section":"8.1. Nivel amarillo; 8.2. Nivel rojo, p. 146","document":"Temario original"},"origin":"síntesis esencial","conceptIds":["T200","T205","S015","S018"]},{"id":"c266","topic":"Nevadas y coordinación","type":"convencional","question":"Con nieve o hielo, ¿qué obligación recoge el plan para camiones de MMA superior a 3.500 kg, autobuses, autobuses articulados y conjuntos de vehículos?","options":["Elegir entre arcén y carril derecho con adelantamiento permitido.","Circular por el carril derecho sin adelantar ni rebasar.","Circular por cualquier carril sin rebasar 60 km/h.","Usar el carril izquierdo para no impedir el trabajo de las quitanieves."],"answer":1,"explanation":"La regla transversal impone carril derecho y prohíbe adelantamientos y rebasamientos. También contempla baja visibilidad por niebla o viento fuerte; no sustituye otras restricciones.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["S022"]},{"id":"m02","topic":"Nevadas y coordinación","type":"convencional","options":["Mantener todos los carriles abiertos hasta que se detenga una máquina quitanieves, restringiendo después únicamente a los pesados.","Restringir el carril más a la izquierda y, si resulta necesario, prohibir temporalmente circular hasta que se limpie la calzada.","TODAS SON CORRECTAS","Reservar el carril derecho a la asistencia y mantener libres los de la izquierda para que los vehículos ligeros puedan adelantar."],"answer":1,"explanation":"El plan contempla restringir el carril más a la izquierda, con prohibición de adelantar, para quitanieves, policía y asistencia. Incluso permite prohibir temporalmente circular a todo tipo de vehículos hasta limpiar. Las otras propuestas no corresponden a esa pauta; la alternativa global es falsa.","source":{"page":145,"section":"8.2. Fase de preemergencia: medidas en autovías","document":"Temario original"},"question":"Durante la preemergencia por nevadas, ¿qué medida de circulación en autovías facilita expresamente la limpieza y el paso de vehículos de asistencia?","origin":"original","conceptIds":["S010","S024"]},{"id":"c269","topic":"Nevadas y coordinación","type":"convencional","question":"En el plan de coordinación por nevadas, ¿cuáles son los dos órganos de coordinación a nivel estatal?","options":["El CECOD y el Centro de Coordinación DGT/ATGC","El CECOP y el Comité Ejecutivo","El CECOD y el CECOP","El CENEM y el Centro Nacional de Gestión de Tráfico"],"answer":0,"explanation":"El temario establece esta regla: El CECOD y el Centro de Coordinación DGT/ATGC. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":139,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T218","S027"]},{"id":"n16","topic":"Nevadas y coordinación","type":"convencional","options":["La persona titular de la Delegación del Gobierno más afectada, con participación del Jefe Provincial de Tráfico.","La persona titular de la ATGC, con participación de las Jefaturas Provinciales y de los Centros de Gestión de Tráfico.","La persona titular de la Dirección General de Tráfico, con representación de las Delegaciones afectadas.","La persona titular de la Subsecretaría del Interior, con participación, entre otras, de la persona titular de la ATGC."],"answer":3,"explanation":"El comité estatal descrito está presidido por la Subsecretaría del Interior e incluye a la persona titular de la ATGC. La presidencia de la Delegación o Subdelegación corresponde al Comité Ejecutivo territorial; no debe trasladarse al órgano estatal.","source":{"page":139,"section":"5.1. Centro de Coordinación de Dirección (CECOD)","document":"Temario original"},"question":"En la coordinación estatal de un episodio de nevadas, ¿quién preside el Comité Estatal de Coordinación descrito en el apartado del CECOD?","origin":"original","conceptIds":["T219","S027"]},{"id":"n17","topic":"Nevadas y coordinación","type":"correcta","options":["La DGT la constituye si el episodio afecta a varias comunidades y existe un riesgo relevante para la movilidad.","Se constituye al iniciarse cualquier alerta provincial y se integra exclusivamente por DGT y los titulares de las carreteras.","Se constituye al quedar personas bloqueadas en una sola provincia y sustituye al órgano autonómico de protección civil.","La constituye la Delegación del Gobierno cuando hay aviso rojo y se integra por representantes provinciales de AEMET y ATGC."],"answer":0,"explanation":"El criterio combina afección a varias comunidades y riesgo relevante para la movilidad. La célula incluye DGT y ATGC; pueden incorporarse Carreteras y Protección Civil cuando proceda, sin sustituir las competencias propias de protección civil.","source":{"page":139,"section":"5.2. Centro de Coordinación DGT/ATGC","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Sobre la célula permanente de coordinación y seguimiento DGT/ATGC en un episodio de nevadas:","origin":"original","conceptIds":["T221","S028"]},{"id":"essNV03","topic":"Nevadas y coordinación","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. ¿Qué combinación distingue los órganos territoriales de coordinación por nevadas y la actuación del Comité Ejecutivo?","options":["Comité Ejecutivo, CECOD y PMA; el Ejecutivo está presidido por Delegación/Subdelegación y se activa únicamente al haber personas bloqueadas.","Comité Ejecutivo, CECOP y PMA; el Ejecutivo está presidido por la Jefatura Provincial de Tráfico y mantiene contacto desde la alerta.","CECOD, CECOP y Centro DGT/ATGC; el Ejecutivo está presidido por la Subsecretaría del Interior y se convoca al declararse la emergencia.","Comité Ejecutivo, CECOP y PMA; el Ejecutivo está presidido por Delegación/Subdelegación y se convoca o mantiene contacto permanente desde la preemergencia."],"answer":3,"explanation":"Los órganos territoriales son Comité Ejecutivo, Centro de Coordinación Operativa (CECOP) y Puestos de Mando Avanzado (PMA). El Ejecutivo lo preside la persona titular de Delegación o Subdelegación del Gobierno. Debe convocarse o mantenerse el contacto permanente desde la declaración efectiva de preemergencia, cuando la meteorología haga prever dificultades. El CECOD y el Centro DGT/ATGC pertenecen al nivel estatal.","source":{"page":140,"section":"6. Órganos de coordinación a nivel territorial; 6.1. Comité Ejecutivo","document":"Temario original"},"origin":"síntesis esencial","conceptIds":["S029"]},{"id":"n18","topic":"Nevadas y coordinación","type":"incorrecta","options":["Mantiene comunicaciones con el Centro Nacional de Seguimiento y Coordinación de Emergencias mientras dura la emergencia.","Está dirigido por la Jefatura Provincial de Tráfico y la Delegación del Gobierno ejerce su asistencia técnica.","La Unidad de Protección Civil asiste a la persona titular de la Delegación o Subdelegación del Gobierno en su dirección.","Mantiene las comunicaciones con los Puestos de Mando Avanzado y, cuando proceda, con las unidades de intervención."],"answer":1,"explanation":"El CECOP lo dirige la persona titular de la Delegación o Subdelegación del Gobierno, asistida por la Unidad de Protección Civil. La Jefatura Provincial de Tráfico no ocupa esa dirección; confundir su papel en las restricciones con la dirección del CECOP altera el reparto de funciones.","source":{"page":140,"section":"6.2. Centro de Coordinación Operativa (CECOP)","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto al Centro de Coordinación Operativa territorial durante una emergencia por nevadas:","origin":"original","conceptIds":["T226","S030"]},{"id":"n15","topic":"Nevadas y coordinación","type":"incorrecta","options":["Su ubicación se contempla en los protocolos de la Delegación o Subdelegación y se asocia a tramos potencialmente conflictivos.","El protocolo determina quienes han de integrarlos por razón del cargo y los recursos de comunicaciones de que han de disponer.","La representación de la ATGC debe corresponder a un oficial; la categoría de suboficial no reúne el requisito previsto.","Se integran con personal con capacidad de decisión de los organismos implicados en la respuesta al episodio."],"answer":2,"explanation":"La ATGC puede estar representada por personal de categoría de oficial o suboficial. Exigir exclusivamente oficial restringe indebidamente el requisito. El resto reproduce las previsiones sobre composición, ubicación y dotación de estos puestos.","source":{"page":140,"section":"6.3. Puestos de Mando Avanzado","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre los Puestos de Mando Avanzado previstos para episodios de nevadas:","origin":"original","conceptIds":["T227","S031"]},{"id":"n19","topic":"Nevadas y coordinación","type":"convencional","options":["Prevalece el criterio de carreteras por ser responsable de la limpieza, comunicándolo al finalizar el corte.","Se traslada la decisión al Comité Ejecutivo y se aplaza el corte hasta que este vuelva a reunirse.","El criterio de quien esté más próximo al terreno, con información inmediata a sus superiores de lo decidido.","Se mantiene el tráfico sin restricciones hasta que los tres actores formulen una decisión común por escrito."],"answer":2,"explanation":"La pauta es intentar una decisión común; si no es posible por ausencia o discrepancia, prevalece la proximidad al terreno y se informa inmediatamente a superiores. No se condiciona la actuación a una reunión ni a un acuerdo escrito previo.","source":{"page":149,"section":"10. Procedimiento específico sobre restricciones al tráfico","document":"Temario original"},"question":"Ante la necesidad de restringir el tráfico por nieve, no se logra el acuerdo entre ATGC, responsables de carreteras y CGT por discrepancia. ¿Qué criterio subsidiario recoge el plan?","origin":"original","conceptIds":["T213","T214","S032"]},{"id":"n20","topic":"Nevadas y coordinación","type":"correcta","options":["La limpieza del primer tramo obliga a levantarlo; las restricciones de otros tramos no pueden condicionar esa reapertura.","El titular reabre el tramo limpio tras avisar a la ATGC, y el CGT coordina únicamente la información al ciudadano.","La ATGC reabre el tramo limpio de forma automática y propone después al CGT medidas de apoyo al otro tramo.","Se eleva propuesta consensuada al CGT, coordinado con JPT, que puede mantener el corte por la situación del itinerario."],"answer":3,"explanation":"La desaparición del riesgo local permite proponer el levantamiento, pero debe considerarse el resto del itinerario. La propuesta de carreteras y agentes se eleva al responsable CGT coordinado con JPT; el CGT puede mantener una restricción como apoyo a otras aún necesarias.","source":{"page":161,"section":"Anexo VII. MOV 2025/10: 11. Procedimientos específicos sobre restricciones al tráfico","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Ha desaparecido el riesgo en un tramo cortado por nieve, pero otro tramo del mismo itinerario sigue restringido. Respecto al levantamiento del corte:","origin":"original","conceptIds":["T216","S033"]},{"id":"c300","topic":"Nevadas y coordinación","type":"convencional","question":"En la coordinación territorial por nevadas, ¿quién dispone los controles para restringir pesados, exigir cadenas o desviar el tráfico según el Comité Ejecutivo?","options":["La Comandancia de la Guardia Civil","El Sector de Tráfico","La Unidad de Protección Civil","La Jefatura Provincial de Tráfico"],"answer":3,"explanation":"El temario establece esta regla: La Jefatura Provincial de Tráfico. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"n13","topic":"Nevadas y coordinación","type":"convencional","options":["Ocupar desde los más próximos al tramo; levantar conforme al CGT, priorizando el mayor tiempo de estacionamiento.","Ocupar primero los más alejados y dar salida prioritariamente a los vehículos que hayan llegado más recientemente.","Ocupar primero los más próximos y dar salida prioritariamente a los vehículos de mayor masa, con independencia de su espera.","Ocupar primero los más alejados y dar salida prioritariamente a quienes lleven más tiempo, sin atender a directrices del CGT."],"answer":0,"explanation":"El llenado es progresivo y escalonado, empezando por los estacionamientos más próximos al tramo restringido y coordinando con el Subsector limítrofe. El levantamiento sigue las directrices del CGT y prioriza por tiempo de espera, no por masa ni por orden de llegada inverso.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"question":"En preemergencia se dispone de varios estacionamientos sucesivos antes de un tramo restringido. ¿Qué combinación respeta la pauta para ocuparlos y para levantar posteriormente las restricciones?","origin":"original","conceptIds":["S010","S102"]},{"id":"n12","topic":"Nevadas y coordinación","type":"incorrecta","options":["Los convoyes específicos de pesados se organizan en momentos de baja intensidad circulatoria después de limpiar la calzada.","La precedencia de quitanieves se contempla tanto para ligeros como para pesados si continúa nevando intensamente o el tramo es largo.","Se prevé dar paso sin demora a vehículos ligeros una vez limpia la calzada, con quitanieves si sigue nevando intensamente o el tramo es largo.","Los convoyes de pesados han de ir precedidos de quitanieves aunque haya dejado de nevar y el tramo limpio sea corto."],"answer":3,"explanation":"La precedencia de quitanieves no se formula como exigencia incondicional: se vincula a que continúe nevando intensamente o a que el tramo sea largo. Para los pesados también se exige elegir momentos de baja circulación. No hay que convertir una condición operativa en una obligación universal.","source":{"page":154,"section":"Anexo V. Principios de actuación básicos: puntos 2 y 3","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Tras limpiar la calzada durante un episodio de nevadas, los principios básicos prevén aperturas a intervalos mediante convoyes. Respecto a estas aperturas:","origin":"original","conceptIds":["S103","S104"]},{"id":"snew22","topic":"Nevadas y coordinación","type":"convencional","options":["Guiarlos para regular la velocidad, precedidos de quitanieves si fuera necesario.","Cerrar el convoy sin posibilidad de guiarlo, porque la regulación de velocidad corresponde solo a conservación.","Acompañarlo a una velocidad fija universal sin valorar el estado del tramo.","Sustituir siempre a las quitanieves, aunque la calzada todavía necesite limpieza."],"answer":0,"explanation":"El apartado de embolsamientos prevé convoyes ordenados de salida guiados por vehículos ATGC para regular la velocidad y precedidos, si es necesario, por una quitanieves. No fija una cifra universal de máquinas ni elimina su necesidad.","source":{"page":150,"section":"11. Embolsamientos: organización de convoyes de salida","document":"Temario original"},"conceptIds":["S103"],"question":"Al organizar convoyes ordenados de salida de un embolsamiento por nieve, ¿qué función se prevé para los vehículos de la ATGC?","origin":"ampliación"},{"id":"g02","topic":"Nevadas y coordinación","type":"correcta","options":["Solo la afirmación I es correcta.","Solo la afirmación II es correcta.","Solo la afirmación III es correcta.","TODAS SON CORRECTAS"],"answer":3,"explanation":"Las tres afirmaciones figuran en el apartado de LINCE. La grabación no espera al umbral de más de 30 minutos de la novedad SIGO. Al ser verdaderas las tres, ninguna respuesta que diga «solo» una de ellas es válida.","source":{"page":151,"section":"12.1. Localizador de Incidencias en las Carreteras de España","document":"Temario original"},"origin":"ampliación","question":"ELIGE LA OPCIÓN CORRECTA. Sobre LINCE durante una nevada: I) El COTA graba inmediatamente el suceso en coordinación con el CGT. II) Se incorporan localización, vehículos por tipología y personas en bloqueos. III) También se incluye información de unidades GC ajenas a la ATGC sobre el estado de la red. ¿Qué valoración conjunta es válida?","conceptIds":[]},{"id":"n23","topic":"Nevadas y coordinación","type":"correcta","options":["En el embolsamiento, ubicación y pesados; en el bloqueo, ubicación y ligeros, completando personas en el parte periódico SIGO.","En ambos casos, ubicación y personas; la tipología de vehículos se omite si ya figura el número total de afectados.","En ambos, ubicación, vehículos por tipo y personas; en embolsamientos, pesados, ligeros y personas en observaciones.","En ambos casos, ubicación y total de vehículos; el número de personas se registra únicamente cuando ya se ha solicitado auxilio."],"answer":2,"explanation":"La localización y el total de vehículos no bastan: se exige tipología y número de personas tanto para embolsados como para bloqueados. En el embolsamiento se precisa además consignar pesados, ligeros y personas en observaciones, sin esperar una solicitud de auxilio.","source":{"page":151,"section":"12.1. Localizador de Incidencias en las Carreteras de España (LINCE)","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. El COTA debe registrar en LINCE un embolsamiento causado por nieve y, en otro punto, vehículos bloqueados en calzada. ¿Qué información exige el plan?","origin":"original","conceptIds":["T230","S037"]},{"id":"n22","topic":"Nevadas y coordinación","type":"convencional","options":["Los COTA esperan al parte diario más próximo, porque todavía no se ha cumplido una hora de restricción.","Los COTA se coordinan para una única novedad a COTA Central y a su respectiva Comandancia.","Cada COTA remite una novedad separada a COTA Central para que este suprima después las duplicidades.","La comunicación se dirige solo al CGT, que informa a las Comandancias cuando concluye la restricción."],"answer":1,"explanation":"La duración prevista supera treinta minutos en una carretera del anexo I, por lo que procede la novedad directa a COTA Central y a la Comandancia. Si afecta a varios Subsectores, deben coordinar el envío de una única novedad; no se espera al parte periódico.","source":{"page":151,"section":"12.2. Novedades SIGO","document":"Temario original"},"question":"Una restricción por nieve en una carretera del anexo I previsiblemente durará 45 minutos y afecta a varios Subsectores. ¿Qué comunicación inicial por SIGO establece el plan?","origin":"original","conceptIds":["T231","T232","S038"]},{"id":"essNV04","topic":"Nevadas y coordinación","type":"convencional","question":"Mientras continúe una restricción por nieve y salvo orden distinta, ¿qué horarios límite distinguen los dos escalones de los partes periódicos por SIGO?","options":["COTA afectado a COTA Central: antes de 07:15, 15:15 y 23:15; COTA Central a la Sala: antes de 07:30, 15:30 y 23:30.","COTA afectado a COTA Central: antes de 07:00, 15:00 y 23:00; COTA Central a la Sala: antes de 07:15, 15:15 y 23:15.","COTA afectado a COTA Central: antes de 06:45, 14:45 y 22:45; COTA Central a la Sala: antes de 07:00, 15:00 y 23:00.","COTA afectado y COTA Central: ambos antes de 07:00, 15:00 y 23:00, mediante remisiones simultáneas a la Sala."],"answer":1,"explanation":"El COTA afectado remite a COTA Central antes de 07:00, 15:00 y 23:00, hasta la normalización salvo disposición contraria del Mando de la Agrupación. COTA Central remite posteriormente las novedades de interés a la Sala de Operaciones y Servicios, siempre antes de 07:15, 15:15 y 23:15. Los horarios de ambos escalones no son intercambiables.","source":{"page":151,"section":"12.2. Novedades SIGO: partes periódicos y remisión a Sala de Operaciones y Servicios","document":"Temario original"},"origin":"síntesis esencial","conceptIds":["T233","S039"]},{"id":"n14","topic":"Nevadas y coordinación","type":"correcta","options":["Los medios de la AGE se dedican a despejar la calzada; la atención a ocupantes se limita a su traslado a un alojamiento.","Se ponen a disposición del órgano autonómico competente sin desatender casos urgentes mientras se activa el plan.","Los medios se ponen a disposición del titular de la carretera y el traslado hospitalario se realiza solo después de reabrir el tramo.","La asistencia se aplaza hasta la activación formal del plan territorial, aunque ya se hayan identificado casos urgentes."],"answer":1,"explanation":"La AGE pone los medios de asistencia a disposición del órgano autonómico competente en protección civil, pero ello no impide atender casos urgentes mientras se activa el plan territorial. La atención puede incluir bebidas, alimentos, abrigo, alojamiento y hospital si hay enfermedad.","source":{"page":146,"section":"8.3. Fase de emergencia","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Se ha alcanzado la emergencia por personas bloqueadas en sus vehículos. Respecto a los medios de la Administración General del Estado y las primeras atenciones:","origin":"original","conceptIds":["S011"]}];
const KEY = 'procedimiento-servicios-esencial-v1';
const SCHEMA = 3;
const byId = new Map(BANK.map(q=>[q.id,q]));
const $ = id=>document.getElementById(id);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const letters = ['A','B','C','D'];
const now = ()=>new Date().toISOString();
const allTopics = [...new Set(BANK.map(q=>q.topic))];
let storageOK = true;
let state = {schema:SCHEMA,bag:{},attempt:null,settings:{topics:allTopics.slice(),quantity:BANK.length,shuffleQuestions:true,shuffleAnswers:true}};
let view = 'home';
let resultFilter = 'all';
function shuffled(items,random=Math.random){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeAttempt(ids,settings,random=Math.random){const selected=settings.shuffleQuestions?shuffled(ids,random):ids.slice();return {id:Date.now().toString(36)+'-'+Math.floor(random()*1e8).toString(36),started:now(),finished:null,completed:false,index:0,mode:settings.mode||'general',items:selected.map(id=>({id,order:settings.shuffleAnswers?shuffled([0,1,2,3],random):[0,1,2,3],selected:null})),settings:{shuffleQuestions:!!settings.shuffleQuestions,shuffleAnswers:!!settings.shuffleAnswers}};}
function totals(attempt){const r={total:attempt.items.length,correct:0,wrong:0,unanswered:0};for(const i of attempt.items){if(i.selected===null)r.unanswered++;else if(i.selected===byId.get(i.id).answer)r.correct++;else r.wrong++;}r.score=r.total?r.correct/r.total*10:0;r.passed=r.score>=5;return r;}
function registerAnswer(attempt,bag,index,answer,date=now()){const item=attempt.items[index];if(!item||attempt.completed||item.selected!==null||!Number.isInteger(answer)||answer<0||answer>3)return false;item.selected=answer;if(answer!==byId.get(item.id).answer){const old=bag[item.id];bag[item.id]={count:(old?.count||0)+1,first:old?.first||date,last:date};}return true;}
function validAttempt(a){if(!a||!Array.isArray(a.items)||!a.items.length||typeof a.completed!=='boolean')return null;const seen=new Set();for(const i of a.items){if(!byId.has(i.id)||seen.has(i.id)||!Array.isArray(i.order)||i.order.length!==4||[...i.order].sort().join()!=='0,1,2,3'||!(i.selected===null||(Number.isInteger(i.selected)&&i.selected>=0&&i.selected<=3)))return null;seen.add(i.id);}return {...a,index:Math.min(Math.max(Number.isInteger(a.index)?a.index:0,0),a.items.length-1)};}
function cleanBag(b){const result={};if(b&&typeof b==='object'&&!Array.isArray(b)){for(const [id,e] of Object.entries(b)){if(byId.has(id)&&e&&Number.isSafeInteger(e.count)&&e.count>0&&typeof e.first==='string'&&Number.isFinite(Date.parse(e.first))&&typeof e.last==='string'&&Number.isFinite(Date.parse(e.last)))result[id]={count:e.count,first:e.first,last:e.last};}}return result;}
function mergeBags(a,b){const out={...a};for(const [id,e] of Object.entries(b)){const old=out[id];out[id]=old?{count:Math.max(old.count,e.count),first:old.first<e.first?old.first:e.first,last:old.last>e.last?old.last:e.last}:{...e};}return out;}
function warnStorage(){storageOK=false;$('storage-warning').textContent='El navegador no permite guardar aquí. Puedes seguir practicando, pero debes descargar una copia de seguridad antes de cerrar para conservar la bolsa y el intento.';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){warnStorage();return false;}}
function restore(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const data=JSON.parse(raw);if(data.schema!==SCHEMA)return;state.bag=cleanBag(data.bag);state.attempt=validAttempt(data.attempt);if(data.settings&&typeof data.settings==='object'){state.settings={topics:Array.isArray(data.settings.topics)?data.settings.topics.filter(t=>allTopics.includes(t)):allTopics.slice(),quantity:Math.max(1,Math.min(BANK.length,Number(data.settings.quantity)||BANK.length)),shuffleQuestions:data.settings.shuffleQuestions!==false,shuffleAnswers:data.settings.shuffleAnswers!==false};}}catch(e){warnStorage();}}
function message(text){$('message').textContent=text;}
function bagIds(){return Object.keys(state.bag).filter(id=>byId.has(id));}
function timeClock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('es-ES',{hour12:false});$('clock').dateTime=d.toISOString();$('clock-date').textContent=d.toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short'});}
function render(){if(view==='quiz'&&state.attempt)renderQuiz();else if(view==='results'&&state.attempt?.completed)renderResults();else renderHome();}
function settingsHTML(){return `<fieldset><legend>Contenidos del ejercicio</legend><label class="check"><input type="checkbox" id="topics-all" ${state.settings.topics.length===allTopics.length?'checked':''}><span>Todos los temas</span></label><div class="topics">${allTopics.map((t,i)=>`<label class="check"><input type="checkbox" name="topic" value="${i}" ${state.settings.topics.includes(t)?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></fieldset><div class="field"><label for="quantity">Número de preguntas</label><input id="quantity" type="number" min="1" max="${BANK.length}" step="1" value="${state.settings.quantity}"><p id="available" class="hint"></p></div><fieldset class="mb0"><legend>Orden del ejercicio</legend><label class="check"><input id="shuffle-questions" type="checkbox" ${state.settings.shuffleQuestions?'checked':''}><span><strong>BARAJAR LAS PREGUNTAS</strong><span class="hint">Cambia el orden de las preguntas en cada intento.</span></span></label><label class="check"><input id="shuffle-answers" type="checkbox" ${state.settings.shuffleAnswers?'checked':''}><span><strong>BARAJAR LAS RESPUESTAS</strong><span class="hint">Cambia el orden de A, B, C y D de forma independiente.</span></span></label></fieldset>`;}
function readSettings(){state.settings.topics=[...document.querySelectorAll('input[name=topic]:checked')].map(el=>allTopics[Number(el.value)]);state.settings.quantity=Math.max(1,Math.floor(Number($('quantity').value)||1));state.settings.shuffleQuestions=$('shuffle-questions').checked;state.settings.shuffleAnswers=$('shuffle-answers').checked;save();}
function available(){const n=BANK.filter(q=>state.settings.topics.includes(q.topic)).length;$('available').textContent=`${n} preguntas disponibles en los temas seleccionados.`;$('quantity').max=Math.max(1,n);$('start').disabled=n===0;if(state.settings.quantity>n&&n){state.settings.quantity=n;$('quantity').value=n;}return n;}
function renderHome(){view='home';const bag=bagIds();const current=state.attempt;const active=current&&!current.completed;const last=current?.completed?totals(current):null;$('app').innerHTML=`<section class="intro"><p class="eyebrow">Versión esencial · 150 preguntas</p><h1>Las ideas principales,<br>con menos repetición.</h1><p>Selección reducida de las 488 preguntas del quiz completo. Agrupa conceptos relacionados y conserva las diferencias importantes para el examen. Cada respuesta se corrige al momento, con explicación y referencia al manual.</p></section><div class="note"><strong>Material de referencia.</strong> Las preguntas se contrastan con <em>Procedimiento y Ejecución de los Servicios</em>. Las acotaciones del profesor delimitan el contenido de estudio. La página y el apartado de cada explicación permiten localizarlo en el manual. En las alternativas «Todas…» se valoran las otras tres opciones de esa pregunta; cuando se enumeran afirmaciones I, II y III, se valoran esas afirmaciones.</div><div class="grid"><section class="card"><h2>Configura tu práctica</h2><form id="setup">${settingsHTML()}<div class="divider"></div><button class="primary full" id="start" type="submit">Comenzar práctica</button><p class="selected-info">${BANK.length} preguntas en total · 4 opciones · Sin penalización por error</p></form></section><aside><section class="card"><p class="eyebrow">Tu repaso acumulado</p><div class="big-number bag-number">${bag.length}</div><h2>Bolsa de falladas</h2><p class="muted">Guarda las preguntas que fallas en todos tus intentos. Acertarlas después no las elimina.</p><div class="stack"><button class="primary" id="start-bag" ${bag.length?'':'disabled'}>Practicar la bolsa (${bag.length})</button><button id="manage-bag">Ver y gestionar bolsa</button></div><p class="hint">Se aplican los dos ajustes de barajado. Se incluyen todas las preguntas guardadas.</p></section><section class="card"><h2>${active?'Tienes un intento abierto':'Tu progreso'}</h2>${active?`<p class="muted">${totals(current).correct+totals(current).wrong} de ${current.items.length} preguntas contestadas. Retoma el ejercicio donde lo dejaste.</p><button id="resume" class="full">Continuar intento</button>`:last?`<p class="muted">Último intento: <strong style="color:var(--text)">${last.score.toFixed(2).replace('.',',')} / 10</strong> · ${last.correct} aciertos de ${last.total}.</p><button id="last-result" class="full">Ver último resultado</button>`:`<p class="muted">El intento se guarda mientras practicas. Podrás continuarlo al abrir este mismo archivo y navegador.</p>`}<div class="divider"></div><h3>Conservar tus datos</h3><p class="hint">La bolsa se guarda en este navegador. Descarga una copia si vas a cambiar de archivo, carpeta, equipo o navegador. Esta versión tiene su propio progreso. Puedes importar una copia del quiz completo para recuperar las falladas cuyas preguntas se conservan aquí.</p><div class="actions"><button id="export" class="small">Descargar copia</button><button id="import" class="small">Importar copia</button></div></section></aside></div>`;$('setup').onsubmit=e=>{e.preventDefault();readSettings();const ids=BANK.filter(q=>state.settings.topics.includes(q.topic)).map(q=>q.id);if(!ids.length)return;if(active&&!confirm('Comenzar una práctica nueva sustituirá el intento que tienes abierto. La bolsa de falladas se conservará. ¿Continuar?'))return;const selected=state.settings.shuffleQuestions?shuffled(ids):ids;begin(selected.slice(0,state.settings.quantity),'general',false);};$('topics-all').onchange=e=>{document.querySelectorAll('input[name=topic]').forEach(el=>el.checked=e.target.checked);readSettings();available();};document.querySelectorAll('input[name=topic]').forEach(el=>el.onchange=()=>{readSettings();$('topics-all').checked=state.settings.topics.length===allTopics.length;available();});['quantity','shuffle-questions','shuffle-answers'].forEach(id=>$(id).onchange=()=>{readSettings();available();});$('start-bag').onclick=()=>{readSettings();if(active&&!confirm('Practicar la bolsa sustituirá el intento que tienes abierto. ¿Continuar?'))return;begin(bagIds(),'bolsa');};$('manage-bag').onclick=openBag;$('export').onclick=exportBackup;$('import').onclick=()=>$('backup-input').click();if(active)$('resume').onclick=()=>{view='quiz';message('');render();scrollTop();};if(last)$('last-result').onclick=()=>{view='results';render();scrollTop();};available();}
function begin(ids,mode='general',doShuffle=true){if(!ids.length){message('No hay preguntas disponibles para este ejercicio.');return;}const settings={...state.settings,mode,shuffleQuestions:doShuffle&&state.settings.shuffleQuestions};state.attempt=makeAttempt(ids,settings);save();view='quiz';resultFilter='all';message('');render();scrollTop();}
function sourceHTML(q){return `<strong>Localización:</strong> <em>${esc(q.source.document||'Procedimiento y Ejecución de los Servicios')}</em>, página ${esc(q.source.page)}, ${esc(q.source.section)}.`;}
function feedbackHTML(item,q){if(item.selected===null)return '';const correct=item.selected===q.answer;const letter=letters[item.order.indexOf(q.answer)];return `<section id="feedback" class="feedback ${correct?'success':'error'}" role="status" aria-live="polite"><h3>${correct?'Respuesta correcta':'Respuesta incorrecta'}</h3><p><strong>La respuesta válida es ${letter}.</strong> ${esc(q.explanation)}</p><p class="source">${sourceHTML(q)}</p>${!correct?'<p class="hint mb0 mt16">Esta pregunta se ha incorporado a tu bolsa de falladas.</p>':''}</section>`;}
function renderQuiz(){const a=state.attempt;const item=a.items[a.index];const q=byId.get(item.id);const r=totals(a);const answered=r.correct+r.wrong;$('app').innerHTML=`<div class="quizhead"><div><p class="eyebrow">${a.completed?'Revisión del intento':a.mode==='bolsa'?'Repaso de la bolsa':a.mode==='falladas'?'Repaso de preguntas falladas':'Sesión de estudio'}</p><h1 class="quiz-running-title">Paso a paso, concepto a concepto.</h1></div><button class="small" id="home">Inicio</button></div><div class="progress-label"><strong>${answered} de ${r.total}</strong> contestadas <span aria-hidden="true">·</span> ${r.correct} aciertos <span aria-hidden="true">·</span> ${r.wrong} errores</div><div class="progressbar" role="progressbar" aria-label="Preguntas contestadas" aria-valuemin="0" aria-valuemax="${r.total}" aria-valuenow="${answered}"><span style="width:${answered/r.total*100}%"></span></div><div class="quizlayout mt16"><section class="card question-card"><div class="badges"><span class="badge practice">${a.completed?'Revisión':'Modo práctica'}</span><span class="badge">${esc(q.topic)}</span><span class="badge">${esc(q.type||'Pregunta')}</span></div><h2 class="question" id="question-title" tabindex="-1">${esc(q.question)}</h2><div class="answers" role="group" aria-labelledby="question-title">${item.order.map((original,display)=>`<button type="button" class="answer ${item.selected!==null?(original===q.answer?'correct':'')+(original===item.selected?' chosen'+(original!==q.answer?' wrong':''):''):''}" data-answer="${original}" ${item.selected!==null||a.completed?'disabled':''}><span class="letter" aria-hidden="true">${letters[display]}</span><span><span class="sr-only">Opción ${letters[display]}: </span>${esc(q.options[original])}</span>${item.selected!==null&&(original===q.answer||original===item.selected)?`<span class="answer-result" aria-label="${original===q.answer?'Respuesta válida':'Respuesta seleccionada, incorrecta'}">${original===q.answer?'✓':'×'}</span>`:''}</button>`).join('')}</div>${feedbackHTML(item,q)}${item.selected===null?`<p class="read-status">${a.completed?'Esta pregunta quedó sin responder.':'Selecciona una opción para ver la corrección y la explicación.'}</p>`:''}<div class="navigation"><button id="prev" ${a.index===0?'disabled':''}>← Anterior</button><span class="position">${a.index+1} / ${r.total}</span><button id="next">${a.index===r.total-1?'Ver resultado':'Siguiente →'}</button></div></section><aside class="card" id="nav-panel"><h3>Preguntas · ${a.index+1} de ${r.total}</h3><div class="question-nav">${a.items.map((i,n)=>`<button title="Pregunta ${n+1}: ${i.selected===null?'sin responder':i.selected===byId.get(i.id).answer?'correcta':'fallada'}" aria-label="Ir a la pregunta ${n+1}${n===a.index?', actual':''}" ${n===a.index?'aria-current="step"':''} class="${n===a.index?'current ':''}${i.selected===null?'':i.selected===byId.get(i.id).answer?'hit':'miss'}" data-index="${n}">${n+1}</button>`).join('')}</div><p class="navlegend"><span style="background:var(--green)"></span>Acierto &nbsp; <span style="background:var(--red)"></span>Error<br>Sin color: pendiente de responder.</p><div class="divider"></div><p class="hint">Puedes volver a cualquier pregunta. Las respuestas ya corregidas quedan fijadas en este intento.</p><button id="finish" class="${a.completed?'':'primary '}full">${a.completed?'Volver al resultado':'Terminar y ver resultado'}</button><button id="export" class="text-button full mt16">Descargar copia de seguridad</button></aside></div>`;document.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{if(registerAnswer(a,state.bag,a.index,Number(btn.dataset.answer))){save();renderQuiz();}});$('prev').onclick=()=>go(a.index-1);$('next').onclick=()=>a.index===r.total-1?$('finish').click():go(a.index+1);document.querySelectorAll('[data-index]').forEach(btn=>btn.onclick=()=>go(Number(btn.dataset.index)));$('home').onclick=()=>{view='home';message('');render();scrollTop();};$('finish').onclick=()=>{if(!a.completed&&r.unanswered&&!confirm(`Quedan ${r.unanswered} preguntas sin responder. Contarán como sin responder y no sumarán aciertos. ¿Terminar el intento?`))return;a.completed=true;a.finished=a.finished||now();save();view='results';resultFilter='all';render();scrollTop();};$('export').onclick=exportBackup;}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function go(index){const a=state.attempt;if(index<0||index>=a.items.length)return;a.index=index;save();renderQuiz();$('question-title').focus({preventScroll:true});scrollTop();}
function renderResults(){const a=state.attempt;const r=totals(a);const wrong=a.items.filter(i=>i.selected!==null&&i.selected!==byId.get(i.id).answer).map(i=>i.id);const shown=a.items.map((i,n)=>({item:i,index:n})).filter(({item:i})=>resultFilter==='all'||(resultFilter==='wrong'?i.selected!==null&&i.selected!==byId.get(i.id).answer:i.selected===null));$('app').innerHTML=`<div class="summary"><p class="eyebrow">Práctica completada</p><h1>Tu resultado.</h1><section class="card"><div class="score"><div class="score-value">${r.score.toFixed(2).replace('.',',')}<small> / 10</small></div><div class="pill ${r.passed?'':'fail'}">${r.passed?'APTO':'NO APTO'} · Criterio: 5 / 10</div></div><div class="stats"><div class="stat"><b style="color:var(--green)">${r.correct}</b><span>Aciertos</span></div><div class="stat"><b style="color:var(--red)">${r.wrong}</b><span>Errores</span></div><div class="stat"><b>${r.unanswered}</b><span>Sin responder</span></div></div><p class="muted">${r.total} preguntas · ${Math.round(r.correct/r.total*100)} % de aciertos. La nota es aciertos ÷ total × 10. Los errores no restan puntos.</p><div class="actions"><button id="repeat-wrong" class="primary" ${wrong.length?'':'disabled'}>Repetir solo las falladas (${wrong.length})</button><button id="new-practice">Configurar otro ejercicio</button></div><p class="hint">La bolsa mantiene ${bagIds().length} preguntas diferentes falladas entre todos tus intentos. Solo se eliminan cuando tú lo decides.</p><div class="divider"></div><div class="actions"><button id="manage-bag" class="small">Ver bolsa de falladas</button><button id="export" class="small">Descargar copia</button></div></section><h2 class="result-title">Revisa las preguntas</h2><div class="actions"><label for="result-filter" class="muted">Mostrar</label><select id="result-filter"><option value="all" ${resultFilter==='all'?'selected':''}>Todas (${r.total})</option><option value="wrong" ${resultFilter==='wrong'?'selected':''}>Falladas (${r.wrong})</option><option value="unanswered" ${resultFilter==='unanswered'?'selected':''}>Sin responder (${r.unanswered})</option></select></div><div class="result-list">${shown.map(({item:i,index:n})=>{const q=byId.get(i.id);return `<div class="review-row"><span class="status-dot ${i.selected===null?'':i.selected===q.answer?'hit':'miss'}" aria-hidden="true"></span><div class="content"><p>${n+1}. ${esc(q.question)}</p><small>${esc(q.topic)} · ${i.selected===null?'Sin responder':i.selected===q.answer?'Acierto':'Error'}</small></div><button class="small" data-review="${n}">Revisar</button></div>`;}).join('')||'<p class="empty">No hay preguntas en este grupo.</p>'}</div></div>`;$('repeat-wrong').onclick=()=>begin(wrong,'falladas');$('new-practice').onclick=()=>{view='home';render();scrollTop();};$('manage-bag').onclick=openBag;$('export').onclick=exportBackup;$('result-filter').onchange=e=>{resultFilter=e.target.value;renderResults();};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{view='quiz';state.attempt.index=Number(b.dataset.review);save();render();scrollTop();});}
function openBag(){renderBag();$('bag-dialog').showModal();}
function renderBag(){const ids=bagIds().sort((a,b)=>state.bag[b].last.localeCompare(state.bag[a].last));$('bag-dialog').innerHTML=`<div class="modalhead"><div><p class="eyebrow">Repaso acumulado</p><h2 id="bag-title">Bolsa de falladas (${ids.length})</h2></div><button id="close-bag" class="small" aria-label="Cerrar bolsa">Cerrar</button></div><p class="muted mt16">Cada pregunta se conserva aunque la aciertes después. Puedes retirarla cuando consideres que ya la dominas.</p><div class="bag-list">${ids.map(id=>{const q=byId.get(id),e=state.bag[id];return `<div class="bag-item"><div class="content"><p>${esc(q.question)}</p><small>${esc(q.topic)} · ${e.count} ${e.count===1?'error acumulado':'errores acumulados'} · Último: ${esc(new Date(e.last).toLocaleDateString('es-ES'))}</small></div><button class="small danger" data-remove="${esc(id)}" aria-label="Retirar de la bolsa: ${esc(q.question)}">Retirar</button></div>`;}).join('')||'<p class="empty">Tu bolsa está vacía. Las preguntas que falles aparecerán aquí.</p>'}</div><div class="divider"></div><div class="actions"><button id="practice-bag-modal" class="primary" ${ids.length?'':'disabled'}>Practicar toda la bolsa</button><button id="clear-bag" class="danger" ${ids.length?'':'disabled'}>Vaciar bolsa</button><button id="export-bag" class="small">Descargar copia</button></div><p class="hint mb0 mt16">Retirar una pregunta solo afecta a la bolsa. Si vuelves a fallarla, se guardará de nuevo.</p>`;$('close-bag').onclick=()=>$('bag-dialog').close();document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete state.bag[b.dataset.remove];save();renderBag();render();});$('clear-bag').onclick=()=>{if(!confirm(`Vas a eliminar las ${ids.length} preguntas de la bolsa y su recuento de errores. Esta acción no se puede deshacer sin una copia de seguridad. ¿Vaciar la bolsa?`))return;state.bag={};save();renderBag();render();};$('export-bag').onclick=exportBackup;$('practice-bag-modal').onclick=()=>{if(state.attempt&&!state.attempt.completed&&!confirm('Practicar la bolsa sustituirá el intento abierto. ¿Continuar?'))return;$('bag-dialog').close();begin(bagIds(),'bolsa');};}
function exportBackup(){const data={format:'quiz-procedimiento-servicios',schema:SCHEMA,exported:now(),questionCount:BANK.length,bag:state.bag,attempt:state.attempt,settings:state.settings};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='copia-quiz-esencial-procedimientos-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('Copia preparada para descargar. Consérvala para recuperar tu bolsa y el intento.');}
async function importBackup(file){if(!file)return;try{if(file.size>10*1024*1024)throw new Error('El archivo es demasiado grande.');const data=JSON.parse(await file.text());if(data.format!=='quiz-procedimiento-servicios'||data.schema!==SCHEMA)throw new Error('El archivo no es una copia compatible de este quiz.');const imported=cleanBag(data.bag);const ids=Object.keys(imported);state.bag=mergeBags(state.bag,imported);const incoming=validAttempt(data.attempt);let attemptNote='';if(incoming&&(!state.attempt||state.attempt.completed)){state.attempt=incoming;attemptNote=incoming.completed?' Se ha recuperado el resultado del intento.':' Se ha recuperado el intento abierto.';}else if(incoming){attemptNote=' Se conserva el intento abierto actual.';}save();view='home';render();message(`Copia importada. La bolsa contiene ${bagIds().length} preguntas. Los recuentos coincidentes se conservan sin duplicarlos.${attemptNote}${data.bag&&Object.keys(data.bag).length>ids.length?' Se han omitido referencias que no pertenecen a este banco.':''}`);scrollTop();}catch(e){message('No se ha podido importar la copia: '+(e.message||'archivo no válido'));}finally{$('backup-input').value='';}}
$('backup-input').addEventListener('change',e=>importBackup(e.target.files[0]));
$('bag-dialog').addEventListener('click',e=>{if(e.target===$('bag-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('bag-dialog').close();}});
window.__quizEngine={shuffled,makeAttempt,totals,registerAnswer,validAttempt,cleanBag,mergeBags,getState:()=>state,byId};
restore();timeClock();setInterval(timeClock,1000);render();
</script>
</body>
