:flex;flex-direction:column;gap:10px;margin-top:20px}.review-row{display:flex;align-items:center;gap:12px;background:#0d1929;border:1px solid var(--line);padding:13px;border-radius:10px}.review-row .content{flex:1;min-width:0}.review-row p{margin:0;font-size:14px}.review-row small{color:var(--muted);font-size:12px}.status-dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;background:#74839b}.status-dot.hit{background:var(--green)}.status-dot.miss{background:var(--red)}details{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-top:20px}summary{cursor:pointer;font-weight:700}footer{border-top:1px solid #30435b80;padding:22px 0 26px;color:var(--muted);font-size:12px}.footerline{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.bag-list{max-height:450px;overflow:auto;padding-right:4px}.bag-item{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:15px;align-items:flex-start}.bag-item .content{flex:1}.bag-item p{margin:0 0 4px;font-size:14px}.bag-item small{color:var(--muted);font-size:12px}.modal{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);max-width:750px;width:calc(100% - 28px);padding:27px;box-shadow:0 20px 90px #000b}.modal::backdrop{background:#020812c9;backdrop-filter:blur(4px)}.modalhead{display:flex;gap:18px;justify-content:space-between;align-items:start}.modalhead h2{margin:0}.empty{color:var(--muted);text-align:center;padding:30px 10px}a{color:var(--accent)}[hidden]{display:none!important}.sr-only{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}.mb0{margin-bottom:0}.mt16{margin-top:16px}.result-title{margin:24px 0 12px}.selected-info{font-size:13px;color:var(--muted);margin:14px 0 0}#nav-panel{max-height:calc(100vh - 40px);overflow:auto;position:sticky;top:20px}#nav-panel h3{font-size:15px;margin-bottom:14px}.quiz-running-title{font-size:24px;margin-bottom:0}.read-status{color:var(--muted);font-size:13px;margin:13px 0 0}::selection{background:#477a77;color:#fff}@media(max-width:850px){.grid{grid-template-columns:1fr}.grid>aside{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid>aside .card+.card{margin-top:0}.quizlayout{grid-template-columns:1fr}#nav-panel{position:static;max-height:none}.question-nav{grid-template-columns:repeat(10,1fr)}.question-nav button{padding:8px 0}.navlegend{margin-top:12px}}@media(max-width:560px){.wrap{padding-left:17px;padding-right:17px}main{padding-top:26px}.card{padding:21px}.grid>aside{display:block}.grid>aside .card+.card{margin-top:18px}.topics{grid-template-columns:1fr}.topbar{gap:10px;padding-top:14px;padding-bottom:14px}.brand strong{font-size:12px}.brand span{font-size:10px}.brandmark{width:33px;height:33px}.clock time{font-size:17px}.clock small{font-size:10px}.question-card{padding:21px 18px}.question{font-size:21px}.answer{padding:13px 12px;gap:10px;font-size:15px}.letter{min-width:27px;height:27px}.navigation button{padding:10px 12px;font-size:14px}.position{display:none}.quizhead{align-items:start}.quiz-running-title{font-size:20px}.question-nav{grid-template-columns:repeat(8,1fr)}.stats{gap:7px}.stat{padding:13px 5px}.stat b{font-size:25px}.stat span{font-size:11px}.modal{padding:21px}.bag-item{gap:10px}.review-row{flex-wrap:wrap}.review-row .content{flex-basis:calc(100% - 24px)}.review-row button{margin-left:21px}.score-value{font-size:65px}.actions>button{flex-grow:1}.bag-item button{font-size:12px;padding:7px 9px}}

<script>
'use strict';
const BANK = [{"id":"d01","topic":"Circular y Manual Operativo","type":"convencional","options":["Que existan indicios de participación en una infracción o necesidad razonable de identificarla para prevenir un delito.","Que se haya consumado un delito de especial gravedad y exista una orden judicial de identificación.","Que el dispositivo haya sido nombrado para investigar exclusivamente infracciones penales, quedando excluidas las administrativas.","Que la persona atraviese un punto elegido para el control, sin necesidad de valorar ninguna otra circunstancia."],"answer":0,"explanation":"La Circular permite la identificación por indicios de participación en una infracción o cuando resulte razonablemente necesaria para prevenir un delito. El mero paso por el dispositivo no convierte en legítima una actuación sistemática e indiscriminada.","source":{"page":45,"section":"3. Supuestos legales de establecimiento: carácter preventivo","document":"Temario original"},"question":"Conforme a la Circular 1/2015, en una situación de normalidad, ¿qué circunstancia puede justificar que se requiera la identificación de una persona en un dispositivo preventivo?","origin":"original","conceptIds":["T119","S040"]},{"id":"d02","topic":"Circular y Manual Operativo","type":"correcta","options":["Su finalidad debe limitarse a detectar infracciones penales, por ser insuficiente la prevención de infracciones administrativas.","Su objeto debe relacionarse con la misión y el dispositivo debe estar previsto específicamente en la papeleta u orden.","Puede establecerse de forma sistemática e indiscriminada cuando sus componentes dispongan de medios suficientes.","Basta con que el servicio esté nombrado, aunque el dispositivo no figure específicamente en la papeleta u orden."],"answer":1,"explanation":"La Circular exige relación directa con la misión y los cometidos, previsión específica en la papeleta u orden y finalidad de impedir o detectar infracciones penales o administrativas. La suficiencia de medios no sustituye la justificación de la actuación.","source":{"page":47,"section":"4.2. Requisitos legales de realización","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Según la Circular 1/2015, ¿qué requisito debe cumplir un dispositivo preventivo sobre vías?","origin":"original","conceptIds":["T126","T127","T128","S048"]},{"id":"essCT01","topic":"Circular y Manual Operativo","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. En un dispositivo preventivo de la Circular, ¿qué diferencia existe entre las comprobaciones en situación de normalidad y las dirigidas a impedir el porte o uso ilegal de armas ante un riesgo potencialmente grave?","options":["En normalidad puede visualizarse superficialmente el interior del vehículo, incluido el maletero; ante el riesgo por armas se añaden palpados y revisión de compartimentos y equipajes en los términos previstos.","En ambos supuestos las comprobaciones del vehículo se limitan a su documentación; la revisión de guanteras y equipajes corresponde exclusivamente al dispositivo reactivo por delito grave.","En normalidad se permite revisar mediante palpado y apertura cualquier equipaje; ante el riesgo por armas las actuaciones se limitan al exterior del vehículo para evitar manipular objetos peligrosos.","Ante el riesgo por armas se permite revisar únicamente el vehículo; las prendas superpuestas y los lugares habituales de ocultación corporal quedan excluidos del examen superficial."],"answer":0,"explanation":"En normalidad se identifican las personas, se comprueba titularidad y documentación del vehículo y se realiza una visualización superficial del interior, incluido el maletero. Ante el riesgo por armas se añaden examen superficial de prendas de abrigo o superpuestas, palpado de los lugares habituales de ocultación, revisión de espacios interiores del vehículo y revisión superficial mediante palpado y apertura de equipajes. Son facultades vinculadas al supuesto que las justifica. La identificación y el registro corporal externo requieren los presupuestos recogidos en la p.45.","source":{"document":"Temario original","page":48,"section":"Circular 1/2015, 4.4.a-b. Condiciones y facultades de ejecución; presupuestos de identificación y registro en p.45"},"origin":"síntesis esencial","conceptIds":["S041","T121"]},{"id":"essCT02","topic":"Circular y Manual Operativo","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Al ordenar dispositivos preventivos de la Circular dentro de la demarcación y competencias correspondientes, ¿qué atribución de facultades es válida?","options":["Los jefes territoriales y de Tráfico pueden ordenarlos; ARS y GAR necesitan siempre autorización del jefe de Puesto, y el Mando de Operaciones puede dirigirlos pero no ordenar su establecimiento.","Los jefes territoriales y de Tráfico pueden ordenarlos; ARS y GAR pueden hacerlo para cumplir una misión encomendada, y el Mando de Operaciones puede ordenarlos y tomar su dirección.","Solo los jefes de Zona y Agrupación pueden ordenarlos; los restantes jefes territoriales y de Tráfico, ARS y GAR se limitan a ejecutarlos, aunque tengan una misión encomendada.","Los jefes territoriales y de Tráfico deben ordenarlos siempre a través de sus centrales operativas; ARS y GAR y el Mando de Operaciones pueden ordenarlos directamente, pero no asumir su dirección."],"answer":1,"explanation":"Pueden ordenarlos los jefes territoriales de Zona, Comandancia, Compañía y Puesto, y los de Tráfico de Agrupación, Sector, Subsector y Destacamento, directamente o a través de sus órganos de coordinación y mando. ARS y GAR pueden ordenarlos por sí mismos en cumplimiento de una misión encomendada. El Mando de Operaciones puede ordenarlos y tomar su dirección. Todas estas facultades se ejercen dentro del ámbito competencial correspondiente.","source":{"document":"Temario original","page":47,"section":"Circular 1/2015, 4.3. Competencias de autoridades y mandos"},"origin":"síntesis esencial","conceptIds":["T132","T133","T134","T135"]},{"id":"d03","topic":"Circular y Manual Operativo","type":"incorrecta","options":["Pueden responder a un riesgo sobrevenido que ponga en peligro inminente a personas o bienes y exija actuar rápidamente.","Pueden perseguir el restablecimiento de la normalidad y, en su caso, la detención de partícipes y recogida de pruebas de un delito.","Los indicios racionales de una posible alteración no permiten un dispositivo reactivo hasta que esa alteración se consume.","En caso de necesidad o urgencia, el mando competente puede ordenar su establecimiento verbalmente, sin perjuicio de formalizarlo después."],"answer":2,"explanation":"La ficha de la Circular relativa a la alteración del orden, seguridad ciudadana o pacífica convivencia incluye también la existencia de indicios racionales de que pueda producirse. Por tanto, «reactivo» no significa necesariamente esperar a que la alteración se consume. Los requisitos generales y la orden verbal urgente se desarrollan en las páginas 49 y 50.","source":{"page":45,"section":"3. Supuestos legales de establecimiento: alteración o indicios racionales de alteración","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a los dispositivos reactivos regulados por la Circular 1/2015:","origin":"original","conceptIds":["T129","T130","T131","S042","S049"]},{"id":"essCT03","topic":"Circular y Manual Operativo","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. En un dispositivo reactivo de la Circular para mantener o restablecer el orden, la seguridad ciudadana o la pacífica convivencia, ¿qué medidas adicionales se contemplan?","options":["Identificar y comprobar documentos, pero sin desviar accesos, evacuar ni ocupar preventivamente efectos, pues esas medidas requieren siempre un delito grave ya consumado.","Desviar accesos y evacuar, manteniendo las medidas hasta finalizar la orden de servicio aunque antes desaparezca su necesidad; la ocupación de efectos exige una resolución judicial previa.","Desviar o impedir accesos, evacuar o desalojar y ocupar preventivamente efectos susceptibles de uso ilegal, cuando sea necesario y por el tiempo imprescindible.","Impedir accesos y ocupar cualquier efecto personal por el solo hecho de atravesar el dispositivo; la duración depende del número de personas identificadas y no de la necesidad existente."],"answer":2,"explanation":"Además de las facultades preventivas, el supuesto reactivo para mantener o restablecer el orden permite, en caso de necesidad y por el tiempo imprescindible, desviar o impedir accesos con o sin vehículo, evacuar o desalojar a las personas de la zona y ocupar preventivamente efectos o instrumentos susceptibles de utilización ilegal. No autoriza actuaciones indiscriminadas ni mantener restricciones innecesarias.","source":{"document":"Temario original","page":50,"section":"Circular 1/2015, 5.4.a. Condiciones y facultades de ejecución; medidas desarrolladas al inicio de p.51"},"origin":"síntesis esencial","conceptIds":["S042","T122"]},{"id":"d05","topic":"Circular y Manual Operativo","type":"correcta","options":["El resultado del dispositivo debe ponerse posteriormente en conocimiento inmediato del Ministerio Fiscal.","La revisión de efectos personales queda excluida, aunque resulte indispensable para recoger pruebas del hecho.","La finalidad de detener a los partícipes impide utilizar el dispositivo para recoger instrumentos o pruebas del mismo delito.","Los efectos buscados deben fijarse sin atender a la naturaleza del delito que motiva el dispositivo."],"answer":0,"explanation":"La Circular exige dar conocimiento posterior inmediato del resultado al Ministerio Fiscal. También vincula los efectos buscados a la naturaleza del delito y permite las actuaciones previstas para detener a los partícipes y recoger efectos, instrumentos y pruebas.","source":{"page":51,"section":"5.4.b. Delito que provoca grave alarma social","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Conforme a la Circular 1/2015, en un dispositivo reactivo establecido para detener a los partícipes de un delito que provoca grave alarma social:","origin":"original","conceptIds":["T123","S043"]},{"id":"d06","topic":"Circular y Manual Operativo","type":"incorrecta","options":["La urgencia imprescindible puede justificar que las medidas se adopten mediante órdenes verbales.","Las medidas pueden mantenerse hasta agotar el plazo inicialmente previsto, aunque antes hayan dejado de ser necesarias.","Entre las medidas previstas se encuentran el cierre o desalojo de establecimientos y la evacuación de espacios públicos.","Pueden establecerse prohibiciones de paso si resultan imprescindibles."],"answer":1,"explanation":"Las medidas extraordinarias solo se pueden adoptar si son imprescindibles y durante el tiempo estrictamente necesario. Un plazo inicial no permite mantener una medida que ya ha dejado de ser necesaria.","source":{"page":52,"section":"5.4.c. Medidas ante una situación de riesgo sobrevenida","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Según la Circular 1/2015, ante una emergencia sobrevenida con peligro inminente que exige una actuación rápida:","origin":"original","conceptIds":["T124","S044"]},{"id":"d07","topic":"Circular y Manual Operativo","type":"convencional","options":["Que se realice de noche, aunque no se añada señalización ni se coloquen elementos sobre la vía.","Que la vía ya tenga una limitación previa de 50 km/h, sin añadir señalización, canalización ni bloqueo.","Que suponga una señalización más restrictiva que la de la vía o requiera elementos de canalización o bloqueo.","Que el dispositivo cuente con un mínimo de cuatro componentes, aunque no modifique la circulación."],"answer":2,"explanation":"En tramos donde se pueda circular a más de 40 km/h, basta con una de esas dos circunstancias: señalización más restrictiva o necesidad de canalización o bloqueo. Este umbral de inclusión en la Circular no debe confundirse con el de 50 km/h empleado para diferenciar despliegues.","source":{"page":44,"section":"2.2. Condiciones","document":"Temario original"},"question":"La Circular 1/2015 exige una condición adicional para incluir un dispositivo en un tramo donde pueda circularse a más de 40 km/h. ¿Cuál de estas circunstancias satisface esa condición?","origin":"original","conceptIds":["T116","S046"]},{"id":"d09","topic":"Circular y Manual Operativo","type":"incorrecta","options":["Los dispositivos para el cumplimiento de funciones de seguridad del tráfico quedan excluidos por no formar parte de la seguridad ciudadana.","Los dispositivos motivados por transportes especiales o accidentes figuran entre las exclusiones.","La indicación desde un vehículo en marcha a otro también en marcha para detenerlo en un lugar idóneo sin riesgo para el tráfico está excluida.","Los dispositivos motivados por obras quedan excluidos en los términos que establece la Circular."],"answer":0,"explanation":"La Circular incluye los dispositivos relacionados con funciones de prevención y mantenimiento de la seguridad del tráfico, considerada una especificidad de la seguridad ciudadana. Las demás opciones corresponden a exclusiones expresas de la página 44.","source":{"page":43,"section":"2.1. Definición e inclusión de la seguridad del tráfico","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre las inclusiones y exclusiones de la Circular 1/2015:","origin":"original","conceptIds":["T115","T117","T118","S045","S047"]},{"id":"tnew36","topic":"Circular y Manual Operativo","type":"convencional","options":["Solo al Ministerio Fiscal, sustituyendo con ello toda comunicación a autoridades y mandos territoriales.","Únicamente al jefe de la patrulla actuante al finalizar el servicio.","Al Centro de Gestión de Tráfico, que decide si informa después a las autoridades territoriales.","A los Delegados o Subdelegados correspondientes y a los mandos con competencia territorial o material."],"answer":3,"explanation":"La Circular establece comunicación inmediata a Delegados o Subdelegados y a los mandos con competencia territorial o material. La actuación fuera del ámbito no elimina esos enlaces.","source":{"page":48,"section":"Circular 1/2015, 4.3. Actuación fuera del ámbito competencial","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T136"],"question":"La Guardia Civil debe actuar fuera de su ámbito competencial territorial o material. ¿Qué comunicación inmediata contempla la Circular?","origin":"ampliación"},{"id":"tnew37","topic":"Circular y Manual Operativo","type":"convencional","options":["Seguridad operativa de la fuerza, seguridad vial y seguridad legal.","Seguridad operativa de la fuerza, eficacia de la intervención y movilidad.","Seguridad vial, coordinación del mando y disponibilidad de transmisiones.","Seguridad legal, sorpresa operativa y continuidad del servicio."],"answer":0,"explanation":"El Manual Operativo exige simultáneamente seguridad operativa de la fuerza, seguridad vial de agentes y ciudadanos y seguridad legal mediante cumplimiento de la normativa.","source":{"page":53,"section":"Manual Operativo general, 1. Principios de seguridad del dispositivo","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T137"],"question":"¿Qué conjunto de principios debe primar en todo dispositivo sobre vías según el Manual Operativo general?","origin":"ampliación"},{"id":"revSC06","topic":"Circular y Manual Operativo","type":"convencional","options":["En la clase que comprende puntos donde la circulación se reduce hasta detenerse y tramos limitados hasta 50 km/h.","En la clase de dispositivos reactivos, ya que la detención previa de los vehículos determina su carácter.","En la clase de notificación de infracciones, porque la existencia del semáforo o del STOP fija su finalidad.","En la clase de vías de más de 50 km/h, porque el criterio se toma de la velocidad de aproximación antes del punto."],"answer":0,"explanation":"El primer tipo del Manual general incluye puntos donde la circulación se reduce hasta detenerse: semáforos, ceda el paso, STOP, rotondas, cruces o peajes, además de tramos limitados hasta 50 km/h. El emplazamiento no determina por sí solo el carácter preventivo o reactivo.","source":{"document":"Temario original","page":57,"section":"Manual Operativo general, 2. Tipos de dispositivos"},"question":"Según el Manual Operativo general, se elige un punto próximo a un semáforo o a un STOP donde la circulación se reduce hasta detenerse. ¿En qué clase de emplazamiento se encuadra el dispositivo?","origin":"ampliación","conceptIds":[]},{"id":"revSC07","topic":"Circular y Manual Operativo","type":"convencional","options":["El primero puede ser preventivo o reactivo, mientras que el segundo se reserva a delitos graves o de alarma social.","Ambos pueden ser preventivos o reactivos; debe atenderse al supuesto y al objetivo que justifiquen su establecimiento.","El carácter depende del número de integrantes: hasta cuatro es preventivo y a partir de ocho es reactivo.","El primero se emplea para prevención y el segundo para reaccionar ante hechos ya producidos."],"answer":1,"explanation":"Los dos tipos del Manual admiten empleo preventivo o reactivo. La velocidad clasifica el despliegue; el carácter responde al supuesto legal y al objetivo, como prevenir riesgos o actuar ante alteraciones, delitos o peligros sobrevenidos. No lo decide la dotación por sí sola.","source":{"document":"Temario original","page":57,"section":"Manual Operativo general, 2. Tipos de dispositivos; supuestos de la Circular en pp.45-46"},"question":"Se compara un dispositivo del Manual Operativo general en un tramo de hasta 50 km/h con otro en un tramo de más de 50 km/h. ¿Cómo influye esa clasificación en su posible carácter preventivo o reactivo?","origin":"ampliación","conceptIds":[]},{"id":"revSC01","topic":"Circular y Manual Operativo","type":"convencional","options":["SC-1: dos o tres; SC-2: cuatro; SC-3: ocho; SC-4: doce componentes.","SC-1: dos; SC-2: cuatro; SC-3: seis; SC-4: ocho o más componentes.","SC-1: tres; SC-2: cuatro; SC-3: ocho; SC-4: más de ocho componentes.","SC-1: dos; SC-2: tres; SC-3: cuatro; SC-4: más de cuatro componentes."],"answer":3,"explanation":"El Manual general contempla SC-1 con dos y SC-2 con tres componentes; en la página 70 continúa con SC-3 de cuatro y SC-4 de más de cuatro. Estas modalidades no deben sustituirse por la clasificación específica ATGC en reducido, ordinario y reforzado.","source":{"document":"Temario original","page":69,"section":"Manual Operativo general, 6.2.2 y 6.2.3; continuación 6.2.4 y 6.2.5 en p.70"},"question":"En los despliegues del Manual Operativo general para tramos de hasta 50 km/h, ¿qué relación entre modalidad SC y dotación es correcta?","origin":"ampliación","conceptIds":[]},{"id":"revSC02","topic":"Circular y Manual Operativo","type":"convencional","options":["Uno reúne jefatura, selección, registro e identificación; el otro tiene como misión principal protegerlo.","Uno asume exclusivamente la jefatura; el otro reúne selección, registro, identificación y protección.","Uno realiza selección e identificación; el otro se ocupa del bloqueo y del registro, sin función específica de protección.","Uno selecciona y protege; el otro realiza las verificaciones de tráfico."],"answer":0,"explanation":"En el SC-1, un componente reúne jefe de servicio, selección, registro e identificación, mientras que el segundo tiene como misión principal darle protección. La combinación selección y protección en una misma persona es la distribución del reducido ATGC de dos, no la del SC-1.","source":{"document":"Temario original","page":69,"section":"Manual Operativo general, 6.2.2. Dispositivo compuesto por dos componentes (SC-1)"},"question":"Se establece un dispositivo SC-1 del Manual Operativo general con dos guardias civiles. ¿Qué reparto de cometidos corresponde a esta modalidad?","origin":"ampliación","conceptIds":[]},{"id":"revSC03","topic":"Circular y Manual Operativo","type":"convencional","options":["Las identificaciones, quedando el jefe dedicado exclusivamente a la selección.","El registro, conforme al cometido que esta modalidad le asigna después de la entrada del vehículo y la salida de sus ocupantes.","La jefatura, para que el anterior jefe pase a prestar protección al registro.","La protección permanente con arma larga, sustituyendo al componente que la venía prestando."],"answer":1,"explanation":"En SC-2, el encargado de bloqueo pasa al registro una vez introducido el vehículo y con sus ocupantes fuera. Otro componente mantiene la protección en todo momento con el arma larga reglamentaria; el jefe reúne selección e identificación.","source":{"document":"Temario original","page":69,"section":"Manual Operativo general, 6.2.3. Dispositivo compuesto por tres componentes (SC-2)"},"question":"En un dispositivo SC-2 de tres integrantes del Manual Operativo general, el vehículo ya ha entrado en la zona de registro y sus ocupantes están fuera. ¿Qué función puede asumir entonces el encargado de los medios de bloqueo?","origin":"ampliación","conceptIds":[]},{"id":"revSC04","topic":"Circular y Manual Operativo","type":"correcta","options":["Uno dirige y selecciona, otro identifica, otro bloquea y el último registra; la protección se reparte durante las pausas.","Uno dirige, otro selecciona y protege, y los otros dos registran e identifican simultáneamente.","Uno ejerce la jefatura, otro selecciona, otro registra e identifica y otro protege a selección y registro.","Uno selecciona, dos verifican tráfico y otro protege; no se reserva una función diferenciada de jefe."],"answer":2,"explanation":"SC-3 diferencia jefatura, selección, registro e identificación, y protección de selección y registro. Si lo ordena el jefe, el encargado de registro e identificación realiza también los cometidos de bloqueo. No debe confundirse con el ordinario ATGC de cuatro, que dedica dos integrantes a verificaciones.","source":{"document":"Temario original","page":70,"section":"Manual Operativo general, 6.2.4. Dispositivo compuesto por cuatro componentes (SC-3)"},"question":"ELIGE LA OPCIÓN CORRECTA. Se prepara un dispositivo SC-3 de cuatro integrantes conforme al Manual Operativo general. ¿Qué distribución funcional procede?","origin":"ampliación","conceptIds":[]},{"id":"revSC05","topic":"Circular y Manual Operativo","type":"incorrecta","options":["Puede contar con más de un escalón en función del personal que lo integre.","El jefe debe asignar los puestos antes de salir de servicio y realizar una reunión previa de organización.","El jefe debe supervisar el servicio, resolver incidencias y vigilar las fichas o su grabación en el aplicativo.","Debe conservar un único escalón, aunque aumente el número de integrantes disponibles."],"answer":3,"explanation":"Es incorrecto imponer un único escalón: el SC-4 puede contar con más de uno, según el personal. El Manual destaca que no es un dispositivo común y exige al jefe organizar previamente los cometidos, supervisar su desarrollo y controlar la documentación, entre otras funciones.","source":{"document":"Temario original","page":70,"section":"Manual Operativo general, 6.2.5. Dispositivo compuesto por más de cuatro componentes (SC-4)"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre el dispositivo SC-4 de más de cuatro integrantes del Manual Operativo general:","origin":"ampliación","conceptIds":[]},{"id":"d10","topic":"Circular y Manual Operativo","type":"convencional","options":["Instalar señalización y barreamiento antes de canalizar; retirar la canalización antes de abrir el paso.","Instalar señalización, canalización y barreamiento; retirar primero el barreamiento, después la canalización y al final la señalización.","Instalar primero la canalización y luego la señalización; retirar los elementos en el mismo orden de instalación.","Instalar primero el barreamiento para proteger la colocación de señales y retirarlo después de la señalización."],"answer":1,"explanation":"El montaje sigue el orden señalización, canalización y barreamiento. La recogida invierte ese orden, quedando la señalización para el final. El Manual también prohíbe colocar barreamientos antes de instalar todas las señales.","source":{"page":65,"section":"5.2. Establecimiento y 5.3. Recogida","document":"Temario original"},"question":"Según el Manual Operativo general, ¿cuál es el orden correcto para instalar y retirar los elementos de un dispositivo?","origin":"original","conceptIds":["T138","S067"]},{"id":"essCT07","topic":"Dispositivos ATGC","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Al comparar un dispositivo establecido por la ATGC con apoyo de otra unidad y otro establecido por una unidad distinta con apoyo vial de la ATGC, ¿qué ámbito y finalidades recoge el temario?","options":["La presencia de agentes de Tráfico basta para aplicar siempre el procedimiento ATGC, aunque otra unidad establezca el dispositivo; este procedimiento se limita a alcohol y drogas y al control de velocidad.","Todo apoyo entre unidades obliga a aplicar el Manual general; el procedimiento ATGC solo sirve para servicios realizados exclusivamente por componentes de la especialidad y para comprobación documental.","El procedimiento ATGC se aplica a los que establece la Agrupación, aunque reciba apoyo, y abarca alcohol/drogas, transporte, otras verificaciones viales y notificación de infracciones. Si solo apoya la seguridad vial de uno establecido por otra unidad, se sigue a la unidad responsable conforme al Manual general.","El procedimiento ATGC se aplica a los que establece la Agrupación con apoyo ajeno, pero excluye las verificaciones de transporte; si otra unidad establece el dispositivo, la Agrupación debe asumir su dirección para prestar apoyo vial."],"answer":2,"explanation":"El criterio es quién establece el dispositivo. El procedimiento específico se aplica a los establecidos por la ATGC, con independencia del apoyo de otras unidades, e incluye verificación de alcohol/drogas, transporte, otras comprobaciones de seguridad vial y notificación de infracciones captadas por medios de imagen (pp.87-88). Queda excluido el caso inverso: la ATGC presta apoyo vial a un dispositivo establecido por otra unidad; entonces se sigue lo dispuesto por esa unidad conforme al Manual general (p.101).","source":{"document":"Temario original","page":87,"section":"Procedimiento ATGC, 4. Tipos según finalidad y ámbito, continuación en p.88; exclusión del apoyo a otras unidades en 14, p.101"},"origin":"síntesis esencial","conceptIds":[]},{"id":"essCT04","topic":"Dispositivos ATGC","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Al elegir composición y emplazamiento para un reducido o un ordinario de la ATGC, ¿qué combinación respeta el procedimiento específico?","options":["Reducido: dos o tres integrantes, preferentemente de día; ordinario: cuatro o más, idóneo de noche. Ambos pueden usar cambios de sentido o carriles de aceleración/deceleración limitados específicamente a 70 km/h.","Reducido: dos o tres integrantes, preferentemente de día; ordinario: cuatro o más, idóneo de noche. En playas de peaje ambos deben situarse antes de las cabinas de pago o control.","Reducido: dos o tres integrantes, reservado al día; ordinario: cuatro o más, reservado a la noche. Ambos pueden usar cualquier punto de la calzada principal si quedan fuera del carril al realizar las comprobaciones.","Reducido: dos o tres integrantes, generalmente de día; ordinario: cuatro o más, idóneo de noche. Se emplean en tramos de velocidad reducida y en los emplazamientos previstos, con máximo específico de 50 km/h donde se exige; en peajes, después de las cabinas."],"answer":3,"explanation":"El reducido tiene dos o tres integrantes y se realiza generalmente de día, admitiendo noche con condiciones. El ordinario tiene al menos cuatro y es idóneo de noche. Se prevén tramos convencionales de velocidad reducida, vías de servicio, cambios de sentido, carriles de aceleración/deceleración, áreas de servicio o descanso y zonas posteriores a las cabinas de peaje. Donde se especifica, la limitación máxima es de 50 km/h; no basta con elegir cualquier punto de autovía. Véanse p.88 para el reducido, p.90 para el ordinario y p.99 para cambios de sentido, intersecciones y peajes.","source":{"document":"Temario original","page":88,"section":"Procedimiento ATGC, 5.1.1. Reducido; comparación con 5.2.1 en p.90 y 6.5 en p.99"},"origin":"síntesis esencial","conceptIds":["S050","S051","S055","T139","T140","T141","T146","T148"]},{"id":"d11","topic":"Dispositivos ATGC","type":"correcta","options":["Exige comunicar a COTA su inicio, pero la finalización solo debe comunicarse si se produce una incidencia.","Solo exige chaleco antibalas al componente dedicado a la protección.","Exige luz artificial suficiente, cobertura, aviso a COTA del inicio, fin y ubicación, y antibalas para todos.","Puede realizarse con iluminación suficiente aunque no exista cobertura para las transmisiones."],"answer":2,"explanation":"El reducido se realiza de forma general de día, pero el procedimiento permite hacerlo de noche con condiciones específicas acumuladas. Se limitan, de forma general, a alcohol y drogas o inspecciones de transportes, respetando especialmente las funciones de protección.","source":{"page":88,"section":"5.1.1. Dispositivo ordinario reducido: horario nocturno","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Según el procedimiento específico de la Agrupación de Tráfico, un dispositivo ordinario reducido en horario nocturno:","origin":"original","conceptIds":["T141","T142","T143","S051"]},{"id":"d12","topic":"Dispositivos ATGC","type":"incorrecta","options":["Un componente asume la selección y protección, y el otro las verificaciones de tráfico.","El jefe del servicio es el componente de mayor antigüedad.","La selección debe evitar aglomeraciones y atender a los movimientos sospechosos de los vehículos que se aproximan.","El encargado de selección y protección puede atender a otro vehículo mientras su compañero verifica el anterior."],"answer":3,"explanation":"El componente de selección y protección no debe introducir nuevos vehículos mientras su compañero actúa con uno ni intervenir con vehículos simultáneamente, porque debe atender a su protección. La distribución y la jefatura por antigüedad figuran en la página 88.","source":{"page":89,"section":"5.1.3.a. Selección y protección en dispositivos de dos componentes","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. En un dispositivo reducido de dos componentes del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["T139","T144","T145","S050","S052","S053"]},{"id":"revSC09","topic":"Dispositivos ATGC","type":"correcta","options":["SC-2 atribuye protección al encargado de bloqueo durante el registro; el reducido ATGC la atribuye al verificador cuando termina cada prueba.","SC-2 separa selección, verificaciones de tráfico y protección; el reducido ATGC reúne jefatura, selección e identificación en uno y bloqueo y registro en otro.","SC-2 concentra selección y protección en un integrante; el reducido ATGC concentra selección, identificación y registro en el jefe.","SC-2 combina bloqueo y posterior registro en un integrante; el reducido ATGC distribuye selección, verificaciones y protección entre integrantes distintos."],"answer":3,"explanation":"En SC-2, un integrante reúne jefatura, selección e identificación; otro protege con arma larga y otro realiza bloqueo y, después, registro (p.69). En el reducido ATGC de tres se separan selección, verificaciones y protección (p.89, con desarrollo de protección en p.90).","source":{"document":"Temario original","page":69,"section":"Manual general, 6.2.3 (SC-2); comparación con 5.1.2.b y 5.1.4 del procedimiento ATGC en pp.89-90"},"question":"ELIGE LA OPCIÓN CORRECTA. Se comparan dos despliegues de tres integrantes: SC-2 del Manual general y reducido del procedimiento ATGC. ¿Qué diferencia es válida?","origin":"ampliación","conceptIds":[]},{"id":"d14","topic":"Dispositivos ATGC","type":"correcta","options":["Los cuatro componentes mínimos deben pertenecer necesariamente a la misma unidad y grupo operativo.","Es idóneo de noche y permite reunir patrullas de distintas unidades o grupos para alcanzar al menos cuatro componentes.","La incorporación de una segunda patrulla permite establecerlo en cualquier tramo sin atender a la limitación específica de velocidad.","Su empleo nocturno está reservado a servicios excepcionales autorizados por el Mando de Operaciones."],"answer":1,"explanation":"El ordinario es idóneo de noche. Cuando sea necesario, los jefes de Subsector deben coordinar el nombramiento para integrar patrullas de diferentes unidades o grupos y reunir al menos cuatro componentes. Se mantienen las condiciones de emplazamiento previstas en el procedimiento.","source":{"page":90,"section":"5.2.1. Normas generales sobre nombramiento y ejecución","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Sobre el dispositivo operativo ordinario del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["T146","T147","T148","S055"]},{"id":"revSC10","topic":"Dispositivos ATGC","type":"convencional","options":["SC-3 distingue jefe, selección, registro e identificación, y protección; el ordinario ATGC distribuye uno en selección, dos en verificaciones y uno en protección.","SC-3 dedica dos integrantes a selección y protección y dos al bloqueo; el ordinario ATGC reúne selección, registro e identificación en un solo integrante.","SC-3 y ordinario ATGC presentan el mismo reparto: jefe exclusivo, selección, dos verificadores y protección compartida entre los cuatro.","SC-3 reserva dos integrantes a registro e identificación; el ordinario ATGC reserva uno a jefatura y otro a selección."],"answer":0,"explanation":"En SC-3 hay un puesto diferenciado de jefe, otro de selección, otro de registro e identificación y otro de protección (p.70). El esquema ordinario ATGC de cuatro dedica uno a selección, dos a verificaciones y uno a protección (p.90).","source":{"document":"Temario original","page":70,"section":"Manual general, 6.2.4 (SC-3); comparación con 5.2.2.a del procedimiento ATGC en p.90"},"question":"Hay cuatro integrantes disponibles. Al comparar el SC-3 del Manual general con el ordinario ATGC de cuatro, ¿qué diferencia recoge el temario?","origin":"ampliación","conceptIds":[]},{"id":"d15","topic":"Dispositivos ATGC","type":"incorrecta","options":["Un ordinario con más de cuatro componentes puede conservar esa modalidad.","Con un mínimo de seis efectivos puede establecerse un escalón de bloqueo y seguimiento sin constituir un dispositivo reforzado.","La incorporación de un quinto componente convierte por sí sola el dispositivo en reforzado.","Puede reforzar las funciones de verificación de tráfico."],"answer":2,"explanation":"La composición superior a cuatro no convierte automáticamente el dispositivo ordinario en reforzado. El procedimiento contempla personal adicional para verificaciones y, con seis efectivos como mínimo, para un escalón de bloqueo y seguimiento.","source":{"page":92,"section":"5.2.3. Personal adicional","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. En relación con el personal adicional de un dispositivo ordinario del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["S057"]},{"id":"d16","topic":"Dispositivos ATGC","type":"convencional","options":["Pueden admitirse más vehículos si queda espacio, aplazando sus verificaciones hasta que se libere un componente.","Puede mantenerse la admisión a un ritmo reducido, limitándola a un vehículo en espera por cada componente ocupado.","La selección puede continuar si el jefe lo autoriza y se informa a los nuevos conductores de que deberán esperar.","No deben introducirse nuevos vehículos mientras esas actuaciones impidan atenderlos."],"answer":3,"explanation":"El procedimiento impide introducir vehículos si todos los componentes de la zona de verificaciones están ocupados en actuaciones que no les permiten atenderlos. La necesidad de mantener actividad no justifica acumular usuarios sin atención ni suprimir la protección.","source":{"page":92,"section":"5.2.2. Fuerza a emplear y misiones: admisión de vehículos","document":"Temario original"},"question":"En un dispositivo ordinario de la Agrupación de Tráfico, todos los componentes de verificaciones están ocupados en denuncias, diligencias u otras actuaciones que les impiden atender a más usuarios. ¿Qué establece el procedimiento específico?","origin":"original","conceptIds":["S056"]},{"id":"revSC11","topic":"Dispositivos ATGC","type":"correcta","options":["El Manual general exige doce integrantes y el reforzado ATGC parte de ocho, aumentando verificadores si se incorporan más efectivos.","El Manual general fija un mínimo de ocho; el reforzado ATGC parte de doce y permite controles de ocho a once reduciendo verificadores, además de prever ocho con desvío a zona calmada.","El Manual general permite dos o tres si existe iluminación; el reforzado ATGC admite cuatro al reunir patrullas de distintas unidades.","El Manual general y el reforzado ATGC parten de ocho integrantes; en ATGC se aumentan a doce cuando se añade control de velocidad."],"answer":1,"explanation":"El Manual general fija ocho como mínimo a más de 50 km/h (p.70). En ATGC el reforzado parte de doce (p.92), pero se admiten ocho a once reduciendo verificadores (p.93) y ocho cuando se desvía desde autopista/autovía a una zona limitada a 50 km/h para controlar (p.97). Las reducciones expresas impiden presentar doce como mínimo absoluto sin excepciones.","source":{"document":"Temario original","page":70,"section":"Manual general, 6.3; comparación con ATGC 5.3.1-5.3.3 en pp.92-93 y 5.3.5 en p.97"},"question":"ELIGE LA OPCIÓN CORRECTA. Para tramos de más de 50 km/h, ¿qué comparación de dotaciones distingue el Manual Operativo general del procedimiento específico ATGC?","origin":"ampliación","conceptIds":[]},{"id":"snew07","topic":"Dispositivos ATGC","type":"correcta","options":["Un jefe, uno de selección, cuatro de verificaciones, dos de vigilancia y cuatro de bloqueo y seguimiento.","Un jefe, uno de selección, seis de verificaciones, dos de vigilancia y dos de bloqueo y seguimiento.","Un jefe, dos de selección, seis de verificaciones, uno de vigilancia y dos de bloqueo y seguimiento.","Un jefe, dos de selección, cinco de verificaciones, tres de vigilancia y uno de bloqueo y seguimiento."],"answer":1,"explanation":"El esquema de doce reserva seis componentes a verificaciones, dos a vigilancia y dos a bloqueo/seguimiento, además del jefe y el componente de selección. Se evalúa el reparto de funciones, no el número ordinal de cada miembro.","source":{"page":93,"section":"5.3.3. Fuerza a emplear y misiones: dispositivo integrado por doce componentes","document":"Temario original"},"conceptIds":["S063","T156"],"question":"ELIGE LA OPCIÓN CORRECTA. En el esquema de un dispositivo reforzado de doce componentes de la ATGC, sin contar notificadores adicionales, ¿qué distribución funcional corresponde al procedimiento?","origin":"ampliación"},{"id":"d17","topic":"Dispositivos ATGC","type":"correcta","options":["Debe estar al mando de un oficial o suboficial e incluir al menos dos componentes de un EIS entre sus efectivos.","La participación de un Equipo de Investigación de Siniestros solo se exige si finalmente se detecta un resultado positivo.","Los componentes de un Equipo de Investigación de Siniestros deben permanecer ajenos a las pruebas hasta que concluya el control.","Puede quedar al mando de cualquier componente por antigüedad, sin exigencia de empleo."],"answer":0,"explanation":"La jefatura corresponde a un oficial o suboficial y se exige que al menos dos componentes pertenezcan a un EIS. El EIS puede apoyar inicialmente las pruebas y asumir después las evidenciales, confirmatorias o diligencias derivadas de positivos.","source":{"page":93,"section":"5.3.2. Normas sobre nombramiento y ejecución","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a la jefatura y la participación especializada en un dispositivo reforzado del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["T153","T154","S061"]},{"id":"d20","topic":"Dispositivos ATGC","type":"correcta","options":["Pueden realizarse por decisión de la patrulla aunque esa posibilidad no esté recogida en los programas preventivos de las reuniones mensuales.","Exigen seleccionar únicamente a conductores con signos de consumo y excluyen la selección aleatoria.","Pueden efectuar la detención sobre la marcha exclusivamente mediante personal no uniformado.","Pueden realizarse si los programas preventivos de las reuniones mensuales entre Tráfico y Subsector recogen esa posibilidad."],"answer":3,"explanation":"El procedimiento vincula estos dispositivos a lo establecido en las actas de las reuniones mensuales y sus programas preventivos. Prevé que personal uniformado detenga sobre la marcha vehículos de forma aleatoria o por indicios, para realizar después las pruebas y comprobaciones oportunas.","source":{"page":97,"section":"5.4. Dispositivos dinámicos","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Según el procedimiento específico de la Agrupación de Tráfico, los dispositivos dinámicos de verificación de alcohol o drogas:","origin":"original","conceptIds":[]},{"id":"essCT05","topic":"Dispositivos ATGC","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. ¿Qué relación entre duración general, dispositivo reforzado y efecto sorpresa recoge el procedimiento específico ATGC?","options":["Límites generales: de 15 minutos a 4 horas; el reforzado se establece, como norma general, al menos 3 horas, y cuando la sorpresa sea esencial se potencian dispositivos cortos.","Límites generales: de 15 minutos a 3 horas; el reforzado se establece, como norma general, al menos 2 horas, y cuando la sorpresa sea esencial se potencia la corta duración.","Límites generales: de 30 minutos a 4 horas; el reforzado se establece, como norma general, al menos 3 horas, y la sorpresa obliga a mantener todo dispositivo durante el máximo autorizado.","Límites generales: de 15 minutos a 4 horas; el reforzado se establece, como norma general, al menos 2 horas, y la sorpresa permite superar el límite máximo mientras no se detecten positivos."],"answer":0,"explanation":"El apartado de duración fija, en cualquier caso, un mínimo de 15 minutos y un máximo de 4 horas. El reforzado tiene como norma general un mínimo de 3 horas por los recursos y el montaje que requiere (p.92); su duración responde a los objetivos perseguidos. Cuando la sorpresa sea esencial se potencian los dispositivos cortos para reducir la reacción de los conductores. La pauta de tres horas del reforzado no debe confundirse con el mínimo general de todos los dispositivos.","source":{"document":"Temario original","page":99,"section":"Procedimiento ATGC, 8. Duración de los dispositivos operativos; regla general del reforzado en 5.3.1, p.92"},"origin":"síntesis esencial","conceptIds":["S062","S065","T155","T157","T158","T159"]},{"id":"d22","topic":"Dispositivos ATGC","type":"convencional","options":["Desviar únicamente hacia una vía que impida regresar a la autovía, para evitar nuevas retenciones.","Desviar hacia la alternativa para reducir la acumulación, manteniendo flujo constante de vehículos en verificaciones.","Suspender necesariamente todas las verificaciones en cuanto se produzca cualquier acumulación, sin valorar el desvío previsto.","Conservar toda la circulación en la calzada principal hasta que finalicen las verificaciones de todos los vehículos retenidos."],"answer":1,"explanation":"El procedimiento prevé el desvío para reducir la acumulación y el riesgo por alcances, manteniendo actividad en la zona del control. Los vehículos desviados deben poder reincorporarse a la calzada principal una vez rebasado el dispositivo.","source":{"page":98,"section":"6.3. Dispositivos en la plataforma de la calzada principal","document":"Temario original"},"question":"En un dispositivo de la Agrupación de Tráfico situado en la calzada principal de una autovía, la acumulación de vehículos genera riesgo por alcances. Existe una vía alternativa que permite reincorporarse después del control. ¿Qué prevé el procedimiento específico?","origin":"original","conceptIds":[]},{"id":"essCT06","topic":"Dispositivos ATGC","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. En la señalización de un dispositivo ATGC, ¿qué combinación de medidas distingue el punto de control y su preaviso a distancia?","options":["La señal de verificación de alcohol-drogas se coloca solo al finalizar el dispositivo; los paneles variables deben anunciar expresamente el control policial para anticipar la detención.","En alcohol-drogas se coloca al inicio la señal correspondiente, si puede portarse, o el mensaje en el panel del vehículo; los vehículos de cuatro ruedas llevan tetrápodos para canalizar reducidos u ordinarios, y los paneles variables de la vía preavisan de las condiciones sin revelar el dispositivo.","En alcohol-drogas basta con los tetrápodos, sin señal ni mensaje; los paneles variables de la vía deben informar del tipo de prueba y del número de carriles cerrados.","La señal de alcohol-drogas solo se exige en reforzados; los tetrápodos son exclusivos del bloqueo y los paneles variables pueden anunciar el control para aumentar su efecto preventivo."],"answer":1,"explanation":"En el punto de verificación de alcohol-drogas, si el vehículo permite portarla, se instala la señal al inicio o se activa el panel alfanumérico del vehículo con ese mensaje. Los vehículos de cuatro ruedas deben portar tetrápodos para canalizar la circulación hacia reducidos u ordinarios (p.99). En autopista/autovía se contacta con el Centro de Gestión para que los paneles variables adviertan de las condiciones circunstanciales —reducción de carriles o velocidad, peligro— sin insertar mensajes que permitan deducir el dispositivo (p.98). Son señalizaciones con funciones distintas.","source":{"document":"Temario original","page":99,"section":"Procedimiento ATGC, 9. Señalización; preaviso mediante paneles variables en 6.1.d, p.98"},"origin":"síntesis esencial","conceptIds":[]},{"id":"d23","topic":"Dispositivos ATGC","type":"correcta","options":["Los notificadores quedan fuera del dispositivo, que se considera formado únicamente por sus operadores.","El enlace entre operador y notificadores solo es necesario cuando ya se ha producido una incidencia.","El de superior empleo o más caracterizado presente en la zona de notificación asume la responsabilidad del escalón.","El operador conserva necesariamente la responsabilidad directa de notificación, aunque otro de superior empleo esté en esa zona."],"answer":2,"explanation":"El dispositivo incluye operadores y notificadores. Cuando el más caracterizado del grupo es operador, la responsabilidad del escalón de notificación la asume el de superior empleo o más caracterizado que esté allí. El operador debe permanecer enlazado con los notificadores.","source":{"page":99,"section":"7. Dispositivos para notificación de infracciones","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En un dispositivo de notificación por cinemómetro o RPAS de la Agrupación de Tráfico, el componente más caracterizado del grupo actúa como operador. Según el procedimiento específico:","origin":"original","conceptIds":[]},{"id":"d24","topic":"Dispositivos ATGC","type":"incorrecta","options":["El procedimiento contempla su colocación ante indicios de que el conductor pueda reemprender la marcha para eludir el control.","Antes de colocarlo debe ordenarse que se pare el motor y, en su caso, retirar la llave del interruptor.","Tras las actuaciones debe retirarse antes de ordenar que se reemprenda la marcha.","Se instala rutinariamente en cualquier vehículo, aunque no haya indicios de que el conductor vaya a eludir el control."],"answer":3,"explanation":"La colocación se vincula a indicios de posible reanudación de la marcha para eludir el control, no a una instalación rutinaria e indiscriminada. Se ordena parar el motor antes, se informa al conductor una vez colocado y se retira antes de ordenar la marcha.","source":{"page":100,"section":"10.1. Equipo de barreamiento individual","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre el equipo de barreamiento individual en dispositivos reducidos u ordinarios de la Agrupación de Tráfico:","origin":"original","conceptIds":[]},{"id":"d21","topic":"Dispositivos ATGC","type":"incorrecta","options":["Debe utilizarla también en los controles reducidos con el mismo carácter obligatorio que en los ordinarios y reforzados.","En un reforzado puede utilizarla el escalón de vigilancia.","Si la utiliza vigilancia en un reforzado, debe mantener enlace permanente con selección para comunicar vehículos con incidencias.","Debe utilizarla en controles ordinarios o reforzados."],"answer":0,"explanation":"El procedimiento distingue entre el uso debido en controles ordinarios o reforzados y el uso posible en reducidos. No atribuye al reducido el mismo carácter obligatorio. En reforzados, vigilancia puede usar el sistema manteniendo enlace con selección.","source":{"page":100,"section":"11. Utilización de dispositivos OCR","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Una unidad de la Agrupación de Tráfico dispone de lectura de matrículas OCR conectada con las bases de datos para el reporte de incidencias. Según el procedimiento específico:","origin":"original","conceptIds":[]},{"id":"revSC15","topic":"Dispositivos ATGC","type":"convencional","options":["Programar preferentemente dispositivos reforzados de tres horas para mantener la presencia policial durante el episodio.","Evitar con carácter general planificar esos dispositivos y orientar el potencial al auxilio y protección de los usuarios; si se realizan, adoptar las medidas preventivas previstas.","Trasladar el control a cualquier área de servicio, lo que permite mantenerlo sin medidas adicionales por la meteorología.","Mantener la planificación del control y reducir los integrantes para disponer de más patrullas en otros puntos."],"answer":1,"explanation":"El apartado de prevención de riesgos indica evitar con carácter general planificar dispositivos ante meteorología extremadamente adversa y orientar el potencial al auxilio y protección de los usuarios. Si se realizan, deben adoptarse las acciones preventivas del Manual de Prevención de Riesgos en Tráfico para esas circunstancias.","source":{"document":"Temario original","page":101,"section":"Procedimiento ATGC, 13. Prevención de riesgos"},"question":"Al planificar un dispositivo operativo de tráfico se prevén circunstancias meteorológicas extremadamente adversas. ¿Qué orientación general establece el temario?","origin":"ampliación","conceptIds":[]},{"id":"essUD01","topic":"UNIS","type":"convencional","question":"¿Qué combinación describe el mando y las dependencias del Oficial Jefe de la UNIS del Sector?","options":["Coordina EIS, EPRAT y GIAT; depende orgánica y funcionalmente del Jefe del Sector y técnicamente de la Jefatura de Operaciones.","Coordina EIS y motoristas; depende orgánica y técnicamente del Jefe del Subsector y funcionalmente de COTA.","Coordina EPRAT y GIAT; depende orgánica y funcionalmente de la Jefatura de Operaciones y técnicamente del Jefe del Sector.","Coordina EIS, EPRAT y GIAT; depende orgánica y funcionalmente del Jefe del Subsector y técnicamente de la fiscalía provincial."],"answer":0,"explanation":"El Oficial de Investigación lidera las decisiones y coordina EIS, EPRAT y GIAT para investigar siniestros y perseguir ilícitos de tráfico. En la UNIS del Sector, el Jefe del Sector reúne la dependencia orgánica y funcional; la dependencia técnica corresponde a la Jefatura de Operaciones.","source":{"document":"Temario original","page":7,"section":"1.1 y 1.1.1.1 (continúa en p. 8). Misión y dependencias del Oficial Jefe"},"origin":"esencial","conceptIds":["T002","T005","T004","T001","T003"]},{"id":"essUD02","topic":"UNIS","type":"convencional","question":"Al comparar las visitas y los contactos de los oficiales jefes de UNIS de Sector y de Subsector, ¿qué relación es válida?","options":["Las visitas mínimas son semestrales; el del Sector contacta con fiscalía provincial y el del Subsector con la autonómica.","Las visitas mínimas son trimestrales; el del Sector contacta con el fiscal delegado autonómico y el del Subsector especialmente con el provincial.","Las visitas mínimas son trimestrales; ambos contactan exclusivamente con el fiscal delegado autonómico.","Las visitas se realizan solo por incidencias; el contacto trimestral con fiscalía sustituye la inspección de bases."],"answer":1,"explanation":"El Oficial Jefe del Sector visita todas sus UNIS al menos trimestralmente, con conocimiento del Jefe del Subsector, y contacta al menos trimestralmente con el fiscal delegado autonómico. El de Sector uniprovincial/Subsector visita las bases EIS, EPRAT y GIAT al menos trimestralmente y contacta especialmente con el fiscal delegado provincial.","source":{"document":"Temario original","page":8,"section":"1.1.1.3; 1.1.1.13 (p. 9); 1.1.2.5 y 1.1.2.13 (pp. 10–11)"},"origin":"esencial","conceptIds":["T008","T009","T016","T014","S117"]},{"id":"c013","topic":"UNIS","type":"convencional","question":"Ante supuestos de mayor relevancia penal o técnica, o de investigación prolongada, el Oficial Jefe de UNIS de Subsector determina la intervención de:","options":["El EPRAT o el GIAT","El ERAT o el DIRAT","La Policía Judicial de la Comandancia","El SEPRONA"],"answer":0,"explanation":"1.1.2.11: determinando la intervención del EPRAT o del GIAT, coordinando las actuaciones.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"essUD03","topic":"UNIS","type":"convencional","question":"Antes de remitir informes técnicos EIS y periciales EPRAT a la autoridad judicial, ¿cómo se reparten la conformidad y el visto bueno en la UNIS de Subsector?","options":["El Oficial Jefe da conformidad y el 2.º Jefe da el visto bueno, sin enviar copia a la UNIS del Sector.","El instructor da ambos trámites; el Oficial Jefe interviene solo si la autoridad judicial formula objeciones.","El 2.º Jefe da conformidad y el Oficial Jefe da el visto bueno; este envía copia al Jefe de la UNIS del Sector.","El 2.º Jefe da conformidad solo a periciales EPRAT; los informes técnicos EIS se remiten sin revisión de la UNIS."],"answer":2,"explanation":"El 2.º Jefe da conformidad a todos los informes técnicos EIS y periciales EPRAT. El Oficial Jefe de Sector uniprovincial/Subsector da el visto bueno antes de la remisión, tras la revisión del equipo tutor cuando corresponda, da cuenta al mando y envía copia al Jefe de la UNIS del Sector. El visto bueno del Oficial Jefe del Sector a los periciales de su EPRAT establece doble supervisión.","source":{"document":"Temario original","page":10,"section":"1.1.2.10; 1.2.1.7 (p. 13); 1.1.1.5 (p. 8)"},"origin":"esencial","conceptIds":["T024","S112","T025","T086"]},{"id":"s17","topic":"UNIS","type":"convencional","options":["Mejorar la calidad de atestados e informes técnicos EIS y asesorar y auxiliar al jefe de UNIS en el servicio.","Asesorar al jefe en necesidades de servicio y concentrar el control técnico en los informes periciales EPRAT.","Garantizar la calidad de documentos EIS y asesorar al jefe, reservando la inspección y control al oficial.","Mantener la calidad de los atestados EIS y asumir la dirección orgánica de sus equipos y áreas funcionales."],"answer":0,"explanation":"Su misión combina la calidad de los documentos EIS y el asesoramiento y auxilio al jefe de la UNIS para impulsar, inspeccionar, controlar y mejorar el servicio.","source":{"page":12,"section":"1.2. Funciones de los suboficiales segundos jefes de las UNIS: misión principal","document":"Temario original"},"question":"¿Qué actuación refleja mejor la misión principal del suboficial segundo jefe de una Unidad de Investigación de Seguridad Vial (UNIS)?","origin":"original","conceptIds":["T017","T018","S105"]},{"id":"s18","topic":"UNIS","type":"incorrecta","options":["Utiliza, como norma general, uniforme de servicio y adapta su actividad a necesidades relevantes o complejas.","Depende orgánicamente del jefe de Subsector y funcionalmente de un delegado suyo distinto del jefe de UNIS.","Depende orgánica y funcionalmente del jefe de la UNIS del Sector o Subsector, con supervisión técnica y operativa.","Presta servicio en la residencia de la UNIS, principalmente en horario de labores burocráticas."],"answer":1,"explanation":"La instrucción atribuye ambas dependencias, orgánica y funcional, al jefe de UNIS de Sector/Subsector. La separación propuesta en la opción incorrecta no corresponde a este puesto.","source":{"page":12,"section":"1.2.1.1 y 1.2.1.2. Dependencia y prestación del servicio del suboficial segundo jefe de UNIS","document":"Temario original"},"question":"Respecto a la dependencia y la prestación ordinaria del servicio del suboficial segundo jefe de una UNIS, ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":["T019","T020","S106","S107"]},{"id":"s19","topic":"UNIS","type":"convencional","options":["Al jefe del GIAT, que coordina los servicios de las distintas áreas funcionales.","Al responsable del EPRAT, bajo la supervisión técnica del oficial de Investigación.","Al suboficial segundo jefe de la UNIS, para todos los integrantes de la unidad.","Al suboficial responsable de cada EIS, dentro del planeamiento general de la UNIS."],"answer":2,"explanation":"El cometido de planificar y nombrar el servicio de todos los integrantes de la UNIS se asigna expresamente al suboficial segundo jefe.","source":{"page":12,"section":"1.2.1.4. Planificación y nombramiento del servicio de la UNIS","document":"Temario original"},"question":"En una UNIS debe planificarse y nombrarse el servicio de todos sus integrantes, asegurando su coordinación, el reparto equitativo de recursos humanos y la cobertura de necesidades. ¿A quién asigna expresamente esta función el temario?","origin":"original","conceptIds":["T022","S109"]},{"id":"essUD04","topic":"UNIS","type":"convencional","question":"El 2.º Jefe de una UNIS detecta carencias operativas y de personal en GIAT y EPRAT. ¿Qué actuación se ajusta a sus cometidos?","options":["Elevar propuestas logísticas al Jefe del Sector sin intervención del Jefe de UNIS y seleccionar por sí solo al personal de GIAT/EPRAT.","Auxiliar al Jefe con propuestas basadas en datos operativos y colaborar en la selección de personal, evaluando competencias y proponiendo formación o reciclaje.","Limitar las propuestas a material y logística; la evaluación de competencias y las necesidades formativas quedan fuera de su función.","Proponer personal al Jefe de UNIS atendiendo exclusivamente a antigüedad, sin utilizar datos ni estadísticas para las necesidades de la unidad."],"answer":1,"explanation":"El 2.º Jefe auxilia al Jefe de UNIS en las necesidades de logística, material, operativa, formación y personal, con propuestas fundamentadas en datos y estadísticas. También colabora en seleccionar y proponer personal GIAT/EPRAT, evalúa sus competencias y propone formación o reciclaje.","source":{"document":"Temario original","page":12,"section":"1.2.1.3 y 1.2.1.5. Necesidades operativas y selección del personal"},"origin":"esencial","conceptIds":["S108","S110"]},{"id":"s21","topic":"UNIS","type":"incorrecta","options":["Puede encabezar la instrucción si sustituye al oficial, pero no como cometido propio del segundo jefe.","Puede encabezar la instrucción con el EIS designado cuando el jefe de UNIS lo estime por su relevancia.","Auxilia en detectar y seguir supuestos que puedan requerir elementos con mayor capacidad investigadora.","Auxilia al jefe en el despacho y supervisión de siniestros EIS de mayor relevancia penal."],"answer":0,"explanation":"Encabezar una instrucción relevante por decisión del jefe de UNIS es un cometido propio. No se condiciona a estar sustituyendo por ausencia al oficial de Investigación.","source":{"page":13,"section":"1.2.1.7 y 1.2.1.8. Supervisión e instrucción de casos relevantes","document":"Temario original"},"question":"Un siniestro vial presenta especial relevancia o complejidad y afecta a la demarcación de una UNIS. ELIGE LA OPCIÓN INCORRECTA sobre los cometidos del suboficial segundo jefe.","origin":"original","conceptIds":["S111","S112","S113"]},{"id":"m12","topic":"UNIS","type":"convencional","options":["TODAS SON INCORRECTAS","Validar solo los totales periódicos, quedando la calidad y la grabación en las bases de datos exclusivamente a cargo de cada EIS.","Difundir los escritos de interés judicial sin revisar la calidad estadística, que corresponde de forma exclusiva al oficial de Investigación.","Controlar la calidad de la estadística, asegurar la correcta grabación en las bases y la difusión de los escritos de interés judicial."],"answer":3,"explanation":"El cometido comprende las tres facetas: calidad estadística, correcta grabación en las bases y difusión de escritos de interés judicial. Las alternativas que excluyen alguna de ellas recortan una función expresamente atribuida al segundo jefe.","source":{"page":13,"section":"1.2.1.9. Calidad estadística, grabación y difusión de escritos","document":"Temario original"},"question":"Respecto al control de datos de investigación, ¿qué cometido atribuye el temario al suboficial segundo jefe de la UNIS?","origin":"original","conceptIds":["S114"]},{"id":"essUD05","topic":"UNIS","type":"convencional","question":"¿Qué seguimiento judicial corresponde al Suboficial 2.º Jefe de la UNIS?","options":["Solo el de las citaciones propias; los resultados de las sentencias no forman parte de la supervisión operativa.","El de las comparecencias del personal, pero las sentencias se archivan sin valorar efectos sobre los procedimientos.","El de todas las causas penales de la provincia, aunque no intervenga personal de la UNIS, despachando únicamente con fiscalía.","El de las comparecencias del personal y las sentencias relevantes, valorando mejoras y despachándolas con el Jefe de la Unidad."],"answer":3,"explanation":"Debe seguir las comparecencias judiciales del personal de las UNIS y las sentencias de mayor relevancia, valorar su impacto operativo, proponer mejoras y despacharlas con el Jefe de la Unidad.","source":{"document":"Temario original","page":13,"section":"1.2.1.10. Seguimiento de comparecencias y sentencias"},"origin":"esencial","conceptIds":[]},{"id":"essUD06","topic":"UNIS","type":"convencional","question":"Tras estudiar la siniestralidad y el consumo de alcohol y drogas en su demarcación, ¿qué debe hacer el 2.º Jefe de UNIS?","options":["Elevar informes al Jefe de UNIS y proponer acciones preventivas y mejoras en la planificación del servicio.","Elevar directamente sanciones a fiscalía, sin trasladar conclusiones al Jefe de UNIS.","Limitarse a grabar los datos; las propuestas preventivas no forman parte de sus cometidos.","Proponer únicamente actuaciones judiciales sobre casos cerrados, sin utilizar los datos para planificar servicios."],"answer":0,"explanation":"Debe conocer la casuística, estudiar la estadística de siniestralidad y la problemática de alcohol y drogas. Con ese análisis eleva informes al Jefe de UNIS y propone prevención y mejoras estratégicas del servicio.","source":{"document":"Temario original","page":13,"section":"1.2.1.11. Casuística, siniestralidad, alcohol y drogas"},"origin":"esencial","conceptIds":[]},{"id":"revUNIS01","topic":"UNIS","type":"correcta","options":["Realizar por sí solo todas las visitas trimestrales y limitar la intervención del Jefe de la UNIS a recibir el acta.","Acompañar al Jefe de la UNIS únicamente a las bases EIS, quedando EPRAT y GIAT fuera de este cometido.","Participar solo para revisar material y dependencias, sin realizar observaciones sobre la operativa de los equipos.","Acompañar al Jefe de la UNIS cuando este lo estime oportuno, realizar observaciones técnicas y detectar mejoras en la operativa."],"answer":3,"explanation":"El segundo jefe acompaña al Jefe de la UNIS cuando este lo estime oportuno en las visitas periódicas a las bases de EIS, EPRAT y GIAT. Su participación incluye observaciones técnicas y detección de oportunidades de mejora operativa; no sustituye por regla general al jefe ni se limita a revisar material.","source":{"document":"Temario original","page":13,"section":"1.2.1.12. Acompañamiento del Suboficial 2.º Jefe en visitas periódicas a las bases"},"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a las visitas a las bases de EIS, EPRAT y GIAT, ¿qué cometido tiene el Suboficial 2.º Jefe de la UNIS?","origin":"ampliación","conceptIds":[]},{"id":"m06","topic":"UNIS","type":"correcta","options":["Participa en las dirigidas a EIS, mientras la colaboración en las de GIAT, EPRAT y motoristas queda fuera de su cometido.","Participa en las relacionadas con EIS y auxilia en las de EPRAT, GIAT y motoristas, impartiendo formación en las materias previstas.","Limita su colaboración a recopilar legislación para el jefe, sin intervenir directamente en la formación sobre siniestralidad y atestados.","TODAS SON CORRECTAS"],"answer":1,"explanation":"La función formativa incluye participar en materias relacionadas con EIS y auxiliar en EPRAT, GIAT y motoristas; además, impartir formación en siniestralidad vial, atestados y delitos contra la seguridad vial. Las otras alternativas recortan ese alcance.","source":{"page":13,"section":"1.2.1.13. Acciones formativas de unidad","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En las acciones formativas de unidad, el suboficial segundo jefe de la UNIS:","origin":"original","conceptIds":["S118"]},{"id":"s23","topic":"UNIS","type":"correcta","options":["El jefe de UNIS determina el apoyo y sus cometidos quedan fijados en la orden diaria del servicio.","El jefe de UNIS determina el apoyo del GIAT y el Subsector asigna por separado el del EPRAT.","El jefe de UNIS determina el personal de apoyo y sus cometidos se reflejan en el Plan Anual.","El segundo jefe elige el personal de apoyo y registra sus cometidos en cada orden de servicio."],"answer":2,"explanation":"La decisión sobre el apoyo corresponde al jefe de UNIS y sus cometidos deben figurar en el Plan Anual. No se limita el apoyo al GIAT.","source":{"page":13,"section":"1.2.1.14. Personal de apoyo y Plan Anual de la UNIS","document":"Temario original"},"question":"El suboficial segundo jefe de una UNIS necesita apoyo de personal para desarrollar sus funciones. ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":["S119"]},{"id":"essUD07","topic":"UNIS","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. En relación con su capacitación y la elaboración de expedientes, el 2.º Jefe de UNIS:","options":["Recibe formación únicamente cuando sustituye al Oficial de Investigación y elabora solo informes estadísticos.","Debe recibir formación actualizada y realizar o auxiliar en los expedientes e informes que se le encomienden.","Puede impartir formación, pero recibirla queda limitado al periodo anterior a su nombramiento.","Auxilia en expedientes solamente si son judiciales y deja la actualización de procedimientos a los EIS."],"answer":1,"explanation":"Recibe la formación necesaria para sus funciones, manteniéndose actualizado en procedimientos, normas y herramientas. Además, realiza y auxilia en los expedientes e informes que se le encomienden.","source":{"document":"Temario original","page":13,"section":"1.2.1.15 y 1.2.1.16 (continúa en p. 14). Formación y expedientes"},"origin":"esencial","conceptIds":[]},{"id":"s22","topic":"UNIS","type":"convencional","options":["Que suceda al oficial únicamente en la elaboración de estadísticas, sin otras responsabilidades.","Que le suceda, asumiendo las funciones y responsabilidades inherentes al puesto.","Que atienda solo asuntos administrativos y deje pendientes las funciones técnicas del oficial.","Que se limite a informar al jefe de Sector, sin asumir ninguna función del ausente."],"answer":1,"explanation":"La sucesión prevista no se limita a un área concreta: en ausencia de los oficiales de Investigación, el segundo jefe asume las funciones y responsabilidades inherentes.","source":{"page":14,"section":"1.2.1.17. Sucesión a los oficiales de Investigación en sus ausencias","document":"Temario original"},"question":"El oficial de Investigación de una UNIS de Sector o Subsector está ausente. ¿Qué prevé el temario respecto al suboficial segundo jefe de la UNIS?","origin":"original","conceptIds":["T023","S122"]},{"id":"essUD08","topic":"UNIS","type":"convencional","question":"¿Qué combinación recoge responsabilidades del Suboficial 2.º Jefe de UNIS sobre otros cometidos y los medios del servicio?","options":["Asume únicamente tareas enumeradas y limita el control de medios a los vehículos del EIS.","Acepta otros cometidos solo de la autoridad judicial y delega todo control de dependencias en los equipos.","Realiza otros cometidos expresamente encomendados por el Jefe de UNIS y supervisa el estado y uso de medios, dependencias y elementos del servicio.","Realiza cualquier tarea solicitada por terceros y controla los medios únicamente cuando se produce una avería."],"answer":2,"explanation":"Además de las funciones descritas, cumple otros cometidos que le encomiende expresamente el Jefe de UNIS y supervisa el correcto estado y uso de los medios, las dependencias y los demás elementos del servicio.","source":{"document":"Temario original","page":14,"section":"1.2.1.18 y 1.2.1.19. Otros cometidos y supervisión de medios"},"origin":"esencial","conceptIds":["S124","S123"]},{"id":"tnew03","topic":"UNIS","type":"correcta","options":["Su cometido se limita a impulsar puntos de verificación en días laborables.","Impulsa esos puntos solo mediante personal GIAT, sin participación de los EIS.","Impulsa la presencia de los EIS en puntos de verificación de fines de semana.","La prestación principalmente burocrática excluye impulsar servicios de los EIS en carretera."],"answer":2,"explanation":"Además de servir principalmente en horario burocrático, el Suboficial 2.º Jefe debe impulsar el servicio en carretera de los EIS en puntos de verificación de fines de semana.","source":{"page":12,"section":"1.2.1.2. Suboficial 2.º Jefe: servicio en carretera","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T021"],"question":"ELIGE LA OPCIÓN CORRECTA. Respecto al servicio en carretera que impulsa el Suboficial 2.º Jefe de una UNIS:","origin":"ampliación"},{"id":"c011","topic":"UNIS","type":"convencional","question":"¿Cuándo asume el Oficial Jefe de la UNIS de Subsector la instrucción de diligencias en siniestros de especial relevancia?","options":["Cuando lo solicite expresamente el instructor del Equipo de Atestados","Cuando lo ordene el Fiscal Delegado de Seguridad Vial","Cuando lo determine el Jefe del Sector/Subsector o un superior","Siempre que en el siniestro resulte algún fallecido"],"answer":2,"explanation":"Literal: «Cuando así lo determine el Jefe del Sector/Subsector o un superior en la cadena de mando». 1.1.2.4.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T013"]},{"id":"essUD09","topic":"Atestados y reconstrucción","type":"convencional","question":"¿Qué relación entre misión y dependencia de los Equipos de Atestados es correcta?","options":["Investigan como policía administrativa y dependen orgánica y funcionalmente del fiscal de seguridad vial.","Investigan como policía judicial, bajo dirección técnica y funcional del Suboficial Encargado de EA; orgánicamente dependen de su unidad de destino.","Investigan como policía judicial y toda su dependencia corresponde a COTA, al margen de sus unidades de destino.","Investigan solo siniestros sin relevancia penal y reciben la dirección técnica del Jefe de Destacamento en todos los casos."],"answer":1,"explanation":"La misión principal es investigar siniestros como policía judicial, confeccionar atestados e informes e instruir delitos de seguridad vial u otros derivados de la conducción. La dirección técnica y funcional es del Suboficial Encargado de EA, delegado del Jefe del Subsector; la dependencia orgánica sigue en la unidad de destino.","source":{"document":"Temario original","page":14,"section":"2. Cometidos de los Equipos de Atestados: antecedentes y misión"},"origin":"esencial","conceptIds":["T026","T028","T030","T027","T029"]},{"id":"essUD10","topic":"Atestados y reconstrucción","type":"convencional","question":"¿Qué clasificación de cometidos de los Equipos de Atestados se ajusta al temario?","options":["Específico: análisis de accidentalidad; genérico: informes de incidencias viarias; común: investigación de siniestros complejos.","Específico: cualquier PVA/D; genérico: siniestros complejos; común: informes de incidencias viarias.","Específico: siniestros complejos e informes de incidencias viarias; genérico: análisis de accidentalidad; común: participación en PVA/D.","Específico: vigilancia ordinaria de carreteras; genérico: PVA/D; común: atestados de siniestros complejos."],"answer":2,"explanation":"Hay cometidos específicos, genéricos y comunes de la especialidad. Son específicos los que exigen la capacidad técnica o procedimental del EA, incluidos siniestros complejos y los informes de incidencias viarias. El análisis de accidentalidad es genérico; los PVA/D son comunes.","source":{"document":"Temario original","page":15,"section":"2.1 a 2.3. Clasificación; informes de carreteras (p. 17), análisis (p. 18) y PVA/D (p. 19)"},"origin":"esencial","conceptIds":["T035","T040","T046","T048","T036","T037"]},{"id":"essUD11","topic":"Atestados y reconstrucción","type":"convencional","question":"Tras un siniestro complejo o con posible relevancia penal, ¿cómo se organiza la dedicación del instructor y secretario del Equipo de Atestados?","options":["Cinco servicios exclusivos; pueden interrumpirse por otro siniestro complejo/relevante o por los dispositivos de alcohol/drogas previstos y se recuperan inmediatamente después.","Cinco días naturales exclusivos; cualquier servicio ordinario interrumpe el plazo sin necesidad de recuperarlo.","Tres servicios exclusivos; se amplían a cinco solo si el juzgado reclama nuevas diligencias.","Cinco servicios exclusivos para el instructor; el secretario mantiene toda su actividad ordinaria y los servicios interrumpidos se pierden."],"answer":0,"explanation":"Ambos disponen de los cinco servicios posteriores para esclarecer el siniestro y terminar diligencias con calidad. Solo justifican interrupción otro siniestro complejo o de posible relevancia penal y los controles nocturnos de alcohol/drogas previos a sábado, domingo o festivo, u otros similares imposibles sin participación expresa del EA. Los servicios interrumpidos se recuperan inmediatamente después.","source":{"document":"Temario original","page":15,"section":"2.1.1. Dedicación exclusiva e interrupciones (continúa en p. 16)"},"origin":"esencial","conceptIds":["T031","T032","T033","T034","T037"]},{"id":"c044","topic":"Atestados y reconstrucción","type":"convencional","question":"En siniestros competencia de los motoristas, los EA realizan:","options":["La atención in situ e inmediata del siniestro en la vía","La instrucción completa del atestado desde el primer momento, en el lugar","Únicamente el reportaje fotográfico y el croquis del siniestro","Las gestiones posteriores: heridos, decl
