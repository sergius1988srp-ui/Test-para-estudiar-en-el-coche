araciones y pruebas en hospital"],"answer":3,"explanation":"Literal: «Las gestiones posteriores (identificar heridos, declaraciones, pruebas de alcohol/drogas en centros sanitarios)». 2.1.2: preservar la actividad fundamental de los motoristas más allá de la atención in situ.","source":{"page":16,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T038"]},{"id":"c049","topic":"Atestados y reconstrucción","type":"convencional","question":"El apoyo de los EA a investigaciones ajenas a la ATGC (homicidios dolosos con vehículo, pruebas deportivas…) requiere:","options":["Solicitud previa de colaboración y autorización del jefe del subsector","Orden directa y por escrito de la Autoridad Judicial que instruye la causa","Autorización expresa del Área de Operaciones de la Agrupación","Petición escrita del Jefe de la Comandancia de la provincia"],"answer":0,"explanation":"Literal: «Previa solicitud de colaboración y autorización del jefe del subsector». 2.1.5.","source":{"page":17,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T041"]},{"id":"essUD12","topic":"Atestados y reconstrucción","type":"convencional","question":"En las informaciones verbales por siniestros de vehículos o personal del Cuerpo, ¿cómo varía el apoyo de los EA según haya víctimas?","options":["Con víctimas apoyan siempre al oficial de la unidad territorial; sin víctimas instruyen solos y no necesitan requerimiento.","Con y sin víctimas apoyan exclusivamente al oficial de la ATGC, aunque no se haya requerido su intervención.","Con víctimas apoyan al oficial de la ATGC; sin víctimas, al oficial de la unidad territorial que la instruya, si se les requiere.","Con víctimas el apoyo corresponde solo a motoristas; los EA intervienen únicamente si no hay víctimas."],"answer":2,"explanation":"En accidentes con víctimas y vehículos o personal del Cuerpo, los EA apoyan al oficial de la ATGC que instruye la información verbal. En los accidentes sin víctimas apoyan al oficial de la unidad territorial que la instruya, cuando sean requeridos.","source":{"document":"Temario original","page":17,"section":"2.1. Cometidos específicos: apoyo a informaciones verbales con y sin víctimas"},"origin":"esencial","conceptIds":["T042"]},{"id":"tnew04","topic":"Atestados y reconstrucción","type":"incorrecta","options":["No deben concurrir circunstancias extraordinarias que aconsejen la intervención especializada del EA.","La existencia de un concurso de delitos es una de las circunstancias extraordinarias que se deben valorar.","La intervención de extranjeros figura entre los ejemplos de circunstancias extraordinarias del temario.","La intervención de menores o la concurrencia de requisitorias nunca afecta a la valoración de la sencillez."],"answer":3,"explanation":"La sencillez no se valora solo por el tipo de delito: requisitoriados, menores, extranjeros o concurso de delitos son ejemplos de circunstancias extraordinarias que pueden aconsejar la intervención de los EA.","source":{"page":18,"section":"2.2.2. Instrucción de delitos contra la seguridad vial sencillos","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T045"],"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a los delitos contra la seguridad vial sencillos como cometido genérico de los Equipos de Atestados:","origin":"ampliación"},{"id":"essUD13","topic":"Atestados y reconstrucción","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. En materia de reconstrucción de siniestros por Equipos de Atestados:","options":["Cualquier cálculo de velocidad de un informe técnico convierte el documento en pericial y habilita al EA sin autorización.","La autorización del Jefe del Subsector basta siempre para un pericial; la formación universitaria es requisito obligatorio sin excepciones.","El EA puede emitir periciales sin designación si el siniestro tuvo fallecidos, y todos los cálculos de velocidad son periciales.","El pericial requiere autorización o designación expresa del Área de Operaciones; se prefiere personal con el curso de experto, y calcular velocidad no convierte un informe técnico en pericial."],"answer":3,"explanation":"Los periciales de reconstrucción de EA requieren autorización o designación expresa del Área de Operaciones. Se prefiere personal con el Curso de Experto Universitario en Reconstrucción de Siniestros Viales. Los estudios de velocidad incluidos en informes técnicos no son por ello informes periciales y tienen regulación propia.","source":{"document":"Temario original","page":16,"section":"2.1.1. Informes periciales de reconstrucción y estudios de velocidad"},"origin":"esencial","conceptIds":["T051","T052","T053"]},{"id":"essUD14","topic":"Atestados y reconstrucción","type":"convencional","question":"¿Qué distribución de sede y dependencia distingue al ERAT del DIRAT?","options":["ERAT: Madrid y dependencia orgánica/funcional de Operaciones; DIRAT: Escuela de Tráfico de Mérida, dependencia orgánica de la Escuela y funcional de Operaciones en tareas no docentes de reconstrucción.","ERAT: Mérida y dependencia orgánica de la Escuela; DIRAT: Madrid y dependencia orgánica y funcional de Operaciones.","Ambos: Madrid y dependencia orgánica de la Escuela de Tráfico, con dependencia funcional del Jefe del Sector de intervención.","ERAT: Madrid, dependencia del Jefe del Subsector; DIRAT: Mérida y dependencia orgánica y funcional de la Escuela incluso en reconstrucción no docente."],"answer":0,"explanation":"El ERAT está en Madrid y depende orgánica y funcionalmente del Área de Operaciones. El DIRAT tiene sede en la Escuela de Tráfico de Mérida y depende orgánicamente de ella; en actividades no docentes de reconstrucción depende funcionalmente de Operaciones.","source":{"document":"Temario original","page":20,"section":"Equipos de Reconstrucción: 1. Estructura, ERAT y DIRAT"},"origin":"esencial","conceptIds":["T054","T055"]},{"id":"essUD15","topic":"Atestados y reconstrucción","type":"convencional","question":"Para solicitar apoyo de un Equipo de Reconstrucción, ¿qué diferencia hay entre la vía urgente y la no urgente?","options":["La urgente se solicita directamente por el instructor al DIRAT; la no urgente la autoriza únicamente el Jefe del Subsector.","Ambas siguen la cadena de mando: en urgente el Jefe del Sector contacta con el Jefe de Operaciones, que decide; en no urgente se tramita por Sectores al Negociado de Atestados de Operaciones.","La urgente la decide COTA; la no urgente se cursa desde el EA directamente a la Escuela de Tráfico.","En urgente la decisión corresponde al Jefe del Sector sin intervención de Operaciones; en no urgente se solicita exclusivamente a fiscalía."],"answer":1,"explanation":"Las dos solicitudes siguen la cadena de mando. En urgentes, el Jefe del Sector contacta con el Jefe del Área de Operaciones, que decide la intervención. Las no urgentes se elevan a través de los Sectores al Negociado de Atestados del Área de Operaciones.","source":{"document":"Temario original","page":21,"section":"3.2. Solicitud de Equipos de Reconstrucción: urgente y no urgente (continúa en p. 22)"},"origin":"esencial","conceptIds":["T056","T057"]},{"id":"c066","topic":"Atestados y reconstrucción","type":"convencional","question":"Aunque no hayan concluido todos sus cometidos específicos y genéricos, ¿en qué supuesto pueden participar los Equipos de Atestados en dispositivos operativos de control?","options":["Únicamente cuando ya no exista ninguna diligencia pendiente en todo el Subsector","En controles nocturnos de alcohol y drogas previos a sábado, domingo o festivo, u otros dispositivos similares que requieran expresamente su participación","En cualquier control diurno ordinario, aunque interfiera con una investigación compleja en dedicación exclusiva","Solo cuando el dispositivo se celebre dentro de la base del equipo"],"answer":1,"explanation":"La participación ordinaria en PVA/D exige que estén finalizados los cometidos específicos y genéricos, pero el manual mantiene la excepción de controles nocturnos previos a sábado, domingo o festivo y otros dispositivos similares que no puedan desarrollarse sin participación expresa del EA. Si interrumpen dedicación exclusiva, sus servicios se recuperan inmediatamente.","source":{"page":19,"section":"Cometidos comunes: PVA/D, excepción conectada con la dedicación exclusiva descrita en la página 16","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"essUD16","topic":"Atestados y reconstrucción","type":"convencional","question":"Respecto a las prioridades de los Equipos de Atestados, ¿qué afirmación es correcta?","options":["Los cometidos genéricos se realizan antes que los específicos y la reserva del mando puede desplazar cualquier investigación.","La vigilancia de carreteras tiene prioridad sobre toda diligencia pendiente, porque es un cometido común de la especialidad.","Los genéricos se realizan cuando no hay específicos preferentes; la vigilancia o reserva del mando exige no interferir en los específicos o genéricos.","Los específicos solo tienen prioridad si hay fallecidos; en los demás casos se asignan todos los servicios indistintamente."],"answer":2,"explanation":"Los cometidos específicos tienen preferencia. Los genéricos se realizan cuando no hay específicos preferentes, y otros siniestros se distribuyen buscando eficiencia global con motoristas. La vigilancia de carreteras o la reserva del mando no debe interferir en cometidos específicos ni genéricos.","source":{"document":"Temario original","page":17,"section":"2.2. Genéricos; 2.3. Comunes: vigilancia y reserva (p. 19)"},"origin":"esencial","conceptIds":["T043","T044","T047","T049"]},{"id":"essUD17","topic":"Siniestros y documentación","type":"convencional","question":"En la asignación inicial de modalidad ante un siniestro vial, ¿qué criterio comparten los casos con fallecidos y con al menos un herido inicialmente grave?","options":["Corresponden a motoristas si el conductor responsable acepta su responsabilidad.","La modalidad la elige siempre COTA sin criterio por el resultado lesivo.","Los fallecidos corresponden a EIS, pero cualquier herido grave corresponde exclusivamente a motoristas.","En ambos interviene el EIS, sin perjuicio de reajustar la asignación al disponer de información más completa."],"answer":3,"explanation":"Los siniestros con fallecidos y los que presentan inicialmente al menos un herido grave se asignan al EIS. La asignación inicial puede ajustarse conforme la información aumenta y se consolida.","source":{"document":"Temario original","page":25,"section":"3.1. Criterios generales de intervención: fallecidos y heridos graves"},"origin":"esencial","conceptIds":["T059","T058"]},{"id":"essUD18","topic":"Siniestros y documentación","type":"convencional","question":"Sin otras circunstancias especiales, ¿cómo se compara la intervención en siniestros con heridos leves y en los de solo daños materiales sin relevancia penal?","options":["Heridos leves: determina el mando conforme al plan anual; solo daños sin relevancia penal: motoristas, salvo previsión del plan anual o COTA.","Heridos leves: EIS obligatoriamente; solo daños sin relevancia penal: el mando elige siempre EIS.","Heridos leves: motoristas obligatoriamente; solo daños sin relevancia penal: EIS si hay varios vehículos.","En ambos interviene siempre el EIS, porque cualquier daño puede acabar judicializado."],"answer":0,"explanation":"En heridos leves la modalidad se determina por el mando conforme al plan anual. Para solo daños materiales sin relevancia penal intervienen motoristas, salvo otra previsión del plan anual o COTA. Los criterios específicos concurrentes deben valorarse.","source":{"document":"Temario original","page":26,"section":"3.1. Criterios generales de intervención: heridos leves y daños materiales"},"origin":"esencial","conceptIds":["T060","T062"]},{"id":"essUD19","topic":"Siniestros y documentación","type":"convencional","question":"¿Qué grupo de actuaciones corresponde al EIS según los criterios de intervención en siniestros?","options":["Solo daños sin relevancia penal; pruebas deportivas sin circunstancias especiales; cualquier herido leve.","Siniestros ferroviarios, daños materiales con posible relevancia penal por su valor y apoyo a otras unidades en homicidios, asesinatos o suicidios relacionados con vehículos.","Solo siniestros con fallecidos; quedan fuera los ferroviarios sin víctimas y el apoyo a otras unidades.","Mercancías peligrosas sin otros criterios concurrentes; cualquier daño leve; todos los transportes escolares."],"answer":1,"explanation":"El EIS interviene en siniestros en vías férreas, en daños materiales con posible relevancia penal por su valor y en apoyo a otras unidades por homicidios, asesinatos o suicidios relacionados con vehículos. No debe confundirse con las modalidades decididas según el plan anual para ciertos transportes o actividades.","source":{"document":"Temario original","page":26,"section":"3.1. Criterios generales de intervención: supuestos específicos EIS"},"origin":"esencial","conceptIds":["T061","T064","T066"]},{"id":"essUD20","topic":"Siniestros y documentación","type":"convencional","question":"Si no hay fallecidos, heridos graves ni otro criterio que imponga EIS, ¿cómo se decide la modalidad en siniestros de mercancías peligrosas, transporte escolar, autoridades o pruebas deportivas?","options":["Interviene necesariamente EIS por la actividad del vehículo, sin atender al plan anual.","Intervienen necesariamente motoristas por no haber heridos graves o fallecidos.","La determina el mando conforme al plan anual de los Equipos de Atestados.","La decide el Centro de Gestión de Tráfico conforme al protocolo de transportes especiales."],"answer":2,"explanation":"El temario remite esos supuestos a la determinación del mando conforme al plan anual de los EA. Si concurre además un criterio como fallecidos o heridos graves, este puede exigir EIS.","source":{"document":"Temario original","page":26,"section":"3.1. Criterios generales de intervención: mercancías peligrosas, escolar, autoridades y pruebas deportivas"},"origin":"esencial","conceptIds":["T063"]},{"id":"revREQ05","topic":"Siniestros y documentación","type":"convencional","options":["El EIS en el de servicio y motoristas en el ocurrido fuera de servicio.","Motoristas en el de servicio y el EIS en el ocurrido fuera de servicio.","La que determine el mando conforme al plan anual en ambos supuestos, sin criterio específico por tratarse de vehículos oficiales.","El Equipo de Investigación de Siniestros en ambos supuestos."],"answer":3,"explanation":"Los criterios generales de intervención asignan al Equipo de Investigación de Siniestros los siniestros de componentes de la ATGC de servicio o fuera de servicio con vehículos oficiales. El supuesto de otro personal del Cuerpo distinto de la ATGC tiene su remisión específica a las instrucciones GAVO.","source":{"document":"Temario original","page":26,"section":"3.1. Criterios generales de intervención: siniestros de componentes de la ATGC de servicio o fuera de servicio con vehículos oficiales"},"question":"Un componente de la ATGC sufre un siniestro de servicio con un vehículo oficial y otro componente lo sufre fuera de servicio, también con un vehículo oficial. Según el criterio específico del temario, ¿qué modalidad interviene?","origin":"ampliación","conceptIds":[]},{"id":"essUD21","topic":"Siniestros y documentación","type":"convencional","question":"Un siniestro corresponde inicialmente a motoristas y concurre un delito contra la seguridad vial. ¿Cuándo puede seguir instruyéndolo esa patrulla por considerarse de instrucción simple?","options":["Solo por alcoholemia objetivada, aunque se pida prueba de contraste o asistencia letrada.","En cualquier delito contra la seguridad vial si no hay fallecidos, aunque intervengan menores o se necesite intérprete.","Únicamente por carecer de permiso; la negativa a la prueba siempre exige EIS, aunque no haya otras circunstancias.","Por alcoholemia objetivada, carecer de permiso o negativa a la prueba, sin excepciones como contraste, letrado, intérprete o menores; si deja de ser simple, interviene EIS."],"answer":3,"explanation":"La instrucción simple comprende esos tres delitos cuando no concurre ninguna excepción prevista. Prueba de contraste, asistencia letrada, intérprete e intervención de menores son excepciones. Si el delito no es simple, el criterio atribuye la intervención a EIS.","source":{"document":"Temario original","page":26,"section":"3.1. Criterios generales: delito de instrucción simple, nota 14"},"origin":"esencial","conceptIds":["T067","T068","T069"]},{"id":"c077","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro con solo daños o lesiones leves sin indicios de delito. ¿Qué se elabora?","options":["FODA, en papel o con el aplicativo TRAMO","Atestado completo conforme al procedimiento AGT01","Informe Técnico ITI02 y diligencias a prevención","Acta DCV01 y diligencia ASV03 del siniestro"],"answer":0,"explanation":"En siniestros con solo daños materiales o lesiones leves sin indicios de delito se elabora el Formulario de Obtención de Datos en Accidente (FODA), en papel o mediante TRAMO.","source":{"page":28,"section":"Documentación a confeccionar: solo daños materiales o lesiones leves sin indicios de delito","document":"Temario original"},"origin":"complementario","conceptIds":["T073"]},{"id":"essUD22","topic":"Siniestros y documentación","type":"convencional","question":"En lesiones graves por imprudencia menos grave, sin otros indicios de delito vial, ¿qué combinación de prevención y paso a atestado es válida?","options":["Se instruye de oficio atestado e ITI02 en todos los casos, sin esperar denuncia ni orden judicial o fiscal.","Se recogen FODA, inspección de la vía con croquis, lesiones y fotografías; el EIS elabora atestado con esos datos si hay denuncia del agraviado/representante u orden judicial o fiscal.","Se recoge solo FODA y se destruye al mes; la denuncia del agraviado no modifica la documentación.","No se documenta hasta recibir denuncia y solo el juzgado, nunca fiscalía, puede ordenar elaborar el atestado."],"answer":1,"explanation":"Estas lesiones requieren denuncia del agraviado o representante legal. A prevención se recogen FODA para CASUS JUZ, inspección técnico-ocular de la vía con croquis, informe de lesiones y fotografías de vehículos. Si hay denuncia u orden judicial o fiscal, el EIS elabora atestado con los datos archivados. La supervisión corresponde al Oficial Jefe o al 2.º Jefe de UNIS. No se exige ITI02 sin fallecido.","source":{"document":"Temario original","page":28,"section":"6.2. Lesiones graves por imprudencia menos grave; supervisión en p. 29"},"origin":"esencial","conceptIds":["T074","T079","T075","T078","T076","T077","T080"]},{"id":"revREQ03","topic":"Siniestros y documentación","type":"convencional","options":["Se añade únicamente un informe CASUS SIM a las diligencias a prevención, sin instruir atestado.","Se instruye el atestado correspondiente con detención o investigación del conductor responsable.","Se confecciona obligatoriamente ITI02 en sustitución del atestado, aunque no se haya producido ningún fallecimiento.","Se mantienen exclusivamente las diligencias a prevención hasta que la persona lesionada denuncie, también respecto al delito contra la seguridad vial."],"answer":1,"explanation":"El procedimiento de diligencias a prevención para lesiones graves por imprudencia menos grave se contempla siempre que no se aprecien indicios de delitos contra la seguridad vial. Si los hay, la instrucción exige el atestado correspondiente con detención o investigación del conductor responsable.","source":{"document":"Temario original","page":29,"section":"6.2. Lesiones graves por imprudencia menos grave: excepción cuando se aprecian indicios de delitos contra la seguridad vial"},"question":"En un siniestro con lesiones graves por imprudencia menos grave se aprecian, además, indicios de un delito contra la seguridad vial. ¿Cómo afecta esto al procedimiento de diligencias a prevención previsto para aquellos casos?","origin":"ampliación","conceptIds":[]},{"id":"c092","topic":"Siniestros y documentación","type":"convencional","question":"Lesiones graves por imprudencia GRAVE en persona distinta del conductor responsable:","options":["Diligencias a prevención a la espera de denuncia del agraviado","Solo FODA, salvo que el lesionado o su representante presente denuncia posterior ante el juez","Informe Técnico ITI02 sin atestado, por no haber fallecidos","Atestado por imprudencia grave; delito público con detención o investigación"],"answer":3,"explanation":"Literal: «Atestado por siniestro vial por imprudencia grave; delito público, con detención o investigación del responsable». Tabla, punto 6.2.2.","source":{"page":29,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T081"]},{"id":"c079","topic":"Siniestros y documentación","type":"convencional","question":"Fallecen personas distintas del conductor responsable (imprudencia grave o menos grave). ¿Qué se hace?","options":["Solo FODA e informe CASUS, por ser delito privado","Atestado sin Informe Técnico, salvo que lo pida el juez","Atestado e Informe Técnico; delito público perseguible de oficio","Diligencias a prevención, esperando la denuncia de los familiares"],"answer":2,"explanation":"Literal: «Atestado por siniestro vial con el resultado de X fallecidos e Informe Técnico; delito público perseguible de oficio». Tabla de documentación, punto 6.3.1.","source":{"page":29,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T082"]},{"id":"c080","topic":"Siniestros y documentación","type":"convencional","question":"Si fallece el conductor responsable del siniestro, aunque haya otros fallecidos o lesionados graves:","options":["No se instruye diligencia alguna al no haber responsable","Atestado por homicidio imprudente con detención de ocupantes","Solo se cumplimenta el FODA y se archiva el asunto","No punible: atestado con X fallecidos e Informe Técnico"],"answer":3,"explanation":"Literal: «Fallecimiento no punible: atestado por siniestro vial con el resultado de X fallecidos e Informe Técnico». Tabla de documentación, punto 6.3.2.","source":{"page":30,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T083"]},{"id":"essUD23","topic":"Siniestros y documentación","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Sobre la confección y revisión del Informe Técnico ITI02 tras un siniestro vial:","options":["Se exige si fallece al menos una persona en las 24 horas siguientes; antes de remitirse necesita conformidad del 2.º Jefe y visto bueno del Oficial Jefe de UNIS.","Se exige por cualquier herido grave, aunque no fallezca; basta la firma del instructor sin revisión de UNIS.","Solo se exige si el fallecido era ajeno al vehículo responsable; la muerte del conductor excluye el informe.","Se exige ante cualquier fallecimiento hasta treinta días después; el Oficial Jefe da conformidad y el 2.º Jefe el visto bueno."],"answer":0,"explanation":"Se elabora además de las diligencias en todos los siniestros con al menos un fallecido dentro de las 24 horas siguientes, también si inicialmente era herido grave y muere dentro de ese plazo. Expone conclusiones argumentadas con pruebas documentadas y requiere conformidad del 2.º Jefe y visto bueno del Oficial Jefe de la UNIS del Subsector/Sector uniprovincial.","source":{"document":"Temario original","page":30,"section":"7. Informe Técnico ITI02; fallecimiento dentro de 24 horas en 6.2 (p. 29)"},"origin":"esencial","conceptIds":["T084","T025","T086","T085"]},{"id":"essUD24","topic":"Siniestros y documentación","type":"convencional","question":"¿Qué plazo y destinatarios corresponden al envío del Informe Técnico ITI02?","options":["Máximo quince días desde la finalización del atestado; solo al Ministerio Fiscal.","Máximo un mes desde el visto bueno; al juzgado solo si lo reclama.","No superior a un mes desde el siniestro; a la autoridad judicial y al Ministerio Fiscal.","Máximo tres meses desde el siniestro; exclusivamente a la autoridad judicial."],"answer":2,"explanation":"El ITI02 debe remitirse a la autoridad judicial y al Ministerio Fiscal en un plazo no superior a un mes desde la ocurrencia del siniestro. El cómputo no comienza con el visto bueno ni con el cierre del atestado.","source":{"document":"Temario original","page":30,"section":"7. Informe Técnico ITI02: remisión y plazo"},"origin":"esencial","conceptIds":["T087"]},{"id":"essUD25","topic":"Familiares y entrega de información","type":"convencional","question":"¿Cómo se informa de sus derechos a víctimas y perjudicados en los siniestros viales?","options":["Solo en los siniestros con fallecidos; los demás se informan cuando presenten denuncia.","En todos los siniestros; el FODA incluye la información y, si se instruye atestado, se cumplimenta el acta de derechos de implicados/representantes y se les entrega copia.","Solo si el atestado se remite al juzgado; si se conserva a su disposición queda excluida el acta de derechos.","En todos los siniestros mediante comunicación verbal, sin entregar copia del acta cuando se instruye atestado."],"answer":1,"explanation":"La información de derechos procede siempre, independientemente del resultado. En FODA está incluida en el formulario. En atestado, incluso conservado a disposición judicial sin indicios de delito público, se cumplimenta DCV01 para las personas implicadas o representantes legales y se entrega copia.","source":{"document":"Temario original","page":27,"section":"4. Información a víctimas, perjudicados y ofendidos"},"origin":"esencial","conceptIds":["T070","T071","T072"]},{"id":"essUD26","topic":"Familiares y entrega de información","type":"convencional","question":"En una actuación por siniestro ya judicializada, ¿qué acceso a la información recoge la actualización del temario?","options":["Solo se facilita el número de atestado; todo documento debe pedirse al juzgado tras su remisión.","Solo los perjudicados personados pueden recibir copia, pagando previamente la tasa correspondiente.","Las aseguradoras pueden recibir copia, pero el Consorcio queda excluido cuando el atestado esté en el juzgado.","A petición de perjudicados, aseguradoras, sus representantes y Consorcio, se facilita gratis copia del atestado o equivalente con toda la información sobre las circunstancias, incluso remitido al juzgado."],"answer":3,"explanation":"La actualización de 04/08/2025 recogida en el manual permite ese acceso gratuito a los solicitantes legitimados, incluyendo sus representantes y el Consorcio. La remisión previa a la autoridad judicial no elimina el acceso. La información se refiere a las circunstancias del accidente.","source":{"document":"Temario original","page":38,"section":"4.1. Diligencias judicializadas: contenido actualizado"},"origin":"esencial","conceptIds":["T097","T098","T099"]},{"id":"essUD27","topic":"Familiares y entrega de información","type":"convencional","question":"Una autoridad judicial requiere datos de un siniestro hasta entonces no judicializado. ¿Qué entrega y efecto corresponden?","options":["CASUS tipo autoridad judicial con FODA original en papel si existe y anexos confeccionados; se documenta la remisión y entrega, y pasa a estatus judicializado.","Solo CASUS SIM; el original de FODA se destruye y la actuación sigue sin judicializarse.","Solo ARENA2, sin oficio ni diligencia de entrega; el requerimiento no cambia el estatus.","CASUS tipo autoridad judicial sin los anexos disponibles, y solo adquiere estatus judicializado si se formula denuncia."],"answer":0,"explanation":"Se confeccionan oficio, portada, informe CASUS tipo autoridad judicial con original FODA en papel y reportaje/croquis si existen, y diligencia de entrega. Atendido el requerimiento judicial, la información adquiere estatus de judicializada.","source":{"document":"Temario original","page":38,"section":"4.2. Diligencias no judicializadas: requerimiento de autoridad judicial"},"origin":"esencial","conceptIds":["T100","T101","T102"]},{"id":"essUD28","topic":"Familiares y entrega de información","type":"convencional","question":"Una parte acredita derechos afectados por un siniestro. ¿Qué informe prevé la instrucción para su solicitud, al margen del acceso al atestado de los legitimados?","options":["CASUS tipo autoridad judicial, exclusivamente si la actuación aún no está judicializada.","ARENA2 en todos los casos, aunque CASUS funcione y el solicitante sea un particular.","Copia de CASUS simplificado SIM, aunque esté judicializado; la condición de interesado se basa en derechos afectados o representación acreditada.","Solo el número del siniestro; el interés periodístico por sí solo basta para acceder al FODA original."],"answer":2,"explanation":"Es interesado quien tiene derechos afectados, por ejemplo conductores, pasajeros, propietarios, aseguradoras o herederos; también cabe representación acreditada. Para la solicitud de parte interesada se prevé copia de CASUS SIM, aunque las diligencias estén judicializadas. El mero interés informativo no acredita esa condición.","source":{"document":"Temario original","page":39,"section":"4.2. Solicitud por parte interesada: definición y CASUS SIM"},"origin":"esencial","conceptIds":["T104","T103"]},{"id":"c103","topic":"Familiares y entrega de información","type":"convencional","question":"Si el aplicativo CASUS no está operativo y la solicitud la hace directamente una aseguradora, se entrega:","options":["Un certificado del accidente","Nada hasta que CASUS funcione","El estadístico completo ARENA2","Copia del FODA"],"answer":2,"explanation":"Si CASUS no está operativo y la solicitud ha sido cursada directamente por una compañía aseguradora, se entrega el estadístico completo ARENA2. La excepción está vinculada a esas dos condiciones.","source":{"page":39,"section":"Solicitud por parte interesada: indisponibilidad de CASUS y petición directa de aseguradora","document":"Temario original"},"origin":"complementario","conceptIds":["T105"]},{"id":"essUD29","topic":"Familiares y entrega de información","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Sobre la tramitación de solicitudes e informes de siniestros a partes interesadas:","options":["Se cursan por correo corporativo; la persona física que comparece en dependencias puede elegir el medio, se atienden otras demarcaciones y se archiva copia de las gestiones.","Se entregan solo en papel y exclusivamente si el siniestro ocurrió en la demarcación de la unidad receptora.","Se tramitan siempre por LEXNET, incluso para cualquier persona física que comparezca en dependencias.","La aseguradora que comparece físicamente queda automáticamente exenta del canal electrónico y no se registra la respuesta."],"answer":0,"explanation":"La vía prevista es electrónica mediante correo corporativo. La excepción descrita permite elegir a la persona física interesada que comparece en dependencias. Se facilitan informes de otras demarcaciones y se conserva copia registrada de solicitudes, gestiones y contestaciones en la base de atestados.","source":{"document":"Temario original","page":39,"section":"4.2. Solicitud de parte interesada: canal, demarcación y archivo"},"origin":"esencial","conceptIds":["T106","T107"]},{"id":"essUD30","topic":"Familiares y entrega de información","type":"convencional","question":"Debe comunicarse a la familia un fallecimiento en siniestro vial y vive en otra demarcación. ¿Qué actuación procede?","options":["Enviar directamente un correo con el fallecimiento para evitar la intervención de otro Subsector.","Priorizar comunicación presencial por personal idóneo, con medidas del Jefe del Subsector y coordinación entre Subsectores si corresponde a otra demarcación.","Elegir siempre la llamada telefónica, aunque sea posible la comunicación presencial.","Solicitar a la aseguradora que comunique la muerte, porque la otra demarcación excluye a la ATGC."],"answer":1,"explanation":"Se prioriza la comunicación presencial por personal adecuado por preparación o idoneidad, mediante las medidas que arbitre el Jefe del Subsector. Si la familia reside en otra demarcación, se establecen los contactos oportunos entre Subsectores.","source":{"document":"Temario original","page":34,"section":"6. Comunicación a familiares: prioridad presencial y coordinación territorial"},"origin":"esencial","conceptIds":["T091","T092","T093"]},{"id":"tnew26","topic":"Familiares y entrega de información","type":"convencional","options":["Indicar que se trata de un accidente sin importancia para conseguir que el familiar llame sin preocuparse.","Pedir contacto cuanto antes con el Subsector por un problema familiar grave, sin dejar constancia del fallecimiento.","Identificar al fallecido y describir brevemente el accidente, evitando únicamente los detalles médicos.","Comunicar el fallecimiento con precisión y pedir que la familia confirme la recepción del mensaje."],"answer":1,"explanation":"En medios escritos o grabaciones de voz no se deja constancia del fallecimiento. El mensaje se limita a pedir contacto urgente con el Subsector por un problema familiar grave.","source":{"page":34,"section":"Comunicación a familiares: medios escritos y contestadores","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T095"],"question":"No ha sido posible comunicar un fallecimiento ni presencialmente ni por teléfono y hay que dejar un mensaje en un contestador. ¿Qué contenido corresponde?","origin":"ampliación"},{"id":"tnew27","topic":"Familiares y entrega de información","type":"incorrecta","options":["No se comunica por teléfono si el interlocutor identificado es anciano.","Si el interlocutor no es adecuado, se intenta establecer contacto con otra persona más apropiada.","Puede comunicarse a un adulto que está solo al cuidado de menores por el solo hecho de ser mayor de edad.","No se comunica por teléfono si el interlocutor identificado es menor de edad."],"answer":2,"explanation":"El manual excluye comunicar por teléfono a menores, ancianos y adultos solos que en ese momento cuiden menores. Se debe intentar contactar con una persona más adecuada.","source":{"page":34,"section":"Comunicación a familiares: interlocutores excluidos de comunicación telefónica","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T096"],"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a la comunicación telefónica de un fallecimiento en accidente de tráfico:","origin":"ampliación"},{"id":"essUD31","topic":"Familiares y entrega de información","type":"convencional","question":"Al entregar datos personales de un siniestro a un solicitante legitimado, ¿qué criterio debe aplicarse?","options":["Facilitar todos los datos de las personas investigadas, aunque carezcan de relación con la finalidad de la solicitud.","Exigir siempre consentimiento de todos los implicados, aunque la entrega responda a una obligación legal.","Limitarse a datos anónimos, incluso cuando la norma autorice información necesaria para reclamar derechos.","Verificar el interés o representación y comunicar datos adecuados, pertinentes y limitados a lo necesario para la finalidad amparada por la norma."],"answer":3,"explanation":"La entrega tiene cobertura normativa para las partes legitimadas. Debe verificarse el interés o representación con medios válidos en derecho y respetarse la minimización: datos adecuados, pertinentes y limitados a lo necesario. La habilitación legal puede permitir la comunicación sin consentimiento previo en los supuestos recogidos.","source":{"document":"Temario original","page":36,"section":"2. Acreditación del interés; 3. Datos que se deben facilitar (p. 37)"},"origin":"esencial","conceptIds":[]},{"id":"tnew22","topic":"SIGO y remisión de atestados","type":"correcta","options":["Se remite por SIGO a COTA, que entrega el original en papel al perjudicado y a la aseguradora.","Se remite el PDF vía LEXNET al Juzgado, al Fiscal Delegado de Seguridad Vial provincial y al fiscal que deba actuar en el caso.","Se remite únicamente al Juzgado y se espera a que este autorice cada comunicación a fiscalía.","Se remite solo al Fiscal Delegado de Seguridad Vial; el juzgado recibe exclusivamente el informe técnico."],"answer":1,"explanation":"El manual exige remitir el PDF completo por LEXNET a los tres destinatarios: Juzgado competente, Fiscal Delegado de Seguridad Vial provincial y fiscal del caso. Lo indica tanto con conexión inicial a SIGO como sin ella.","source":{"page":32,"section":"8.2. Remisión final del atestado","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T090"],"question":"ELIGE LA OPCIÓN CORRECTA. Al finalizar un atestado por el siniestro vial regulado en el temario, respecto a la remisión de todas las diligencias:","origin":"ampliación"},{"id":"essUD32","topic":"Relación electrónica con la Administración","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA. Según el temario, sobre quién debe relacionarse electrónicamente con la Administración:","options":["Las personas jurídicas y las entidades sin personalidad jurídica están entre los sujetos obligados.","El profesional de colegiación obligatoria lo está en su actividad profesional, y también quien representa a un interesado obligado.","Todo empleado público está obligado en cualquier trámite privado, sin limitarse a actuaciones por su condición de empleado.","Las personas físicas pueden elegir el medio salvo obligación; los empleados públicos están obligados por su condición en los términos reglamentarios de cada Administración."],"answer":2,"explanation":"La obligación del empleado público se refiere a trámites por su condición de empleado y en la forma reglamentaria de cada Administración; no a toda su esfera privada. El temario incluye personas jurídicas, entidades sin personalidad, profesionales colegiados en su actividad y representantes de interesados obligados. Las personas físicas pueden elegir salvo que estén obligadas.","source":{"document":"Temario original","page":37,"section":"2. Derecho y obligación de relación electrónica: sujetos y alcance"},"origin":"esencial","conceptIds":["T108","T109","T110","T111","T112"]},{"id":"essDT01","topic":"Detenciones en carretera","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Como regla general, al proteger una incidencia en carretera con un vehículo oficial de cuatro ruedas, ¿qué combinación de colocación y seguridad procede?","options":["Situarlo antes de la incidencia, a no menos de 20 m, semioblicuo y con las ruedas orientadas hacia la trayectoria de escape; agentes y usuarios quedan fuera de esa trayectoria.","Situarlo antes de la incidencia, a no menos de 20 m, con las ruedas hacia la zona de trabajo para que el vehículo proteja directamente a quienes permanecen en ella.","Situarlo después de la incidencia, a no menos de 20 m, con las ruedas orientadas hacia la trayectoria de escape y todos los usuarios junto al vehículo oficial.","Situarlo antes de la incidencia, a no menos de 10 m, en paralelo a la calzada y con las ruedas rectas para impedir su desplazamiento en caso de alcance."],"answer":0,"explanation":"El vehículo oficial se coloca previamente a la incidencia según el sentido de marcha, con separación no inferior a 20 m, de forma semioblicua y con las ruedas hacia la trayectoria de escape. Puede desplazarse si recibe un impacto: usuarios y agentes deben mantenerse fuera de esa trayectoria. Se define una zona de seguridad y, con carácter general en cuatro ruedas, se baliza; el vehículo no sustituye estas medidas.","source":{"document":"Temario original","page":105,"section":"1. Consideraciones operativas generales: ubicación del vehículo, trayectoria de escape y balizamiento"},"origin":"versión esencial","conceptIds":["S074","S075","S076","T161","T162","T165"]},{"id":"essDT02","topic":"Detenciones en carretera","type":"convencional","question":"En la aproximación general a una incidencia, ¿qué secuencia de distancias y visibilidad recoge el protocolo de detenciones?","options":["El auxiliar desciende a no menos de 20 m, el vehículo avanza hasta 50 m y el protector debe ser visible desde 100 m.","El auxiliar desciende a no menos de 50 m, el vehículo avanza hasta no menos de 20 m y el protector advierte de forma visible desde al menos 100 m.","El auxiliar desciende a no menos de 100 m, el vehículo avanza hasta 50 m y el protector debe ser visible desde 20 m.","El auxiliar desciende a no menos de 50 m, el vehículo avanza hasta 20 m y el protector solo necesita ser visible desde la posición del notificador."],"answer":1,"explanation":"En la aproximación, el auxiliar desciende a no menos de 50 m; el conductor continúa hasta estacionar a no menos de 20 m. El protector advierte a los usuarios de forma visible desde al menos 100 m. Distancias y velocidades son referencias genéricas que se valoran con trazado, intensidad de tráfico, posición de los vehículos y climatología; no justifican omitir la protección.","source":{"document":"Temario original","page":106,"section":"1. Consideraciones operativas generales: reparto de funciones, aproximación y referencias genéricas"},"origin":"versión esencial","conceptIds":["S068","S077","S078","S079","T164","T166"]},{"id":"essDT03","topic":"Detenciones en carretera","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA sobre la elección del lugar para detener un vehículo y notificar una infracción en carretera.","options":["Se procura realizar la detención preferentemente fuera de la vía, aprovechando una explanada o una zona de descanso o servicio.","Los arcenes y los carriles de aceleración o deceleración se evitan, salvo fuerza mayor, por el riesgo de la intervención.","En carretera convencional sin arcén practicable se puede completar la notificación sobre la calzada si el vehículo oficial se coloca a 20 m.","En carretera convencional sin arcén practicable se busca un emplazamiento fuera de la calzada, como una explanada, camino adyacente o estación de servicio."],"answer":2,"explanation":"La regla general procura detener fuera de la vía y reserva los lugares no seguros a la fuerza mayor. En la carretera convencional sin arcén o con arcén impracticable, el texto prohíbe detener sobre la calzada: se aprovecha un lugar exterior adecuado. La separación de 20 m no elimina esa prohibición.","source":{"document":"Temario original","page":107,"section":"2.1. Lugar de detención; 2.1.2.1, carretera convencional sin arcén practicable (p. 114)","additionalPages":[114]},"origin":"versión esencial","conceptIds":["S069","S087","T167","T168"]},{"id":"essDT04","topic":"Detenciones en carretera","type":"convencional","question":"Una patrulla va a detener a un vehículo para notificarle una infracción. ¿Qué combinación sobre las señales y la posición del particular se ajusta al procedimiento común?","options":["Activa las señales desde que detecta la infracción y sitúa al particular a la derecha, detrás del vehículo policial.","Espera a tener clara la zona segura, pero ordena al particular detenerse a la izquierda y detrás del vehículo policial.","Activa las señales desde que detecta la infracción y ordena detenerse a la derecha, delante del vehículo policial.","Espera a tener clara la zona segura y señaliza al aproximarse; el particular debe detenerse a la derecha, delante del vehículo policial, conforme a sus instrucciones."],"answer":3,"explanation":"Se evitan señales prematuras que puedan inducir una detención inadecuada: se activan al aproximarse al lugar seguro. La luz roja o amarilla intermitente o destellante hacia delante indica detenerse a la derecha, delante del vehículo policial, sin mayores riesgos o molestias y siguiendo las instrucciones de los agentes.","source":{"document":"Temario original","page":106,"section":"2.1. Procedimiento común: momento de señalización y posición del vehículo; significado de la señal en p. 107","additionalPages":[107]},"origin":"versión esencial","conceptIds":["S070"]},{"id":"essDT05","topic":"Detenciones en carretera","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA sobre la protección durante la identificación de ocupantes de un vehículo detenido en carretera.","options":["El agente de apoyo puede concentrarse exclusivamente en los ocupantes mientras su compañero identifica, dejando para después la vigilancia del tráfico.","La identificación del conductor es un momento de especial riesgo ante posibles agresiones de los ocupantes.","El agente protector combina la seguridad frente a los ocupantes con la protección frente al tráfico y adapta su posición a las circunstancias.","En el supuesto de dos motoristas en autopista o autovía, el notificador espera al compañero antes de acercarse al vehículo detenido."],"answer":0,"explanation":"La protección tiene dos vertientes simultáneas: posibles agresiones y tráfico. Durante la identificación aumenta el riesgo porque se desconoce a los ocupantes. En el supuesto de motoristas, el apoyo ofrece inicialmente protección directa sin perder de vista la circulación; el notificador debe esperar al compañero.","source":{"document":"Temario original","page":107,"section":"2.1. Identificación y doble misión del protector; 2.1.1.3, contacto inicial de motoristas (p. 113)","additionalPages":[113]},"origin":"versión esencial","conceptIds":["S073","S086"]},{"id":"essDT06","topic":"Detenciones en carretera","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Una patrulla de cuatro ruedas intenta detener a un conductor que no obedece. ¿Qué relación entre conducta y actuación recoge el protocolo tanto en vías desdobladas como en carreteras convencionales?","options":["Conducción agresiva y peligrosa o sospecha delictiva: intentar desde delante; peligrosa no agresiva: únicamente desde atrás; ninguna de las anteriores: solicitar un bloqueo adelantando.","Conducción agresiva y peligrosa o sospecha delictiva: autoprotección, apoyo y seguimiento desde atrás; peligrosa no agresiva: intentar desde delante salvo circunstancias en contra; ninguna de las anteriores: seguir intentando solo desde atrás.","Conducción agresiva y peligrosa o sospecha delictiva: autoprotección y apoyo desde atrás; peligrosa no agresiva: seguir solo desde atrás; ninguna de las anteriores: adelantar para detener desde delante.","Conducción agresiva y peligrosa o sospecha delictiva: adelantar con apoyo; peligrosa no agresiva: circular en paralelo; ninguna de las anteriores: continuar únicamente desde atrás."],"answer":1,"explanation":"El protocolo distingue tres supuestos. En el primero se extreman autoprotección y apoyo y se continúa por detrás. En conducción peligrosa no agresiva se contempla intentar desde delante, salvo que las circunstancias desaconsejen la maniobra. Si no concurre ninguna de las dos, se sigue intentando solo desde atrás. Ante sospecha durante un adelantamiento se aborta y se vuelve detrás, comunicando a COTA y solicitando apoyo.","source":{"document":"Temario original","page":108,"section":"2.1.1.1. Tres supuestos de desobediencia; desarrollo de la maniobra en p. 109","additionalPages":[109]},"origin":"versión esencial","conceptIds":["S080","S081","S082","T169","T170","T171"]},{"id":"essDT07","topic":"Detenciones en carretera","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA sobre conducción agresiva o peligrosa y posición de la patrulla durante una detención en carretera.","options":["El protocolo considera agresiva la conducta del conductor que intenta huir de la patrulla o atropellar a sus miembros.","Se considera peligrosa la conducción que pone en riesgo a otros usuarios o al propio conductor, aunque no exista intención de huir o atropellar.","En motocicleta se permite circular brevemente en paralelo para dar instrucciones, siempre que el otro motorista permanezca detrás.","En cuatro ruedas no se mantiene la circulación en paralelo, salvo el tiempo estrictamente necesario para adelantar."],"answer":2,"explanation":"Las definiciones de agresiva y peligrosa describen situaciones distintas. La patrulla de cuatro ruedas solo permanece lateralmente el tiempo imprescindible para adelantar. En motocicleta se mantiene detrás; puede aproximarse momentáneamente a la parte posterior izquierda sin llegar a circular en paralelo, por el riesgo de embestida lateral.","source":{"document":"Temario original","page":108,"section":"2.1.1.1. Definiciones y posición lateral (p. 109); 2.1.1.3, motocicletas (p. 112)","additionalPages":[109,112]},"origin":"versión esencial","conceptIds":["S083","S084","T172","T173","T174"]},{"id":"essDT08","topic":"Detenciones en carretera","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Una patrulla en vehículo de cuatro ruedas con colores comerciales debe detener a un infractor en una autovía, sin apoyo inmediato de un vehículo uniformado. ¿Qué pauta procede?","options":["Detenerlo por cualquier medio de señalización disponible y completar los trámites en el arcén para evitar un segundo desplazamiento.","Adelantar aunque la maniobra sea indebida cuando resulte necesario mostrar la orden de detención en el panel posterior.","Esperar siempre al vehículo uniformado, aunque sea posible actuar sin riesgo en un lugar seguro.","Procurar apoyo uniformado y, si actúa sin él, no crear riesgo ni realizar maniobras arriesgadas; si la parada en arcén es excepcionalmente necesaria, limitarla a dirigir al conductor a un lugar seguro."],"answer":3,"explanation":"Se procura apoyo uniformado siempre que sea posible. Su ausencia no impide intervenir cuando pueda hacerse con seguridad, pero no autoriza maniobras de riesgo ni adelantamientos indebidos. La parada excepcional en arcén debe durar lo necesario para requerir que el infractor siga delante hasta un emplazamiento idóneo donde realizar las actuaciones.","source":{"document":"Temario original","page":111,"section":"2.1.1.2. Vehículo de cuatro ruedas con colores comerciales"},"origin":"versión esencial","conceptIds":["S089"]},{"id":"snew10","topic":"Detenciones en carretera","type":"convencional","options":["Identificarlo, comunicar verbalmente la infracción y el motivo y tramitar después la notificación oficial por la JPT.","Omitir toda identificación y archivar la infracción por la falta de un lugar adecuado.","Entregarle una advertencia verbal que sustituye definitivamente la notificación oficial.","Completar obligatoriamente la notificación oficial en el lugar, aunque subsista el riesgo."],"answer":0,"explanation":"El protocolo prevé identificación y comunicación verbal de la infracción y del motivo de detención, con notificación oficial posterior por la Jefatura Provincial de Tráfico. El texto exceptúa a los no residentes; por eso el caso precisa que el conductor es residente.","source":{"page":108,"section":"2.1. Detención para notificar: notificación posterior, primer párrafo","document":"Temario original"},"conceptIds":["S071"],"question":"Durante una detención para notificar una infracción a un conductor residente, la notificación no puede demorarse y continuar la actuación genera riesgo o perjuicio a la circulación. ¿Qué solución recoge el protocolo?","origin":"ampliación"},{"id":"snew14","topic":"Detenciones en carretera","type":"convencional","options":["Desde el vehículo policial, ampliándolo si lo requieren la visibilidad o las circunstancias adversas.","Desde el siguiente acceso a la autopista, con independencia de la ubicación de ambos vehículos.","Desde el agente notificador, manteniendo siempre veinte metros exactos.","Desde el vehículo particular, sin posibilidad de aumentar la distancia."],"answer":0,"explanation":"El protector retrocede por el arcén al menos cincuenta metros desde el vehículo policial tras el contacto inicial y si los ocupantes no suponen amenaza. Esa distancia puede prolongarse por visibilidad o circunstancias adversas; no se confunde con los veinte metros entre vehículos.","source":{"page":111,"section":"2.1.1.1. Vehículo de cuatro ruedas oficial: detención excepcional, agente protector","document":"Temario original"},"conceptIds":["S085"],"question":"En una detención excepcional en arcén de autopista con vehículo oficial de cuatro ruedas, ya se ha contactado con los ocupantes y se ha descartado amenaza. ¿Desde dónde se mide el retroceso mínimo de 50 metros del agente protector?","origin":"ampliación"},{"id":"snew15","topic":"Detenciones en carretera","type":"convencional","options":["Ambas motos a 50 m del particular, estacionadas en paralelo.","Primera moto al menos 20 m del particular y segunda al menos 50 m de la primera, con adaptación según circunstancias.","Primera moto 50 m del particular y segunda 20 m de la primera, como distancia rígida.","Primera moto 15 m del particular y segunda 20 m de la primera, sin adaptación."],"answer":1,"explanation":"El supuesto de autopista/autovía fija inicialmente veinte metros para la primera moto respecto del particular y cincuenta para la segunda respecto de la primera. El propio pasaje permite ajustar esta última separación según protección y seguridad vial.","source":{"page":112,"section":"2.1.1.3. Vehículo de dos ruedas: detención excepcional en autopista/autovía","document":"Temario original"},"conceptIds":["S086"],"question":"Dos motoristas efectúan por fuerza mayor una detención en un lugar no seguro de una autovía. ¿Qué referencias iniciales de separación establece el supuesto?","origin":"ampliación"},{"id":"snew17","topic":"Detenciones en carretera","type":"convencional","options":["Una a 20 m del detenido y la otra a 20 m de la primera, ambas junto al vehículo particular.","Una a 50 m del detenido y la otra junto al notificador, sin separación previa.","Ambas juntas a 100 m del vehículo detenido, fuera del arcén.","Una a 15 m del vehículo detenido y la otra previamente, en el arcén, a la distancia de 50 m indicada para este supuesto."],"answer":3,"explanation":"El pasaje de motocicletas en carretera convencional sitúa una moto a quince metros del vehículo detenido y la otra de forma previa, en el arcén del carril afectado, a cincuenta metros. No se trasladan automáticamente los veinte metros de la primera moto del supuesto de autopista/autovía.","source":{"page":115,"section":"2.1.2.3. Vehículo de dos ruedas en carreteras convencionales","document":"Temario original"},"conceptIds":["S088"],"question":"Dos motoristas deben detener excepcionalmente un vehículo en el arcén u otro lugar no seguro de una carretera convencional, por fuerza mayor y con amplia visibilidad. ¿Qué distribución inicial de las motocicletas recoge ese supuesto del protocolo?","origin":"ampliación"},{"id":"snew18","topic":"Detenciones en carretera","type":"convencional","options":["A una posición intermedia entre ambas motocicletas, advirtiendo a los demás usuarios.","A la mediana, aunque la carretera carezca de ella.","Delante del vehículo particular, de espaldas a ambos sentidos de circulación.","Al lado del notificador, dejando sin vigilancia los dos sentidos."],"answer":0,"explanation":"El auxiliar vuelve a una posición intermedia entre las dos motos tras comprobar que la actuación es segura. Desde allí protege al conjunto y advierte a los usuarios, teniendo presentes los dos sentidos de una carretera convencional.","source":{"page":116,"section":"2.1.2.3. Vehículo de dos ruedas: actuación del auxiliar, primer párrafo","document":"Temario original"},"conceptIds":["S088"],"question":"En una detención por dos motoristas en carretera convencional, el auxiliar ya ha apoyado el contacto con los ocupantes y comprueba que la actuación es segura. ¿Dónde pasa a prestar protección?","origin":"ampliación"},{"id":"s08","topic":"Detenciones en carretera","type":"incorrecta","options":["Sin otros equipos y ante una infracción muy grave, puede cambiar de sentido con las medidas de seguridad necesarias para intentar alcanzarlo de forma segura.","Debe abstenerse de realizar seguimientos a altas velocidades.","Debe solicitar apoyo a otros equipos de la especialidad que puedan encontrar al infractor, indicando sus características y la infracción.","Si no hay otros equipos, basta con que la infracción sea grave para cambiar de sentido e intentar darle alcance."],"answer":3,"explanation":"El supuesto que permite intentar darle alcance sin otros equipos se refiere a una infracción muy grave, con todas las precauciones. Sustituir «muy grave» por «grave» altera la condición del manual.","source":{"page":113,"section":"2.1.2.1. Vehículo de cuatro ruedas con colores oficiales en carreteras convencionales","document":"Temario original"},"question":"En una carretera convencional de un carril por sentido, una patrulla en vehículo oficial de cuatro ruedas observa una infracción cometida por un vehículo que circula en sentido contrario. ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":[]},{"id":"s09","topic":"Detenciones en carretera","type":"correcta","options":["El jefe puede avanzar con seguridad a un lugar seguro y dar el alto a pie, o dejarse sobrepasar para actuar ambos desde atrás.","El auxiliar asume la detención desde atrás y el jefe conserva su marcha, sin intervenir hasta que el infractor ya esté parado.","El jefe permanece delante y el auxiliar detrás, manteniendo al infractor entre ambos hasta localizar una salida segura.","El auxiliar debe rebasar al infractor y mantenerse a su lado hasta que el jefe pueda ordenarle la detención desde delante."],"answer":0,"explanation":"El protocolo ofrece ambas alternativas: adelantarse lo suficiente hasta un lugar seguro para ordenar a pie la detención, o dejar que el infractor sobrepase al jefe para quedar ambos detrás. No autoriza maniobras peligrosas.","source":{"page":115,"section":"2.1.2.3. Vehículo de dos ruedas en carreteras convencionales","document":"Temario original"},"question":"En una carretera convencional, el motorista auxiliar observa una infracción de un vehículo situado entre él y el jefe de pareja. Ha comunicado e identificado el vehículo por radio. ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":[]},{"id":"essDT09","topic":"Detenciones en carretera","type":"convencional","question":"Para acompañar hasta una salida segura a un vehículo que circula a velocidad anormalmente reducida por una circunstancia imprevista, sin tratarse de un transporte especial, ¿qué distribución corresponde al acompañamiento continuo?","options":["Cuatro ruedas: unos 20–25 m detrás; con motos: jefe unos 50 m detrás del vehículo lento y auxiliar unos 100 m detrás del jefe.","Cuatro ruedas: unos 50 m detrás; con motos: jefe unos 20–25 m detrás del vehículo lento y auxiliar unos 100 m detrás del jefe.","Cuatro ruedas: unos 20–25 m delante; con motos: jefe unos 50 m detrás del vehículo lento y auxiliar unos 100 m delante del jefe.","Cuatro ruedas: unos 20–25 m detrás; con motos: jefe unos 100 m detrás del vehículo lento y auxiliar unos 50 m detrás del jefe."],"answer":0,"explanation":"El vehículo de cuatro ruedas acompaña a unos 20–25 m por detrás, por el carril derecho y cerca del arcén, señalizando la emergencia. En motos, el jefe queda unos 50 m por detrás del vehículo auxiliado y el auxiliar unos 100 m detrás del jefe: no se mide este último intervalo desde el vehículo lento. El jefe utiliza el arcén cuando puede o el borde derecho; el auxiliar circula por el arcén y advierte al jefe si un usuario no percibe las señales.","source":{"document":"Temario original","page":125,"section":"3.1 y 3.2. Acompañamiento continuo con cuatro ruedas y motocicletas"},"origin":"versión esencial","conceptIds":["S098","S099","S101","T175","T176","T178"]},{"id":"s16","topic":"Detenciones en carretera","type":"correcta","options":["Un motorista señaliza estático por delante del averiado y el otro lo acompaña también desde delante.","Ambos señalizan estáticos hasta que los rebase el averiado y después avanzan juntos hasta otra posición.","Los motoristas alternan la posición delantera y trasera del acompañamiento sin detener sus motocicletas.","Alternan la señalización estática fuera de la calzada o en el arcén y el acompañamiento desde atrás."],"answer":3,"explanation":"El rodillo alterna una posición estática de señalización con el acompañamiento desde atrás. Cuando la separación entre motoristas alcanza aproximadamente un kilómetro, intercambian esas funciones.","source":{"page":126,"section":"3.2. Acompañamiento en motocicletas: procedimiento alternativo de rodillo","document":"Temario original"},"question":"Una pareja de motoristas acompaña a un vehículo averiado que circula a velocidad anormalmente reducida y opta por la señalización alternativa mediante «rodillo». ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":["T177","S100"]},{"id":"snew19","topic":"Detenciones en carretera","type":"correcta","options":["Unos 30 km/h hacia ambos, por aplicar el límite del nivel rojo de nieve.","Unos 50 km/h hacia la avería y unos 40 km/h hacia el accidente, con los avisos previstos.","Unos 60 km/h hacia la avería y unos 80 km/h hacia el accidente.","Unos 40 km/h hacia la avería y unos 50 km/h hacia el accidente."],"answer":1,"explanation":"En el supuesto de avería se retiene alrededor de cincuenta km/h con aviso al Centro de Gestión. Para el accidente previamente localizado, el vehículo de cuatro ruedas reduce progresivamente hasta unos cuarenta km/h y avisa a COTA. Son referencias de escenarios concretos.","source":{"page":121,"section":"2.3.1.1. Accidente con cuatro ruedas; avería en 2.2.1.1, p. 116","additionalPages":[116],"document":"Temario original"},"conceptIds":["S090","S091"],"question":"Una patrulla en vehículo oficial de cuatro ruedas se aproxima en autopista/autovía a una avería comunicada por COTA que ocupa parte de la calzada; en otro servicio se aproxima a un accidente previamente localizado. ¿Qué referencias de velocidad distingue el protocolo para retener progresivamente la circulación en ambos supuestos?","origin":"ampliación"},{"id":"snew20","topic":"Detenciones en carretera","type":"convencional","options":["Prevenir, atender y señalizar.","Proteger, auxiliar y seguir.","Proteger, avisar y socorrer.","Parar, asegurar y sancionar."],"answer":2,"explanation":"El protocolo expresa PAS como proteger, avisar y socorrer. El apartado prevé comunicar la novedad a COTA, atender a los heridos y movilizar los apoyos médicos, mecánicos y de conservación que correspondan.","source":{"page":120,"section":"2.3. Detención para auxilio en accidente: párrafo inicial","document":"Temario original"},"conceptIds":["S091"],"question":"En el auxilio de un accidente de circulación, ¿qué significa la pauta PAS del protocolo?","origin":"ampliación"},{"id":"s10","topic":"Detenciones en carretera","type":"convencional","options":["Circular por su calzada correcta y mantener seguimiento visual, sin usar señales hasta situarse delante del infractor.","Continuar por la calzada correcta e intentar advertirle a través de la mediana, sin seguirlo por la calzada equivocada.","Acceder por el siguiente enlace a la calzada del infractor y seguirlo con señales de emergencia para que se detenga.","Circular por el arcén de la calzada equivocada a su altura, evitando ocupar los carriles mientras se le dan indicaciones."],"answer":1,"explanation":"La patrulla nunca debe cometer la misma infracción para seguirlo. Debe circular por los carriles habilitados e intentar advertir al conductor; si ello no es posible, el protocolo contempla adelantarse hasta la siguiente salida.","source":{"page":127,"section":"4.2.1. Vehículo oficial en el mismo sentido físico del infractor, por los carriles habilitados","document":"Temario original"},"question":"En una vía desdoblada, una patrulla en vehículo oficial de cuatro ruedas circula correctamente y observa al otro lado de la mediana a un vehículo que avanza en el mismo sentido físico, pero por la calzada equivocada. ¿Qué actuación es conforme al protocolo?","origin":"original","conceptIds":["S092","S093"]},{"id":"s11","topic":"Detenciones en carretera","type":"incorrecta","options":["No debe utilizarse el arma reglamentaria para lograr que el infractor se detenga.","Si se dispone de tiempo y medios, los conos y las luces pueden encauzar al infractor hacia el equipo de bloqueo.","El vehículo oficial debe ocupar el carril izquierdo de la vía para cerrar la trayectoria del infractor.","El vehículo oficial debe permanecer en el sentido correcto de la marcha."],"answer":2,"explanation":"Las normas generales ordenan que el vehículo oficial no cruce ni invada el carril izquierdo. No debe confundirse la ubicación del vehículo oficial con la del equipo de bloqueo no letal.","source":{"page":126,"section":"4. Detención de vehículos en sentido contrario en vías desdobladas: normas generales","document":"Temario original"},"question":"Una patrulla en vehículo oficial de cuatro ruedas actúa ante un vehículo que circula en sentido contrario en una vía desdoblada. ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":["T179","T180","T181","S092"]},{"id":"essDT10","topic":"Detenciones en carretera","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Ante un vehículo que se aproxima en sentido contrario en una vía desdoblada, la circulación ya está detenida y otra patrulla cubre la cola. ¿Qué comparación de posiciones delanteras recoge el protocolo para cuatro ruedas y motocicletas?","options":["Cuatro ruedas: conductor con vehículo a unos 300 m y ocupante a 100 m; motos: jefe a 400 m y auxiliar a 200 m, dejando las motos en el carril central.","Cuatro ruedas: conductor con vehículo a unos 400 m y ocupante a 200 m; motos: jefe a 300 m y auxiliar a 200 m, dejando las motos en el arcén del sentido correcto.","Cuatro ruedas: conductor con vehículo a unos 200 m y ocupante a 400 m; motos: jefe a 200 m y auxiliar a 300 m, dejando las motos en el arcén del sentido correcto.","Cuatro ruedas: conductor con vehículo a unos 400 m y ocupante a 300 m; motos: jefe a 300 m y auxiliar a 100 m, dejando las motos en el carril izquierdo."],"answer":1,"explanation":"Las referencias se miden delante de la línea detenida. En cuatro ruedas, el conductor lleva el oficial a unos 400 m, al carril central si hay tres o al derecho si hay dos, y el ocupante queda a unos 200 m si la cola ya está cubierta; de lo contrario este protege la cola. Si se despliega bloqueo no letal en el carril izquierdo, el conductor hace señales unos 100 m por delante de él. En motos, el jefe queda a unos 300 m y el auxiliar a unos 200 m con cola cubierta; las motos se estacionan en el arcén, aunque los agentes señalicen desde carril derecho o central. Los ocupantes de las primeras filas se ponen a salvo fuera de la calzada o detrás de las filas siguientes, dejando luces de cruce y emergencia.","source":{"document":"Temario original","page":128,"section":"4.2.2. Actuación de frente en cuatro ruedas; 4.2.3.2, motocicletas (p. 129); seguridad de las primeras filas en p. 127","additionalPages":[127,129]},"origin":"versión esencial","conceptIds":["S094","S095","S096","S097","T182","T183","T184"]},{"id":"essNV01","topic":"Nevadas y coordinación","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. ¿Qué esquema de fases del protocolo AGE y su relación con los niveles de circulación recoge el plan de nevadas?","options":["Cuatro fases: alerta (verde), preemergencia (amarillo), emergencia (rojo) y bloqueo (negro).","Tres fases: alerta (verde), preemergencia (amarillo y rojo) y emergencia (negro).","Tres fases: alerta (verde y amarillo), preemergencia (rojo) y emergencia (negro).","Dos fases: alerta (verde y amarillo) y emergencia (rojo y negro)."],"answer":2,"explanation":"Las tres fases AGE son alerta, preemergencia y emergencia. El cuadro relaciona alerta con verde/amarillo, preemergencia con rojo y emergencia con negro. Blanco indica normalidad en la escala de transitabilidad, no una cuarta fase. Los avisos meteorológicos AEMET constituyen una escala distinta.","source":{"page":142,"additionalPages":[147],"section":"8. Condiciones de ejecución; 8.5. Cuadro-resumen fases-niveles de circulación, p. 147","document":"Temario original"},"origin":"síntesis esencial","conceptIds":["T185","S001"]},{"id":"n02","topic":"Nevadas y coordinación","type":"correcta","options":["Las declara el COTA que recibe la incidencia; su declaración vincula el nivel de emergencia de los municipios afectados.","Las declara Delegación/Subdelegación del Gobierno; son internas y no fijan la declaración de los planes autonómicos o locales.","Las declara AEMET al emitir el aviso; la declaración determina simultáneamente el nivel de circulación en cada carretera afectada.","Las declara la Jefatura Provincial de Tráfico; su declaración sustituye la activación de los planes territoriales de protección civil."],"answer":1,"explanation":"La competencia de declaración corresponde a Delegaciones o Subdelegaciones. Las fases del protocolo tienen carácter interno para la AGE y no predeterminan lo que deba declararse conforme a los planes de protección civil autonómicos o locales. Un aviso meteorológico no equivale a esa declaración.","source":{"page":142,"section":"8. Condiciones de ejecución","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a la declaración y alcance de las fases de alerta, preemergencia y emergencia del protocolo AGE por nevadas:","origin":"original","conceptIds":["T186","T187","S001","S002"]},{"id":"essNV02","topic":"Nevadas y coordinación","type":"convencional","question":"En el protocolo AGE por nevadas, ¿qué diferencia correctamente el inicio de la alerta y el de la preemergencia?","options":["Alerta: aviso rojo o naranja AEMET, o amarillo en áreas metropolitanas con grandes núcleos; preemergencia: dificultades previstas por la intensidad de la nevada o ya efectivas en la circulación.","Alerta: cualquier aviso amarillo AEMET, sin importar el territorio; preemergencia: únicamente dificultades efectivas, sin que baste preverlas.","Alerta: aviso rojo AEMET exclusivamente; preemergencia: cualquier aviso naranja, aunque no se prevean dificultades para circular.","Alerta: dificultades de circulación ya producidas; preemergencia: necesidad de atender a ocupantes bloqueados que no pueden continuar por sus medios."],"answer":0,"explanation":"La alerta comienza con aviso por nevadas rojo o naranja, o amarillo en áreas metropolitanas con grandes núcleos de población. La preemergencia admite dos supuestos alternativos: intensidad que haga prever dificultades o dificultad efectiva por nieve, hielo u otra circunstancia en un tramo de la Red de Carreteras del Estado. No exige esperar al bloqueo. La alerta y la preemergencia finalizan al cesar sus causas o al pasar a la fase siguiente.","source":{"page":142,"additionalPages":[145],"section":"8.1. Fase de alerta; 8.2. Fase de preemergencia, p. 145","document":"Temario original"},"origin":"síntesis esencial","conceptIds":["T188","T191","S003","S005"]},{"id":"n04","topic":"Nevadas y coordinación","type":"convencional","options":["El de preemergencia, que se mantiene hasta que se confirme un espesor superior a cinco centímetros en todo el itinerario.","El de emergencia únicamente si ya se ha acordado trasladar a los ocupantes a hospitales o alojamientos.","El de alerta, porque la fase depende del aviso meteorológico aunque ya sea necesario auxiliar a los ocupantes.","El de emergencia, por la necesidad de atender a personas bloqueadas o retenidas que no pueden continuar por sus medios."],"answer":3,"explanation":"El inicio de emergencia depende de que sea necesario atender a esas personas, no de un espesor concreto ni de haber acordado ya su traslado. El alojamiento o la atención hospitalaria son posibles medidas posteriores según las necesidades.","source":{"page":146,"section":"8.3. Fase de emergencia","document":"Temario original"},"question":"Varios vehículos han quedado retenidos por la nieve. Sus ocupantes no pueden continuar el viaje por sus propios medios y es necesario atenderlos. ¿Qué criterio del protocolo AGE se cumple?","origin":"original","conceptIds":["T194","S007"]},{"id":"revNV01","topic":"Nevadas y coordinación","type":"correcta","options":["Calzada que empieza a cubrirse, con prohibición de superar 60 km/h propia del nivel amarillo.","Preemergencia con cadenas o neumáticos especiales y máximo de 30 km/h propio del rojo.","Circulación normal; los cuatro colores de afección por nieve son verde, amarillo, rojo y negro.","Inicio de la nevada sin afección, con la recomendación de 100/80 km/h propia del nivel verde."],"answer":2,"explanation":"La escala de transitabilidad incluye blanco como estado normal. Los cuatro colores de afección por nieve se relacionan con las fases en un cuadro distinto: verde/amarillo con alerta, rojo con preemergencia y negro con emergencia. Las fases AGE siguen siendo tres.","source":{"document":"Temario original","page":147,"section":"8.4. Transitabilidad en carretera: código de colores; 8.5. Cuadro de fases y niveles"},"question":"ELIGE LA OPCIÓN CORRECTA. En la escala gráfica de transitabilidad del plan de nevadas, ¿qué significado tiene el color blanco?","origin":"ampliación","conceptIds":[]},{"id":"n05","topic":"Nevadas y coordinación","type":"correcta","options":["Recomendación de máximo 100 km/h en autopistas/autovías y 80 en el resto; valorar la restricción de articulados.","Prohibición de superar 100 km/h en autopistas y autovías y 80 km/h en el resto; prohibición de articulados.","Recomendación de 100 km/h para turismos y 80 km/h para pesados; valorar la restricción de articulados.","Recomendación de 80 km/h en autopistas y autovías y 60 km/h en el resto; restringir articulados si no llevan cadenas."],"answer":0,"explanation":"En verde, 100/80 se formula como recomendación y se distingue por tipo de vía, no de vehículo. La restricción de articulados se valora por su inestabilidad con baja adherencia; no se presenta aquí como una prohibición automática.","source":{"page":144,"section":"8.1. Fase de alerta: nivel verde","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Comienza a nevar, la circulación no se ve afectada y se aplica nivel verde. ¿Qué combinación respeta el carácter de las medidas del manual?","origin":"original","conceptIds":["T197","T198","T199","S013","S014"]},{"id":"n06","topic":"Nevadas y coordinación","type":"incorrecta","options":["Se contempla circulación a intervalos en convoyes específicos, con baja intensidad, tras limpiar la calzada o tras quitanieves.","La prohibición de circulación alcanza a los autobuses del mismo modo que a los camiones y articulados.","Se prohíbe superar 60 km/h, sin que ese límite autorice a circular a vehículos sujetos a prohibición.","Se prevén desvíos o embolsamientos de los vehículos con circulación prohibida en zonas acondicionadas."],"answer":1,"explanation":"La prohibición ordinaria de autobuses se añade en rojo. En amarillo, el cuerpo del plan prohíbe camiones y articulados y fija 60 km/h; el gráfico de colores permite turismos y autobuses a ese máximo. No debe trasladarse a amarillo la prohibición de autobuses propia del rojo.","source":{"page":144,"section":"8.1. Fase de alerta: nivel amarillo","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. La calzada comienza a cubrirse de nieve y se aplica nivel amarillo. Según sus medidas ordinarias en el cuerpo del plan:","origin":"original","conceptIds":["T201","T202","T203","T204","S016"]},{"id":"n07","topic":"Nevadas y coordinación","type":"convencional","options":["Cadenas o neumáticos especiales de nieve o hielo y velocidad máxima de 60 km/h.","Neumáticos ordinarios si sigue a una quitanieves y velocidad máxima de 30 km/h.","Cadenas o neumáticos especiales de nieve o hielo y prohibición de superar 30 km/h.","Cadenas o neumáticos especiales de nieve o hielo y recomendación de no superar 80 km/h."],"answer":2,"explanation":"El nivel rojo exige cadenas o neumáticos especiales para nieve o hielo y prohíbe superar 30 km/h. La posibilidad de prohibir directamente circular por la intensidad es una salvedad; seguir a una quitanieves no convierte los neumáticos ordinarios en equipamiento suficiente.","source":{"page":146,"section":"8.2. Fase de preemergencia: nivel rojo","document":"Temario original"},"question":"Un turismo puede seguir circulando en un tramo con nivel rojo y no se ha acordado prohibir directamente la circulación por su intensidad. ¿Qué combinación de equipamiento y velocidad exige ese nivel?","origin":"original","conceptIds":["T206","T208","S019"]},{"id":"revREQ04","topic":"Nevadas y coordinación","type":"correcta","options":["En amarillo se prohíbe circular a camiones y articulados; en rojo estos pueden circular individualmente si llevan cadenas.","En rojo se prohíbe circular a camiones y articulados, pero los autobuses pueden circular individualmente con cadenas a 30 km/h.","En amarillo se prohíbe circular a camiones y articulados; en rojo la prohibición comprende también a los autobuses.","En ambos niveles se prohíbe circular a camiones, articulados y autobuses; la única diferencia es la velocidad de los turismos."],"answer":2,"explanation":"El cuerpo del plan prohíbe camiones y vehículos articulados en amarillo. En rojo enumera camiones, vehículos articulados y autobuses. La posibilidad específica de organizar convoyes de pesados con baja intensidad circulatoria y calzada en condiciones no supone autorizar su circulación individual ordinaria con cadenas.","source":{"document":"Temario original","page":146,"section":"8.2. Nivel rojo: prohibición de camiones, articulados y autobuses; comparación con nivel amarillo en 8.1, p. 144"},"question":"ELIGE LA OPCIÓN CORRECTA. Al comparar las prohibiciones ordinarias por tipo de vehículo en los niveles amarillo y rojo por nieve, sin tratarse de un convoy específico autorizado:","origin":"ampliación","conceptIds":[]},{"id":"n10","topic":"Nevadas y coordinación","type":"convencional","options":["Carretera con nieve intensa en la que se reservan carriles de emergencia, aunque siga siendo transitable con equipamiento.","Carretera intransitable para cualquier vehículo, con inmovilización prolongada ya producida o riesgo claro de sufrirla.","Circulación difícil, aunque practicable con cadenas o neumáticos especiales y una velocidad máxima de 30 km/h.","Calzada que comienza a cubrirse, con desvíos de vehículos restringidos y circulación de los restantes hasta 60 km/h."],"answer":1,"explanation":"El rasgo del negro es la intransitabilidad para cualquier vehículo, acompañada de riesgo de inmovilización prolongada o de bloqueo ya producido. La circulación difícil pero practicable con equipamiento corresponde al rojo, no basta para definir el negro.","source":{"page":147,"section":"8.3. Fase de emergencia: nivel negro","document":"Temario original"},"question":"¿Qué situación describe específicamente el nivel negro de circulación por nieve?","origin":"original","conceptIds":["T212","S021"]},{"id":"essNV05","topic":"Nevadas y coordinación","type":"convencional","question":"Al valorar la nieve acumulada, ¿qué descripción diferencia los niveles amarillo y rojo del plan de nevadas?","options":["Amarillo: entre 2 y 5 cm sin admitir espesores inferiores; rojo: únicamente más de 10 cm, con independencia de la intensidad.","Amarillo: desde 5 cm con nieve intensa; rojo: entre 2 y 5 cm siempre que haya dejado de nevar.","Amarillo: unos 2 a 5 cm, o menos si empieza a estar deslizante; rojo: 5 cm o más, o menos con nieve intensa o afectación de
