["Un motorista señaliza estático por delante del averiado y el otro lo acompaña también desde delante.","Ambos señalizan estáticos hasta que los rebase el averiado y después avanzan juntos hasta otra posición.","Los motoristas alternan la posición delantera y trasera del acompañamiento sin detener sus motocicletas.","Alternan la señalización estática fuera de la calzada o en el arcén y el acompañamiento desde atrás."],"answer":3,"explanation":"El rodillo alterna una posición estática de señalización con el acompañamiento desde atrás. Cuando la separación entre motoristas alcanza aproximadamente un kilómetro, intercambian esas funciones.","source":{"page":126,"section":"3.2. Acompañamiento en motocicletas: procedimiento alternativo de rodillo","document":"Temario original"},"question":"Una pareja de motoristas acompaña a un vehículo averiado que circula a velocidad anormalmente reducida y opta por la señalización alternativa mediante «rodillo». ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":["T177","S100"]},{"id":"s17","topic":"UNIS","type":"convencional","options":["Mejorar la calidad de atestados e informes técnicos EIS y asesorar y auxiliar al jefe de UNIS en el servicio.","Asesorar al jefe en necesidades de servicio y concentrar el control técnico en los informes periciales EPRAT.","Garantizar la calidad de documentos EIS y asesorar al jefe, reservando la inspección y control al oficial.","Mantener la calidad de los atestados EIS y asumir la dirección orgánica de sus equipos y áreas funcionales."],"answer":0,"explanation":"Su misión combina la calidad de los documentos EIS y el asesoramiento y auxilio al jefe de la UNIS para impulsar, inspeccionar, controlar y mejorar el servicio.","source":{"page":12,"section":"1.2. Funciones de los suboficiales segundos jefes de las UNIS: misión principal","document":"Temario original"},"question":"¿Qué actuación refleja mejor la misión principal del suboficial segundo jefe de una Unidad de Investigación de Seguridad Vial (UNIS)?","origin":"original","conceptIds":["T017","T018","S105"]},{"id":"s18","topic":"UNIS","type":"incorrecta","options":["Utiliza, como norma general, uniforme de servicio y adapta su actividad a necesidades relevantes o complejas.","Depende orgánicamente del jefe de Subsector y funcionalmente de un delegado suyo distinto del jefe de UNIS.","Depende orgánica y funcionalmente del jefe de la UNIS del Sector o Subsector, con supervisión técnica y operativa.","Presta servicio en la residencia de la UNIS, principalmente en horario de labores burocráticas."],"answer":1,"explanation":"La instrucción atribuye ambas dependencias, orgánica y funcional, al jefe de UNIS de Sector/Subsector. La separación propuesta en la opción incorrecta no corresponde a este puesto.","source":{"page":12,"section":"1.2.1.1 y 1.2.1.2. Dependencia y prestación del servicio del suboficial segundo jefe de UNIS","document":"Temario original"},"question":"Respecto a la dependencia y la prestación ordinaria del servicio del suboficial segundo jefe de una UNIS, ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":["T019","T020","S106","S107"]},{"id":"s19","topic":"UNIS","type":"convencional","options":["Al jefe del GIAT, que coordina los servicios de las distintas áreas funcionales.","Al responsable del EPRAT, bajo la supervisión técnica del oficial de Investigación.","Al suboficial segundo jefe de la UNIS, para todos los integrantes de la unidad.","Al suboficial responsable de cada EIS, dentro del planeamiento general de la UNIS."],"answer":2,"explanation":"El cometido de planificar y nombrar el servicio de todos los integrantes de la UNIS se asigna expresamente al suboficial segundo jefe.","source":{"page":12,"section":"1.2.1.4. Planificación y nombramiento del servicio de la UNIS","document":"Temario original"},"question":"En una UNIS debe planificarse y nombrarse el servicio de todos sus integrantes, asegurando su coordinación, el reparto equitativo de recursos humanos y la cobertura de necesidades. ¿A quién asigna expresamente esta función el temario?","origin":"original","conceptIds":["T022","S109"]},{"id":"s20","topic":"UNIS","type":"correcta","options":["Los informes EPRAT requieren su conformidad técnica, mientras los EIS se supervisan sin ese trámite.","Da conformidad a informes periciales EIS e informes técnicos EPRAT, atendiendo a la relevancia penal.","Su conformidad se circunscribe a los informes técnicos EIS de siniestros con homicidio o lesiones.","Da conformidad a todos los informes técnicos EIS y a los informes periciales elaborados por EPRAT."],"answer":3,"explanation":"El manual distingue informes técnicos EIS e informes periciales EPRAT y atribuye al segundo jefe darles conformidad, asegurando la calidad de las diligencias y documentos.","source":{"page":13,"section":"1.2.1.7. Despacho, supervisión y conformidad de informes","document":"Temario original"},"question":"Respecto a la supervisión documental del suboficial segundo jefe de la UNIS, ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":["T024","S112"]},{"id":"s21","topic":"UNIS","type":"incorrecta","options":["Puede encabezar la instrucción si sustituye al oficial, pero no como cometido propio del segundo jefe.","Puede encabezar la instrucción con el EIS designado cuando el jefe de UNIS lo estime por su relevancia.","Auxilia en detectar y seguir supuestos que puedan requerir elementos con mayor capacidad investigadora.","Auxilia al jefe en el despacho y supervisión de siniestros EIS de mayor relevancia penal."],"answer":0,"explanation":"Encabezar una instrucción relevante por decisión del jefe de UNIS es un cometido propio. No se condiciona a estar sustituyendo por ausencia al oficial de Investigación.","source":{"page":13,"section":"1.2.1.7 y 1.2.1.8. Supervisión e instrucción de casos relevantes","document":"Temario original"},"question":"Un siniestro vial presenta especial relevancia o complejidad y afecta a la demarcación de una UNIS. ELIGE LA OPCIÓN INCORRECTA sobre los cometidos del suboficial segundo jefe.","origin":"original","conceptIds":["S111","S112","S113"]},{"id":"s22","topic":"UNIS","type":"convencional","options":["Que suceda al oficial únicamente en la elaboración de estadísticas, sin otras responsabilidades.","Que le suceda, asumiendo las funciones y responsabilidades inherentes al puesto.","Que atienda solo asuntos administrativos y deje pendientes las funciones técnicas del oficial.","Que se limite a informar al jefe de Sector, sin asumir ninguna función del ausente."],"answer":1,"explanation":"La sucesión prevista no se limita a un área concreta: en ausencia de los oficiales de Investigación, el segundo jefe asume las funciones y responsabilidades inherentes.","source":{"page":14,"section":"1.2.1.17. Sucesión a los oficiales de Investigación en sus ausencias","document":"Temario original"},"question":"El oficial de Investigación de una UNIS de Sector o Subsector está ausente. ¿Qué prevé el temario respecto al suboficial segundo jefe de la UNIS?","origin":"original","conceptIds":["T023","S122"]},{"id":"s23","topic":"UNIS","type":"correcta","options":["El jefe de UNIS determina el apoyo y sus cometidos quedan fijados en la orden diaria del servicio.","El jefe de UNIS determina el apoyo del GIAT y el Subsector asigna por separado el del EPRAT.","El jefe de UNIS determina el personal de apoyo y sus cometidos se reflejan en el Plan Anual.","El segundo jefe elige el personal de apoyo y registra sus cometidos en cada orden de servicio."],"answer":2,"explanation":"La decisión sobre el apoyo corresponde al jefe de UNIS y sus cometidos deben figurar en el Plan Anual. No se limita el apoyo al GIAT.","source":{"page":13,"section":"1.2.1.14. Personal de apoyo y Plan Anual de la UNIS","document":"Temario original"},"question":"El suboficial segundo jefe de una UNIS necesita apoyo de personal para desarrollar sus funciones. ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":["S119"]},{"id":"s24","topic":"UNIS","type":"convencional","options":["Sustituyendo el análisis estadístico por la valoración de los responsables de los equipos afectados.","Elevando propuestas logísticas al jefe de UNIS y remitiendo las operativas al Área de Operaciones.","Elevando necesidades materiales y reservando las de personal y formación para la propuesta del jefe.","Elevando al jefe propuestas sobre esas áreas fundamentadas en datos y estadísticas operativas."],"answer":3,"explanation":"El análisis de necesidades abarca todas esas áreas y las propuestas deben estar fundamentadas en datos y estadísticas operativas.","source":{"page":12,"section":"1.2.1.3. Análisis de necesidades operativas y propuestas al jefe de UNIS","document":"Temario original"},"question":"El suboficial segundo jefe de una UNIS analiza sus necesidades de logística, material, formación, operativa y personal. ¿Cómo debe trasladar sus propuestas al jefe de UNIS?","origin":"original","conceptIds":["S108"]},{"id":"m01","topic":"Nevadas y coordinación","type":"correcta","options":["Debe considerarse su acceso a servicios; si faltan servicios básicos y se prevé una espera prolongada, valorar el aviso a Protección Civil.","La capacidad para estacionar prevalece sobre el acceso a servicios; la asistencia se solicita solo después de declararse la emergencia.","La previsión de atención corresponde al levantamiento de restricciones; durante la alerta solo se comprueba la capacidad de vehículos.","TODAS SON CORRECTAS"],"answer":0,"explanation":"La alerta ya incluye prever la accesibilidad a servicios públicos y valorar Protección Civil si el aparcamiento no tiene servicios básicos y la restricción puede prolongarse. No se espera necesariamente a la emergencia. Por ello, no son todas correctas.","source":{"page":143,"section":"8.1. Fase de alerta: previsión del despliegue y zonas de estacionamiento","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En la fase de alerta por nevadas, al preparar zonas de estacionamiento para vehículos afectados:","origin":"original","conceptIds":["S009"]},{"id":"m02","topic":"Nevadas y coordinación","type":"convencional","options":["Mantener todos los carriles abiertos hasta que se detenga una máquina quitanieves, restringiendo después únicamente a los pesados.","Restringir el carril más a la izquierda y, si resulta necesario, prohibir temporalmente circular hasta que se limpie la calzada.","TODAS SON CORRECTAS","Reservar el carril derecho a la asistencia y mantener libres los de la izquierda para que los vehículos ligeros puedan adelantar."],"answer":1,"explanation":"El plan contempla restringir el carril más a la izquierda, con prohibición de adelantar, para quitanieves, policía y asistencia. Incluso permite prohibir temporalmente circular a todo tipo de vehículos hasta limpiar. Las otras propuestas no corresponden a esa pauta; la alternativa global es falsa.","source":{"page":145,"section":"8.2. Fase de preemergencia: medidas en autovías","document":"Temario original"},"question":"Durante la preemergencia por nevadas, ¿qué medida de circulación en autovías facilita expresamente la limpieza y el paso de vehículos de asistencia?","origin":"original","conceptIds":["S010","S024"]},{"id":"m03","topic":"Circular y Manual Operativo","type":"correcta","options":["TODAS SON CORRECTAS","El amparo genérico de la seguridad ciudadana permite efectuar comprobaciones indiscriminadas sin identificar una necesidad concreta.","La actuación requiere una circunstancia o necesidad justificativa; las actuaciones sistemáticas e indiscriminadas son contrarias a derecho.","El control de la seguridad del tráfico queda excluido del concepto de seguridad ciudadana, aunque exista una necesidad justificativa."],"answer":2,"explanation":"La Circular exige una circunstancia o necesidad concreta que justifique las facultades ejercidas y rechaza actuaciones sistemáticas e indiscriminadas. Además, incluye la seguridad del tráfico en ese ámbito. Solo una de las tres afirmaciones de contenido es válida.","source":{"page":43,"section":"2.1. Concepto de dispositivo operativo para controlar vías","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Al establecer controles sobre vías en el ámbito de la Circular 1/2015:","origin":"original","conceptIds":["S045"]},{"id":"m04","topic":"Dispositivos ATGC","type":"convencional","options":["TODAS SON CORRECTAS","La presencia de bloqueo y seguimiento lo convierte por sí sola en reforzado, aunque conserve los demás cometidos de un ordinario.","El personal adicional de un ordinario solo puede verificar; el bloqueo exige constituir antes un dispositivo reforzado completo.","Con ese mínimo cabe añadir bloqueo y seguimiento al ordinario, sin que ese refuerzo lo convierta necesariamente en reforzado."],"answer":3,"explanation":"El apartado de personal adicional del ordinario permite establecer bloqueo y seguimiento cuando hay un mínimo de seis efectivos. No equipara automáticamente ese apoyo a la modalidad reforzada. Las otras dos propuestas restringen o cambian indebidamente esa posibilidad.","source":{"page":92,"section":"5.2.3. Personal adicional del dispositivo operativo ordinario","document":"Temario original"},"question":"Un dispositivo ordinario de la ATGC reúne seis componentes y se plantea añadir bloqueo y seguimiento. Según el procedimiento específico, ¿qué afirmación es válida?","origin":"original","conceptIds":["T150","S057"]},{"id":"m05","topic":"Detenciones en carretera","type":"convencional","options":["Valorar emplear únicamente la azul fija y el ámbar posterior en lugar del prioritario azul destellante.","Suprimir la advertencia posterior y mantener solo el prioritario azul destellante hasta finalizar la intervención.","Conservar los destellos azules sin valorar otras combinaciones, porque esa señal no admite adaptación.","TODAS SON CORRECTAS"],"answer":0,"explanation":"El protocolo permite valorar azul fija y ámbar posterior cuando el efecto mirón de los destellos puede ocasionar problemas. No es una orden de apagar toda advertencia ni una prohibición de adaptar esa combinación. La propuesta que reúne esas condiciones se ajusta al supuesto.","source":{"page":110,"section":"2.1.1.1. Vehículo de cuatro ruedas con colores oficiales: efecto mirón","document":"Temario original"},"question":"Una patrulla en vehículo de cuatro ruedas con colores oficiales realiza una detención en autopista o autovía. Los destellos azules provocan «efecto mirón» con circulación intensa. ¿Qué valoración contempla el protocolo?","origin":"original","conceptIds":[]},{"id":"m06","topic":"UNIS","type":"correcta","options":["Participa en las dirigidas a EIS, mientras la colaboración en las de GIAT, EPRAT y motoristas queda fuera de su cometido.","Participa en las relacionadas con EIS y auxilia en las de EPRAT, GIAT y motoristas, impartiendo formación en las materias previstas.","Limita su colaboración a recopilar legislación para el jefe, sin intervenir directamente en la formación sobre siniestralidad y atestados.","TODAS SON CORRECTAS"],"answer":1,"explanation":"La función formativa incluye participar en materias relacionadas con EIS y auxiliar en EPRAT, GIAT y motoristas; además, impartir formación en siniestralidad vial, atestados y delitos contra la seguridad vial. Las otras alternativas recortan ese alcance.","source":{"page":13,"section":"1.2.1.13. Acciones formativas de unidad","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En las acciones formativas de unidad, el suboficial segundo jefe de la UNIS:","origin":"original","conceptIds":["S118"]},{"id":"m07","topic":"Nevadas y coordinación","type":"correcta","options":["La limpieza permite ejecutar la reapertura antes de elevar la propuesta al CGT, siempre que se informe inmediatamente después.","El responsable de carreteras eleva la propuesta al CGT sin consenso con agentes, pues dicho consenso solo se exige al imponer el corte.","TODAS SON INCORRECTAS","La propuesta se decide atendiendo al tramo limpio, porque las restricciones de otros tramos del itinerario no pueden condicionar su reapertura."],"answer":2,"explanation":"Las otras tres afirmaciones son falsas: se consideran los demás tramos, la propuesta de levantamiento se eleva al responsable del CGT y debe estar consensuada entre carreteras y agentes. No basta con que el riesgo local haya desaparecido. Aquí la única conclusión válida es «Todas son incorrectas».","source":{"page":149,"section":"10. Procedimiento específico sobre restricciones al tráfico: levantamiento","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Ha desaparecido el riesgo local en un tramo cerrado por nieve y se propone levantar la restricción. Según el plan:","origin":"original","conceptIds":["T216","S033"]},{"id":"m08","topic":"Dispositivos ATGC","type":"convencional","options":["Su ejecución está excluida por el horario, aunque exista iluminación suficiente y se cumplan los demás condicionantes.","La iluminación artificial permite prescindir de cobertura de transmisiones si se comunica a COTA la posición antes del montaje.","El chaleco antibalas se exige al componente de protección; el verificador puede prescindir de él para efectuar las pruebas.","TODAS SON INCORRECTAS"],"answer":3,"explanation":"Las tres propuestas alteran los requisitos: el reducido puede ejecutarse de noche con condiciones; se necesita iluminación y cobertura, no una a cambio de la otra; todos los componentes deben portar antibalas. La alternativa global es la única válida.","source":{"page":88,"section":"5.1.1. Dispositivo ordinario reducido: condiciones nocturnas","document":"Temario original"},"question":"Se prepara un dispositivo ordinario reducido de la ATGC en horario nocturno. ¿Qué afirmación respeta sus condiciones específicas?","origin":"original","conceptIds":["T141","S051"]},{"id":"m09","topic":"Detenciones en carretera","type":"correcta","options":["TODAS SON INCORRECTAS","Si no hay arcén practicable, puede detenerlo sobre la calzada cuando exista un tramo recto y ambos sentidos tengan visibilidad.","Descartada la amenaza de los ocupantes, el protector permanece junto al vehículo particular durante toda la gestión y deja de advertir al tráfico.","El agente encargado de continuar la actuación accede al vehículo por su lateral izquierdo para mantener contacto directo con el conductor."],"answer":0,"explanation":"Sin arcén practicable, el protocolo exige detener fuera de la calzada; tras comprobar que no existe amenaza, el auxiliar retrocede para advertir al tráfico; el otro agente accede por el lateral derecho. Ninguna de las tres actuaciones propuestas es correcta.","source":{"page":114,"section":"2.1.2.1. Vehículo de cuatro ruedas con colores oficiales en carreteras convencionales","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En una carretera convencional, una patrulla de cuatro ruedas con colores oficiales debe detener excepcionalmente un vehículo. Según el protocolo:","origin":"original","conceptIds":["S087"]},{"id":"m10","topic":"Nevadas y coordinación","type":"correcta","options":["TODAS SON INCORRECTAS","Debe circular por el carril derecho y no efectuar adelantamientos ni rebasamientos, sin perjuicio de las demás restricciones aplicables.","Puede adelantar por el contiguo al derecho si tiene tres carriles por sentido, aunque continúe la nieve y se apliquen las medidas previstas.","Queda fuera de la obligación del carril derecho porque esa regla solo alcanza a camiones y conjuntos de vehículos."],"answer":1,"explanation":"La regla incluye autobuses, además de camiones de MMA superior a 3.500 kg, autobuses articulados y conjuntos. Exige carril derecho y prohíbe adelantamientos y rebasamientos en los casos indicados. Como sí hay una afirmación verdadera, «Todas son incorrectas» es falsa.","source":{"page":144,"section":"8.1. Fase de alerta: regla de carril derecho ante fenómenos adversos","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Según la regla transversal recogida en el plan de nevadas, un autobús circula por una vía afectada por nieve:","origin":"original","conceptIds":["S022"]},{"id":"m11","topic":"Dispositivos ATGC","type":"convencional","options":["TODAS SON INCORRECTAS","Introducir el siguiente vehículo si ya ha identificado visualmente a su conductor, dejando la protección al verificador mientras concluye.","Atender a la protección y no introducir nuevos vehículos ni intervenir simultáneamente mientras su compañero actúa con el anterior.","Iniciar una segunda comprobación documental y recuperar la protección cuando el primer verificador termine la denuncia."],"answer":2,"explanation":"El primer componente debe proteger al segundo. No introduce vehículos ni interviene simultáneamente mientras su compañero actúa. Existe una excepción de apoyo para trámites que se demoran, pero no autoriza crear otra intervención simultánea desatendiendo la protección.","source":{"page":89,"section":"5.1.3. Misiones del componente de selección y protección; apoyo en p. 90","document":"Temario original"},"question":"En un dispositivo reducido de dos componentes de la ATGC, el verificador está actuando con un vehículo. ¿Qué actuación corresponde al componente de selección y protección?","origin":"original","conceptIds":["T145","S053"]},{"id":"m12","topic":"UNIS","type":"convencional","options":["TODAS SON INCORRECTAS","Validar solo los totales periódicos, quedando la calidad y la grabación en las bases de datos exclusivamente a cargo de cada EIS.","Difundir los escritos de interés judicial sin revisar la calidad estadística, que corresponde de forma exclusiva al oficial de Investigación.","Controlar la calidad de la estadística, asegurar la correcta grabación en las bases y la difusión de los escritos de interés judicial."],"answer":3,"explanation":"El cometido comprende las tres facetas: calidad estadística, correcta grabación en las bases y difusión de escritos de interés judicial. Las alternativas que excluyen alguna de ellas recortan una función expresamente atribuida al segundo jefe.","source":{"page":13,"section":"1.2.1.9. Calidad estadística, grabación y difusión de escritos","document":"Temario original"},"question":"Respecto al control de datos de investigación, ¿qué cometido atribuye el temario al suboficial segundo jefe de la UNIS?","origin":"original","conceptIds":["S114"]},{"id":"c001","topic":"UNIS","type":"convencional","question":"¿Qué unidades coordina el Oficial Jefe de las UNIS?","options":["EIS, EPRAT y GIAT","EIS, ERAT y DIRAT","EA, ERAT y GIAT","EPRAT, DIRAT y COTA"],"answer":0,"explanation":"Su misión principal es el mando, control, impulso y coordinación de los EIS, EPRAT y GIAT.","source":{"page":7,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T002"]},{"id":"c002","topic":"UNIS","type":"convencional","question":"¿De quién depende técnicamente el Oficial Jefe de la UNIS del Sector?","options":["Del Fiscal Delegado de Seguridad Vial provincial","De la Jefatura de Operaciones de la Agrupación","Del Jefe del Subsector de Tráfico de su provincia","Del Jefe de la Zona de la Guardia Civil"],"answer":1,"explanation":"Literal: «De la Jefatura de Operaciones (Área de Operaciones) de la Agrupación». Depende orgánica y funcionalmente del Jefe del Sector y técnicamente del Área de Operaciones.","source":{"page":8,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T005"]},{"id":"c003","topic":"UNIS","type":"convencional","question":"¿De quién depende orgánica y funcionalmente el Oficial Jefe de la UNIS del Sector?","options":["Del Jefe del Subsector","Del Oficial Jefe de la UNIS del Subsector","Del Jefe del Sector","Del Área de Operaciones"],"answer":2,"explanation":"1.1.1.1: dependerá orgánica y funcionalmente del Jefe del Sector.","source":{"page":8,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T004"]},{"id":"c004","topic":"UNIS","type":"convencional","question":"El Oficial Jefe de la UNIS del Sector realizará visitas e inspecciones a todas las UNIS del Sector:","options":["Al menos semestralmente, con conocimiento del Jefe del Sector","Al menos mensualmente, sin necesidad de comunicarlo a ningún mando","Al menos anualmente, con conocimiento del Área de Operaciones","Al menos trimestralmente, con conocimiento del Jefe del Subsector"],"answer":3,"explanation":"1.1.1.3: al menos trimestralmente, con conocimiento del Jefe del Subsector correspondiente.","source":{"page":8,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T008"]},{"id":"c005","topic":"UNIS","type":"convencional","question":"¿Con qué fiscal contacta, al menos trimestralmente, el Oficial Jefe de la UNIS del Sector?","options":["Con el fiscal delegado autonómico de seguridad vial","Con el fiscal delegado provincial de seguridad vial","Con el Fiscal de Sala Coordinador de Seguridad Vial","Con el fiscal jefe de la Audiencia Provincial respectiva"],"answer":0,"explanation":"Literal: «Con el fiscal delegado autonómico de la especialidad de seguridad vial». 1.1.1.13: fiscal delegado autonómico. El de Sector uniprovincial/Subsector contacta con el de la fiscalía provincial.","source":{"page":9,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T009"]},{"id":"c006","topic":"UNIS","type":"convencional","question":"El Oficial Jefe de la UNIS de Sector uniprovincial/Subsector contacta especialmente con:","options":["El Delegado o Subdelegado del Gobierno","El fiscal delegado de seguridad vial provincial","El fiscal delegado autonómico de seguridad vial","El Fiscal de Sala Coordinador de Seguridad Vial"],"answer":1,"explanation":"Literal: «El fiscal delegado de seguridad vial en la fiscalía provincial». 1.1.2.13: especialmente con el fiscal delegado de seguridad vial en la fiscalía provincial.","source":{"page":11,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T016"]},{"id":"c007","topic":"UNIS","type":"convencional","question":"¿Qué establece el Oficial Jefe de la UNIS del Sector al dar el visto bueno a los informes periciales del EPRAT?","options":["Una revisión exclusiva del Área de Operaciones","Un control posterior por el fiscal delegado","Un sistema de doble supervisión","Un sistema de triple control de calidad"],"answer":2,"explanation":"1.1.1.5: estableciendo un sistema de doble supervisión que evitará errores técnicos o formales.","source":{"page":8,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c008","topic":"UNIS","type":"convencional","question":"¿Qué uniforme utiliza el Oficial Jefe de la UNIS del Sector?","options":["Siempre de paisano, salvo en actos oficiales","De servicio en todo caso, sin ninguna excepción","De paisano, salvo cuando acuda a siniestros con personas fallecidas","De servicio, salvo excepciones en que irá de paisano"],"answer":3,"explanation":"Literal: «Uniforme de servicio, salvo situaciones excepcionales en que podrá vestir de paisano». 1.1.1.2: con uniforme de servicio, salvo en situaciones excepcionales que podrá vestir de paisano.","source":{"page":8,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T007"]},{"id":"c009","topic":"UNIS","type":"convencional","question":"¿Con qué central mantiene el enlace el Oficial Jefe de la UNIS del Sector?","options":["Con la Central Operativa (COTA) del Sector","Con el COC de la Comandancia","Con el Centro de Gestión de Tráfico de la DGT en la provincia","Con el CECOP de la Subdelegación"],"answer":0,"explanation":"Literal: «Con la Central Operativa de Servicio (COTA) del Sector». 1.1.1.14: mantendrá el enlace con la COTA del Sector y con el Jefe de la UNIS correspondiente.","source":{"page":9,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T010"]},{"id":"c010","topic":"UNIS","type":"convencional","question":"¿Qué hace el Oficial Jefe de la UNIS de Sector uniprovincial/Subsector respecto del servicio de oficial de servicio?","options":["Los delega siempre en el Suboficial 2º Jefe de la UNIS","Realiza los que le correspondan en el Sector/Subsector","Está exento de prestar servicios de oficial de servicio","Solo los realiza en ausencia del Jefe del Subsector"],"answer":1,"explanation":"Literal: «Realiza los servicios de oficial de servicio que le correspondan dentro del Sector/Subsector». 1.1.2.3: realizará los servicios de oficial de servicio que le correspondan, integrándose en el mando y control.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T012"]},{"id":"c011","topic":"UNIS","type":"convencional","question":"¿Cuándo asume el Oficial Jefe de la UNIS de Subsector la instrucción de diligencias en siniestros de especial relevancia?","options":["Cuando lo solicite expresamente el instructor del Equipo de Atestados","Cuando lo ordene el Fiscal Delegado de Seguridad Vial","Cuando lo determine el Jefe del Sector/Subsector o un superior","Siempre que en el siniestro resulte algún fallecido"],"answer":2,"explanation":"Literal: «Cuando así lo determine el Jefe del Sector/Subsector o un superior en la cadena de mando». 1.1.2.4.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T013"]},{"id":"c012","topic":"UNIS","type":"convencional","question":"Los siniestros con mayor relevancia penal que supervisa el Oficial Jefe de UNIS de Subsector, auxiliado por el Suboficial 2º Jefe, son los de:","options":["Conducción temeraria y alcoholemia","Delitos contra la seguridad vial del art. 384","Daños de cuantía elevada","Homicidio y lesiones"],"answer":3,"explanation":"El Oficial Jefe de la UNIS de Sector uniprovincial/Subsector supervisa, auxiliado por el Suboficial 2.º Jefe, los siniestros de mayor relevancia penal, expresamente los de homicidio y lesiones, y la corrección técnica y normativa de sus atestados.","source":{"page":10,"section":"Oficial Jefe de la UNIS de Sector uniprovincial/Subsector: supervisión de siniestros de mayor relevancia penal","document":"Temario original"},"origin":"complementario","conceptIds":["T015"]},{"id":"c013","topic":"UNIS","type":"convencional","question":"Ante supuestos de mayor relevancia penal o técnica, o de investigación prolongada, el Oficial Jefe de UNIS de Subsector determina la intervención de:","options":["El EPRAT o el GIAT","El ERAT o el DIRAT","La Policía Judicial de la Comandancia","El SEPRONA"],"answer":0,"explanation":"1.1.2.11: determinando la intervención del EPRAT o del GIAT, coordinando las actuaciones.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c014","topic":"UNIS","type":"convencional","question":"¿Cuál es la misión principal del Suboficial 2º Jefe de la UNIS?","options":["Coordinar las relaciones de la UNIS con la Autoridad Judicial","Mantener y mejorar la calidad de los atestados e informes de los EIS","Dirigir personalmente la investigación de todos los siniestros con fallecidos","Instruir personalmente los informes periciales del EPRAT"],"answer":1,"explanation":"Literal: «Mantener y mejorar el nivel de calidad de los atestados e informes técnicos de los EIS y asesorar al Jefe de la UNIS». 1.2: misión principal.","source":{"page":12,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["T017","S105"]},{"id":"c015","topic":"UNIS","type":"convencional","question":"¿De quién depende orgánica y funcionalmente el Suboficial 2º Jefe de la UNIS?","options":["Del Suboficial Encargado de los Equipos de Atestados","Del Área de Operaciones","Del Jefe de la UNIS del Sector/Subsector","Del Jefe del Subsector"],"answer":2,"explanation":"El Suboficial 2.º Jefe de la UNIS depende orgánica y funcionalmente del Jefe de la UNIS del Sector/Subsector; sus funciones incluyen la supervisión técnica y operativa de la investigación y los informes.","source":{"page":12,"section":"Suboficial 2.º Jefe de la UNIS: dependencia orgánica y funcional","document":"Temario original"},"origin":"complementario","conceptIds":["T019","S106"]},{"id":"c016","topic":"UNIS","type":"convencional","question":"El Suboficial 2º Jefe de la UNIS presta servicio principalmente:","options":["En turnos de 24 horas integrado en la COTA del Sector","De paisano, salvo cuando acuda a siniestros con víctimas","En horario nocturno, impulsando los dispositivos PVA/D","En horario burocrático, de uniforme como norma general"],"answer":3,"explanation":"Literal: «En horario de labores burocráticas, con uniforme de servicio como norma general». 1.2.1.2. También impulsa el servicio de los EIS en puntos de verificación de fines de semana.","source":{"page":12,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["T020","S107"]},{"id":"c017","topic":"UNIS","type":"convencional","question":"¿Quién planifica y nombra el servicio de todos los integrantes de la UNIS?","options":["El Suboficial 2º Jefe de la UNIS","El Oficial Jefe de la UNIS","El Jefe del Subsector","El Suboficial Encargado de los Equipos de Atestados"],"answer":0,"explanation":"El Suboficial 2.º Jefe planifica y nombra el servicio de todos los integrantes de la UNIS, garantizando coordinación, distribución equitativa de los recursos humanos y cobertura de las necesidades del servicio.","source":{"page":12,"section":"Suboficial 2.º Jefe de la UNIS: planificación y nombramiento del servicio","document":"Temario original"},"origin":"complementario","conceptIds":["T022","S109"]},{"id":"c018","topic":"UNIS","type":"convencional","question":"¿Quién da conformidad a todos los informes técnicos de los EIS y a los periciales de los EPRAT?","options":["El Área de Operaciones","El Suboficial 2º Jefe de la UNIS","El Oficial Jefe de la UNIS del Sector","El Jefe del Subsector"],"answer":1,"explanation":"1.2.1.7. El Oficial Jefe da el visto bueno; el Suboficial 2º Jefe da la conformidad.","source":{"page":13,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["T024","S112"]},{"id":"c019","topic":"UNIS","type":"convencional","question":"¿Quién sucede a los Oficiales de Investigación en sus ausencias?","options":["El Suboficial Encargado de los Equipos de Atestados del Subsector","El componente más antiguo del EIS","Los Suboficiales 2º Jefes de la UNIS del Sector/Subsector","El Oficial adjunto al Jefe del Subsector"],"answer":2,"explanation":"Los Suboficiales 2.º Jefes de la UNIS del Sector/Subsector suceden a los Oficiales de Investigación en sus ausencias y asumen las funciones y responsabilidades correspondientes.","source":{"page":14,"section":"Suboficial 2.º Jefe de la UNIS: sucesión de los Oficiales de Investigación","document":"Temario original"},"origin":"complementario","conceptIds":["T023","S122"]},{"id":"c020","topic":"UNIS","type":"convencional","question":"¿Qué responsabilidad tiene el Suboficial 2.º Jefe de la UNIS sobre los medios y dependencias de su unidad?","options":["Gestionar el presupuesto anual asignado a la UNIS","Custodiar las armas y equipos del personal de la UNIS","Autorizar los informes periciales elaborados por el EPRAT","Supervisar el estado y uso de los medios y dependencias"],"answer":3,"explanation":"Debe supervisar el correcto estado y uso de los medios, dependencias y demás elementos del servicio.","source":{"page":14,"section":"Suboficial 2.º Jefe de la UNIS: estado y uso de los medios y dependencias","document":"Temario original"},"origin":"complementario","conceptIds":["S124"]},{"id":"c021","topic":"UNIS","type":"convencional","question":"Visita e inspecciona al menos trimestralmente las bases de los EIS, EPRAT y GIAT a su cargo:","options":["El Oficial Jefe de la UNIS de Sector uniprovincial/Subsector","El Suboficial 2º Jefe de la UNIS, sin necesidad de acompañamiento alguno","El Jefe del Área de Operaciones","El Jefe de la Comandancia"],"answer":0,"explanation":"1.1.2.5. El Suboficial 2º Jefe le acompaña cuando el Jefe lo estime oportuno (1.2.1.12).","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T014","S117"]},{"id":"c022","topic":"UNIS","type":"convencional","question":"Según el manual, ¿quién lidera la toma de decisiones, su ejecución y el desarrollo estratégico de las UNIS?","options":["El Jefe del Área de Operaciones","El Oficial de Investigación","El Suboficial 2º Jefe de las UNIS","El Jefe del Subsector"],"answer":1,"explanation":"1.1: al frente de las UNIS se encuentra el Oficial de Investigación, con el apoyo del Suboficial 2º Jefe.","source":{"page":7,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T001"]},{"id":"c023","topic":"UNIS","type":"convencional","question":"En apoyo al Oficial de Investigación que lidera las decisiones de la UNIS, ¿a qué figura atribuye el párrafo introductorio la supervisión, inspección y control para aplicar correctamente los procedimientos?","options":["El Jefe del Sector","El GIAT","El Suboficial 2º Jefe de las UNIS","El Oficial Jefe de la UNIS del Sector"],"answer":2,"explanation":"El Oficial de Investigación dirige la toma de decisiones y su ejecución. Para apoyar esa dirección, el Suboficial 2.º Jefe asume funciones de supervisión, inspección y control y favorece la aplicación correcta de los procedimientos y la coordinación de la unidad.","source":{"page":7,"section":"Funciones de los Oficiales Jefes de las UNIS: párrafo introductorio sobre el apoyo del Suboficial 2.º Jefe","document":"Temario original"},"origin":"complementario","conceptIds":["T018","S105"]},{"id":"c024","topic":"UNIS","type":"convencional","question":"¿Qué supervisa el Oficial Jefe de la UNIS del Sector respecto del personal de las áreas funcionales?","options":["Su régimen disciplinario, permisos, licencias y vacaciones anuales del personal","Su productividad mensual en denuncias y atestados","Su asistencia a los juicios a los que son citados","Que mantengan sus competencias, proponiendo reciclaje o sustitución"],"answer":3,"explanation":"El Oficial Jefe de la UNIS del Sector supervisa el mantenimiento de las competencias y capacidades del personal de las áreas funcionales. Cuando sea necesario, propone actualización, reciclaje o sustitución del personal.","source":{"page":8,"section":"Oficial Jefe de la UNIS del Sector: selección del personal y mantenimiento de competencias en GIAT y EPRAT","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c025","topic":"UNIS","type":"convencional","question":"Si el Jefe del Sector encomienda expresamente otro cometido al Oficial Jefe de la UNIS del Sector, ¿qué condición establece el manual?","options":["Otros que le encomiende el Jefe del Sector, con conocimiento de Operaciones","Sustituir al Jefe del Sector en sus ausencias y vacantes","Instruir personalmente todas las informaciones verbales por accidentes sin víctimas","Dirigir la COTA del Sector durante los servicios nocturnos"],"answer":0,"explanation":"El Oficial Jefe de la UNIS ejecutará los otros cometidos que le encomiende expresamente el Jefe del Sector, con conocimiento de la Jefatura de Operaciones (Área de Operaciones).","source":{"page":9,"section":"Oficial Jefe de la UNIS del Sector: otros cometidos expresamente encomendados","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c026","topic":"UNIS","type":"convencional","question":"El Oficial Jefe de la UNIS de Subsector depende del Jefe de Sector/Subsector, participándole:","options":["Las bajas del personal","Las novedades de las investigaciones que realice","Las estadísticas mensuales de siniestralidad de su demarcación","Las denuncias formuladas por los EIS"],"answer":1,"explanation":"El Oficial Jefe de la UNIS de Sector uniprovincial/Subsector depende del Jefe de Sector/Subsector y le participa las novedades de las investigaciones que realiza. Así se asegura una supervisión directa de las actuaciones de los EIS.","source":{"page":10,"section":"Oficial Jefe de la UNIS de Sector uniprovincial/Subsector: dependencia y comunicación de novedades","document":"Temario original"},"origin":"complementario","conceptIds":["T011"]},{"id":"c027","topic":"UNIS","type":"convencional","question":"¿A quién eleva el Oficial Jefe de la UNIS de Subsector las propuestas sobre necesidades operativas y logísticas?","options":["Al Jefe de la Comandancia, a través del Jefe del Subsector","A la Dirección General de Tráfico, a través de la Jefatura Provincial correspondiente","A la Jefatura de Operaciones, vía Jefe del Subsector y del Sector","Directamente al General Jefe de la Agrupación de Tráfico"],"answer":2,"explanation":"Literal: «A la Jefatura de Operaciones, a través del Jefe del Subsector y del Sector». 1.1.2.6.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c028","topic":"UNIS","type":"convencional","question":"¿Sobre qué equipos y grupos coordina las actuaciones de investigación el Oficial Jefe de la UNIS de Sector uniprovincial/Subsector, asegurando la calidad de sus informes técnicos?","options":["Los EA y los motoristas","El ERAT y el DIRAT","La COTA y el GIAT","Los EPRAT, EIS y GIAT"],"answer":3,"explanation":"Coordina las actuaciones de investigación en su ámbito y asegura la correcta ejecución de diligencias y la calidad de los informes técnicos elaborados por EPRAT, EIS y GIAT.","source":{"page":10,"section":"Oficial Jefe de la UNIS de Sector uniprovincial/Subsector: coordinación de actuaciones e informes técnicos","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c029","topic":"UNIS","type":"convencional","question":"¿Con quién participa en reuniones de coordinación el Oficial Jefe de la UNIS de Subsector para mantener criterios homogéneos?","options":["Con el Jefe de la UNIS del Sector y otros investigadores","Con el Delegado del Gobierno y el Jefe de la Comandancia","Con el Jefe Provincial de Tráfico y los Jefes de Destacamento","Con el Fiscal de Sala Coordinador y los fiscales delegados"],"answer":0,"explanation":"Literal: «Con el Jefe de la UNIS del Sector y otros responsables de investigación». 1.1.2.12.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c030","topic":"UNIS","type":"convencional","question":"Al dar el visto bueno a los informes técnicos y periciales, el Oficial Jefe de UNIS de Subsector envía copia a:","options":["El Fiscal Delegado provincial","El Jefe de la UNIS del Sector","El Juzgado de guardia","El Área de Operaciones"],"answer":1,"explanation":"1.1.2.10: dando cuenta al Jefe del Sector/Subsector y enviando copia al Jefe de la UNIS del Sector.","source":{"page":10,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":["T025"]},{"id":"c031","topic":"UNIS","type":"convencional","question":"¿Con quién contacta el Oficial Jefe de la UNIS de Subsector por delegación del Jefe del Sector/Subsector?","options":["Colegios de abogados y procuradores, y oficinas municipales de atención al ciudadano","Ayuntamientos, diputaciones y servicios de conservación de carreteras","Autoridades judiciales, forenses, asociaciones de víctimas y policías locales","Compañías aseguradoras, talleres y empresas de grúas de la zona"],"answer":2,"explanation":"Literal: «Autoridades judiciales, médicos forenses, asociaciones de víctimas y policías locales». 1.1.2.13.","source":{"page":11,"section":"UNIS: oficiales jefes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c032","topic":"UNIS","type":"convencional","question":"El Suboficial 2º Jefe auxilia al Jefe de la UNIS en el análisis de las necesidades operativas con propuestas basadas en:","options":["La antigüedad del personal","Las peticiones de la COTA","Las quejas de los ciudadanos","Datos y estadísticas operativas"],"answer":3,"explanation":"Las propuestas del Suboficial 2.º Jefe sobre necesidades logísticas, materiales, operativas, formativas y de personal deben estar fundamentadas en datos y estadísticas operativas.","source":{"page":12,"section":"Suboficial 2.º Jefe de la UNIS: análisis de necesidades operativas","document":"Temario original"},"origin":"complementario","conceptIds":["S108"]},{"id":"c033","topic":"UNIS","type":"convencional","question":"En la selección y propuesta del personal de las áreas GIAT y EPRAT, el Suboficial 2º Jefe:","options":["Colabora con el Jefe de la UNIS evaluando competencias y proponiendo formación","Decide por sí solo la incorporación, informando después al Jefe de la UNIS","No interviene: es competencia exclusiva del Jefe del Sector","Propone directamente al Área de Operaciones sin pasar por el Jefe de la UNIS"],"answer":0,"explanation":"Literal: «Colabora con el Jefe de la UNIS, evaluando competencias y proponiendo formación o reciclaje». 1.2.1.5.","source":{"page":12,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["S110"]},{"id":"c034","topic":"UNIS","type":"convencional","question":"En el seguimiento de supuestos de mayor relevancia penal y/o técnica, el Suboficial 2º Jefe:","options":["Informa directamente al Juzgado sin dar cuenta al Jefe de la UNIS","Auxilia al Jefe de la UNIS, coordinando con otras unidades especializadas","Asume siempre la instrucción de las diligencias en lugar del EIS que intervino","Decide por sí mismo la intervención del ERAT en el siniestro"],"answer":1,"explanation":"Literal: «Auxilia al Jefe de la UNIS, asegurando la coordinación con otras unidades especializadas». 1.2.1.6.","source":{"page":12,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["S111"]},{"id":"c035","topic":"UNIS","type":"convencional","question":"Además de sus funciones expresamente descritas, ¿qué otros cometidos debe realizar el Suboficial 2.º Jefe de la UNIS?","options":["Los servicios de oficial de servicio que le correspondan en el Subsector","Las funciones del Jefe del Sector durante sus ausencias o vacantes","Los otros cometidos que le encomiende expresamente el Jefe de la UNIS","Los cometidos que le encomiende expresamente el Jefe de la Comandancia"],"answer":2,"explanation":"Debe realizar aquellos otros cometidos que le encomiende expresamente el Jefe de la UNIS.","source":{"page":14,"section":"Suboficial 2.º Jefe de la UNIS: otros cometidos expresamente encomendados","document":"Temario original"},"origin":"complementario","conceptIds":["S123"]},{"id":"c036","topic":"Atestados y reconstrucción","type":"convencional","question":"La misión principal de los Equipos de Atestados (EA) es la investigación de siniestros viales en su faceta de:","options":["Policía administrativa","Policía de seguridad ciudadana","Policía de tráfico preventiva","Policía judicial"],"answer":3,"explanation":"La misión principal de los Equipos de Atestados es investigar siniestros viales en su faceta de policía judicial. Esa labor incluye la confección de atestados e informes técnicos y las diligencias por determinados delitos relacionados con la conducción.","source":{"page":14,"section":"Cometidos de los Equipos de Atestados: antecedentes y misión principal","document":"Temario original"},"origin":"complementario","conceptIds":["T026"]},{"id":"c037","topic":"Atestados y reconstrucción","type":"convencional","question":"¿Bajo la dirección técnica y funcional de quién actúan los Equipos de Atestados?","options":["Del Suboficial Encargado de los EA del Subsector","Del Oficial Jefe de la UNIS del Sector","Del Jefe del Destacamento de Tráfico","Del Suboficial 2º Jefe de la UNIS del Sector correspondiente"],"answer":0,"explanation":"Literal: «Del Suboficial Encargado de los Equipos de Atestados del Subsector». Actúa como delegado del jefe del subsector en lo que respecta a los cometidos de atestados.","source":{"page":14,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["T028"]},{"id":"c038","topic":"Atestados y reconstrucción","type":"convencional","question":"La dependencia orgánica de los componentes de los Equipos de Atestados es:","options":["Del Área de Operaciones","De sus respectivas unidades de destino","Del Suboficial Encargado de los EA","Del Oficial Jefe de la UNIS del Sector correspondiente"],"answer":1,"explanation":"La dirección técnica y funcional es del Suboficial Encargado; la orgánica, de sus unidades de destino.","source":{"page":14,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["T030"]},{"id":"c039","topic":"Atestados y reconstrucción","type":"convencional","question":"Los cometidos de la modalidad de atestados se clasifican en:","options":["Ordinarios, extraordinarios y comunes de la especialidad","Judiciales, administrativos y preventivos del servicio","Específicos, genéricos y comunes de la especialidad","Principales, secundarios y accesorios del servicio"],"answer":2,"explanation":"El manual distingue tres clases de cometidos: específicos de la modalidad de atestados, genéricos de esa modalidad y comunes de la especialidad. La clasificación determina la prioridad y las condiciones de utilización de los equipos.","source":{"page":15,"section":"Cometidos de los Equipos de Atestados: clasificación de los cometidos","document":"Temario original"},"origin":"complementario","conceptIds":["T035"]},{"id":"c040","topic":"Atestados y reconstrucción","type":"convencional","question":"Tras un siniestro complejo o con relevancia penal, instructor y secretario disponen de dedicación exclusiva durante:","options":["Los tres servicios posteriores al siniestro","Las 72 horas posteriores al siniestro","Los diez días naturales siguientes","Los cinco servicios posteriores al siniestro"],"answer":3,"explanation":"Tras un siniestro especialmente complejo o con posible relevancia penal, tanto el instructor como el secretario disponen de dedicación exclusiva durante los cinco servicios posteriores, para priorizar las indagaciones y gestiones de la investigación.","source":{"page":15,"section":"Cometidos específicos: intervención en siniestros con relevancia penal o complejos; dedicación exclusiva","document":"Temario original"},"origin":"complementario","conceptIds":["T031"]},{"id":"c041","topic":"Atestados y reconstrucción","type":"convencional","question":"¿Cuál de estas actuaciones justifica interrumpir la dedicación exclusiva de los 5 servicios?","options":["Acudir a otro siniestro complejo o de posible relevancia penal","Un servicio ordinario de vigilancia de carreteras del subsector","Un dispositivo diurno de control de velocidad con cinemómetro","La elaboración de un informe de incidencias en carreteras"],"answer":0,"explanation":"La asistencia a otro siniestro complejo o de posible relevancia penal puede interrumpir la dedicación exclusiva. También puede hacerlo la participación en controles nocturnos de alcohol y drogas previos a sábado, domingo o festivo, u otros dispositivos similares que no puedan desarrollarse sin la participación expresa del EA. Los servicios interrumpidos deben recuperarse inmediatamente.","source":{"page":16,"section":"Cometidos específicos: supuestos de interrupción y recuperación de los cinco servicios de dedicación exclusiva","document":"Temario original"},"origin":"complementario","conceptIds":["T032"]},{"id":"c042","topic":"Atestados y reconstrucción","type":"convencional","question":"En la investigación de un siniestro complejo o con posible relevancia penal, ¿qué controles de alcohol y drogas pueden justificar que el Equipo de Atestados interrumpa los cinco servicios de dedicación exclusiva?","options":["Los ordenados por la DGT dentro de una campaña","Nocturnos previos a sábado, domingo o festivo","Diurnos de cualquier día laborable de la semana","Nocturnos de cualquier día, sea o no laborable"],"answer":1,"explanation":"El manual contempla los controles de alcohol y drogas en horario nocturno previo a sábado, domingo o festivo. Añade otros dispositivos similares que no puedan desarrollarse sin la participación expresa del EA; la dedicación interrumpida debe recuperarse después.","source":{"page":16,"section":"Cometidos específicos: dispositivos que justifican interrumpir la dedicación exclusiva","document":"Temario original"},"origin":"complementario","conceptIds":["T033"]},{"id":"c043","topic":"Atestados y reconstrucción","type":"convencional","question":"Si un Equipo de Atestados debe interrumpir justificadamente alguno de los cinco servicios de dedicación exclusiva tras un siniestro complejo o con posible relevancia penal, ¿qué ocurre con esos servicios?","options":["Se recuperan solo si lo autoriza el Jefe del Subsector","Se compensan con un día de descanso a disfrutar dentro del mes","Deben recuperarse inmediatamente en los servicios posteriores","Se pierden y no se recuperan"],"answer":2,"explanation":"Los servicios interrumpidos deben recuperarse inmediatamente en los posteriores, de modo que el equipo instructor disponga siempre de los cinco servicios de dedicación exclusiva previstos.","source":{"page":16,"section":"Cometidos específicos: recuperación de servicios de dedicación exclusiva","document":"Temario original"},"origin":"complementario","conceptIds":["T034"]},{"id":"c044","topic":"Atestados y reconstrucción","type":"convencional","question":"En siniestros competencia de los motoristas, los EA realizan:","options":["La atención in situ e inmediata del siniestro en la vía","La instrucción completa del atestado desde el primer momento, en el lugar","Únicamente el reportaje fotográfico y el croquis del siniestro","Las gestiones posteriores: heridos, declaraciones y pruebas en hospital"],"answer":3,"explanation":"Literal: «Las gestiones posteriores (identificar heridos, declaraciones, pruebas de alcohol/drogas en centros sanitarios)». 2.1.2: preservar la actividad fundamental de los motoristas más allá de la atención in situ.","source":{"page":16,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T038"]},{"id":"c045","topic":"Atestados y reconstrucción","type":"convencional","question":"La instrucción de delitos contra la seguridad vial complejos por los EA se produce cuando:","options":["Lo considere necesario el jefe del subsector, según las circunstancias","Lo pida expresamente el Fiscal Delegado de Seguridad Vial","El detenido sea reincidente en delitos contra la seguridad vial en el último año","Lo determine el motorista actuante al llegar al lugar"],"answer":0,"explanation":"Literal: «El jefe del subsector, valoradas las circunstancias concretas, lo considere necesario». 2.1.3.","source":{"page":16,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T039"]},{"id":"c046","topic":"Atestados y reconstrucción","type":"convencional","question":"La elaboración de informes de carreteras (incidencias viarias) es un cometido:","options":["Exclusivo del GIAT","Específico de la modalidad de atestados","Genérico de la modalidad de atestados","Común de la especialidad"],"answer":1,"explanation":"La elaboración de informes de incidencias viarias y las gestiones correspondientes al caso se incluye entre los cometidos específicos de la modalidad de atestados.","source":{"page":17,"section":"Cometidos específicos: elaboración de informes de carreteras","document":"Temario original"},"origin":"complementario","conceptIds":["T040"]},{"id":"c047","topic":"Atestados y reconstrucción","type":"convencional","question":"El análisis de la accidentalidad es un cometido:","options":["Común de la especialidad","Exclusivo del Suboficial 2º Jefe de la UNIS","Genérico de la modalidad de atestados","Específico de la modalidad de atestados"],"answer":2,"explanation":"El análisis de la accidentalidad es un cometido genérico: los EA participan en los análisis requeridos por el Jefe del Subsector, tanto globales o estadísticos como específicos o técnicos, para reducir la siniestralidad.","source":{"page":18,"section":"Cometidos genéricos: análisis de la accidentalidad","document":"Temario original"},"origin":"complementario","conceptIds":["T046"]},{"id":"c048","topic":"Atestados y reconstrucción","type":"convencional","question":"La participación en puntos de verificación de alcohol y/o drogas (PVA/D) es un cometido:","options":["Específico de la modalidad de atestados","Genérico de la modalidad de atestados","Excluido de los EA","Común de la especialidad"],"answer":3,"explanation":"2.3.1: cuando tengan finalizada la actividad de cometidos específicos y genéricos.","source":{"page":19,"section":"Cometidos de los Equipos de Atestados: genéricos y comunes","document":"Temario original"},"origin":"complementario","conceptIds":["T048"]},{"id":"c049","topic":"Atestados y reconstrucción","type":"convencional","question":"El apoyo de los EA a investigaciones ajenas a la ATGC (homicidios dolosos con vehículo, pruebas deportivas…) requiere:","options":["Solicitud previa de colaboración y autorización del jefe del subsector","Orden directa y por escrito de la Autoridad Judicial que instruye la causa","Autorización expresa del Área de Operaciones de la Agrupación","Petición escrita del Jefe de la Comandancia de la provincia"],"answer":0,"explanation":"Literal: «Previa solicitud de colaboración y autorización del jefe del subsector». 2.1.5.","source":{"page":17,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T041"]},{"id":"c050","topic":"Atestados y reconstrucción","type":"convencional","question":"En accidentes CON víctimas en que estén implicados vehículos o personal del Cuerpo, los EA dan apoyo:","options":["Al Juzgado de guardia que conozca de los hechos","Al oficial de la ATGC que instruya la información verbal","Al oficial de la unidad territorial afectada por el accidente","Al Jefe de la Comandancia donde ocurra el accidente"],"answer":1,"explanation":"Literal: «Al oficial de la ATGC responsable de instruir la información verbal». 2.1.6. Sin víctimas: apoyo al oficial de la unidad territorial cuando sea requerido.","source":{"page":17,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T042"]},{"id":"c051","topic":"Atestados y reconstrucción","type":"convencional","question":"Cuando los Equipos de Atestados colaboran con componentes de Seguridad Ciudadana, ¿qué planificación deben tener en cuenta?","options":["Exclusivamente el calendario de campañas estadísticas de la DGT","Solo el plan de mantenimiento de material de la unidad","El Plan de Actuaciones de Vigilancia de las Vías de Comunicación","Únicamente su planificación de reconstrucción de siniestros, sin atender al plan de vigilancia de vías"],"answer":2,"explanation":"En las actuaciones en colaboración con Seguridad Ciudadana debe tenerse en cuenta el Plan de Actuaciones de Vigilancia de las Vías de Comunicación, recogido en la Orden de Servicio indicada por el manual.","source":{"page":19,"section":"Cometidos comunes de la especialidad: intervención como unidades de Seguridad Ciudadana","document":"Temario original"},"origin":"complementario","conceptIds":["T050"]},{"id":"c052","topic":"Atestados y reconstrucción","type":"convencional","question":"El sobredimensionamiento en el uso de los EA en cometidos comunes sirve como criterio orientador para:","options":["Aumentar las plantillas de las UNIS en cada sector","Determinar las gratificaciones y productividad del personal","Diseñar el Plan Anual de Formación de la especialidad","Regular los catálogos de puestos de atestados y motoristas"],"answer":3,"explanation":"Literal: «Regular los catálogos de puestos de trabajo de atestados y motoristas en los subsectores». 2.3, segundo párrafo.","source":{"page":19,"section":"Cometidos de los Equipos de Atestados: genéricos y comunes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c053","topic":"Atestados y reconstrucción","type":"convencional","question":"Al inicio de cada turno, ¿qué deben comprobar los componentes de los Equipos de Atestados sobre su material de dotación?","options":["Que el material necesario para intervenir fuera de la base está disponible y en condiciones de uso","Que el material se ha revisado en el turno anterior, sin necesidad de otra comprobación","Únicamente que el vehículo dispone de combustible, dejando el resto para la primera intervención","Que el material de reconstrucción se ha remitido al Área de Operaciones antes de iniciar el servicio"],"answer":0,"explanation":"El personal de los EA es responsable del mantenimiento y cuidado del material oficial. Al comenzar cada turno debe comprobar que el necesario para intervenir fuera de base está disponible y en condiciones de utilización.","source":{"page":15,"section":"Cometidos de los Equipos de Atestados: mantenimiento y comprobación del material al inicio del turno","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c054","topic":"Atestados y reconstrucción","type":"convencional","question":"Además de investigar siniestros, los EA instruyen diligencias por delitos contra la seguridad vial u otros derivados de la conducción de:","options":["Vehículos oficiales","Vehículos a motor o ciclomotor","Cualquier vehículo, incluidas bicicletas","Vehículos de transporte de mercancías"],"answer":1,"explanation":"Además de investigar siniestros, la misión principal de los EA incluye instruir diligencias por delitos contra la seguridad vial u otros derivados de la conducción de vehículos a motor o ciclomotor.","source":{"page":14,"section":"Cometidos de los Equipos de Atestados: antecedentes y alcance de las diligencias","document":"Temario original"},"origin":"complementario","conceptIds":["T027"]},{"id":"c055","topic":"Atestados y reconstrucción","type":"convencional","question":"El Suboficial Encargado de los Equipos de Atestados del Subsector actúa como delegado de:","options":["El Jefe del Sector, en lo relativo a la instrucción","El Área de Operaciones, en lo relativo a atestados","El jefe del subsector, en los cometidos de atestados","El Oficial Jefe de la UNIS, en los cometidos de investigación"],"answer":2,"explanation":"Literal: «El jefe del subsector, en lo que respecta a los cometidos de atestados». ISAT 6/2020, antecedentes.","source":{"page":14,"section":"UNIS: suboficial segundo jefe","document":"Temario original"},"origin":"complementario","conceptIds":["T029"]},{"id":"c056","topic":"Atestados y reconstrucción","type":"convencional","question":"En la modalidad de atestados, ¿qué caracteriza a los cometidos específicos?","options":["Se realizan cuando no existen cometidos genéricos pendientes en el subsector","Sirven para reforzar la labor de los motoristas en la vía","Ordena expresamente la Autoridad Judicial en cada caso","Por su complejidad técnica o procedimental hacen idóneos a los EA"],"answer":3,"explanation":"Son actuaciones de especial complejidad técnica o procedimental para las que la formación y herramientas de los EA los hacen el personal idóneo. Los cometidos genéricos y comunes tienen una naturaleza y prioridad distintas.","source":{"page":15,"section":"Cometidos de los Equipos de Atestados: definición de cometidos específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T036"]},{"id":"c057","topic":"Atestados y reconstrucción","type":"convencional","question":"En los siniestros especialmente complejos o con posible relevancia penal, ¿qué conjunto documental identifica el manual como cometido específico de los Equipos de Atestados?","options":["Atestados, informes técnicos y, en su caso, informes de reconstrucción","Atestados e informes de incidencias viarias, reservando todos los informes técnicos al ERAT","Informes técnicos e informes de reconstrucción, reservando el atestado a la modalidad de motoristas","Atestados e informes estadísticos, excluyendo los informes técnicos y de reconstrucción"],"answer":0,"explanation":"A los EA les corresponde instruir atestados, informes técnicos y, en su caso, de reconstrucción, por siniestros especialmente complejos o que puedan tener relevancia penal. La posterior elaboración de informes periciales de reconstrucción está sujeta a autorización o designación expresa del Área de Operaciones.","source":{"page":15,"section":"Cometidos específicos: intervención en siniestros con relevancia penal o complejos","document":"Temario original"},"origin":"complementario","conceptIds":["T037"]},{"id":"c058","topic":"Atestados y reconstrucción","type":"convencional","question":"Durante los cinco servicios de dedicación exclusiva, instructor y secretario deben priorizar:","options":["La formación del personal de nuevo ingreso en el equipo","Las indagaciones y gestiones para esclarecer el siniestro","La redacción de las denuncias administrativas pendientes","Los servicios de vigilancia de carreteras de su demarcación"],"answer":1,"explanation":"Literal: «Las indagaciones y gestiones necesarias para esclarecer el siniestro». 2.1.1.","source":{"page":15,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T031"]},{"id":"c059","topic":"Atestados y reconstrucción","type":"convencional","question":"¿Qué finalidad persiguen los cinco servicios de dedicación exclusiva del instructor y secretario de un Equipo de Atestados tras un siniestro complejo o con posible relevancia penal?","options":["El aumento de las denuncias por alcoholemia y drogas","La disponibilidad inmediata del EA para la COTA","La pronta finalización y calidad de las diligencias","La reducción de la siniestralidad global del subsector"],"answer":2,"explanation":"La dedicación debe repercutir directamente en la pronta finalización y en la calidad de las diligencias instruidas, evitando dilaciones inasumibles.","source":{"page":16,"section":"Cometidos específicos: finalidad de la dedicación exclusiva","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c060","topic":"Atestados y reconstrucción","type":"convencional","question":"El objetivo de que los EA hagan las gestiones posteriores en siniestros de motoristas es:","options":["Que los motoristas no instruyan nunca atestados","Aumentar la estadística de actuaciones de los EA","Evitar que los motoristas tengan que acudir a hospitales","Preservar la actividad fundamental de los motoristas"],"answer":3,"explanation":"Literal: «Preservar la actividad fundamental de los motoristas más allá de la atención in situ e inmediata». 2.1.2.","source":{"page":16,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c061","topic":"Atestados y reconstrucción","type":"convencional","question":"En los informes de carreteras, los EA son los encargados de:","options":["Elaborar los informes de incidencias viarias","Reparar o reponer la señalización dañada","Informar a la DGT de las retenciones en curso","Coordinar a los servicios de conservación de la vía"],"answer":0,"explanation":"Literal: «Elaborar los informes de incidencias viarias y las gestiones que correspondan». 2.1.4.","source":{"page":17,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T040"]},{"id":"c062","topic":"Atestados y reconstrucción","type":"convencional","question":"En informaciones verbales por accidentes SIN víctimas, los EA prestan apoyo:","options":["A nadie: no intervienen en accidentes sin víctimas","Al oficial de la unidad territorial que la instruya, si se requiere","Al oficial de la ATGC que deba instruirla, en todo caso y sin necesidad de petición","Al Juzgado de guardia, remitiéndole las diligencias"],"answer":1,"explanation":"Literal: «Al oficial de la unidad territorial que deba instruirla, cuando sea requerida la colaboración». 2.1.6.","source":{"page":17,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T042"]},{"id":"c063","topic":"Atestados y reconstrucción","type":"convencional","question":"Los cometidos genéricos de atestados se definen como:","options":["Los destinados a reforzar la labor de los motoristas en la atención de siniestros","Los ordenados expresamente por el Fiscal Delegado","Los que realizan cuando no tienen cometidos específicos preferentes","Los de especial complejidad técnica o procedimental"],"answer":2,"explanation":"Literal: «Los que, sin ser específicos, los EA llevan a cabo cuando no tengan cometidos específicos preferentes». 2.2.","source":{"page":17,"section":"Cometidos de los Equipos de Atestados: específicos","document":"Temario original"},"origin":"complementario","conceptIds":["T043"]},{"id":"c064","topic":"Atestados y reconstrucción","type":"convencional","question":"La asignación de otros siniestros a los EA como cometido genérico se basa en criterios de:","options":["Antigüedad y experiencia del instructor del equipo","Gravedad de las lesiones sufridas por los implicados","Proximidad geográfica de la base al lugar del siniestro","Eficiencia global en el reparto de tareas con motoristas"],"answer":3,"explanation":"Literal: «Eficiencia global en la asignación de tareas entre motoristas y atestados». 2.2.1.","source":{"page":18,"section":"Cometidos de los Equipos de Atestados: genéricos y comunes","document":"Temario original"},"origin":"complementario","conceptIds":["T044"]},{"id":"c065","topic":"Atestados y reconstrucción","type":"convencional","question":"En el análisis de la accidentalidad, los EA participan en los análisis que requiera el jefe del subsector a nivel:","options":["Global/estadístico y específico/técnico","Solo estadístico, a partir de los datos de ARENA2","Solo técnico, sobre siniestros concretos con víctimas","Provincial y autonómico, junto con la DGT"],"answer":0,"explanation":"Los EA participan en los análisis de accidentalidad que requiera el Jefe del Subsector, tanto a nivel global o estadístico como específico o técnico. Deben estudiar factores de origen de los siniestros y agravantes de sus consecuencias.","source":{"page":18,"section":"Cometidos genéricos: análisis de la accidentalidad","document":"Temario original"},"origin":"complementario","conceptIds":["T046"]},{"id":"c066","topic":"Atestados y reconstrucción","type":"convencional","question":"Aunque no hayan concluido todos sus cometidos específicos y genéricos, ¿en qué supuesto pueden participar los Equipos de Atestados en dispositivos operativos de control?","options":["Únicamente cuando ya no exista ninguna diligencia pendiente en todo el Subsector","En controles nocturnos de alcohol y drogas previos a sábado, domingo o festivo, u otros dispositivos similares que requieran expresamente su participación","En cualquier control diurno ordinario, aunque interfiera con una investigación compleja en dedicación exclusiva","Solo cuando el dispositivo se celebre dentro de la base del equipo"],"answer":1,"explanation":"La participación ordinaria en PVA/D exige que estén finalizados los cometidos específicos y genéricos, pero el manual mantiene la excepción de controles nocturnos previos a sábado, domingo o festivo y otros dispositivos similares que no puedan desarrollarse sin participación expresa del EA. Si interrumpen dedicación exclusiva, sus servicios se recuperan inmediatamente.","source":{"page":19,"section":"Cometidos comunes: PVA/D, excepción conectada con la dedicación exclusiva descrita en la página 16","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c067","topic":"Atestados y reconstrucción","type":"convencional","question":"Los EA podrán prestar servicio de vigilancia de carreteras o como reserva del mando siempre que:","options":["No haya más de dos siniestros pendientes de instruir","Sea en horario nocturno y con autorización de la COTA","No interfiera en sus cometidos específicos y/o genéricos","Lo autorice previamente el Área de Operaciones"],"answer":2,"explanation":"Literal: «No interfiera en la actividad de sus cometidos específicos y/o genéricos». 2.3.2.","source":{"page":19,"section":"Cometidos de los Equipos de Atestados: genéricos y comunes","document":"Temario original"},"origin":"complementario","conceptIds":["T047","T049"]},{"id":"c068","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro con una calificación inicial de al menos un herido grave. ¿Quién interviene?","options":["La patrulla de motoristas que acuda primero","El mando, según el plan anual de los EIS","El GIAT, con apoyo de la patrulla de motoristas","El EIS (equipo de investigación de siniestros)"],"answer":3,"explanation":"Literal: «El equipo de investigación de siniestros (EIS)». 3.1.","source":{"page":25,"section":"Intervención en siniestros y documentación: modalidad de intervención","document":"Temario original"},"origin":"complementario","conceptIds":["T059"]},{"id":"c069","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro con al menos un herido leve y sin graves ni fallecidos. ¿Quién interviene?","options":["El mando, conforme al plan anual de los EIS","Siempre el equipo de investigación de siniestros","Siempre la patrulla de motoristas actuante","El Suboficial 2º Jefe de la UNIS en persona"],"answer":0,"explanation":"Literal: «A determinar por el mando conforme al plan anual de los EIS». 3.1.","source":{"page":26,"section":"Intervención en siniestros y documentación: modalidad de intervención","document":"Temario original"},"origin":"complementario","conceptIds":["T060"]},{"id":"c070","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro con solo daños materiales SIN relevancia penal. ¿Quién interviene?","options":["Nadie: lo resuelven los implicados con el parte amistoso","Motoristas, salvo otra previsión del plan anual o de la COTA","El equipo de investigación de siniestros, en todo caso y sin excepción","El mando, según lo previsto en el plan anual"],"answer":1,"explanation":"Literal: «La patrulla de motoristas, salvo otra definición en el plan anual o indicación de COTA». 3.1.","source":{"page":26,"section":"Intervención en siniestros y documentación: modalidad de intervención","document":"Temario original"},"origin":"complementario","conceptIds":["T062"]},{"id":"c071","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro con solo daños materiales CON posible relevancia penal por el valor de los daños:","options":["A determinar por el mando según el plan anual","GIAT, con apoyo de la COTA","Equipo de investigación de siniestros","Patrulla de motoristas, salvo que haya heridos"],"answer":2,"explanation":"En los siniestros con solo daños materiales, la posible relevancia penal por el valor de los daños determina la intervención del EIS. Cuando no existe relevancia penal, el criterio ordinario es motoristas, con las salvedades del plan anual o la COTA.","source":{"page":26,"section":"Criterios generales de intervención: siniestros con solo daños materiales","document":"Temario original"},"origin":"complementario","conceptIds":["T061"]},{"id":"c072","topic":"Siniestros y documentación","type":"convencional","question":"En un siniestro de transporte escolar o de una prueba deportiva, sin fallecidos ni heridos graves ni otra circunstancia que imponga la intervención del EIS, ¿cómo se concreta la modalidad que interviene?","options":["Siempre el equipo de investigación de siniestros","Siempre la patrulla de motoristas actuante","El ERAT, por su posible repercusión mediática","El mando, conforme al plan anual de los EA"],"answer":3,"explanation":"El criterio específico para transporte escolar, pruebas deportivas y supuestos similares remite a la determinación del mando conforme al plan anual de los Equipos de Atestados. Se debe tener en cuenta cualquier otro criterio concurrente que determine la intervención del EIS.","source":{"page":26,"section":"Criterios generales de intervención: transporte escolar, autoridades, mercancías peligrosas y pruebas deportivas","document":"Temario original"},"origin":"complementario","conceptIds":["T063"]},{"id":"c073","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro en vía férrea. ¿Quién interviene?","options":["Equipo de investigación de siniestros","Patrulla de motoristas","A determinar por el mando","La Policía Judicial de la Comandancia"],"answer":0,"explanation":"El manual asigna al equipo de investigación de siniestros la intervención en los siniestros en vías férreas.","source":{"page":26,"section":"Criterios generales de intervención: siniestros en vías férreas","document":"Temario original"},"origin":"complementario","conceptIds":["T064"]},{"id":"c074","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro de un componente de la ATGC con vehículo oficial, fuera de servicio:","options":["A determinar por el mando, según plan anual","Equipo de investigación de siniestros","Patrulla de motoristas del destacamento","Información verbal sin necesidad de atestado"],"answer":1,"explanation":"3.1: de servicio o fuera de servicio con vehículos oficiales.","source":{"page":26,"section":"Intervención en siniestros y documentación: modalidad de intervención","document":"Temario original"},"origin":"complementario","conceptIds":["T065"]},{"id":"c075","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro que ya corresponde a la patrulla de motoristas, con un delito contra la seguridad vial de instrucción simple. ¿Quién instruye?","options":["El GIAT","El mando decide según el plan anual","Sigue siendo la patrulla de motoristas","Pasa siempre al equipo de investigación de siniestros"],"answer":2,"explanation":"Si el siniestro ya corresponde a motoristas y el delito contra la seguridad vial añadido es de instrucción simple, sigue instruyendo la patrulla de motoristas. Para los restantes supuestos interviene el EIS.","source":{"page":26,"section":"Criterios generales de intervención: siniestro acompañado de delito contra la seguridad vial","document":"Temario original"},"origin":"complementario","conceptIds":["T067"]},{"id":"c076","topic":"Siniestros y documentación","type":"convencional","question":"¿Dónde se define la modalidad a intervenir en los siniestros que admiten una u otra modalidad?","options":["En la Orden General 30/2021 de la Guardia Civil","En el Procedimiento AGT01 de instrucción de atestados","En la papeleta de servicio del motorista actuante","En el plan anual de los EA de cada jefe de subsector"],"answer":3,"explanation":"Literal: «En el plan anual de los equipos de atestados, por cada jefe de subsector». 3.2.","source":{"page":26,"section":"Intervención en siniestros y documentación: modalidad de intervención","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c077","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro con solo daños o lesiones leves sin indicios de delito. ¿Qué se elabora?","options":["
