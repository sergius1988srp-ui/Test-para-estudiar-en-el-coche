PAS conforme a la instrucción 107/TV-19?","options":["Los equipos EIS","Los equipos GIAT","Los equipos EPRAT","Los equipos EVAT"],"answer":3,"explanation":"El temario establece esta regla: Los equipos EVAT. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c293","topic":"Nevadas y coordinación","type":"convencional","question":"En emergencia se tienen en cuenta los vehículos retenidos o encapsulados de las categorías:","options":["M, N y O","A, B y C","L, M y N","N, O y T"],"answer":0,"explanation":"El temario establece esta regla: M, N y O. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c294","topic":"Nevadas y coordinación","type":"convencional","question":"En situaciones de bloqueo de vehículos en calzada, se incorpora a LINCE:","options":["El nombre y teléfono de los conductores afectados","Ubicación, nº de vehículos bloqueados por tipo y nº de personas","Solo la localización exacta de la incidencia","Las matrículas de todos los vehículos bloqueados y su lugar de destino"],"answer":1,"explanation":"Literal: «La localización, el número de vehículos bloqueados por tipología y el número de personas». 12.1.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":["S037"]},{"id":"c295","topic":"Nevadas y coordinación","type":"convencional","question":"¿Qué decisiones deben trasladarse de inmediato a la DGT en LINCE?","options":["Solo los embolsamientos de vehículos pesados","Los partes de personal y medios disponibles","Las decisiones de corte y las restricciones aplicadas","Solo los accidentes en los que haya víctimas mortales o heridos"],"answer":2,"explanation":"Literal: «Las decisiones operativas de corte y las restricciones aplicadas». 12.1.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":["S036"]},{"id":"c296","topic":"Nevadas y coordinación","type":"convencional","question":"Si la carretera discurre por varios Subsectores, los COTA afectados:","options":["Envían cada uno su propia novedad por separado","Delegan la comunicación en la COTA Central","No envían novedad hasta el final del episodio","Se coordinan para enviar una única novedad"],"answer":3,"explanation":"El temario establece esta regla: Se coordinan para enviar una única novedad. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":["T232","S038"]},{"id":"c297","topic":"Nevadas y coordinación","type":"convencional","question":"Se prevé que una restricción por nieve en una carretera incluida en el plan dure más de 30 minutos. ¿A quién comunica el COTA la novedad por SIGO?","options":["Directamente al COTA Central y a su respectiva Comandancia.","Solo al Centro de Gestión de Tráfico, sin comunicación al COTA Central.","Únicamente al Sector, que decide si la traslada al día siguiente.","Solo a los puestos avanzados, sin remisión central."],"answer":0,"explanation":"En las carreteras del anexo I y con duración prevista superior a 30 minutos, la novedad se remite directamente al COTA Central y a la Comandancia. El dato importante es el circuito de comunicación.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c298","topic":"Nevadas y coordinación","type":"convencional","question":"¿Cómo se vinculan en SIGO los hechos creados con motivo del plan de nevadas?","options":["Se graban aislados y se vinculan únicamente al cerrar la campaña.","Al evento del Sector correspondiente y, dado el caso, al de la respectiva Comandancia.","Solo al servicio individual de la patrulla, sin evento de referencia.","Exclusivamente a un evento de AEMET ajeno a la cadena del Cuerpo."],"answer":1,"explanation":"El temario ordena vincular los hechos al evento del Sector y, cuando proceda, al de Comandancia. Se evalúa la relación de información y no el número del procedimiento.","source":{"page":152,"section":"12.2-12.3. SIGO e informes de nevadas","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c299","topic":"Nevadas y coordinación","type":"convencional","question":"¿Quiénes pueden incorporarse a la célula DGT/ATGC si es preciso?","options":["Las compañías aseguradoras de los vehículos","Las asociaciones de empresas de transporte","Carreteras y protección civil, en contacto con AEMET","Las Policías Locales de los municipios afectados por la nevada"],"answer":2,"explanation":"Literal: «Dirección General de Carreteras y protección civil, con comunicación permanente con AEMET». 5.2.","source":{"page":139,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T222","S028"]},{"id":"c300","topic":"Nevadas y coordinación","type":"convencional","question":"Según el Comité Ejecutivo, ¿quién dispondrá el establecimiento de controles para restringir pesados, exigir cadenas o desviar el tráfico?","options":["La Comandancia de la Guardia Civil","El Sector de Tráfico","La Unidad de Protección Civil","La Jefatura Provincial de Tráfico"],"answer":3,"explanation":"El temario establece esta regla: La Jefatura Provincial de Tráfico. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c301","topic":"Nevadas y coordinación","type":"convencional","question":"¿Quién asiste al Delegado o Subdelegado del Gobierno en la dirección del CECOP?","options":["La Unidad de Protección Civil","El Jefe del Subsector","La Jefatura Provincial de Tráfico","El Gabinete de Información"],"answer":0,"explanation":"El temario establece esta regla: La Unidad de Protección Civil. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["S030"]},{"id":"c302","topic":"Nevadas y coordinación","type":"convencional","question":"La ubicación de los Puestos de Mando Avanzado está contemplada en:","options":["Los Planes Territoriales de las CC. AA.","Los Protocolos de la Delegación o Subdelegación","La Orden de Servicio de la Agrupación de Tráfico","El Plan Meteoalerta de AEMET en vigor"],"answer":1,"explanation":"Literal: «Los Protocolos de la Delegación o Subdelegación del Gobierno». 6.3.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c303","topic":"Nevadas y coordinación","type":"convencional","question":"Para la coordinación entre provincias limítrofes, en los Sectores con vías de alta capacidad se designan:","options":["Un enlace de la DGT en cada Subsector afectado","Un coordinador designado por cada Comandancia","Oficiales coordinadores y un 2º Oficial entre la ATGC y los CGT","Suboficiales coordinadores en cada Puesto de Mando Avanzado de la provincia"],"answer":2,"explanation":"Literal: «Oficiales coordinadores y un segundo Oficial entre la ATGC y los CGT». 6.5. Sobre todo para el levantamiento de las restricciones.","source":{"page":141,"section":"6.5. Coordinación entre provincias limítrofes","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"snew01","topic":"Nevadas y coordinación","type":"correcta","options":["Ambas finalizan únicamente al quedar todos los tramos en nivel verde.","La alerta termina con la primera dificultad prevista; la emergencia solo mediante la declaración de preemergencia.","La alerta termina al emitirse un aviso amarillo en cualquier lugar; la emergencia, al reducirse el espesor a menos de cinco centímetros.","La alerta, al cesar sus causas o pasar a preemergencia; la emergencia, al desaparecer sus causas."],"answer":3,"explanation":"La terminación de alerta admite dos vías: cese de las circunstancias que la originaron o necesidad de pasar a preemergencia. Emergencia finaliza cuando desaparecen sus causas. No se establece una condición universal de nivel verde.","source":{"page":142,"section":"8.1. Fase de alerta; final de emergencia en 8.3, p. 146","additionalPages":[146],"document":"Temario original"},"conceptIds":["S004","S008","T189","T195"],"question":"ELIGE LA OPCIÓN CORRECTA. En el protocolo AGE por nevadas, ¿cuándo finalizan las fases de alerta y emergencia?","origin":"ampliación"},{"id":"snew02","topic":"Nevadas y coordinación","type":"incorrecta","options":["La previsión de grúas y de atención a usuarios se pospone obligatoriamente hasta que se declare la emergencia.","Debe disponerse de información actualizada sobre el despliegue y posible movilización de quitanieves.","Debe preverse la ubicación y actuación de grúas o máquinas que aparten vehículos que obstruyan la vía.","Pueden establecerse los Puestos de Mando Avanzado asociados a los tramos que lo requieran."],"answer":0,"explanation":"Preemergencia ya incluye PMA según necesidad, información sobre quitanieves, previsión de grúas o palas y atención a usuarios si la situación se prolonga. No hay que esperar a emergencia para prever estos apoyos.","source":{"page":145,"section":"8.2. Fase de preemergencia: actuaciones","document":"Temario original"},"conceptIds":["S010"],"question":"ELIGE LA OPCIÓN INCORRECTA. En la fase de preemergencia por nevadas, respecto a los medios y apoyos previstos:","origin":"ampliación"},{"id":"snew03","topic":"Nevadas y coordinación","type":"convencional","options":["La mediana, dejando el arcén exclusivamente para los vehículos embolsados ligeros.","Los arcenes o el carril derecho.","El carril central en todo caso, aunque solo existan dos carriles por sentido.","El carril izquierdo para mantener libre el derecho a las quitanieves."],"answer":1,"explanation":"El apartado de nivel amarillo prevé desvíos o embolsamientos en zonas acondicionadas y, en su defecto, en arcenes o carril derecho de vías desdobladas. La previsión pertenece a ese supuesto; no convierte cualquier arcén en estacionamiento ordinario.","source":{"page":144,"section":"8.1. Fase de alerta: nivel amarillo, desvíos y embolsamientos","document":"Temario original"},"conceptIds":["S017"],"question":"En nivel amarillo por nieve deben embolsarse vehículos con circulación prohibida. No se dispone de zonas acondicionadas. ¿Qué alternativa contempla el plan en vías desdobladas?","origin":"ampliación"},{"id":"snew04","topic":"Nevadas y coordinación","type":"incorrecta","options":["Se contempla excepcionalmente la circulación de ligeros con cadenas u otros dispositivos autorizados.","Puede aconsejarse prohibir directamente circular si la intensidad de circulación lo exige.","La recomendación operativa de evitarlo elimina el nivel rojo y todas las restricciones que el cuerpo del plan le asigna.","Se desaconseja establecerlo como norma general por la complejidad de gestionar y controlar el uso de cadenas."],"answer":2,"explanation":"El anexo desaconseja con carácter general establecer rojo por dificultades de gestión, pero conserva el supuesto excepcional de ligeros con cadenas u otros dispositivos autorizados. Esa orientación adicional no deroga las medidas del nivel rojo del cuerpo del plan.","source":{"page":154,"section":"Anexo V. Principios de actuación básicos: puntos 1 y 4","document":"Temario original"},"conceptIds":["S026","T211"],"question":"ELIGE LA OPCIÓN INCORRECTA. Según los principios de actuación del anexo V del plan de nevadas, respecto al nivel rojo:","origin":"ampliación"},{"id":"snew05","topic":"Nevadas y coordinación","type":"correcta","options":["Exclusivamente personal de Protección Civil y de la empresa conservadora de carreteras.","La Subsecretaría del Interior y la persona titular de la ATGC, sin representación provincial.","Únicamente representantes de los ayuntamientos afectados y del Centro Nacional de Gestión.","Entre otros, las personas titulares de Comandancia, Sector o Subsector de Tráfico y Jefatura Provincial de Tráfico."],"answer":3,"explanation":"El Comité Ejecutivo territorial incluye a los titulares de Comandancia y Sector/Subsector y a la Jefatura Provincial de Tráfico. No debe confundirse con el comité estatal descrito en CECOD ni con el CECOP.","source":{"page":140,"section":"6.1. Comité Ejecutivo: composición","document":"Temario original"},"conceptIds":["S029","T224"],"question":"ELIGE LA OPCIÓN CORRECTA. En la coordinación territorial de nevadas, ¿qué composición corresponde al Comité Ejecutivo además de su presidencia por Delegación o Subdelegación del Gobierno?","origin":"ampliación"},{"id":"snew06","topic":"Dispositivos ATGC","type":"convencional","options":["Ocho componentes.","Seis componentes, por incorporar un escalón de bloqueo.","Cuatro componentes, por quedar automáticamente convertido en ordinario.","Doce componentes sin posibilidad de reducción."],"answer":0,"explanation":"El supuesto específico de desvío desde autopista/autovía a una zona de tráfico calmado limitada a 50 km/h permite reducir a ocho componentes. Es una reducción expresa y no autoriza a trasladar sin más la composición de un ordinario.","source":{"page":97,"section":"5.3.5. Dispositivos con desvíos a una zona de tráfico calmado","document":"Temario original"},"conceptIds":["S060","T152"],"question":"Un dispositivo de la ATGC se sitúa en una autovía, pero la circulación se desvía a un área de servicio limitada a 50 km/h donde se realiza el control. ¿Qué mínimo permite expresamente este supuesto?","origin":"ampliación"},{"id":"snew07","topic":"Dispositivos ATGC","type":"correcta","options":["Un jefe, uno de selección, cuatro de verificaciones, dos de vigilancia y cuatro de bloqueo y seguimiento.","Un jefe, uno de selección, seis de verificaciones, dos de vigilancia y dos de bloqueo y seguimiento.","Un jefe, dos de selección, seis de verificaciones, uno de vigilancia y dos de bloqueo y seguimiento.","Un jefe, dos de selección, cinco de verificaciones, tres de vigilancia y uno de bloqueo y seguimiento."],"answer":1,"explanation":"El esquema de doce reserva seis componentes a verificaciones, dos a vigilancia y dos a bloqueo/seguimiento, además del jefe y el componente de selección. Se evalúa el reparto de funciones, no el número ordinal de cada miembro.","source":{"page":93,"section":"5.3.3. Fuerza a emplear y misiones: dispositivo integrado por doce componentes","document":"Temario original"},"conceptIds":["S063","T156"],"question":"ELIGE LA OPCIÓN CORRECTA. En el esquema de un dispositivo reforzado de doce componentes de la ATGC, sin contar notificadores adicionales, ¿qué distribución funcional corresponde al procedimiento?","origin":"ampliación"},{"id":"snew08","topic":"Dispositivos ATGC","type":"incorrecta","options":["El lugar de notificación debe ser próximo pero diferenciado.","Mientras un componente notifica, el otro debe prestarle protección.","Ambos deben notificar simultáneamente, sin que uno deba prestar protección al otro.","Se integran en verificaciones, dedicados preferentemente a las infracciones de velocidad detectadas."],"answer":2,"explanation":"Los dos notificadores adicionales no anulan la protección: uno protege mientras el otro notifica. El procedimiento los integra en verificaciones, preferentemente para velocidad, en un lugar próximo pero diferenciado.","source":{"page":96,"section":"5.3.3. Componentes adicionales para notificación de velocidad","document":"Temario original"},"conceptIds":["S064"],"question":"ELIGE LA OPCIÓN INCORRECTA. Un reforzado de la ATGC incorpora dos notificadores adicionales porque existe un control de velocidad previo con notificación de infracciones:","origin":"ampliación"},{"id":"snew09","topic":"Circular y Manual Operativo","type":"convencional","options":["Cuatro componentes en todos los casos.","Doce componentes como mínimo absoluto, sin excepciones.","Dos o tres componentes si existe enlace con una COTA.","Ocho componentes, con los refuerzos previstos si se dispone de más personal."],"answer":3,"explanation":"El Manual Operativo general fija ocho componentes en tramos de más de 50 km/h. Debe distinguirse de la regulación específica de los reforzados ATGC, que declara otra regla general y recoge sus propias reducciones.","source":{"page":70,"section":"Manual Operativo general: dispositivos en tramos donde se circule a más de 50 km/h","document":"Temario original"},"conceptIds":["S066"],"question":"Según el Manual Operativo general de dispositivos en vías, ¿cuál es el mínimo para el despliegue en tramos donde se circula a más de 50 km/h?","origin":"ampliación"},{"id":"snew10","topic":"Detenciones en carretera","type":"convencional","options":["Identificarlo, comunicar verbalmente la infracción y el motivo y tramitar después la notificación oficial por la JPT.","Omitir toda identificación y archivar la infracción por la falta de un lugar adecuado.","Entregarle una advertencia verbal que sustituye definitivamente la notificación oficial.","Completar obligatoriamente la notificación oficial en el lugar, aunque subsista el riesgo."],"answer":0,"explanation":"El protocolo prevé identificación y comunicación verbal de la infracción y del motivo de detención, con notificación oficial posterior por la Jefatura Provincial de Tráfico. El texto exceptúa a los no residentes; por eso el caso precisa que el conductor es residente.","source":{"page":108,"section":"2.1. Detención para notificar: notificación posterior, primer párrafo","document":"Temario original"},"conceptIds":["S071"],"question":"Durante una detención para notificar una infracción a un conductor residente, la notificación no puede demorarse y continuar la actuación genera riesgo o perjuicio a la circulación. ¿Qué solución recoge el protocolo?","origin":"ampliación"},{"id":"snew11","topic":"Detenciones en carretera","type":"correcta","options":["Entre el vehículo oficial y el incidente, sin valorar la trayectoria de un posible desplazamiento.","Fuera de su posible trayectoria de desplazamiento por impacto, dentro de una zona de seguridad suficiente.","Sobre el carril contiguo, porque cualquier distancia de veinte metros garantiza protección completa.","En la trayectoria de escape de las ruedas, para aprovechar el vehículo como refugio directo."],"answer":1,"explanation":"El vehículo no está anclado y puede desplazarse por una colisión. El protocolo combina distancia suficiente, posición semioblicua, ruedas hacia una trayectoria de escape y usuarios y agentes fuera de esa trayectoria; la zona requiere anchura y profundidad.","source":{"page":105,"section":"1. Consideraciones operativas generales: zona de seguridad y desplazamiento por impacto","document":"Temario original"},"conceptIds":["S074"],"question":"ELIGE LA OPCIÓN CORRECTA. El vehículo oficial protege una intervención antes del incidente y puede desplazarse si un tercero lo golpea. ¿Dónde deben mantenerse agentes y usuarios?","origin":"ampliación"},{"id":"snew12","topic":"Detenciones en carretera","type":"incorrecta","options":["De noche o con meteorología adversa se prevén, en su caso, luces estroboscópicas portátiles.","Las medidas de seguridad se adaptan a las circunstancias concurrentes.","La colocación del vehículo oficial hace innecesario balizar la zona de seguridad con cualquier otro elemento.","Con carácter general se canaliza mediante tetrápodos de dotación o conos de mantenimiento."],"answer":2,"explanation":"El vehículo oficial cumple una función protectora, pero el protocolo prevé además balizar la zona y canalizar con tetrápodos o conos. Las luces estroboscópicas se contemplan de noche o con meteorología adversa, adaptando el conjunto al peligro.","source":{"page":105,"section":"1. Consideraciones operativas generales: párrafo final, balizamiento","document":"Temario original"},"conceptIds":["S075"],"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre el balizamiento general de una intervención con vehículo oficial de cuatro ruedas:","origin":"ampliación"},{"id":"snew13","topic":"Detenciones en carretera","type":"correcta","options":["Como cifras rígidas que impiden modificar el despliegue aunque cambien las condiciones de visibilidad.","Como cifras meramente informativas que permiten omitir las medidas de seguridad si el agente tiene experiencia.","Como valores aplicables solo a los accidentes, sin relación con averías ni detenciones por infracción.","Como referencias genéricas que se valoran junto al trazado, tráfico, posición de vehículos y climatología."],"answer":3,"explanation":"El texto califica expresamente esas cifras de referencias genéricas y exige valorar trazado, intensidad circulatoria, situación de vehículos y climatología. La adaptación mantiene el objetivo de seguridad y la iniciativa profesional descritos en los antecedentes.","source":{"page":106,"section":"1. Consideraciones operativas generales: párrafo sobre distancias y velocidades","document":"Temario original"},"conceptIds":["S079","S068"],"question":"ELIGE LA OPCIÓN CORRECTA. ¿Cómo deben utilizarse las distancias y velocidades del protocolo de detenciones en carretera?","origin":"ampliación"},{"id":"snew14","topic":"Detenciones en carretera","type":"convencional","options":["Desde el vehículo policial, ampliándolo si lo requieren la visibilidad o las circunstancias adversas.","Desde el siguiente acceso a la autopista, con independencia de la ubicación de ambos vehículos.","Desde el agente notificador, manteniendo siempre veinte metros exactos.","Desde el vehículo particular, sin posibilidad de aumentar la distancia."],"answer":0,"explanation":"El protector retrocede por el arcén al menos cincuenta metros desde el vehículo policial tras el contacto inicial y si los ocupantes no suponen amenaza. Esa distancia puede prolongarse por visibilidad o circunstancias adversas; no se confunde con los veinte metros entre vehículos.","source":{"page":111,"section":"2.1.1.1. Vehículo de cuatro ruedas oficial: detención excepcional, agente protector","document":"Temario original"},"conceptIds":["S085"],"question":"En una detención excepcional en arcén de autopista con vehículo oficial de cuatro ruedas, ya se ha contactado con los ocupantes y se ha descartado amenaza. ¿Desde dónde se mide el retroceso mínimo de 50 metros del agente protector?","origin":"ampliación"},{"id":"snew15","topic":"Detenciones en carretera","type":"convencional","options":["Ambas motos a 50 m del particular, estacionadas en paralelo.","Primera moto al menos 20 m del particular y segunda al menos 50 m de la primera, con adaptación según circunstancias.","Primera moto 50 m del particular y segunda 20 m de la primera, como distancia rígida.","Primera moto 15 m del particular y segunda 20 m de la primera, sin adaptación."],"answer":1,"explanation":"El supuesto de autopista/autovía fija inicialmente veinte metros para la primera moto respecto del particular y cincuenta para la segunda respecto de la primera. El propio pasaje permite ajustar esta última separación según protección y seguridad vial.","source":{"page":112,"section":"2.1.1.3. Vehículo de dos ruedas: detención excepcional en autopista/autovía","document":"Temario original"},"conceptIds":["S086"],"question":"Dos motoristas efectúan por fuerza mayor una detención en un lugar no seguro de una autovía. ¿Qué referencias iniciales de separación establece el supuesto?","origin":"ampliación"},{"id":"snew16","topic":"Detenciones en carretera","type":"incorrecta","options":["El agente de apoyo proporciona inicialmente protección directa para evitar agresiones.","La protección directa no implica perder de vista el tráfico que se aproxima.","El notificador debe acercarse antes de que llegue su compañero, para reducir el tiempo de detención.","El notificador espera a su compañero antes de acercarse al vehículo detenido."],"answer":2,"explanation":"El agente notificador debe esperar al compañero antes de acercarse. La protección inicial comprende posibles agresiones y vigilancia del tráfico; comprobada la ausencia de peligro, el apoyo pasa a señalizar conforme al supuesto.","source":{"page":113,"section":"2.1.1.3. Vehículo de dos ruedas: protección inicial, primer párrafo","document":"Temario original"},"conceptIds":["S086"],"question":"ELIGE LA OPCIÓN INCORRECTA. En la detención de un vehículo por dos motoristas en autopista o autovía, respecto al contacto con los ocupantes:","origin":"ampliación"},{"id":"snew17","topic":"Detenciones en carretera","type":"convencional","options":["Una a 20 m del detenido y la otra a 20 m de la primera, ambas junto al vehículo particular.","Una a 50 m del detenido y la otra junto al notificador, sin separación previa.","Ambas juntas a 100 m del vehículo detenido, fuera del arcén.","Una a 15 m del vehículo detenido y la otra previamente, en el arcén, a la distancia de 50 m indicada para este supuesto."],"answer":3,"explanation":"El pasaje de motocicletas en carretera convencional sitúa una moto a quince metros del vehículo detenido y la otra de forma previa, en el arcén del carril afectado, a cincuenta metros. No se trasladan automáticamente los veinte metros de la primera moto del supuesto de autopista/autovía.","source":{"page":115,"section":"2.1.2.3. Vehículo de dos ruedas en carreteras convencionales","document":"Temario original"},"conceptIds":["S088"],"question":"Dos motoristas deben detener excepcionalmente un vehículo en el arcén u otro lugar no seguro de una carretera convencional, por fuerza mayor y con amplia visibilidad. ¿Qué distribución inicial de las motocicletas recoge ese supuesto del protocolo?","origin":"ampliación"},{"id":"snew18","topic":"Detenciones en carretera","type":"convencional","options":["A una posición intermedia entre ambas motocicletas, advirtiendo a los demás usuarios.","A la mediana, aunque la carretera carezca de ella.","Delante del vehículo particular, de espaldas a ambos sentidos de circulación.","Al lado del notificador, dejando sin vigilancia los dos sentidos."],"answer":0,"explanation":"El auxiliar vuelve a una posición intermedia entre las dos motos tras comprobar que la actuación es segura. Desde allí protege al conjunto y advierte a los usuarios, teniendo presentes los dos sentidos de una carretera convencional.","source":{"page":116,"section":"2.1.2.3. Vehículo de dos ruedas: actuación del auxiliar, primer párrafo","document":"Temario original"},"conceptIds":["S088"],"question":"En una detención por dos motoristas en carretera convencional, el auxiliar ya ha apoyado el contacto con los ocupantes y comprueba que la actuación es segura. ¿Dónde pasa a prestar protección?","origin":"ampliación"},{"id":"snew19","topic":"Detenciones en carretera","type":"correcta","options":["Unos 30 km/h hacia ambos, por aplicar el límite del nivel rojo de nieve.","Unos 50 km/h hacia la avería y unos 40 km/h hacia el accidente, con los avisos previstos.","Unos 60 km/h hacia la avería y unos 80 km/h hacia el accidente.","Unos 40 km/h hacia la avería y unos 50 km/h hacia el accidente."],"answer":1,"explanation":"En el supuesto de avería se retiene alrededor de cincuenta km/h con aviso al Centro de Gestión. Para el accidente previamente localizado, el vehículo de cuatro ruedas reduce progresivamente hasta unos cuarenta km/h y avisa a COTA. Son referencias de escenarios concretos.","source":{"page":121,"section":"2.3.1.1. Accidente con cuatro ruedas; avería en 2.2.1.1, p. 116","additionalPages":[116],"document":"Temario original"},"conceptIds":["S090","S091"],"question":"Una patrulla en vehículo oficial de cuatro ruedas se aproxima en autopista/autovía a una avería comunicada por COTA que ocupa parte de la calzada; en otro servicio se aproxima a un accidente previamente localizado. ¿Qué referencias de velocidad distingue el protocolo para retener progresivamente la circulación en ambos supuestos?","origin":"ampliación"},{"id":"snew20","topic":"Detenciones en carretera","type":"convencional","options":["Prevenir, atender y señalizar.","Proteger, auxiliar y seguir.","Proteger, avisar y socorrer.","Parar, asegurar y sancionar."],"answer":2,"explanation":"El protocolo expresa PAS como proteger, avisar y socorrer. El apartado prevé comunicar la novedad a COTA, atender a los heridos y movilizar los apoyos médicos, mecánicos y de conservación que correspondan.","source":{"page":120,"section":"2.3. Detención para auxilio en accidente: párrafo inicial","document":"Temario original"},"conceptIds":["S091"],"question":"En el auxilio de un accidente de circulación, ¿qué significa la pauta PAS del protocolo?","origin":"ampliación"},{"id":"snew21","topic":"Detenciones en carretera","type":"correcta","options":["Auxiliar a unos 300 m y jefe a unos 400 m, con ambas motos en el carril izquierdo.","Auxiliar a unos 100 m y jefe a unos 200 m, con las motos en el centro de la calzada.","Ambos a unos 400 m, utilizando las motos como barrera en el carril izquierdo.","Auxiliar a unos 200 m y jefe a unos 300 m, con motos en arcén; el jefe señaliza desde carril derecho o central según la vía."],"answer":3,"explanation":"Con la cola cubierta, el auxiliar se adelanta unos doscientos metros y el jefe unos trescientos. Las motos se dejan en el arcén del sentido correcto; los cuatrocientos metros del vehículo de cuatro ruedas no se trasladan a las motos. El jefe realiza las señales desde carril derecho o central según la anchura y carriles disponibles; esto no significa estacionar la moto en ese carril.","source":{"page":129,"section":"4.2.3.2.1 y 4.2.3.2.2. Auxiliar y jefe de pareja ante vehículo en sentido contrario","document":"Temario original"},"conceptIds":["S096","S097","T184"],"question":"ELIGE LA OPCIÓN CORRECTA. Dos motoristas actúan de frente ante un vehículo en sentido contrario. La cola de la retención ya está cubierta por otra patrulla. ¿Qué posiciones aproximadas diferencia el protocolo delante de la línea detenida?","origin":"ampliación"},{"id":"snew22","topic":"Nevadas y coordinación","type":"convencional","options":["Guiarlos para regular la velocidad, precedidos de quitanieves si fuera necesario.","Cerrar el convoy sin posibilidad de guiarlo, porque la regulación de velocidad corresponde solo a conservación.","Acompañarlo a una velocidad fija universal sin valorar el estado del tramo.","Sustituir siempre a las quitanieves, aunque la calzada todavía necesite limpieza."],"answer":0,"explanation":"El apartado de embolsamientos prevé convoyes ordenados de salida guiados por vehículos ATGC para regular la velocidad y precedidos, si es necesario, por una quitanieves. No fija una cifra universal de máquinas ni elimina su necesidad.","source":{"page":150,"section":"11. Embolsamientos: organización de convoyes de salida","document":"Temario original"},"conceptIds":["S103"],"question":"Al organizar convoyes ordenados de salida de un embolsamiento por nieve, ¿qué función se prevé para los vehículos de la ATGC?","origin":"ampliación"},{"id":"snew23","topic":"UNIS","type":"convencional","options":["Asumir la representación judicial de todos los componentes que comparezcan.","Seguirlas, evaluar su impacto y proponer mejoras, despachándolas con el jefe de la unidad.","Remitirlas únicamente al COTA, que decide las mejoras de investigación.","Limitarse a archivarlas sin estudiar su efecto en los procedimientos."],"answer":1,"explanation":"El cometido incluye seguimiento de comparecencias y sentencias relevantes, valoración del impacto operativo y propuestas de mejora, con despacho al jefe. No es una función limitada al archivo ni comporta asumir la representación judicial del personal.","source":{"page":13,"section":"1.2.1.10. Comparecencias judiciales y sentencias relevantes","document":"Temario original"},"conceptIds":["S115"],"question":"¿Qué debe hacer el suboficial segundo jefe de una UNIS respecto a las comparecencias judiciales del personal y a las sentencias de mayor relevancia?","origin":"ampliación"},{"id":"snew24","topic":"UNIS","type":"incorrecta","options":["Estudia la problemática y actividad relacionada con consumo de alcohol y drogas.","Eleva informes al jefe de UNIS y propone acciones preventivas y mejoras estratégicas en los servicios.","Eleva sus conclusiones exclusivamente como datos retrospectivos, sin proponer acciones preventivas ni mejoras en la planificación.","Conoce la casuística y estudia la estadística de siniestralidad de la demarcación."],"answer":2,"explanation":"El estudio de datos se orienta a la acción: el segundo jefe eleva informes y propone prevención y mejoras estratégicas para planificar el servicio. Reducirlo a información retrospectiva elimina expresamente esa finalidad.","source":{"page":13,"section":"1.2.1.11. Siniestralidad, alcohol y drogas","document":"Temario original"},"conceptIds":["S116"],"question":"ELIGE LA OPCIÓN INCORRECTA. En el estudio de la siniestralidad, el alcohol y las drogas, el suboficial segundo jefe de la UNIS:","origin":"ampliación"},{"id":"snew25","topic":"UNIS","type":"correcta","options":["Que la formación propia termine al ocupar el puesto y se limite desde entonces a impartir cursos.","Que actualice únicamente materias administrativas, quedando la investigación reservada a los oficiales.","Que reciba formación solo cuando deba sustituir temporalmente al oficial de Investigación.","Que reciba formación para sus funciones y se mantenga actualizado en procedimientos, normativa y herramientas de investigación."],"answer":3,"explanation":"Además de colaborar en la formación de otros, el segundo jefe debe recibir formación que le permita desempeñar sus cometidos y mantenerse actualizado en procedimientos, normativa y herramientas innovadoras de investigación.","source":{"page":13,"section":"1.2.1.15. Formación propia; continuación en p. 14","additionalPages":[14],"document":"Temario original"},"conceptIds":["S120"],"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a su propia preparación, ¿qué establece la instrucción para el suboficial segundo jefe de una UNIS?","origin":"ampliación"},{"id":"snew26","topic":"UNIS","type":"convencional","options":["Realizarlos y auxiliar en su elaboración.","Únicamente darles entrada cuando hayan sido elaborados por un EIS.","Supervisarlos solo si se refieren a un siniestro con resultado mortal.","Solo registrarlos, sin intervenir en su contenido."],"answer":0,"explanation":"La instrucción le asigna realizar y auxiliar en los expedientes e informes que se le encomienden. El apartado no limita este cometido al registro, a los documentos EIS ni a los siniestros mortales.","source":{"page":14,"section":"1.2.1.16. Expedientes e informes encomendados","document":"Temario original"},"conceptIds":["S121"],"question":"¿Qué alcance tiene el cometido del suboficial segundo jefe de la UNIS respecto a los expedientes e informes que se le encomienden?","origin":"ampliación"},{"id":"snew27","topic":"Nevadas y coordinación","type":"correcta","options":["Se constituye obligatoriamente un PMA en cada acceso, sin atender a los protocolos territoriales.","Se anticipan el despliegue y los medios, los PMA y sus comunicaciones con intervención y CECOP, siguiendo la evolución prevista.","Se sustituye el contacto con conservación y gestión del tráfico por instrucciones independientes de cada patrulla.","Se esperan bloqueos efectivos antes de prever fuerza, medios o comunicaciones."],"answer":1,"explanation":"La alerta exige anticipación: estudiar la evolución meteorológica, prever fuerza, medios, restricciones y actuaciones de los PMA para poder cumplirlas de inmediato si se activa preemergencia, con recursos que garanticen comunicaciones.","source":{"page":143,"section":"8.1. Fase de alerta: previsiones de PMA, comunicaciones y despliegue","document":"Temario original"},"conceptIds":["S009"],"question":"ELIGE LA OPCIÓN CORRECTA. En alerta por nevadas, todavía sin dificultades efectivas de circulación, ¿cómo se prepara el posible paso a preemergencia?","origin":"ampliación"},{"id":"snew29","topic":"Nevadas y coordinación","type":"incorrecta","options":["Incluye autobuses, autobuses articulados y conjuntos de vehículos.","Su aplicación se entiende sin perjuicio de otras restricciones que puedan afectar a esos vehículos.","Solo afecta cuando nieva: con hielo, niebla de baja visibilidad o viento fuerte deja de aplicarse.","Incluye camiones de MMA superior a 3.500 kg."],"answer":2,"explanation":"La regla citada comprende nieve, hielo, baja visibilidad por niebla o viento fuerte, no solo la nevada. Obliga a los vehículos enumerados a usar el carril derecho y a no adelantar ni rebasar, sin sustituir las otras restricciones.","source":{"page":144,"section":"8.1. Fase de alerta: regla ante fenómenos meteorológicos adversos, primer párrafo","document":"Temario original"},"conceptIds":["S022"],"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre la regla transversal de carril derecho y prohibición de adelantar o rebasar que recoge el plan de nevadas:","origin":"ampliación"},{"id":"snew30","topic":"Detenciones en carretera","type":"convencional","options":["A permanecer allí hasta que llegue el denunciante, incluso si ya puede continuar a una zona segura.","A esperar un mínimo fijo de quince minutos antes de trasladar la actuación.","A completar siempre todos los trámites en el arcén, aunque exista una salida próxima.","Al tiempo necesario para dirigirlo hasta un lugar idóneo y seguro."],"answer":3,"explanation":"La regla para colores comerciales limita la parada excepcional en el arcén al tiempo necesario para dirigir al conductor a un lugar idóneo. La intervención sigue condicionada a no poner en riesgo a agentes ni usuarios y a evitar maniobras arriesgadas.","source":{"page":111,"section":"2.1.1.2. Vehículo de cuatro ruedas con colores comerciales: detención excepcional","document":"Temario original"},"conceptIds":["S089"],"question":"Una patrulla en vehículo de cuatro ruedas con colores comerciales debe detener excepcionalmente en el arcén de una autovía a un infractor. ¿A qué debe limitarse la parada prevista para este supuesto?","origin":"ampliación"},{"id":"tnew01","topic":"UNIS","type":"convencional","options":["La investigación de siniestros viales y la persecución de ilícitos penales relacionados con el tráfico.","La distribución de patrullas de vigilancia y la tramitación exclusiva de infracciones administrativas.","La reconstrucción pericial de todos los siniestros y la aprobación de sus indemnizaciones.","La gestión de centros de tráfico y la dirección de la conservación de carreteras."],"answer":0,"explanation":"El mando, control, impulso y coordinación de EIS, EPRAT y GIAT se orientan a investigar siniestros viales y perseguir ilícitos penales de tráfico. No se limitan a una tarea de vigilancia o reconstrucción.","source":{"page":7,"section":"1.1. Funciones de los oficiales jefes de las UNIS; misión principal","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T003"],"question":"¿Qué objetivo común orienta la coordinación de EIS, EPRAT y GIAT por el Oficial Jefe de una UNIS?","origin":"ampliación"},{"id":"tnew02","topic":"UNIS","type":"convencional","options":["Desde la sede del Subsector con mayor siniestralidad del último trimestre.","Desde la sede donde resida la UNIS que se encuentra bajo su mando.","Desde cada base periférica por turnos, sin una sede de referencia.","Desde el Área de Operaciones, aunque su UNIS tenga residencia distinta."],"answer":1,"explanation":"La regla fija la sede en el lugar donde reside la UNIS que manda. La dependencia técnica del Área de Operaciones no traslada allí su sede de servicio.","source":{"page":8,"section":"1.1.1.2. Oficial Jefe de la UNIS del Sector: prestación del servicio","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T006"],"question":"Como regla de prestación del servicio, ¿desde qué sede actúa el Oficial Jefe de la UNIS del Sector?","origin":"ampliación"},{"id":"tnew03","topic":"UNIS","type":"correcta","options":["Su cometido se limita a impulsar puntos de verificación en días laborables.","Impulsa esos puntos solo mediante personal GIAT, sin participación de los EIS.","Impulsa la presencia de los EIS en puntos de verificación de fines de semana.","La prestación principalmente burocrática excluye impulsar servicios de los EIS en carretera."],"answer":2,"explanation":"Además de servir principalmente en horario burocrático, el Suboficial 2.º Jefe debe impulsar el servicio en carretera de los EIS en puntos de verificación de fines de semana.","source":{"page":12,"section":"1.2.1.2. Suboficial 2.º Jefe: servicio en carretera","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T021"],"question":"ELIGE LA OPCIÓN CORRECTA. Respecto al servicio en carretera que impulsa el Suboficial 2.º Jefe de una UNIS:","origin":"ampliación"},{"id":"tnew04","topic":"Atestados y reconstrucción","type":"incorrecta","options":["No deben concurrir circunstancias extraordinarias que aconsejen la intervención especializada del EA.","La existencia de un concurso de delitos es una de las circunstancias extraordinarias que se deben valorar.","La intervención de extranjeros figura entre los ejemplos de circunstancias extraordinarias del temario.","La intervención de menores o la concurrencia de requisitorias nunca afecta a la valoración de la sencillez."],"answer":3,"explanation":"La sencillez no se valora solo por el tipo de delito: requisitoriados, menores, extranjeros o concurso de delitos son ejemplos de circunstancias extraordinarias que pueden aconsejar la intervención de los EA.","source":{"page":18,"section":"2.2.2. Instrucción de delitos contra la seguridad vial sencillos","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T045"],"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a los delitos contra la seguridad vial sencillos como cometido genérico de los Equipos de Atestados:","origin":"ampliación"},{"id":"tnew05","topic":"Atestados y reconstrucción","type":"convencional","options":["Autorización o designación expresa del Área de Operaciones de la ATGC.","La mera conformidad del instructor del atestado, al ser una diligencia de su investigación.","Una petición de la aseguradora acompañada de autorización del perjudicado.","La decisión del Jefe de Pareja, siempre que disponga de un programa de reconstrucción."],"answer":0,"explanation":"Los informes periciales de reconstrucción por componentes de EA solo se elaboran con autorización o designación expresa del Área de Operaciones. La competencia para informes técnicos no basta por sí sola.","source":{"page":16,"section":"2.1.1. Informes periciales de reconstrucción por EA","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T051"],"question":"Un Equipo de Atestados se plantea elaborar un informe pericial de reconstrucción. ¿Qué habilitación exige el temario?","origin":"ampliación"},{"id":"tnew06","topic":"Atestados y reconstrucción","type":"convencional","options":["La formación general de motorista, sin que se establezca preferencia adicional.","El Curso de Experto Universitario en Reconstrucción de Siniestros Viales.","El curso de operador de cinemómetros, que sustituye cualquier formación de reconstrucción.","El curso de inspección de transportes, exigido con carácter exclusivo."],"answer":1,"explanation":"El temario prefiere personal con la aptitud en el Curso de Experto Universitario en Reconstrucción de Siniestros Viales. Es una preferencia y no sustituye la autorización o designación del Área de Operaciones.","source":{"page":16,"section":"2.1.1. Formación preferente para informes periciales de EA","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T052"],"question":"Para elaborar un informe pericial de reconstrucción autorizado a un Equipo de Atestados, ¿qué formación se prefiere?","origin":"ampliación"},{"id":"tnew07","topic":"Atestados y reconstrucción","type":"correcta","options":["Los cálculos de velocidad quedan prohibidos en los informes técnicos y deben eliminarse del documento.","La incorporación de un cálculo exime de seguir la regulación específica sobre estudios de velocidad.","Ese cálculo no convierte el documento en informe pericial de reconstrucción y se sujeta a su regulación específica.","La presencia de cualquier cálculo convierte automáticamente el documento en informe pericial de reconstrucción."],"answer":2,"explanation":"Los estudios de cálculo de velocidad incluidos en informes técnicos no se consideran informes periciales a estos efectos y se sujetan a su regulación específica.","source":{"page":16,"section":"2.1.1. Estudios de cálculo de velocidad en informes técnicos","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T053"],"question":"ELIGE LA OPCIÓN CORRECTA. Un informe técnico de un Equipo de Atestados incluye un estudio de cálculo de velocidad. Según el temario:","origin":"ampliación"},{"id":"tnew08","topic":"Atestados y reconstrucción","type":"convencional","options":["Mérida; dependencia orgánica de la Escuela y funcional del Jefe del Sector.","Madrid; dependencia orgánica de la Escuela de Tráfico y funcional del Subsector.","Mérida; dependencia orgánica y funcional de la Jefatura Provincial de Tráfico.","Madrid; dependencia orgánica y funcional del Área de Operaciones de la ATGC."],"answer":3,"explanation":"El ERAT tiene sede en Madrid y depende orgánica y funcionalmente del Área de Operaciones de la Agrupación de Tráfico.","source":{"page":20,"section":"Equipos de Reconstrucción: 1. Estructura; ERAT","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T054"],"question":"¿Qué combinación de sede y dependencia corresponde al ERAT?","origin":"ampliación"},{"id":"tnew09","topic":"Atestados y reconstrucción","type":"correcta","options":["Tiene sede en la Escuela de Tráfico de Mérida, depende orgánicamente de ella y funcionalmente del Área de Operaciones en las tareas no docentes de reconstrucción.","Tiene sede en Madrid y depende orgánica y funcionalmente del Área de Operaciones para todas sus tareas docentes.","Tiene sede en Mérida, pero depende orgánicamente del Sector y funcionalmente de la fiscalía provincial.","Tiene sede en la Escuela de Tráfico y depende funcionalmente de cada EA al que presta apoyo, también para la docencia."],"answer":0,"explanation":"El DIRAT está en la Escuela de Tráfico de Mérida y su dependencia orgánica es de la Escuela. Su dependencia funcional del Área de Operaciones se refiere a sus tareas específicas no docentes de reconstrucción.","source":{"page":20,"section":"Equipos de Reconstrucción: 1. Estructura; DIRAT","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T055"],"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a la sede y dependencias del DIRAT:","origin":"ampliación"},{"id":"tnew10","topic":"Atestados y reconstrucción","type":"convencional","options":["Remitir exclusivamente al Negociado de Atestados y esperar su tramitación ordinaria, aunque la necesidad sea urgente.","Elevar por la cadena de mando; el Jefe del Sector contacta con el Jefe del Área de Operaciones, quien decide la intervención.","Requerir directamente al ERAT, que decide por sí mismo sin intervención de los mandos orgánicos.","Elevar directamente al fiscal delegado provincial, que asigna el equipo disponible."],"answer":1,"explanation":"En urgencia se utiliza la cadena de mando. El Jefe del Sector se comunica con el Jefe del Área de Operaciones, que decide si interviene alguno de los Equipos de Reconstrucción.","source":{"page":21,"section":"3.2. Solicitud de Equipos de Reconstrucción: solicitudes urgentes","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T056"],"question":"Un Jefe de Unidad necesita urgentemente la intervención de un Equipo de Reconstrucción. ¿Qué tramitación corresponde?","origin":"ampliación"},{"id":"tnew11","topic":"Atestados y reconstrucción","type":"convencional","options":["Por la COTA al Centro de Gestión de Tráfico, que asigna el equipo reconstructor.","Por el perjudicado a la Jefatura Provincial de Tráfico, que autoriza el servicio del ERAT.","Por la cadena de mando y a través de los Sectores al Negociado de Atestados del Área de Operaciones.","Directamente por el secretario del atestado a la Escuela de Tráfico, sin elevarla a su cadena de mando."],"answer":2,"explanation":"Las solicitudes no urgentes también se elevan por la cadena de mando y se tramitan a través de los Sectores al Negociado de Atestados del Área de Operaciones.","source":{"page":22,"section":"3.2. Solicitud de Equipos de Reconstrucción: solicitudes no urgentes","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T057"],"question":"Si el apoyo de un Equipo de Reconstrucción no es urgente, ¿cómo se tramita la solicitud de la Unidad?","origin":"ampliación"},{"id":"tnew12","topic":"Siniestros y documentación","type":"convencional","options":["Alcoholemia con solicitud de contraste, conducción con un menor investigado y negativa con necesidad de intérprete.","Cualquier delito contra la seguridad vial, siempre que no haya un fallecido.","Únicamente la conducción sin permiso; la alcoholemia objetivada exige siempre intervención del EIS.","Alcoholemia objetivada, carecer de permiso de conducir o negativa a someterse a la prueba."],"answer":3,"explanation":"La nota de los criterios de intervención considera de instrucción simple la alcoholemia objetivada, carecer de permiso y la negativa, salvo circunstancias como asistencia letrada, contraste, intérprete o menores.","source":{"page":26,"section":"3.1. Criterios generales de intervención; nota 14, instrucción simple","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T068"],"question":"Un siniestro ya corresponde a motoristas. ¿Qué grupo de delitos puede tener instrucción simple si no concurre ninguna de las excepciones previstas?","origin":"ampliación"},{"id":"tnew13","topic":"Siniestros y documentación","type":"incorrecta","options":["La solicitud de prueba de contraste mantiene siempre la consideración de instrucción simple.","La solicitud de asistencia letrada es una de las excepciones a esa consideración.","La necesidad de intérprete es una de las excepciones previstas.","La intervención de menores es una de las excepciones previstas."],"answer":0,"explanation":"La prueba de contraste es una excepción, igual que asistencia letrada, intérprete o menores. Si el delito no es de instrucción simple, el criterio general atribuye la intervención al EIS.","source":{"page":26,"section":"3.1. Criterios generales de intervención; nota 14, excepciones","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T069"],"question":"ELIGE LA OPCIÓN INCORRECTA. Un siniestro corresponde inicialmente a motoristas y concurre alcoholemia objetivada. Respecto a su consideración como delito de instrucción simple:","origin":"ampliación"},{"id":"tnew14","topic":"Familiares y entrega de información","type":"convencional","options":["Solo cuando se instruya atestado; el FODA no incorpora información de derechos.","En todos los siniestros en que se intervenga, independientemente del resultado.","Solo en los que tengan fallecidos o heridos graves y un delito público.","Únicamente cuando se presente previamente denuncia ante la patrulla."],"answer":1,"explanation":"La obligación de informar se establece para todos los siniestros, con independencia del resultado. El soporte documental varía según se confeccione FODA o atestado.","source":{"page":27,"section":"4. Información a víctimas, perjudicados y ofendidos","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T070"],"question":"¿En qué siniestros debe informarse a las víctimas o perjudicados de los derechos que les asisten?","origin":"ampliación"},{"id":"tnew15","topic":"Familiares y entrega de información","type":"convencional","options":["En el acta de entrega al juzgado, que sustituye la información al interesado.","Se facilita únicamente si el interesado vuelve después a las dependencias.","En el propio formulario FODA.","Solo en el informe técnico ITI02, que debe elaborarse siempre junto al FODA."],"answer":2,"explanation":"Cuando se confecciona FODA, la información de derechos ya se encuentra en el formulario. La instrucción diferencia este supuesto del atestado, para el que prevé el acta DCV01.","source":{"page":27,"section":"4. Información a víctimas: siniestros documentados con FODA","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T071"],"question":"En un siniestro que se documenta mediante FODA, ¿dónde se encuentra la información de derechos a la víctima o perjudicado?","origin":"ampliación"},{"id":"tnew16","topic":"Familiares y entrega de información","type":"correcta","options":["El acta DCV01 se entrega únicamente al conductor considerado responsable.","La ausencia de indicios de delito público elimina la información escrita de derechos.","La copia del acta se reserva para el juzgado y no se entrega a los implicados.","Se cumplimenta el acta DCV01 de las personas implicadas o representantes legales y se les entrega copia."],"answer":3,"explanation":"El apartado de información a víctimas exige DCV01 para las personas implicadas o representantes legales y entrega de copia, también cuando no se aprecian indicios de delito público y se archiva a disposición judicial.","source":{"page":27,"section":"4. Información a víctimas: acta DCV01","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T072"],"question":"ELIGE LA OPCIÓN CORRECTA. Cuando se instruye atestado por un siniestro vial, incluida su conservación a disposición judicial sin indicios de delito público:","origin":"ampliación"},{"id":"tnew17","topic":"Siniestros y documentación","type":"incorrecta","options":["Se exige siempre el Informe Técnico ITI02, aunque no haya fallecidos.","Se elabora FODA para la obtención del informe CASUS tipo JUZ.","Se incluye informe fotográfico de los vehículos implicados.","Se documentan la inspección técnico-ocular de la vía y las lesiones de las personas implicadas."],"answer":0,"explanation":"La relación incluye FODA para CASUS JUZ, ASV03 con croquis, ASV05 e informe fotográfico de vehículos. El ITI02 se exige, además de las diligencias, para siniestros con fallecido dentro de las 24 horas.","source":{"page":28,"section":"6.2. Lesiones graves por imprudencia menos grave: diligencias a prevención","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T075","T078"],"question":"ELIGE LA OPCIÓN INCORRECTA. En lesiones graves por imprudencia menos grave, respecto a las diligencias a prevención previstas por el temario:","origin":"ampliación"},{"id":"tnew18","topic":"Siniestros y documentación","type":"convencional","options":["La propuesta de indemnización de la aseguradora y su aceptación.","El anexo con el croquis de la escena del siniestro vial.","Exclusivamente el informe médico de cada persona lesionada.","La autorización del Área de Operaciones para una reconstrucción pericial."],"answer":1,"explanation":"El ASV03 es el informe de resultados de la inspección técnico-ocular de la vía y debe incluir su anexo de croquis de la escena. La información sobre lesiones corresponde al ASV05.","source":{"page":28,"section":"6.2. Diligencias a prevención: informe ASV03 y croquis","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T076"],"question":"En las diligencias a prevención por lesiones graves debidas a imprudencia menos grave, ¿qué debe incorporar el informe ASV03 de inspección técnico-ocular de la vía?","origin":"ampliación"},{"id":"tnew19","topic":"Siniestros y documentación","type":"convencional","options":["El acta DCV01, que sustituye el informe sobre las lesiones.","La portada del CASUS SIM, sin documento complementario.","La diligencia informe ASV05.","El informe ASV03, que solo documenta lesiones personales."],"answer":2,"explanation":"La diligencia informe ASV05 documenta las lesiones de las personas implicadas. El ASV03 corresponde a la inspección técnico-ocular y DCV01 a la información de derechos.","source":{"page":28,"section":"6.2. Diligencias a prevención: ASV05","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T077"],"question":"En diligencias a prevención por lesiones graves debidas a imprudencia menos grave, ¿qué documento recoge el informe sobre las lesiones de las personas implicadas?","origin":"ampliación"},{"id":"tnew20","topic":"Siniestros y documentación","type":"convencional","options":["Exclusivamente el Jefe del ERAT, aunque no intervenga en la investigación.","El representante de la aseguradora del vehículo responsable.","Solo el Jefe Provincial de Tráfico, antes de entregar el FODA al EIS.","El Oficial Jefe de la UNIS o el Suboficial 2.º Jefe de la UNIS."],"answer":3,"explanation":"Tras regular las actuaciones y el seguimiento de víctimas en estos casos, el manual exige su supervisión por el Oficial Jefe de la UNIS o el Suboficial 2.º Jefe.","source":{"page":29,"section":"6.2. Lesiones graves por imprudencia menos grave: supervisión","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T080"],"question":"¿Quién supervisa los casos de lesiones graves por imprudencia menos grave documentados mediante las diligencias a prevención descritas en el temario?","origin":"ampliación"},{"id":"tnew21","topic":"SIGO y remisión de atestados","type":"convencional","options":["Homicidio: H010103; lesiones graves: H010301.","Homicidio: H010301; lesiones graves: H010103.","Homicidio: H010103; lesiones graves: H010103, con subexpedientes distintos.","Homicidio: H010301; lesiones graves: H010301, diferenciados por la carátula."],"answer":0,"explanation":"El manual asigna H010103 al presunto homicidio por imprudencia y H010301 a las presuntas lesiones graves por imprudencia.","source":{"page":31,"section":"8.2. Modalidad de trabajo con conexión a intranet y SIGO","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T088","T089"],"question":"Al dar de alta el hecho delictivo en SIGO, ¿qué correspondencia de códigos de homicidio y lesiones graves por imprudencia es la prevista?","origin":"ampliación"},{"id":"tnew22","topic":"SIGO y remisión de atestados","type":"correcta","options":["Se remite por SIGO a COTA, que entrega el original en papel al perjudicado y a la aseguradora.","Se remite el PDF vía LEXNET al Juzgado, al Fiscal Delegado de Seguridad Vial provincial y al fiscal que deba actuar en el caso.","Se remite únicamente al Juzgado y se espera a que este autorice cada comunicación a fiscalía.","Se remite solo al Fiscal Delegado de Seguridad Vial; el juzgado recibe exclusivamente el informe técnico."],"answer":1,"explanation":"El manual exige remitir el PDF completo por LEXNET a los tres destinatarios: Juzgado competente, Fiscal Delegado de Seguridad Vial provincial y fiscal del caso. Lo indica tanto con conexión inicial a SIGO como sin ella.","source":{"page":32,"section":"8.2. Remisión final del atestado","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T090"],"question":"ELIGE LA OPCIÓN CORRECTA. Al finalizar un atestado por el siniestro vial regulado en el temario, respecto a la remisión de todas las diligencias:","origin":"ampliación"},{"id":"tnew23","topic":"Familiares y entrega de información","type":"convencional","options":["Encargar la comunicación al familiar que primero llame, sin valorar su preparación o situación.","Limitar la comunicación a la COTA por teléfono, sin posibilidad de intervención de EA o GIAT.","Priorizar la comunicación presencial por personal idóneo, con las medidas que arbitre el Jefe del Subsector.","Priorizar siempre el correo electrónico para que quede constancia escrita del fallecimiento."],"answer":2,"explanation":"La comunicación se considera un servicio de gran importancia. Debe hacerse presencialmente en la medida de lo posible; el Jefe del Subsector dispone personal preparado o idóneo, como EA o GIAT.","source":{"page":34,"section":"Comunicación a familiares: prioridad presencial y personal idóneo","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T091","T092"],"question":"Debe comunicarse a una familia el fallecimiento de una persona en un siniestro. ¿Qué criterio de comunicación establece el temario?","origin":"ampliación"},{"id":"tnew24","topic":"Familiares y entrega de información","type":"convencional","options":["Descartar la comunicación presencial por no pertenecer a la demarcación del instructor.","Dejar un aviso escrito con el fallecimiento y dar por completada la comunicación.","Esperar a que la familia contacte espontáneamente con el Subsector instructor.","Establecer los contactos oportunos entre Subsectores para realizar la comunicación."],"answer":3,"explanation":"La residencia en otra demarcación no elimina la prioridad presencial. El manual prevé contactos oportunos entre Subsectores cuando la localidad corresponde a otra Unidad.","source":{"page":34,"section":"Comunicación a familiares: otra demarcación","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T093"],"question":"La familia a la que hay que comunicar un fallecimiento reside en la demarcación de otra Unidad. ¿Qué actuación prevé el temario?","origin":"ampliación"},{"id":"tnew25","topic":"Familiares y entrega de información","type":"convencional","options":["El Gabinete de Psicología de la Agrupación.","El Centro Nacional de Gestión de Tráfico.","El Negociado de Inspección del Transporte.","El Consorcio de Compensación de Seguros."],"answer":0,"explanation":"El procedimiento de comunicación fue elaborado por el Gabinete de Psicología de la Agrupación y se incorpora como anexo. La pregunta evalúa su naturaleza y procedencia, no el número del anexo.","source":{"page":34,"section":"Comunicación a familiares: procedimiento del Gabinete de Psicología","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T094"],"question":"¿Qué órgano elaboró el procedimiento orientador para comunicar malas noticias a familiares de fallecidos en accidentes de tráfico recogido en el temario?","origin":"ampliación"},{"id":"tnew26","topic":"Familiares y entrega de información","type":"convencional","options":["Indicar que se trata de un accidente sin importancia para conseguir que el familiar llame sin preocuparse.","Pedir contacto cuanto antes con el Subsector por un problema familiar grave, sin dejar constancia del fallecimiento.","Identificar al fallecido y describir brevemente el accidente, evitando únicamente los detalles médicos.","Comunicar el fallecimiento con precisión y pedir que la familia confirme la recepción del mensaje."],"answer":1,"explanation":"En medios escritos o grabaciones de voz no se deja constancia del fallecimiento. El mensaje se limita a pedir contacto urgente con el Subsector por un problema familiar grave.","source":{"page":34,"section":"Comunicación a familiares: medios escritos y contestadores","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T095"],"question":"No ha sido posible comunicar un fallecimiento ni presencialmente ni por teléfono y hay que dejar un mensaje en un contestador. ¿Qué contenido corresponde?","origin":"ampliación"},{"id":"tnew27","topic":"Familiares y entrega de información","type":"incorrecta","options":["No se comunica por teléfono si el interlocutor identificado es anciano.","Si el interlocutor no es adecuado, se intenta establecer contacto con otra persona más apropiada.","Puede comunicarse a un adulto que está solo al cuidado de menores por el solo hecho de ser mayor de edad.","No se comunica por teléfono si el interlocutor identificado es menor de edad."],"answer":2,"explanation":"El manual excluye comunicar por teléfono a menores, ancianos y adultos solos que en ese momento cuiden menores. Se debe intentar contactar con una persona más adecuada.","source":{"page":34,"section":"Comunicación a familiares: interlocutores excluidos de comunicación telefónica","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T096"],"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a la comunicación telefónica de un fallecimiento en accidente de tráfico:","origin":"ampliación"},{"id":"tnew28","topic":"Familiares y entrega de información","type":"convencional","options":["No judicializada hasta que se dicte sentencia firme.","No judicializada mientras el FODA conserve el formato en papel.","Reservada exclusivamente a la aseguradora, sin que el requerimiento modifique su estatus.","Judicializada, por lo que pasa a aplicarse el criterio previsto para ese supuesto."],"answer":3,"explanation":"La instrucción establece expresamente que el requerimiento y su atención a la autoridad judicial hacen que la información adquiera el estatus de judicializada.","source":{"page":38,"section":"4.2. Diligencias no judicializadas: solicitud de autoridad judicial","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T102"],"question":"Se atiende el requerimiento de una autoridad judicial sobre información de un siniestro que hasta entonces no estaba judicializada. ¿Qué estatus adquiere esa información?","origin":"ampliación"},{"id":"tnew29","topic":"Relación electrónica con la Administración","type":"incorrecta","options":["Las entidades sin personalidad jurídica quedan excluidas de la obligación por carecer de esa personalidad.","Las personas jurídicas están incluidas entre los sujetos obligados.","Las compañías aseguradoras son un ejemplo de persona jurídica obligada.","Las comunidades de propietarios se citan como ejemplo de entidad sin personalidad jurídica obligada."],"answer":0,"explanation":"La obligación alcanza tanto a personas jurídicas como a entidades sin personalidad jurídica. La ausencia de personalidad no constituye una excepción.","source":{"page":37,"section":"2. Antecedentes: sujetos obligados a relación electrónica, letras a y b","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T108","T109"],"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a los sujetos obligados a relacionarse electrónicamente con la Administración según el temario:","origin":"ampliación"},{"id":"tnew30","topic":"Relación electrónica con la Administración","type":"convencional","options":["Solo si la Administración le comunica previamente una obligación individual para cada expediente.","En los trámites y actuaciones que realice en ejercicio de su actividad profesional.","En todos sus trámites personales, aunque no tengan relación alguna con su profesión.","Solo si además es empleado público de la Administración a la que se dirige."],"answer":1,"explanation":"La obligación por colegiación se refiere a trámites y actuaciones realizados en ejercicio de la actividad profesional. El texto no extiende esa causa automáticamente a cualquier trámite privado.","source":{"page":37,"section":"2. Antecedentes: sujetos obligados a relación electrónica, letra c","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T110"],"question":"Un profesional que ejerce una actividad de colegiación obligatoria realiza un trámite con la Administración. ¿En qué ámbito le exige el temario relación electrónica por esa condición?","origin":"ampliación"},{"id":"tnew31","topic":"Relación electrónica con la Administración","type":"convencional","options":["Solo está obligado si tiene a su vez personalidad jurídica propia.","Queda obligado únicamente si representa simultáneamente a dos o más aseguradoras.","También debe relacionarse electrónicamente al representar a un interesado obligado.","Puede elegir siempre papel porque la obligación nunca se transmite al representante."],"answer":2,"explanation":"La relación electrónica es obligatoria para quienes representan a un interesado que esté obligado a usarla. No depende de que el representante sea persona jurídica.","source":{"page":37,"section":"2. Antecedentes: sujetos obligados a relación electrónica, letra d","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T111"],"question":"Una persona actúa en representación de una aseguradora obligada a relacionarse electrónicamente con la Administración. ¿Qué regla corresponde al representante?","origin":"ampliación"},{"id":"tnew32","topic":"Relación electrónica con la Administración","type":"correcta","options":["Comprende necesariamente cualquier trámite privado del empleado con toda Administración, sin distinción.","Solo alcanza a empleados que ocupen puestos con funciones informáticas.","Queda excluida si el empleado no ejerce una profesión de colegiación obligatoria.","Se refiere a trámites y actuaciones por razón de su condición de empleado, en la forma que determine reglamentariamente cada Administración."],"answer":3,"explanation":"La obligación específica del empleado público se vincula a trámites por razón de su condición de empleado y a la forma reglamentaria que determine cada Administración.","source":{"page":37,"section":"2. Antecedentes: sujetos obligados a relación electrónica, letra e","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T112"],"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a la obligación de relación electrónica de los empleados públicos que recoge el temario:","origin":"ampliación"},{"id":"tnew33","topic":"Circular y Manual Operativo","type":"correcta","options":["Pueden hacerlo los jefes de unidades territoriales de Zona a Puesto y de unidades de Tráfico de Agrupación a Destacamento, directamente o a través de sus órganos de coordinación y mando.","En las unidades territoriales solo puede hacerlo el Jefe de Comandancia, quedando excluidos los de Compañía y Puesto.","En Tráfico solo puede hacerlo el Jefe del Sector; el Jefe de Destacamento debe limitarse a ejecutar dispositivos ajenos.","La existencia de una COTA impide que el jefe de la unidad ordene directamente el dispositivo."],"answer":0,"explanation":"El manual incluye a jefes de Zona, Comandancia, Compañía y Puesto, y de Agrupación, Sector, Subsector y Destacamento. Pueden actuar por sí mismos o mediante centrales operativas y oficiales de servicio o adjuntos, dentro de su demarcación y competencias.","source":{"page":47,"section":"Circular 1/2015, 4.3. Competencias de autoridades y mandos","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T132","T133"],"question":"ELIGE LA OPCIÓN CORRECTA. En el ámbito de su demarcación y competencias, respecto a quién puede ordenar dispositivos preventivos sobre vías:","origin":"ampliación"},{"id":"tnew34","topic":"Circular y Manual Operativo","type":"convencional","options":["Pueden dirigirlos, pero tienen prohibido decidir su establecimiento en toda circunstancia.","Pueden ordenar por sí mismos su establecimiento para cumplir esa misión.","Solo pueden proponerlos y deben esperar siempre orden expresa del Jefe del Puesto.","Pueden ordenarlos únicamente si el servicio se transforma previamente en reactivo."],"answer":1,"explanation":"Los mandos de las Unidades de Reserva ARS y GAR pueden ordenar por sí mismos estos dispositivos preventivos en cumplimiento de una misión encomendada.","source":{"page":47,"section":"Circular 1/2015, 4.3. Competencias de ARS y GAR","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T134"],"question":"Los mandos de ARS y GAR están cumpliendo una misión encomendada. ¿Qué capacidad les reconoce el temario sobre dispositivos preventivos?","origin":"ampliación"},{"id":"tnew35","topic":"Circular y Manual Operativo","type":"convencional","options":["Dirigirlos únicamente si se han establecido previamente por orden de una Jefatura Provincial de Tráfico.","Ordenarlos, pero sin posibilidad de asumir su dirección en ningún caso.","Ordenarlos y tomar su dirección cuando lo considere necesario, en la demarcación y competencias del Cuerpo.","Solo comprobar resultados, sin facultad para ordenar o dirigir el servicio."],"answer":2,"explanation":"El Mando de Operaciones puede tanto ordenar como tomar la dirección de los servicios que considere necesarios dentro de la demarcación y competencias del Cuerpo.","source":{"page":47,"section":"Circular 1/2015, 4.3. Competencias del Mando de Operaciones","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T135"],"question":"Según la Circular 1/2015 sobre dispositivos operativos en vías públicas, ¿qué capacidad se atribuye al Mando de Operaciones respecto a esos dispositivos?","origin":"ampliación"},{"id":"tnew36","topic":"Circular y Manual Operativo","type":"convencional","options":["Solo al Ministerio Fiscal, sustituyendo con ello toda comunicación a autoridades y mandos territoriales.","Únicamente al jefe de la patrulla actuante al finalizar el servicio.","Al Centro de Gestión de Tráfico, que decide si informa después a las autoridades territoriales.","A los Delegados o Subdelegados correspondientes y a los mandos con competencia territorial o material."],"answer":3,"explanation":"La Circular establece comunicación inmediata a Delegados o Subdelegados y a los mandos con competencia territorial o material. La actuación fuera del ámbito no elimina esos enlaces.","source":{"page":48,"section":"Circular 1/2015, 4.3. Actuación fuera del ámbito competencial","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T136"],"question":"La Guardia Civil debe actuar fuera de su ámbito competencial territorial o material. ¿Qué comunicación inmediata contempla la Circular?","origin":"ampliación"},{"id":"tnew37","topic":"Circular y Manual Operativo","type":"convencional","options":["Seguridad operativa de la fuerza, seguridad vial y seguridad legal.","Seguridad operativa de la fuerza, eficacia de la intervención y movilidad.","Seguridad vial, coordinación del mando y disponibilidad de transmisiones.","Seguridad legal, sorpresa operativa y continuidad del servicio."],"answer":0,"explanation":"El Manual Operativo exige simultáneamente seguridad operativa de la fuerza, seguridad vial de agentes y ciudadanos y seguridad legal mediante cumplimiento de la normativa.","source":{"page":53,"section":"Manual Operativo general, 1. Principios de seguridad del dispositivo","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T137"],"question":"¿Qué conjunto de principios debe primar en todo dispositivo sobre vías según el Manual Operativo general?","origin":"ampliación"},{"id":"tnew38","topic":"Dispositivos ATGC","type":"convencional","options":["Los dos componentes del EIS, que dejan de ser exigibles.","El personal dedicado a verificaciones de tráfico.","El equipo de bloqueo y seguimiento, que se suprime necesariamente.","La jefatura, que deja de requerir oficial o suboficial."],"answer":1,"explanation":"El manual permite controles de ocho a once componentes reduciendo el personal con funciones de verificaciones de tráfico. No convierte esa reducción en una exención de la jefatura o de participación EIS.","source":{"page":93,"section":"5.3.3. Fuerza a emplear: controles reforzados de ocho a once componentes","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T152"],"question":"Se planifica un dispositivo reforzado ATGC con entre ocho y once componentes al amparo de la reducción prevista. ¿Qué dotación se reduce para ajustar su composición?","origin":"ampliación"},{"id":"tnew39","topic":"Nevadas y coordinación","type":"correcta","options":["El carril de emergencia se habilita únicamente tras alcanzar nivel negro.","Los desvíos alternativos se descartan hasta que desaparezca completamente la nieve.","Se habilita un carril libre de emergencia y se posibilitan desvíos alternativos.","Se ocupan todos los carriles con vehículos retenidos para maximizar la capacidad de estacionamiento."],"answer":2,"explanation":"Entre las restricciones y medidas del nivel rojo figuran habilitar un carril libre de emergencia y posibilitar desvíos alternativos, además del equipamiento, prohibiciones y límites de velocidad.","source":{"page":146,"section":"8.2. Fase de preemergencia: medidas del nivel rojo","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T209"],"question":"ELIGE LA OPCIÓN CORRECTA. Se aplica nivel rojo de circulación durante una nevada. Respecto a las medidas para emergencias y la continuidad del itinerario:","origin":"ampliación"},{"id":"tnew40","topic":"Nevadas y coordinación","type":"correcta","options":["Debe esperar al siguiente parte periódico antes de hacer efectivo el corte.","Puede dejar de mantener el corte al terminar el turno, aunque no se haya levantado la restricción.","Su actuación se limita a informar; el temario excluye que el personal ATGC ejecute materialmente el corte.","Adopta las decisiones y actuaciones necesarias para que el corte sea efectivo inmediatamente y se mantenga hasta levantar la restricción."],"answer":3,"explanation":"La ATGC hace efectivo el corte inmediatamente y lo mantiene hasta el levantamiento. El manual también contempla ejecución por CGT mediante señalización o balizamiento, o por vigilancia de concesionarias cuando la criticidad lo requiera; no atribuye exclusividad absoluta.","source":{"page":149,"section":"10. Procedimiento específico sobre restricciones: ejecución del corte","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T215"],"question":"ELIGE LA OPCIÓN CORRECTA. Una restricción por nieve ya ha sido decidida conforme al procedimiento. Respecto a su ejecución ordinaria por el personal de ATGC:","origin":"ampliación"},{"id":"tnew41","topic":"Nevadas y coordinación","type":"convencional","options":["A requerimiento de la presidencia, por iniciativa propia o a solicitud de cualquiera de sus miembros.","Solo mediante convocatoria conjunta de todos sus miembros y por unanimidad.","Únicamente después de que se declare la emergencia en todas las comunidades afectadas.","Solo a petición del Centro de Gestión de Tráfico y nunca por iniciativa de un miembro."],"answer":0,"explanation":"El temario prevé reunión por requerimiento de la presidencia, por propia iniciativa o a solicitud de cualquiera de los miembros. No la condiciona a unanimidad ni a emergencia en todos los territorios.","source":{"page":139,"section":"5.1. Centro de Coordinación de Dirección: reunión del Comité Estatal","document":"Procedimiento y Ejecución de los Servicios"},"conceptIds":["T220"],"question":"¿En qué condiciones puede reunirse el Comité Estatal de Coordinación descrito en el apartado CECOD?","origin":"ampliación"},{"id":"tnew42","topic":"Nevadas y coordinación","type":"convencional","options":["La COTA del Subsector que tenga más carreteras afectadas.","El Centro Nacional de Gestión de Tráfico.","El Centro de Coordinación Operativa de una sola Delegación del Gobierno.","El Centro Nacional de Seguimiento y Coordinación de Emergencias como único centro de apoyo."],"answer":1,"explanation":"La célula se reúne en la Sala de Crisis de la DGT y está apoyada por el Centro Nacional de Gestión de Tráfico. El CENEM es otro órgano, con el que se comunican los CECOP en la emergencia.","source":{"page":140,"section":"5.2. Centro de Coordinación DGT/ATGC: apoyo a la célula permanente","document":"Procedimiento y Ejecución de los
