FODA, en papel o con el aplicativo TRAMO","Atestado completo conforme al procedimiento AGT01","Informe Técnico ITI02 y diligencias a prevención","Acta DCV01 y diligencia ASV03 del siniestro"],"answer":0,"explanation":"En siniestros con solo daños materiales o lesiones leves sin indicios de delito se elabora el Formulario de Obtención de Datos en Accidente (FODA), en papel o mediante TRAMO.","source":{"page":28,"section":"Documentación a confeccionar: solo daños materiales o lesiones leves sin indicios de delito","document":"Temario original"},"origin":"complementario","conceptIds":["T073"]},{"id":"c078","topic":"Siniestros y documentación","type":"convencional","question":"Las lesiones graves por imprudencia MENOS grave son perseguibles:","options":["Solo si concurre además un delito de conducción bajo alcohol o drogas","Mediante denuncia del agraviado o su representante legal","De oficio, al tratarse de un delito público","Solo a instancia del Ministerio Fiscal, por escrito"],"answer":1,"explanation":"Literal: «Mediante denuncia de la persona agraviada o su representante legal». 6.2.","source":{"page":28,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T074"]},{"id":"c079","topic":"Siniestros y documentación","type":"convencional","question":"Fallecen personas distintas del conductor responsable (imprudencia grave o menos grave). ¿Qué se hace?","options":["Solo FODA e informe CASUS, por ser delito privado","Atestado sin Informe Técnico, salvo que lo pida el juez","Atestado e Informe Técnico; delito público perseguible de oficio","Diligencias a prevención, esperando la denuncia de los familiares"],"answer":2,"explanation":"Literal: «Atestado por siniestro vial con el resultado de X fallecidos e Informe Técnico; delito público perseguible de oficio». Tabla de documentación, punto 6.3.1.","source":{"page":29,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T082"]},{"id":"c080","topic":"Siniestros y documentación","type":"convencional","question":"Si fallece el conductor responsable del siniestro, aunque haya otros fallecidos o lesionados graves:","options":["No se instruye diligencia alguna al no haber responsable","Atestado por homicidio imprudente con detención de ocupantes","Solo se cumplimenta el FODA y se archiva el asunto","No punible: atestado con X fallecidos e Informe Técnico"],"answer":3,"explanation":"Literal: «Fallecimiento no punible: atestado por siniestro vial con el resultado de X fallecidos e Informe Técnico». Tabla de documentación, punto 6.3.2.","source":{"page":30,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T083"]},{"id":"c081","topic":"Siniestros y documentación","type":"convencional","question":"¿En qué siniestros se confecciona, además de las diligencias, el Informe Técnico (ITI02)?","options":["Cuando fallezca al menos una persona en las 24 horas siguientes","En todos aquellos en que resulten heridos graves","Solo cuando lo solicite expresamente la Autoridad Judicial","Cuando alguien fallezca dentro de los 30 días siguientes al siniestro"],"answer":0,"explanation":"Literal: «En todos los que resulte al menos una persona fallecida dentro de las 24 horas siguientes». 6.3, consideraciones comunes. Es «lo nuevo» que dice el profesor.","source":{"page":30,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T084"]},{"id":"c082","topic":"Siniestros y documentación","type":"convencional","question":"Antes de remitirse, el Informe Técnico ITI02 debe contar con:","options":["La supervisión y el visto bueno del ERAT del Sector correspondiente","La conformidad del Suboficial 2º Jefe y el visto bueno del Oficial Jefe de la UNIS","El visto bueno del Suboficial 2º Jefe y la conformidad del Oficial Jefe de la UNIS","La firma del Jefe del Subsector y la del Jefe del Sector de Tráfico"],"answer":1,"explanation":"Antes de remitirse a la autoridad judicial y fiscalía, el ITI02 debe contar con la conformidad del Suboficial 2.º Jefe y el visto bueno del Oficial Jefe de la UNIS del Subsector o Sector uniprovincial. No deben intercambiarse ambas funciones.","source":{"page":30,"section":"Siniestros con fallecidos: consideraciones comunes, conformidad y visto bueno del Informe Técnico","document":"Temario original"},"origin":"complementario","conceptIds":["T025","T086"]},{"id":"c083","topic":"Siniestros y documentación","type":"convencional","question":"¿En qué plazo se remite el Informe Técnico ITI02 a la autoridad judicial y al Ministerio Fiscal?","options":["No superior a tres meses desde el siniestro","Cinco servicios desde la ocurrencia del siniestro","No superior a un mes desde el siniestro","No superior a 15 días desde el siniestro"],"answer":2,"explanation":"Literal: «No superior a un mes desde la ocurrencia del siniestro». 6.3.","source":{"page":30,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T087"]},{"id":"c084","topic":"Siniestros y documentación","type":"convencional","question":"Si un herido grave fallece como consecuencia del siniestro dentro de las 24 horas siguientes:","options":["Se mantiene el procedimiento de lesiones graves","Se archiva el FODA y se abre información verbal","Se remite todo lo actuado al ERAT del Sector","Se sigue el procedimiento de fallecidos (6.3)"],"answer":3,"explanation":"Literal: «Se sigue el procedimiento de siniestros con fallecidos (apartado 6.3)». 6.2.","source":{"page":29,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c085","topic":"Siniestros y documentación","type":"convencional","question":"La asignación inicial de la modalidad que interviene en un siniestro vial, ¿puede modificarse cuando se dispone de información más completa?","options":["Sí, mediante los reajustes necesarios conforme la información sea mayor y esté más consolidada","No, la primera asignación queda fijada hasta la remisión del atestado","Solo si lo solicita una compañía aseguradora de los implicados","Únicamente si cambia la demarcación territorial del lugar del siniestro"],"answer":0,"explanation":"Los criterios de primera actuación se aplican sin perjuicio de los reajustes posteriores de asignación que sean necesarios a medida que la información sea mayor y más consolidada.","source":{"page":25,"section":"Criterios generales de intervención: párrafo introductorio sobre reajustes de asignación","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c086","topic":"Siniestros y documentación","type":"convencional","question":"En un siniestro de autoridades, sin fallecidos ni heridos graves ni otra circunstancia que imponga la intervención del EIS, ¿cómo se concreta la modalidad que interviene?","options":["El Oficial Jefe de la UNIS en persona","El mando, conforme al plan anual de los EA","Siempre el equipo de investigación de siniestros","Siempre la patrulla de motoristas actuante"],"answer":1,"explanation":"Para los siniestros de autoridades, el criterio específico remite a la determinación del mando conforme al plan anual de los Equipos de Atestados, considerando los demás criterios concurrentes.","source":{"page":26,"section":"Criterios generales de intervención: siniestros de autoridades","document":"Temario original"},"origin":"complementario","conceptIds":["T063"]},{"id":"c087","topic":"Siniestros y documentación","type":"convencional","question":"Cuando otras unidades investigan homicidios, asesinatos o suicidios relacionados con vehículos, ¿qué modalidad de la ATGC prevé el manual para prestarles apoyo?","options":["El mando, según el plan anual de los EA","La Policía Judicial de la Comandancia en exclusiva","El equipo de investigación de siniestros","La patrulla de motoristas más próxima"],"answer":2,"explanation":"Los criterios de intervención asignan el apoyo a otras unidades por homicidios, asesinatos, suicidios y supuestos similares al equipo de investigación de siniestros. Se trata del apoyo técnico de la ATGC a la unidad investigadora.","source":{"page":26,"section":"Criterios generales de intervención: apoyo a otras unidades","document":"Temario original"},"origin":"complementario","conceptIds":["T066"]},{"id":"c088","topic":"Siniestros y documentación","type":"convencional","question":"Siniestro acompañado de delito contra la seguridad vial que no es de instrucción simple:","options":["Patrulla de motoristas que lo detecta","A determinar por el mando, según plan anual","GIAT, por tratarse de un delito","Equipo de investigación de siniestros"],"answer":3,"explanation":"La excepción que mantiene a motoristas exige que el siniestro ya les corresponda y que el delito contra la seguridad vial sea de instrucción simple. Cuando esa sencillez no concurre, corresponde intervenir al equipo de investigación de siniestros.","source":{"page":26,"section":"Criterios generales de intervención: siniestro acompañado de delito contra la seguridad vial","document":"Temario original"},"origin":"complementario","conceptIds":["T067"]},{"id":"c089","topic":"Siniestros y documentación","type":"convencional","question":"En un siniestro con solo daños materiales o lesiones leves, ¿qué condición permite aplicar la documentación mediante FODA prevista para esos casos?","options":["Que no existan indicios de delito","Que los daños no afecten a un vehículo oficial, aunque existan indicios de delito","Que no haya denuncia del agraviado, incluso si se aprecia un delito público","Que el conductor responsable esté identificado, con independencia de los indicios penales"],"answer":0,"explanation":"La regla del FODA en papel o TRAMO se refiere a siniestros con solo daños materiales o lesiones leves sin indicios de delito. No debe transformarse esa condición en una afirmación general de que los daños materiales nunca puedan tener relevancia penal.","source":{"page":28,"section":"Documentación a confeccionar: solo daños materiales o lesiones leves sin indicios de delito","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c090","topic":"Siniestros y documentación","type":"convencional","question":"En un siniestro con lesiones graves por imprudencia menos grave, ¿qué requisito de perseguibilidad señala el manual para ese delito de lesiones?","options":["Autorización previa del Jefe de la UNIS para que pueda denunciar el agraviado","Denuncia de la persona agraviada o de su representante legal","Persecución automática de oficio por la fuerza en todos los casos","Solicitud exclusiva de la aseguradora, aunque no represente al perjudicado"],"answer":1,"explanation":"El manual indica que estas lesiones por imprudencia menos grave son perseguibles mediante denuncia del agraviado o de su representante legal. Inicialmente se practican las diligencias a prevención previstas, sin perjuicio de otros delitos que puedan apreciarse.","source":{"page":28,"section":"Lesiones de gravedad: casos por imprudencia menos grave","document":"Temario original"},"origin":"complementario","conceptIds":["T074"]},{"id":"c091","topic":"Siniestros y documentación","type":"convencional","question":"En lesiones graves por imprudencia menos grave, si hay denuncia o lo ordena la autoridad judicial:","options":["Se remite todo al Fiscal sin necesidad de atestado","Se instruye un atestado nuevo desde cero, con el responsable en calidad de detenido","Se hace atestado con los datos de las diligencias a prevención","Se archivan las diligencias a prevención sin más trámite"],"answer":2,"explanation":"Si se presenta denuncia o lo ordena la autoridad judicial o el Ministerio Fiscal, el EIS elabora el atestado con los datos archivados en el FODA y los documentos de prevención, adaptándolo a las circunstancias para remitirlo a la autoridad competente.","source":{"page":28,"section":"Lesiones graves por imprudencia menos grave: elaboración del atestado tras denuncia u orden de autoridad","document":"Temario original"},"origin":"complementario","conceptIds":["T079"]},{"id":"c092","topic":"Siniestros y documentación","type":"convencional","question":"Lesiones graves por imprudencia GRAVE en persona distinta del conductor responsable:","options":["Diligencias a prevención a la espera de denuncia del agraviado","Solo FODA, salvo que el lesionado o su representante presente denuncia posterior ante el juez","Informe Técnico ITI02 sin atestado, por no haber fallecidos","Atestado por imprudencia grave; delito público con detención o investigación"],"answer":3,"explanation":"Literal: «Atestado por siniestro vial por imprudencia grave; delito público, con detención o investigación del responsable». Tabla, punto 6.2.2.","source":{"page":29,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T081"]},{"id":"c093","topic":"Siniestros y documentación","type":"convencional","question":"En lesiones graves por imprudencia menos grave, sin indicios de otros delitos contra la seguridad vial y antes de que se presente denuncia, ¿qué documentación de prevención contempla el manual?","options":["FODA para CASUS JUZ, inspección técnico-ocular de la vía con croquis, informe de lesiones y reportaje fotográfico de los vehículos","Solo el informe fotográfico, sin datos del accidente ni informe de lesiones","Atestado por homicidio e ITI02, aunque no haya ninguna persona fallecida","Solo el FODA, prescindiendo de la inspección de la vía y del informe de lesiones"],"answer":0,"explanation":"Para las lesiones graves por imprudencia menos grave, el manual prevé diligencias a prevención: FODA para CASUS JUZ, ASV03 con anexo de croquis, ASV05 e informe fotográfico. Si se presenta denuncia o lo ordena la autoridad judicial o fiscal, se confecciona el atestado correspondiente.","source":{"page":28,"section":"Lesiones de gravedad por imprudencia menos grave: diligencias a prevención","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c094","topic":"Siniestros y documentación","type":"convencional","question":"¿En qué supuesto impone el manual confeccionar el Informe Técnico ITI02 además de las diligencias correspondientes?","options":["Solo cuando el atestado se inicie por denuncia del perjudicado","En todos los siniestros con al menos una persona fallecida dentro de las 24 horas siguientes","En todos los siniestros con heridos graves, aunque nadie fallezca","Solo cuando fallezca una persona distinta del conductor responsable"],"answer":1,"explanation":"La regla común exige ITI02 en todo siniestro con al menos una persona fallecida dentro de las 24 horas siguientes, incluido el fallecimiento del conductor responsable. No se limita a una numeración de casos ni se extiende por esta regla a todo herido grave.","source":{"page":30,"section":"Siniestros con fallecidos: consideraciones comunes y obligación de confeccionar ITI02","document":"Temario original"},"origin":"complementario","conceptIds":["T084"]},{"id":"c095","topic":"Siniestros y documentación","type":"convencional","question":"El Informe Técnico ITI02 sirve para poner en conocimiento de la autoridad judicial y fiscalía:","options":["Las declaraciones de los implicados y de los testigos","Los datos estadísticos del siniestro grabados en ARENA2 y el reportaje fotográfico completo","Las conclusiones argumentadas de la investigación, con pruebas documentadas","El reportaje fotográfico y el croquis del siniestro"],"answer":2,"explanation":"Literal: «Las conclusiones de la investigación de forma argumentada, basada en fuentes de prueba documentadas». Consideraciones comunes a los fallecidos.","source":{"page":30,"section":"Intervención en siniestros y documentación: documentación según resultado del siniestro","document":"Temario original"},"origin":"complementario","conceptIds":["T085"]},{"id":"c096","topic":"Siniestros y documentación","type":"convencional","question":"La conformidad del Informe Técnico la da el Suboficial 2º Jefe y el visto bueno el Oficial Jefe de la UNIS del:","options":["Sector pluriprovincial correspondiente","Área de Operaciones de la Agrupación","Destacamento que instruye el atestado","Subsector/sector uniprovincial"],"answer":3,"explanation":"El ITI02 debe contar con la conformidad del Suboficial 2.º Jefe y el visto bueno del Oficial Jefe de la UNIS del Subsector o Sector uniprovincial antes de su remisión.","source":{"page":30,"section":"Siniestros con fallecidos: consideraciones comunes, supervisión del Informe Técnico","document":"Temario original"},"origin":"complementario","conceptIds":["T086"]},{"id":"c097","topic":"Siniestros y documentación","type":"convencional","question":"El Informe Técnico de un siniestro con fallecido se remite a:","options":["La autoridad judicial y el ministerio fiscal","La Jefatura Provincial de Tráfico y el juzgado","La compañía aseguradora y los perjudicados","El Área de Operaciones únicamente"],"answer":0,"explanation":"El Informe Técnico se remite a la autoridad judicial y al Ministerio Fiscal en un plazo no superior a un mes desde la fecha del siniestro, para trasladar las conclusiones argumentadas de la investigación y sus fuentes de prueba.","source":{"page":30,"section":"Siniestros con fallecidos: consideraciones comunes, destinatarios y remisión del Informe Técnico","document":"Temario original"},"origin":"complementario","conceptIds":["T087"]},{"id":"c098","topic":"Familiares y entrega de información","type":"convencional","question":"Una aseguradora legitimada solicita copia del atestado de un siniestro que ya se ha remitido al juzgado. Según la actualización recogida en el manual, ¿qué actuación procede?","options":["Entregar únicamente el número de atestado y exigir que toda información se solicite al juzgado","Facilitar gratuitamente copia del atestado o informe equivalente con la información sobre las circunstancias del accidente","Rechazarla siempre porque la remisión al juzgado impide que la fuerza facilite información","Facilitarla solo si la aseguradora abona previamente una tasa policial"],"answer":1,"explanation":"La actualización recogida en el manual obliga a facilitar gratuitamente a los solicitantes legitimados copia del atestado o informe equivalente sobre las circunstancias del accidente, incluso si ya se ha remitido a la autoridad judicial.","source":{"page":38,"section":"Datos a facilitar: diligencias judicializadas, contenido actualizado","document":"Temario original"},"origin":"complementario","conceptIds":["T097"]},{"id":"c099","topic":"Familiares y entrega de información","type":"convencional","question":"En diligencias JUDICIALIZADAS, la copia del atestado se facilita:","options":["Solo por orden expresa del juez que conoce de la causa","Solo a los perjudicados que estén personados en la causa","De forma gratuita a perjudicados, aseguradoras y Consorcio","Previo pago de la tasa a cualquier interesado que lo pida"],"answer":2,"explanation":"Literal: «De forma gratuita a perjudicados, aseguradoras, sus representantes y Consorcio de Compensación de Seguros». 4.1. Es la «diferencia muy importante» que señala el profesor.","source":{"page":38,"section":"Entrega de datos: diligencias judicializadas y requerimientos judiciales","document":"Temario original"},"origin":"complementario","conceptIds":["T097","T098"]},{"id":"c100","topic":"Familiares y entrega de información","type":"convencional","question":"En diligencias NO judicializadas, si lo pide una autoridad judicial, se le facilita:","options":["Copia del informe CASUS simplificado «SIM», junto con el croquis y las fotografías","El estadístico completo ARENA2 del siniestro","Solo una certificación de la existencia del accidente","El CASUS tipo «autoridad judicial» y, si existe, el FODA original"],"answer":3,"explanation":"Literal: «El informe CASUS tipo «autoridad judicial» y, si existe, el original del FODA en papel». 4.1.1. Al atenderse, pasa a estatus de «judicializado».","source":{"page":38,"section":"Entrega de datos: diligencias judicializadas y requerimientos judiciales","document":"Temario original"},"origin":"complementario","conceptIds":["T100"]},{"id":"c101","topic":"Familiares y entrega de información","type":"convencional","question":"¿Qué documentos se confeccionan al remitir información a la autoridad judicial en diligencias no judicializadas?","options":["Oficio de remisión, portada, CASUS con el FODA original en papel y anexos que se hubieran confeccionado, y diligencia de entrega","Solo una copia del CASUS SIM, sin oficio de remisión ni diligencia de entrega","ITI02 en todos los casos, aunque no se haya producido ningún fallecimiento","Solo el estadístico ARENA2 y una certificación verbal del siniestro"],"answer":0,"explanation":"Se confeccionan oficio de remisión, portada, informe CASUS y diligencia de entrega. Se acompaña el original del FODA en papel, reportaje fotográfico y croquis si se hubieran confeccionado. Tras atender el requerimiento judicial, la información adquiere estatus de judicializada.","source":{"page":38,"section":"Diligencias no judicializadas: solicitud de autoridad judicial competente","document":"Temario original"},"origin":"complementario","conceptIds":["T101"]},{"id":"c102","topic":"Familiares y entrega de información","type":"convencional","question":"En diligencias NO judicializadas, a la parte interesada se le entrega:","options":["Copia íntegra del atestado instruido","Copia del CASUS simplificado, opción «SIM»","El informe CASUS tipo «autoridad judicial»","El original del FODA con fotos y croquis"],"answer":1,"explanation":"Literal: «Copia del informe CASUS simplificado, opción «SIM»». 4.1.2.","source":{"page":39,"section":"Entrega de datos: solicitudes de parte interesada","document":"Temario original"},"origin":"complementario","conceptIds":["T104"]},{"id":"c103","topic":"Familiares y entrega de información","type":"convencional","question":"Si el aplicativo CASUS no está operativo y la solicitud la hace directamente una aseguradora, se entrega:","options":["Un certificado del accidente","Nada hasta que CASUS funcione","El estadístico completo ARENA2","Copia del FODA"],"answer":2,"explanation":"Si CASUS no está operativo y la solicitud ha sido cursada directamente por una compañía aseguradora, se entrega el estadístico completo ARENA2. La excepción está vinculada a esas dos condiciones.","source":{"page":39,"section":"Solicitud por parte interesada: indisponibilidad de CASUS y petición directa de aseguradora","document":"Temario original"},"origin":"complementario","conceptIds":["T105"]},{"id":"c104","topic":"Familiares y entrega de información","type":"convencional","question":"¿Por qué medio se cursan las solicitudes e informes a interesados?","options":["Siempre en papel, mediante correo certificado con acuse de recibo, salvo urgencia","Siempre a través de LEXNET, sin excepción alguna","Por el medio que en cada caso elija la unidad actuante","Electrónicos (correo corporativo), salvo quien acude en persona, que elige"],"answer":3,"explanation":"Literal: «Por medios electrónicos (correo corporativo), salvo la persona física que acude a dependencias, que puede elegir». 4.1.2.","source":{"page":39,"section":"Entrega de datos: solicitudes de parte interesada","document":"Temario original"},"origin":"complementario","conceptIds":["T106"]},{"id":"c105","topic":"Familiares y entrega de información","type":"convencional","question":"Los informes a interesados se facilitan aunque:","options":["El accidente corresponda a otra demarcación","No se acredite el interés del solicitante en los hechos","La petición proceda de alguien sin derechos afectados ni representación de un interesado","Se prescinda de registrar la solicitud, las gestiones y la contestación"],"answer":0,"explanation":"Los informes indicados se facilitan aunque el accidente corresponda a otra demarcación. Se mantiene la acreditación del interés y debe dejarse copia registrada de las solicitudes, gestiones y contestaciones en los archivos de la base.","source":{"page":39,"section":"Solicitud por parte interesada: otras demarcaciones y registro de las gestiones","document":"Temario original"},"origin":"complementario","conceptIds":["T107"]},{"id":"c106","topic":"Familiares y entrega de información","type":"convencional","question":"Si una autoridad judicial requiere información de unas diligencias no judicializadas y la unidad atiende el requerimiento, ¿qué ocurre con su estatus?","options":["Pierde su condición de información del siniestro y pasa a ser un informe administrativo anónimo","La información adquiere el estatus de judicializada","Permanece no judicializada hasta que una aseguradora la solicite","Se considera judicializada solo si antes se confeccionó un ITI02"],"answer":1,"explanation":"El manual señala expresamente que, cuando se requiere y atiende a la autoridad judicial, la información adquiere estatus de judicializada y se aplica el criterio establecido para esa situación.","source":{"page":38,"section":"Diligencias no judicializadas: efecto de atender el requerimiento de autoridad judicial","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c107","topic":"Familiares y entrega de información","type":"convencional","question":"En un siniestro con diligencias no judicializadas, ¿es igual el informe CASUS que se facilita a la autoridad judicial que el previsto para la parte interesada?","options":["No: la autoridad judicial recibe SIM y la parte interesada el tipo autoridad judicial","Sí: en ambos casos se entrega siempre solo el estadístico ARENA2","No: para la autoridad judicial se facilita el tipo autoridad judicial, y para la parte interesada la copia simplificada SIM","Sí: ambas reciben exclusivamente SIM, sin posibilidad de otros documentos"],"answer":2,"explanation":"El requerimiento judicial se atiende con el informe CASUS tipo autoridad judicial y los documentos que correspondan. A la parte interesada se entrega copia del informe simplificado SIM; esta última regla también se contempla aunque las diligencias estén judicializadas.","source":{"page":38,"section":"Diligencias no judicializadas: solicitud judicial y solicitud por parte interesada; continuación en página 39","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c108","topic":"Familiares y entrega de información","type":"convencional","question":"La copia que se facilita en diligencias judicializadas debe contener:","options":["Solo los datos de los vehículos y conductores implicados","Solo los datos de las aseguradoras de los vehículos","Únicamente las conclusiones sobre la causa del siniestro","Toda la información sobre las circunstancias del accidente"],"answer":3,"explanation":"La actualización sobre diligencias judicializadas establece la entrega gratuita de copia del atestado o informe equivalente en el que conste toda la información sobre las circunstancias del accidente a los solicitantes legitimados.","source":{"page":38,"section":"Diligencias judicializadas: contenido de la copia del atestado o informe equivalente","document":"Temario original"},"origin":"complementario","conceptIds":["T097"]},{"id":"c109","topic":"Familiares y entrega de información","type":"convencional","question":"El Consorcio de Compensación de Seguros solicita información sobre las circunstancias de un accidente cuyo atestado ya está en el juzgado. ¿Qué prevé el criterio actualizado del manual?","options":["Puede solicitar gratuitamente copia del atestado o informe equivalente aunque se haya remitido a la autoridad judicial","Solo puede obtenerla mediante pago previo de una tasa","Solo puede recibirla si figura como propietario de uno de los vehículos","No puede solicitarla a la fuerza que investigó el siniestro una vez judicializado"],"answer":0,"explanation":"El Consorcio de Compensación de Seguros se incluye expresamente entre quienes pueden pedir gratuitamente copia del atestado o informe equivalente con información sobre las circunstancias del accidente, incluso cuando ya está remitido a la autoridad judicial.","source":{"page":38,"section":"Diligencias judicializadas: solicitantes legitimados y entrega gratuita","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c110","topic":"Familiares y entrega de información","type":"convencional","question":"A efectos de solicitar información de un siniestro, ¿qué persona carece de la condición de interesada en los supuestos descritos?","options":["Un heredero de una parte afectada que acredita su interés","Un periodista que solo invoca interés informativo, sin derechos afectados ni representación de una persona interesada","Un pasajero con derechos afectados por el accidente","El dueño de un animal implicado en el siniestro"],"answer":1,"explanation":"El interesado es quien tiene alguno de sus derechos afectado por el siniestro. La condición deriva de esa afectación o de la representación acreditada, no de la mera curiosidad o del interés informativo.","source":{"page":39,"section":"Solicitud por parte interesada: definición de interesado","document":"Temario original"},"origin":"complementario","conceptIds":["T103"]},{"id":"c111","topic":"Familiares y entrega de información","type":"convencional","question":"Al interesado se le entrega copia del informe CASUS simplificado «SIM»:","options":["Solo con autorización judicial previa","Solo si el solicitante es una aseguradora","Aunque las diligencias estén judicializadas","Solo si las diligencias no están judicializadas"],"answer":2,"explanation":"En las solicitudes de parte interesada, el manual prevé entregar copia del informe CASUS simplificado SIM aunque las diligencias estén judicializadas. La remisión de actuaciones al juzgado no excluye por sí sola esta entrega a quien acredite interés.","source":{"page":39,"section":"Solicitud por parte interesada: entrega del CASUS simplificado SIM","document":"Temario original"},"origin":"complementario","conceptIds":["T104"]},{"id":"c112","topic":"Familiares y entrega de información","type":"convencional","question":"Si se hizo FODA en papel y lo pide una autoridad judicial en diligencias no judicializadas:","options":["Se remite una copia del FODA y se archiva el original","Se remite solo el informe CASUS, sin el FODA","Se destruye el FODA en papel tras grabarlo en CASUS","Se remite el original del FODA con el informe CASUS"],"answer":3,"explanation":"Literal: «Se remite el original del FODA junto con el informe CASUS». 4.1.1.","source":{"page":38,"section":"Entrega de datos: diligencias judicializadas y requerimientos judiciales","document":"Temario original"},"origin":"complementario","conceptIds":["T100"]},{"id":"c113","topic":"Familiares y entrega de información","type":"convencional","question":"Si la solicitud de un interesado no es de una aseguradora y CASUS no funciona:","options":["La ISAT solo prevé el ARENA2 si lo pide directamente una aseguradora","Se le entrega el estadístico ARENA2 completo del siniestro","Se le entrega el original del FODA en papel, con diligencia","Se le entrega una copia íntegra del atestado instruido, con el informe técnico"],"answer":0,"explanation":"Literal: «La ISAT solo prevé el ARENA2 cuando la solicitud la cursa directamente una aseguradora». 4.1.2: el ARENA2 se prevé para el supuesto concreto de que lo pida una aseguradora.","source":{"page":39,"section":"Entrega de datos: solicitudes de parte interesada","document":"Temario original"},"origin":"complementario","conceptIds":["T105"]},{"id":"c114","topic":"Familiares y entrega de información","type":"convencional","question":"El documento con el que se entrega la información a la autoridad judicial en diligencias no judicializadas es:","options":["El oficio de archivo","La diligencia de entrega","El acta DCV01","La papeleta de servicio"],"answer":1,"explanation":"El temario establece esta regla: La diligencia de entrega. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":38,"section":"Entrega de datos: diligencias judicializadas y requerimientos judiciales","document":"Temario original"},"origin":"complementario","conceptIds":["T101"]},{"id":"c115","topic":"Familiares y entrega de información","type":"convencional","question":"¿Cuál es la principal diferencia nueva respecto a lo anterior en diligencias judicializadas?","options":["Ahora la copia del atestado se cobra según la tasa","Ahora solo se entrega el informe CASUS simplificado «SIM» a cualquier solicitante","Se facilita copia del atestado aunque ya se haya remitido al juez","Ahora solo el juez puede facilitar copia del atestado"],"answer":2,"explanation":"Literal: «Ahora se facilita copia del atestado aunque ya se haya remitido a la autoridad judicial». 4.1. Es la «diferencia muy importante» del profesor.","source":{"page":38,"section":"Entrega de datos: diligencias judicializadas y requerimientos judiciales","document":"Temario original"},"origin":"complementario","conceptIds":["T099"]},{"id":"c116","topic":"Circular y Manual Operativo","type":"convencional","question":"Según la Circular 1/2015, un dispositivo operativo para controlar vías es la conjunción de medios:","options":["Humanos y materiales, únicamente en vías interurbanas","Humanos, técnicos y materiales, solo en autopistas y autovías","Técnicos y materiales de la DGT, con apoyo del Cuerpo","Humanos, técnicos y materiales, en vías urbanas e interurbanas"],"answer":3,"explanation":"Literal: «Humanos, técnicos y materiales, organizada por fuerza del Cuerpo sobre vías públicas urbanas e interurbanas». 2.1 Definición.","source":{"page":43,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T113"]},{"id":"c117","topic":"Circular y Manual Operativo","type":"convencional","question":"El objetivo principal de un dispositivo operativo sobre vías es:","options":["Prevenir, mantener o restablecer la tranquilidad ciudadana","Sancionar las infracciones de tráfico que se detecten","Controlar la velocidad de los vehículos que circulan","Recabar información estadística sobre la circulación y la siniestralidad"],"answer":0,"explanation":"Literal: «Prevenir, mantener o, en su caso, restablecer la tranquilidad ciudadana». 2.1 Definición.","source":{"page":43,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T114"]},{"id":"c118","topic":"Circular y Manual Operativo","type":"convencional","question":"Para que un dispositivo en un tramo donde se circula a más de 40 km/h se incluya en la Circular debe:","options":["Durar más de 30 minutos en el mismo punto kilométrico","Implicar señalización más restrictiva o canalización/bloqueo","Contar con al menos cuatro componentes uniformados","Estar autorizado por el Delegado o Subdelegado del Gobierno"],"answer":1,"explanation":"Literal: «Suponer señalización más restrictiva o requerir elementos de canalización o bloqueo». 2.2 Condiciones.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T116"]},{"id":"c119","topic":"Circular y Manual Operativo","type":"convencional","question":"La velocidad a partir de la cual se exigen condiciones adicionales para incluir un dispositivo en la Circular es:","options":["Superior a 60 km/h","Superior a 80 km/h","Superior a 40 km/h","Superior a 50 km/h"],"answer":2,"explanation":"2.2. Ojo: 40 km/h en la Circular; 50 km/h en el Manual y el procedimiento ATGC.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T116"]},{"id":"c120","topic":"Circular y Manual Operativo","type":"convencional","question":"La elección del lugar más idóneo para el dispositivo corresponde a:","options":["La Central Operativa de Servicio","El Jefe de la Comandancia","El componente de selección","El Mando o Jefe de Dispositivo"],"answer":3,"explanation":"Literal: «El Mando o Jefe de Dispositivo (más caracterizado)». 2.2.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c121","topic":"Circular y Manual Operativo","type":"convencional","question":"¿Cuál de estos queda EXCLUIDO de la Circular 1/2015?","options":["Uno por obras, transportes especiales o accidentes","Un control preventivo de alcoholemia y drogas","Un dispositivo reactivo tras un atraco a mano armada","Un control para impedir el porte ilícito de armas"],"answer":0,"explanation":"Literal: «Un dispositivo por obras, transportes especiales o accidentes». 2.3 Exclusiones.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T117","S047"]},{"id":"c122","topic":"Circular y Manual Operativo","type":"convencional","question":"Las indicaciones desde un vehículo en marcha a otro en marcha para que se detenga:","options":["Requieren una papeleta de servicio específica","No se consideran dispositivos a efectos de la Circular","Son dispositivos preventivos del art. 16.1 de la LOSC","Son dispositivos reactivos del art. 17.1 de la LOSC"],"answer":1,"explanation":"El temario establece esta regla: No se consideran dispositivos a efectos de la Circular. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T118","S047"]},{"id":"c123","topic":"Circular y Manual Operativo","type":"convencional","question":"En la Circular de dispositivos, ¿qué criterio condiciona el ejercicio de facultades sobre los ciudadanos?","options":["El número de efectivos determina por sí solo todas las facultades disponibles.","La autorización del control sustituye la necesidad de justificar cada actuación.","La existencia de circunstancias o necesidades concretas que justifiquen la actuación.","La mera instalación del control autoriza comprobaciones indiscriminadas."],"answer":2,"explanation":"La LOSC supedita las actuaciones a circunstancias o necesidades concretas; la Circular considera contrarias a derecho las actuaciones sistemáticas e indiscriminadas.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c124","topic":"Circular y Manual Operativo","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Al distinguir los supuestos de un dispositivo de control, ¿qué relación entre situación y facultad es válida?","options":["En normalidad se puede evacuar un inmueble por el solo hecho de instalar un control preventivo.","La sospecha de armas permite cualquier medida extraordinaria sin valorar necesidad o duración.","El descubrimiento de un delito de alarma social limita las facultades a mirar desde fuera el vehículo.","Un riesgo sobrevenido e inminente puede justificar medidas extraordinarias de seguridad si son imprescindibles y duran solo lo necesario."],"answer":3,"explanation":"Las medidas extraordinarias se vinculan al riesgo sobrevenido e inminente. Las facultades no nacen del lugar en una lista: dependen del supuesto y de la necesidad.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c125","topic":"Circular y Manual Operativo","type":"convencional","question":"Se organiza un dispositivo ante un riesgo potencialmente grave por el porte o uso ilegal de armas. ¿Qué carácter le atribuye la Circular?","options":["Preventivo.","Reactivo por alteración del orden ya consumada.","Reactivo por delito de especial gravedad necesariamente acreditado.","Excluido de la Circular porque solo contempla seguridad vial."],"answer":0,"explanation":"Preventivos: 16.1 y 18. Reactivos: 17.1, 17.2 y 21.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["S040","S041"]},{"id":"c126","topic":"Circular y Manual Operativo","type":"convencional","question":"Un riesgo sobrevenido pone en peligro inminente a personas o bienes y exige rapidez. ¿Qué carácter tiene el dispositivo que permite medidas extraordinarias?","options":["Ajeno a los dispositivos previstos en la Circular.","Reactivo.","Preventivo por normalidad de la situación.","Preventivo por mera comprobación documental."],"answer":1,"explanation":"Art. 21: medida de seguridad extraordinaria ante riesgo sobrevenido.","source":{"page":46,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["S044"]},{"id":"c127","topic":"Circular y Manual Operativo","type":"convencional","question":"En normalidad, existen indicios de participación de una persona en una infracción o es razonablemente necesario identificarla para prevenir un delito. ¿Qué actuación se contempla?","options":["Retener a cualquier transeúnte sin necesidad justificativa.","Ocupar permanentemente cualquier objeto que porte.","Requerir su identificación y realizar las comprobaciones pertinentes.","Evacuar automáticamente todos los locales de la zona."],"answer":2,"explanation":"Art. 16.1, carácter preventivo.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T119","S040"]},{"id":"c128","topic":"Circular y Manual Operativo","type":"convencional","question":"Ante un riesgo potencialmente grave por armas, explosivos u objetos peligrosos, ¿qué objetivo específico tiene el dispositivo preventivo?","options":["Detener necesariamente a todos los ocupantes sin comprobación previa.","Restablecer un orden ya alterado como presupuesto indispensable.","Evacuar todos los inmuebles aunque el riesgo pueda prevenirse de otro modo.","Impedir su porte o utilización ilegal en espacios públicos."],"answer":3,"explanation":"Art. 18, preventivo. Objetivo: impedir que se porten o utilicen ilegalmente armas.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T121","S041"]},{"id":"c129","topic":"Circular y Manual Operativo","type":"convencional","question":"Hay alteración del orden o indicios racionales de que puede producirse. ¿Qué finalidad orienta la actuación reactiva?","options":["Mantener o restablecer la normalidad.","Solo comprobar autorizaciones administrativas de transporte.","Investigar exclusivamente un delito ya consumado de especial gravedad.","Imponer medidas extraordinarias sin relación con la alteración."],"answer":0,"explanation":"El temario establece esta regla: Mantener o restablecer la normalidad. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T122","S042"]},{"id":"c130","topic":"Circular y Manual Operativo","type":"convencional","question":"Se ha cometido un delito de especial gravedad o generador de alarma social. ¿Qué finalidad concreta puede perseguir el dispositivo reactivo?","options":["Realizar un control general indefinido de todas las personas sin condición.","Descubrir y detener a sus partícipes y recoger efectos, instrumentos y pruebas.","Comprobar la documentación de los vehículos como única actuación posible.","Evacuar locales sin necesidad de relación con el riesgo."],"answer":1,"explanation":"El temario establece esta regla: Descubrir y detener a sus partícipes y recoger efectos, instrumentos y pruebas. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":46,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T123","S043"]},{"id":"c131","topic":"Circular y Manual Operativo","type":"convencional","question":"¿Qué situación permite adoptar medidas extraordinarias como evacuaciones o prohibiciones de paso, si son imprescindibles?","options":["La mera conveniencia de agilizar un control documental.","Cualquier infracción administrativa aunque no produzca peligro.","Un riesgo sobrevenido que ponga en peligro inminente a personas o bienes y exija una actuación rápida.","La normalidad del servicio sin ningún riesgo concreto."],"answer":2,"explanation":"El temario establece esta regla: Un riesgo sobrevenido que ponga en peligro inminente a personas o bienes y exija una actuación rápida. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":46,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T124","S044"]},{"id":"c132","topic":"Circular y Manual Operativo","type":"convencional","question":"Tras un delito que provoca grave alarma social se busca detener a sus partícipes. ¿Cómo se determina el objeto de la búsqueda de efectos?","options":["Por un catálogo idéntico de objetos para todos los delitos.","Exclusivamente por el tipo de vehículo que conduce cada persona.","Por la duración que se haya previsto para el dispositivo.","Por la naturaleza del delito que ha provocado la alarma."],"answer":3,"explanation":"La naturaleza del hecho guía los efectos e instrumentos que se buscan y las comprobaciones; no se trata de una revisión desligada del delito.","source":{"page":46,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T123","T131","S043"]},{"id":"c133","topic":"Circular y Manual Operativo","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA. En la actuación reactiva para mantener o restablecer el orden:","options":["Las medidas pueden prolongarse aunque hayan dejado de ser necesarias.","Puede restringirse la circulación cuando exista la necesidad que lo justifique.","Pueden establecerse zonas de seguridad para recuperar la normalidad.","Pueden ocuparse preventivamente efectos susceptibles de emplearse en acciones ilegales."],"answer":0,"explanation":"La actuación se limita a la necesidad y al tiempo imprescindible. Las otras medidas sí están previstas dentro de ese marco.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T122","T131","S042"]},{"id":"c134","topic":"Circular y Manual Operativo","type":"convencional","question":"Una alteración de la convivencia requiere mantener o restablecer la normalidad. ¿Qué facultad específica contempla la Circular?","options":["Sustituir siempre el dispositivo por una simple advertencia verbal.","Limitar circulación o permanencia y establecer zonas de seguridad.","Evacuar cualquier espacio sin límite temporal ni necesidad.","Inspeccionar solo la tarjeta técnica del vehículo sin otras facultades."],"answer":1,"explanation":"Art. 17.1, medios/facultades.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T122","S042"]},{"id":"c135","topic":"Circular y Manual Operativo","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA. Ante un peligro sobrevenido e inminente que exige medidas extraordinarias:","options":["Puede disponerse una evacuación por el tiempo estrictamente necesario.","Puede ordenarse verbalmente la medida si la urgencia lo hace imprescindible.","La urgencia permite mantener las medidas después de que desaparezca su necesidad.","Puede prohibirse el paso cuando resulte imprescindible."],"answer":2,"explanation":"La urgencia puede justificar la orden verbal, pero no elimina los límites de necesidad y duración estricta.","source":{"page":46,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T124","S044"]},{"id":"c136","topic":"Circular y Manual Operativo","type":"convencional","question":"¿Qué presupuesto justifica un registro corporal externo y superficial para la investigación o indagación?","options":["La simple presencia de una persona en cualquier control, sin más circunstancias.","La falta de un documento del vehículo, aunque la persona ya esté identificada.","La conveniencia de aplicar el mismo registro a todos los usuarios por sistema.","Indicios racionales de que permitirá hallar instrumentos, efectos u objetos relevantes para esas funciones."],"answer":3,"explanation":"Art. 16.1, medios/facultades: (artículo 20.1).","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T120"]},{"id":"c137","topic":"Circular y Manual Operativo","type":"convencional","question":"¿Qué conjunto de situaciones caracteriza a los dispositivos preventivos de la Circular?","options":["Protección en normalidad y prevención de riesgos potencialmente graves por armas u objetos peligrosos.","Solo alteraciones del orden ya consumadas y delitos de alarma social.","Solo peligro sobrevenido e inminente con necesidad de evacuación.","Exclusivamente las restricciones por obras y transportes especiales."],"answer":0,"explanation":"El temario establece esta regla: Protección en normalidad y prevención de riesgos potencialmente graves por armas u objetos peligrosos. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":47,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["T125","S040","S041"]},{"id":"c138","topic":"Circular y Manual Operativo","type":"convencional","question":"¿Qué conjunto de situaciones caracteriza a los dispositivos reactivos de la Circular?","options":["Cualquier control de tráfico por el solo hecho de realizarse de noche.","Alteración del orden o indicios racionales, delito grave o de alarma social y riesgo sobrevenido e inminente.","Solo comprobación documental en normalidad y riesgo potencial por armas.","Únicamente obras y accidentes ajenos a la seguridad ciudadana."],"answer":1,"explanation":"El temario establece esta regla: Alteración del orden o indicios racionales, delito grave o de alarma social y riesgo sobrevenido e inminente. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":49,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["T129","S042","S043","S044"]},{"id":"c139","topic":"Circular y Manual Operativo","type":"convencional","question":"¿Cuál NO es un requisito legal de los dispositivos PREVENTIVOS?","options":["Que esté previsto específicamente en la papeleta de nombramiento","Que su finalidad sea impedir o detectar infracciones penales o administrativas","Que exista una situación real de alteración del orden","Que su objeto esté relacionado con la misión del servicio nombrado"],"answer":2,"explanation":"La situación real de alteración es la causa de los reactivos.","source":{"page":47,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["T126","T127","T128","S048"]},{"id":"c140","topic":"Circular y Manual Operativo","type":"convencional","question":"En caso de necesidad o urgencia, un dispositivo REACTIVO:","options":["Nunca puede establecerse sin papeleta de servicio previa","Solo puede ordenarlo el Delegado o Subdelegado del Gobierno","Requiere en todo caso autorización judicial previa","Puede ordenarse verbalmente, formalizándose después"],"answer":3,"explanation":"Literal: «Puede ordenarse verbalmente por los mandos competentes, sin perjuicio de su formalización posterior». 5.2.","source":{"page":49,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["T130","S049"]},{"id":"c141","topic":"Circular y Manual Operativo","type":"convencional","question":"En la identificación preventiva de personas en situación de normalidad, ¿qué documentos reconocidos cita la Circular?","options":["DNI o similar (UE), pasaporte y carné de conducir","Exclusivamente el DNI, sin admitir otros documentos","DNI, NIE y tarjeta sanitaria del interesado","Cualquier documento oficial que lleve fotografía"],"answer":0,"explanation":"Literal: «DNI o similar para ciudadanos UE, pasaporte y carné de conducir». 4.4.a.","source":{"page":48,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c142","topic":"Circular y Manual Operativo","type":"convencional","question":"En el supuesto preventivo de identificación y comprobación en normalidad, ¿qué actuaciones sobre el vehículo prevé la Circular?","options":["Revisar guanteras, reposabrazos y debajo de los asientos","Comprobar documentación y mirar superficialmente el interior y maletero","Registrar exhaustivamente el interior, el maletero y los efectos de los ocupantes","Solo comprobar la documentación, sin mirar el interior"],"answer":1,"explanation":"Literal: «Comprobar titularidad y documentación y realizar una visualización superficial del interior, incluido el maletero». 4.4.a. La revisión de guanteras y asientos es del art. 18.","source":{"page":48,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c143","topic":"Circular y Manual Operativo","type":"convencional","question":"En un dispositivo preventivo dirigido a impedir el porte o uso ilegal de armas, ¿qué revisión del vehículo se contempla?","options":["Desmontar sistemáticamente todas las piezas de cualquier vehículo, sin más indicios.","Intervenir únicamente sobre la matrícula y no sobre el habitáculo.","Espacios interiores como guantera, reposabrazos, bajos de asientos y maletero con sus cavidades.","Solo contemplar el vehículo desde fuera, sin visualizar el interior."],"answer":2,"explanation":"El temario establece esta regla: Espacios interiores como guantera, reposabrazos, bajos de asientos y maletero con sus cavidades. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":48,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c144","topic":"Circular y Manual Operativo","type":"convencional","question":"Un dispositivo busca a los partícipes de un delito que provoca grave alarma social. ¿A quién se da conocimiento posterior inmediato de su resultado?","options":["El Juzgado de guardia","El Delegado del Gobierno","La Dirección General de la Guardia Civil","El Ministerio Fiscal"],"answer":3,"explanation":"El temario establece esta regla: El Ministerio Fiscal. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":51,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["S043"]},{"id":"c145","topic":"Circular y Manual Operativo","type":"convencional","question":"Al actuar para mantener o restablecer el orden, ¿qué límites rigen para desviar accesos, evacuar o desalojar y ocupar efectos?","options":["En caso de necesidad y por el tiempo imprescindible","Siempre que lo ordene el jefe del dispositivo, sin límite temporal","Solo con orden escrita","Durante un máximo de 4 horas"],"answer":0,"explanation":"El temario establece esta regla: En caso de necesidad y por el tiempo imprescindible. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":50,"section":"5.4.a. Actuación para mantener o restablecer el orden; continuación en p.51","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c146","topic":"Circular y Manual Operativo","type":"convencional","question":"Al practicar identificaciones y registros corporales externos en dispositivos, ¿qué criterio rige también respecto a menores?","options":["Aplicar exclusivamente normas de circulación, sin garantías personales.","Aplicar las garantías específicas de identificación, registro y actuación con menores previstas en las instrucciones correspondientes.","Prescindir de las garantías del registro si el dispositivo ha sido ordenado por un mando.","Tratar cualquier identificación como detención y realizar siempre un registro integral."],"answer":1,"explanation":"La Circular remite expresamente a la instrucción sobre diligencia de identificación, registros externos y menores. El establecimiento del dispositivo no suspende esas garantías.","source":{"page":49,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c147","topic":"Circular y Manual Operativo","type":"convencional","question":"La nota del temario sobre garantías de personas detenidas advierte de una instrucción derogada. ¿Qué criterio de estudio es correcto?","options":["Omitir toda garantía de registro al estar derogada una de las referencias.","Aplicar la instrucción antigua preferentemente porque su número es anterior.","Atender a la sustitución señalada por el Procedimiento Integral de la Detención Policial.","Considerar simultáneamente vigentes ambas instrucciones por aparecer citadas en el cuerpo del texto."],"answer":2,"explanation":"La nota 41, en la página 49, advierte de la derogación expresa por la instrucción que aprueba el Procedimiento Integral de la Detención Policial. Se evalúa el criterio, no la memorización de su número.","source":{"page":49,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c148","topic":"Circular y Manual Operativo","type":"convencional","question":"El Manual Operativo distingue dos tipos de dispositivos según:","options":["Que se realicen en horario diurno o en horario nocturno","Que los realice la ATGC o las unidades de Seguridad Ciudadana","Que cuenten con 2 componentes o con más de 4 componentes","Que la velocidad del tramo sea de hasta 50 km/h o superior"],"answer":3,"explanation":"Literal: «Si están en puntos donde la circulación se detiene o el límite es hasta 50 km/h, o en tramos de más de 50 km/h». Manual 2.","source":{"page":57,"section":"Manual Operativo general: tipos de dispositivos y normas de montaje","document":"Temario original"},"origin":"complementario","conceptIds":["S066"]},{"id":"c149","topic":"Circular y Manual Operativo","type":"convencional","question":"Según la Circular, el trato con el ciudadano debe ser:","options":["Correcto y educado, con actuación proporcionada","Firme y distante, para garantizar el principio de autoridad","Mínimo, limitándose a solicitar la documentación","Cordial, pero solo si el ciudadano colabora"],"answer":0,"explanation":"Literal: «Correcto y educado, con actuación proporcionada en medios y comportamiento». 2.2.","source":{"page":44,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c150","topic":"Circular y Manual Operativo","type":"convencional","question":"Los dispositivos de ambos tipos (≤50 km/h y >50 km/h) pueden utilizarse:","options":["Solo para fines de seguridad vial","Con carácter preventivo o reactivo","Solo con carácter preventivo, nunca reactivo","Solo con carácter reactivo, tras un delito"],"answer":1,"explanation":"2.- Tipos de dispositivos.","source":{"page":57,"section":"Manual Operativo general: tipos de dispositivos y normas de montaje","document":"Temario original"},"origin":"complementario","conceptIds":["S066"]},{"id":"c151","topic":"Circular y Manual Operativo","type":"convencional","question":"En el supuesto preventivo de protección de la seguridad en normalidad, ¿cuál es el objetivo de la identificación y las comprobaciones?","options":["Detener a los partícipes de un delito grave en huida","Impedir que se porten armas o medios de agresión","Indagar o prevenir delitos o infracciones penales o administrativas","Restablecer la normalidad tras una alteración grave del orden o la seguridad ciudadana"],"answer":2,"explanation":"Literal: «Indagar o prevenir la comisión de hechos delictivos o infracciones penales o administrativas». Art. 16.1.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T119","S040"]},{"id":"c152","topic":"Circular y Manual Operativo","type":"convencional","question":"Ante un riesgo potencialmente grave por armas o medios de agresión, ¿qué facultades contempla la Circular?","options":["Limitar o restringir la circulación y establecer zonas de seguridad en la vía","Cierre de locales y evacuación de inmuebles próximos","Controlar e identificar a las personas que transitan","Registro de personas y ocupación de armas y medios de agresión"],"answer":3,"explanation":"Literal: «Registro de las personas y ocupación temporal o permanente de armas y medios de agresión». Art. 18.","source":{"page":45,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T121","S041"]},{"id":"c153","topic":"Circular y Manual Operativo","type":"convencional","question":"Tras un delito especialmente grave o de alarma social, ¿cuándo contempla la Circular identificar personas, registrar vehículos o controlar superficialmente efectos?","options":["Cuando resulte indispensable para descubrir o detener a los partícipes y recoger pruebas del hecho.","En todo control, aunque no guarde relación con la investigación ni exista necesidad.","Solo si el titular del vehículo lo solicita expresamente.","Únicamente después de que finalice el dispositivo y se retiren sus efectivos."],"answer":0,"explanation":"El temario establece esta regla: Cuando resulte indispensable para descubrir o detener a los partícipes y recoger pruebas del hecho. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":46,"section":"Circular 1/2015: concepto, condiciones y supuestos legales","document":"Temario original"},"origin":"complementario","conceptIds":["T123"]},{"id":"c154","topic":"Circular y Manual Operativo","type":"convencional","question":"Los dispositivos preventivos se establecen como consecuencia de servicios debidamente ordenados para:","options":["Atender emergencias sobrevenidas en la vía pública","Las funciones generales de prevención o ante un riesgo específico","Restablecer la tranquilidad ciudadana ya alterada","Detener a los autores de delitos que hayan causado grave alarma social en la zona"],"answer":1,"explanation":"Literal: «Las funciones generales de prevención y protección, o ante situaciones susceptibles de generar un riesgo específico». 4.1.","source":{"page":47,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["T125","S048"]},{"id":"c155","topic":"Circular y Manual Operativo","type":"convencional","question":"En un dispositivo preventivo se han agotado los medios para identificar a una persona sin conseguirlo. ¿Qué criterio indica la Circular?","options":["Tratar toda falta de identificación como delito de alarma social.","Sustituir la identificación personal por la consulta de la matrícula, aunque no acredite quién es.","Acudir al procedimiento específico de identificación previsto legalmente, sin inventar una facultad general de detención.","Dar por identificada a la persona por la sola descripción física."],"answer":2,"explanation":"La Circular remite al procedimiento legal específico para esos casos. La imposibilidad de identificar por otros medios no permite improvisar facultades ilimitadas.","source":{"page":48,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c156","topic":"Circular y Manual Operativo","type":"convencional","question":"Ante el riesgo preventivo de porte o uso ilegal de armas, ¿a qué prendas se refiere el examen superficial previsto?","options":["Todas las prendas, incluida la ropa interior","Solo los bolsillos","El calzado","Las prendas de ropa de abrigo o superpuestas"],"answer":3,"explanation":"El temario establece esta regla: Las prendas de ropa de abrigo o superpuestas. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":48,"section":"Circular 1/2015: dispositivos preventivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c157","topic":"Circular y Manual Operativo","type":"convencional","question":"Según los requisitos generales de los dispositivos reactivos de la Circular, ¿qué causa debe justificar el establecimiento?","options":["Una alteración real del orden o la convivencia, o un riesgo sobrevenido","Que esté previsto expresamente en la papeleta de nombramiento del servicio ordenado","Que exista una campaña de control de la DGT en curso","Que lo solicite el Ministerio Fiscal por escrito"],"answer":0,"explanation":"El requisito general alude a una situación de alteración que suponga o se perciba como riesgo real, o a un riesgo sobrevenido e inminente. La ficha de alteración del orden incluye también indicios racionales de que pueda producirse; no se exige esperar a que el daño se consume.","source":{"page":49,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["T129"]},{"id":"c158","topic":"Circular y Manual Operativo","type":"convencional","question":"En un dispositivo por un delito que provoca grave alarma social, ¿qué alcance puede tener la revisión de efectos que porta una persona?","options":["Solo los bolsillos exteriores y el equipaje de mano","El interior de prendas y cualquier bulto o equipaje, también del vehículo","Solo los efectos que estén a simple vista, sin tocar las prendas ni el equipaje del vehículo","Solo el maletero y la guantera, nunca las prendas"],"answer":1,"explanation":"Literal: «El interior de las prendas y cualquier bulto o equipaje, también en el vehículo». 5.4.b.","source":{"page":51,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c159","topic":"Circular y Manual Operativo","type":"convencional","question":"En un dispositivo por un delito que provoca grave alarma social, ¿qué determina los efectos que se buscan?","options":["La lista de objetos prohibidos que recoge la LOSC","El tipo de vehículo y la carga que transporta","La naturaleza del delito que causó la alarma social","Lo que en cada caso indique el jefe del dispositivo"],"answer":2,"explanation":"Literal: «La naturaleza del delito que ha provocado la alarma social». 5.4.b.","source":{"page":51,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c160","topic":"Circular y Manual Operativo","type":"convencional","question":"Ante un riesgo sobrevenido e inminente que exige rapidez, ¿con qué límites pueden adoptarse medidas extraordinarias de seguridad?","options":["Durante un máximo de 4 horas, prorrogables una vez","Solo con orden escrita y motivada del Delegado o Subdelegado del Gobierno en la provincia","Solo tras dar aviso previo al Ministerio Fiscal","Si son imprescindibles, el tiempo necesario, incluso por orden verbal"],"answer":3,"explanation":"Literal: «Solo si son imprescindibles, durante el tiempo estrictamente necesario e incluso por orden verbal si la urgencia lo exige». 5.4.c.","source":{"page":52,"section":"Circular 1/2015: dispositivos reactivos; requisitos y facultades","document":"Temario original"},"origin":"complementario","conceptIds":["S044"]},{"id":"c161","topic":"Dispositivos ATGC","type":"convencional","question":"¿Cuántos componentes tiene el dispositivo ordinario REDUCIDO?","options":["Dos o tres","Uno o dos","Tres o cuatro","Cuatro como mínimo"],"answer":0,"explanation":"El temario establece esta regla: Dos o tres. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T139","S050"]},{"id":"c162","topic":"Dispositivos ATGC","type":"convencional","question":"El dispositivo reducido se emplea en tramos de velocidad:","options":["Superior a 50 km/h","No superior a 50 km/h","No superior a 40 km/h","No superior a 60 km/h"],"answer":1,"explanation":"El temario establece esta regla: No superior a 50 km/h. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T140","S050"]},{"id":"c163","topic":"Dispositivos ATGC","type":"convencional","question":"¿En qué horario se realiza, de forma general, el dispositivo reducido?","options":["Indistintamente","Solo en fines de semana","Diurno","Nocturno"],"answer":2,"explanation":"5.1.1. El ordinario es el idóneo en horario nocturno.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T141","S051"]},{"id":"c164","topic":"Dispositivos ATGC","type":"convencional","question":"Si un dispositivo reducido se hace de noche, ¿cuál NO es un condicionante?","options":["Suficiente iluminación artificial","Suficiente cobertura para las transmisiones","Que la COTA conozca el inicio, el fin y la geoposición","Que esté al mando de un oficial o suboficial"],"answer":3,"explanation":"Lo del oficial/suboficial es del reforzado.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T141","S051"]},{"id":"c165","topic":"Dispositivos ATGC","type":"convencional","question":"De noche, el dispositivo reducido se limita de forma general a:","options":["Alcohol y drogas o inspecciones de transportes","Controles de velocidad con cinemómetro","Controles preventivos de seguridad ciudadana","Notificación de infracciones captadas por RPAS"],"answer":0,"explanation":"Literal: «Verificaciones de alcohol y drogas o inspecciones de transportes». 5.1.1.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T142","S051"]},{"id":"c166","topic":"Dispositivos ATGC","type":"convencional","question":"En un dispositivo reducido de dos integrantes, uno realiza las verificaciones. ¿Qué funciones reúne el otro?","options":["Verificaciones simultáneas de otro vehículo mientras selecciona.","Selección de vehículos y protección del compañero.","Solo selección; la protección queda a cargo del verificador.","Solo bloqueo y seguimiento; no se realiza selección."],"answer":1,"explanation":"La distribución se corresponde con el número de integrantes de la modalidad indicada. La selección, las verificaciones y la protección conservan funciones diferenciadas; no se suprime la protección para aumentar el ritmo del control.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T145","S053"]},{"id":"c167","topic":"Dispositivos ATGC","type":"convencional","question":"En los dispositivos reducidos, el jefe del servicio es:","options":["El componente de protección","El designado por la COTA","El componente con mayor antigüedad","El componente de mayor empleo siempre"],"answer":2,"explanation":"El temario establece esta regla: El componente con mayor antigüedad. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":89,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T144","S052"]},{"id":"c168","topic":"Dispositivos ATGC","type":"convencional","question":"¿Cuál es el mínimo de componentes del dispositivo operativo ORDINARIO?","options":["3","6","8","4"],"answer":3,"explanation":"Literal: «Cuatro». 5.2.","source":{"page":90,"section":"5.2. Dispositivo operativo ordinario ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T146","S055"]},{"id":"c169","topic":"Dispositivos ATGC","type":"convencional","question":"¿En qué horario es idóneo el dispositivo ordinario?","options":["Nocturno","Diurno","Solo en fines de semana","Matinal"],"answer":0,"explanation":"El temario establece esta regla: Nocturno. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":90,"section":"5.2. Dispositivo operativo ordinario ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T148","S055"]},{"id":"c170","topic":"Dispositivos ATGC","type":"convencional","question":"Para reunir al menos cuatro componentes de noche, ¿quién adopta medidas de coordinación?","options":["El Oficial Jefe de la UNIS","Los Jefes de Subsector","La COTA","Los Jefes de Destacamento"],"answer":1,"explanation":"El temario establece esta regla: Los Jefes de Subsector. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":90,"section":"5.2. Dispositivo operativo ordinario ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c171","topic":"Dispositivos ATGC","type":"convencional","question":"En un dispositivo ordinario de cuatro integrantes de la ATGC, ¿cuál es la distribución funcional?","options":["Uno selecciona y tres verifican, sin protección específica.","Uno dirige y tres bloquean, sin equipo de verificaciones.","Uno selecciona, dos verifican y uno protege.","Dos seleccionan y dos verifican, sin protección específica."],"answer":2,"explanation":"La distribución se corresponde con el número de integrantes de la modalidad indicada. La selección, las verificaciones y la protección conservan funciones diferenciadas; no se suprime la protección para aumentar el ritmo del control.","source":{"page":90,"section":"5.2. Dispositivo operativo ordinario ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T149","S056"]},{"id":"c172","topic":"Dispositivos ATGC","type":"convencional","question":"Se incrementa a cinco el personal de un dispositivo ordinario de la ATGC. ¿Qué función refuerza el integrante adicional?","options":["La jefatura, que pasa a requerir obligatoriamente un oficial.","Un escalón de bloqueo completo, aunque solo haya cinco efectivos.","La vigilancia, suprimiéndose la protección.","Las verificaciones de tráfico."],"answer":3,"explanation":"La distribución se corresponde con el número de integrantes de la modalidad indicada. La selección, las verificaciones y la protección conservan funciones diferenciadas; no se suprime la protección para aumentar el ritmo del control.","source":{"page":90,"section":"5.2. Dispositivo operativo ordinario ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["S057"]},{"id":"c173","topic":"Dispositivos ATGC","type":"convencional","question":"El dispositivo REFORZADO es obligatorio en vías cuya velocidad establecida sea:","options":["Superior a 50 km/h","Superior a 40 km/h","Superior a 80 km/h","Igual o superior a 100 km/h"],"answer":0,"explanation":"El temario establece esta regla: Superior a 50 km/h. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T151","S058"]},{"id":"c174","topic":"Dispositivos ATGC","type":"convencional","question":"Sin aplicar las reducciones expresamente previstas, ¿cuál es la composición general de referencia del dispositivo reforzado de la ATGC?","options":["Cuatro componentes con dos verificadores.","Doce componentes.","Ocho componentes en todos los supuestos.","Seis componentes con bloqueo y seguimiento."],"answer":1,"explanation":"La regla general indica doce. El propio manual permite controles de ocho a once reduciendo verificadores y contempla ocho al desviar a zona calmada; por eso el enunciado excluye esas reducciones.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T151","S059"]},{"id":"c175","topic":"Dispositivos ATGC","type":"convencional","question":"Como norma general, el dispositivo reforzado se establece durante un tiempo mínimo de:","options":["2 horas","4 horas","3 horas","1 hora"],"answer":2,"explanation":"5.3.1. Ojo: la duración máxima de los dispositivos es de 4 horas.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T155","S062"]},{"id":"c176","topic":"Dispositivos ATGC","type":"convencional","question":"¿Quién debe estar al mando del dispositivo reforzado?","options":["Un cabo o guardia más antiguo","El jefe de la UNIS en todo caso","Un oficial en todo caso","Un oficial o suboficial"],"answer":3,"explanation":"El temario establece esta regla: Un oficial o suboficial. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T153","S061"]},{"id":"c177","topic":"Dispositivos ATGC","type":"convencional","question":"En el dispositivo reforzado, ¿cuántos componentes como mínimo deben pertenecer a un EIS?","options":["Dos","Uno","Tres","Cuatro"],"answer":0,"explanation":"El temario establece esta regla: Dos. Esta es la condición del supuesto descrito; las otras alternativas la cam
