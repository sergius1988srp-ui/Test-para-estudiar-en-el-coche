:root{color-scheme:dark;--bg:#0a111c;--panel:#111d2d;--panel2:#17263a;--text:#edf3fb;--muted:#a8b7cd;--line:#30435b;--accent:#70dcca;--accent-text:#062b29;--green:#8ee0b2;--red:#ffadb5;--yellow:#f3d28d;--shadow:0 18px 50px #0003}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#16344566,transparent 47%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button,input,select,a{touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 17px;font-weight:650;transition:background .14s,border-color .14s}button:hover:not(:disabled){background:#243953;border-color:#5a7898}.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.primary:hover:not(:disabled){background:#9be9dc;border-color:#9be9dc}.danger{color:var(--red);border-color:#86525b}.small{font-size:14px;padding:7px 12px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,5vw,46px);line-height:1.16;letter-spacing:-.035em;margin-bottom:17px}h2{font-size:23px;line-height:1.35;letter-spacing:-.015em}h3{font-size:18px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;margin:0 0 12px}.wrap{max-width:1130px;margin:auto;padding:0 28px}header{border-bottom:1px solid #30435b8c;background:#0a111ccf}.topbar{display:flex;align-items:center;gap:18px;justify-content:space-between;padding-top:18px;padding-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:38px;height:38px;background:#153d40;color:var(--accent);border:1px solid #31706e;border-radius:11px;display:grid;place-items:center;font-size:19px;font-weight:800}.brand strong{font-size:14px;display:block;line-height:1.3}.brand span{font-size:12px;color:var(--muted)}.clock{font-variant-numeric:tabular-nums;text-align:right;line-height:1.35}.clock time{font-weight:750;font-size:20px}.clock small{display:block;color:var(--muted);font-size:11px}main{padding-top:36px;padding-bottom:50px}.intro{max-width:760px}.intro p{color:var(--muted);max-width:690px}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:22px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}.card+.card{margin-top:18px}.card h2{margin-bottom:16px}.note{background:#142b35;border:1px solid #2c5965;padding:14px 17px;border-radius:12px;color:#c7e5ed;font-size:14px;margin:22px 0}.notice{background:#40321d;color:#f6deb1;border:1px solid #8a693a;padding:13px 17px;border-radius:11px;margin-bottom:20px}.notice:empty{display:none}.toast{margin-bottom:18px;padding:12px 16px;background:#173930;border:1px solid #39755f;border-radius:11px;color:#bcebd3}.toast:empty{display:none}.field{margin:0 0 21px}.field>label,.legend{display:block;font-weight:700;margin-bottom:9px}fieldset{border:0;margin:0 0 22px;padding:0}legend{font-weight:700;margin-bottom:10px}input[type=number],select{border:1px solid var(--line);border-radius:10px;background:#0b1624;color:var(--text);padding:10px 12px;min-height:46px;max-width:100%;width:170px}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:6px 0;cursor:pointer}.check input{margin-top:3px}.topics{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}.topics .check{font-size:14px}.check strong{display:block}.hint{font-size:13px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:22px 0}.big-number{font-size:4 :flex;flex-direction:column;gap:10px;margin-top:20px}.review-row{display:flex;align-items:center;gap:12px;background:#0d1929;border:1px solid var(--line);padding:13px;border-radius:10px}.review-row .content{flex:1;min-width:0}.review-row p{margin:0;font-size:14px}.review-row small{color:var(--muted);font-size:12px}.status-dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;background:#74839b}.status-dot.hit{background:var(--green)}.status-dot.miss{background:var(--red)}details{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-top:20px}summary{cursor:pointer;font-weight:700}footer{border-top:1px solid #30435b80;padding:22px 0 26px;color:var(--muted);font-size:12px}.footerline{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.bag-list{max-height:450px;overflow:auto;padding-right:4px}.bag-item{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:15px;align-items:flex-start}.bag-item .content{flex:1}.bag-item p{margin:0 0 4px;font-size:14px}.bag-item small{color:var(--muted);font-size:12px}.modal{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);max-width:750px;width:calc(100% - 28px);padding:27px;box-shadow:0 20px 90px #000b}.modal::backdrop{background:#020812c9;backdrop-filter:blur(4px)}.modalhead{display:flex;gap:18px;justify-content:space-between;align-items:start}.modalhead h2{margin:0}.empty{color:var(--muted);text-align:center;padding:30px 10px}a{color:var(--accent)}[hidden]{display:none!important}.sr-only{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}.mb0{margin-bottom:0}.mt16{margin-top:16px}.result-title{margin:24px 0 12px}.selected-info{font-size:13px;color:var(--muted);margin:14px 0 0}#nav-panel{max-height:calc(100vh - 40px);overflow:auto;position:sticky;top:20px}#nav-panel h3{font-size:15px;margin-bottom:14px}.quiz-running-title{font-size:24px;margin-bottom:0}.read-status{color:var(--muted);font-size:13px;margin:13px 0 0}::selection{background:#477a77;color:#fff}@media(max-width:850px){.grid{grid-template-columns:1fr}.grid>aside{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid>aside .card+.card{margin-top:0}.quizlayout{grid-template-columns:1fr}#nav-panel{position:static;max-height:none}.question-nav{grid-template-columns:repeat(10,1fr)}.question-nav button{padding:8px 0}.navlegend{margin-top:12px}}@media(max-width:560px){.wrap{padding-left:17px;padding-right:17px}main{padding-top:26px}.card{padding:21px}.grid>aside{display:block}.grid>aside .card+.card{margin-top:18px}.topics{grid-template-columns:1fr}.topbar{gap:10px;padding-top:14px;padding-bottom:14px}.brand strong{font-size:12px}.brand span{font-size:10px}.brandmark{width:33px;height:33px}.clock time{font-size:17px}.clock small{font-size:10px}.question-card{padding:21px 18px}.question{font-size:21px}.answer{padding:13px 12px;gap:10px;font-size:15px}.letter{min-width:27px;height:27px}.navigation button{padding:10px 12px;font-size:14px}.position{display:none}.quizhead{align-items:start}.quiz-running-title{font-size:20px}.question-nav{grid-template-columns:repeat(8,1fr)}.stats{gap:7px}.stat{padding:13px 5px}.stat b{font-size:25px}.stat span{font-size:11px}.modal{padding:21px}.bag-item{gap:10px}.review-row{flex-wrap:wrap}.review-row .content{flex-basis:calc(100% - 24px)}.review-row button{margin-left:21px}.score-value{font-size:65px}.actions>button{flex-grow:1}.bag-item button{font-size:12px;padding:7px 9px}}

<script>
'use strict';
const BANK = [{"id":"n01","topic":"Nevadas y coordinación","type":"convencional","options":["Un aviso naranja AEMET por nevadas, aunque todavía no se hayan producido dificultades de circulación.","La primera retención causada por nieve, siempre que ya existan ocupantes que necesiten alojamiento.","Un aviso amarillo AEMET en cualquier carretera interurbana, aunque no afecte a un área metropolitana.","La previsión de que la nieve alcance cinco centímetros, aunque AEMET no haya emitido aviso."],"answer":0,"explanation":"La alerta se inicia por aviso AEMET rojo o naranja por nevadas; también por amarillo en áreas metropolitanas con grandes núcleos de población. No exige una dificultad efectiva ni personas que necesiten atención: esos son criterios de fases posteriores.","source":{"page":142,"section":"8.1. Fase de alerta","document":"Temario original"},"question":"Se recibe una previsión de nieve, pero la circulación todavía es normal. ¿Qué supuesto basta para iniciar la fase de alerta del protocolo AGE en el ámbito afectado?","origin":"original","conceptIds":["T188","S003"]},{"id":"n02","topic":"Nevadas y coordinación","type":"correcta","options":["Las declara el COTA que recibe la incidencia; su declaración vincula el nivel de emergencia de los municipios afectados.","Las declara Delegación/Subdelegación del Gobierno; son internas y no fijan la declaración de los planes autonómicos o locales.","Las declara AEMET al emitir el aviso; la declaración determina simultáneamente el nivel de circulación en cada carretera afectada.","Las declara la Jefatura Provincial de Tráfico; su declaración sustituye la activación de los planes territoriales de protección civil."],"answer":1,"explanation":"La competencia de declaración corresponde a Delegaciones o Subdelegaciones. Las fases del protocolo tienen carácter interno para la AGE y no predeterminan lo que deba declararse conforme a los planes de protección civil autonómicos o locales. Un aviso meteorológico no equivale a esa declaración.","source":{"page":142,"section":"8. Condiciones de ejecución","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a la declaración y alcance de las fases de alerta, preemergencia y emergencia del protocolo AGE por nevadas:","origin":"original","conceptIds":["T186","T187","S001","S002"]},{"id":"n03","topic":"Nevadas y coordinación","type":"incorrecta","options":["Puede iniciarse cuando el hielo u otra circunstancia ya dificulta efectivamente la circulación en el tramo.","Finaliza si desaparecen sus causas o si la situación obliga a pasar a la fase de emergencia.","Debe mantenerse la alerta mientras la dificultad sea solo prevista; la preemergencia exige una dificultad efectiva.","Puede iniciarse si la intensidad de la nevada hace prever dificultades para circular, sin esperar a una interrupción efectiva."],"answer":2,"explanation":"Es incorrecto exigir dificultad efectiva en todos los casos: la intensidad de la nevada que haga prever dificultades ya permite iniciar la preemergencia. El manual contempla alternativamente la previsión y la dificultad efectiva.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Al valorar el inicio o final de la preemergencia por nieve en un tramo de la Red de Carreteras del Estado:","origin":"original","conceptIds":["T191","T192","S005","S006"]},{"id":"n04","topic":"Nevadas y coordinación","type":"convencional","options":["El de preemergencia, que se mantiene hasta que se confirme un espesor superior a cinco centímetros en todo el itinerario.","El de emergencia únicamente si ya se ha acordado trasladar a los ocupantes a hospitales o alojamientos.","El de alerta, porque la fase depende del aviso meteorológico aunque ya sea necesario auxiliar a los ocupantes.","El de emergencia, por la necesidad de atender a personas bloqueadas o retenidas que no pueden continuar por sus medios."],"answer":3,"explanation":"El inicio de emergencia depende de que sea necesario atender a esas personas, no de un espesor concreto ni de haber acordado ya su traslado. El alojamiento o la atención hospitalaria son posibles medidas posteriores según las necesidades.","source":{"page":146,"section":"8.3. Fase de emergencia","document":"Temario original"},"question":"Varios vehículos han quedado retenidos por la nieve. Sus ocupantes no pueden continuar el viaje por sus propios medios y es necesario atenderlos. ¿Qué criterio del protocolo AGE se cumple?","origin":"original","conceptIds":["T194","S007"]},{"id":"n05","topic":"Nevadas y coordinación","type":"correcta","options":["Recomendación de máximo 100 km/h en autopistas/autovías y 80 en el resto; valorar la restricción de articulados.","Prohibición de superar 100 km/h en autopistas y autovías y 80 km/h en el resto; prohibición de articulados.","Recomendación de 100 km/h para turismos y 80 km/h para pesados; valorar la restricción de articulados.","Recomendación de 80 km/h en autopistas y autovías y 60 km/h en el resto; restringir articulados si no llevan cadenas."],"answer":0,"explanation":"En verde, 100/80 se formula como recomendación y se distingue por tipo de vía, no de vehículo. La restricción de articulados se valora por su inestabilidad con baja adherencia; no se presenta aquí como una prohibición automática.","source":{"page":144,"section":"8.1. Fase de alerta: nivel verde","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Comienza a nevar, la circulación no se ve afectada y se aplica nivel verde. ¿Qué combinación respeta el carácter de las medidas del manual?","origin":"original","conceptIds":["T197","T198","T199","S013","S014"]},{"id":"n06","topic":"Nevadas y coordinación","type":"incorrecta","options":["Se contempla circulación a intervalos en convoyes específicos, con baja intensidad, tras limpiar la calzada o tras quitanieves.","La prohibición de circulación alcanza a los autobuses del mismo modo que a los camiones y articulados.","Se prohíbe superar 60 km/h, sin que ese límite autorice a circular a vehículos sujetos a prohibición.","Se prevén desvíos o embolsamientos de los vehículos con circulación prohibida en zonas acondicionadas."],"answer":1,"explanation":"La prohibición ordinaria de autobuses se añade en rojo. En amarillo, el cuerpo del plan prohíbe camiones y articulados y fija 60 km/h; el gráfico de colores permite turismos y autobuses a ese máximo. No debe trasladarse a amarillo la prohibición de autobuses propia del rojo.","source":{"page":144,"section":"8.1. Fase de alerta: nivel amarillo","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. La calzada comienza a cubrirse de nieve y se aplica nivel amarillo. Según sus medidas ordinarias en el cuerpo del plan:","origin":"original","conceptIds":["T201","T202","T203","T204","S016"]},{"id":"n07","topic":"Nevadas y coordinación","type":"convencional","options":["Cadenas o neumáticos especiales de nieve o hielo y velocidad máxima de 60 km/h.","Neumáticos ordinarios si sigue a una quitanieves y velocidad máxima de 30 km/h.","Cadenas o neumáticos especiales de nieve o hielo y prohibición de superar 30 km/h.","Cadenas o neumáticos especiales de nieve o hielo y recomendación de no superar 80 km/h."],"answer":2,"explanation":"El nivel rojo exige cadenas o neumáticos especiales para nieve o hielo y prohíbe superar 30 km/h. La posibilidad de prohibir directamente circular por la intensidad es una salvedad; seguir a una quitanieves no convierte los neumáticos ordinarios en equipamiento suficiente.","source":{"page":146,"section":"8.2. Fase de preemergencia: nivel rojo","document":"Temario original"},"question":"Un turismo puede seguir circulando en un tramo con nivel rojo y no se ha acordado prohibir directamente la circulación por su intensidad. ¿Qué combinación de equipamiento y velocidad exige ese nivel?","origin":"original","conceptIds":["T206","T208","S019"]},{"id":"n08","topic":"Nevadas y coordinación","type":"correcta","options":["Los convoyes específicos pueden salir con alta intensidad circulatoria si cada vehículo lleva neumáticos de invierno.","Los pesados esperan al levantamiento del nivel rojo; dentro de ese nivel solo se contemplan convoyes de ligeros.","Basta con que los pesados lleven cadenas; pueden circular individualmente mientras no superen 30 km/h.","Convoyes específicos, en momentos de baja intensidad circulatoria y con la calzada en condiciones."],"answer":3,"explanation":"Aunque el nivel rojo prohíbe con carácter ordinario camiones, articulados y autobuses, su relación de medidas contempla convoyes específicos de pesados con baja intensidad de tráfico y calzada en condiciones. No equivale a permitirles circular individualmente por llevar cadenas.","source":{"page":146,"section":"8.2. Fase de preemergencia: nivel rojo","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En un episodio con nivel rojo se estudia desembolsar vehículos pesados mediante convoyes específicos. ¿Qué condiciones recoge el manual para esa posibilidad?","origin":"original","conceptIds":["T210","S019","S020","S103"]},{"id":"n09","topic":"Nevadas y coordinación","type":"incorrecta","options":["La posibilidad de usar el carril contiguo al derecho permite adelantar por él a vehículos más lentos.","Se deja libre el resto de carriles de la izquierda para vehículos de emergencia y máquinas quitanieves.","Se señaliza la prohibición de adelantar y la circulación obligatoria por el carril derecho.","Puede utilizarse también el carril contiguo al derecho al existir al menos tres carriles por sentido."],"answer":0,"explanation":"El uso permitido del carril contiguo no elimina la prohibición de adelantar. La medida combina esa prohibición con la ocupación de los carriles derechos y la reserva de los restantes de la izquierda para emergencias y quitanieves.","source":{"page":144,"section":"8.1. Fase de alerta: señalización en autopistas y autovías","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. En una autopista de tres carriles por sentido, la nieve dificulta circular y se dispone de paneles de mensaje variable. Respecto a la señalización prevista:","origin":"original","conceptIds":["S023"]},{"id":"n10","topic":"Nevadas y coordinación","type":"convencional","options":["Carretera con nieve intensa en la que se reservan carriles de emergencia, aunque siga siendo transitable con equipamiento.","Carretera intransitable para cualquier vehículo, con inmovilización prolongada ya producida o riesgo claro de sufrirla.","Circulación difícil, aunque practicable con cadenas o neumáticos especiales y una velocidad máxima de 30 km/h.","Calzada que comienza a cubrirse, con desvíos de vehículos restringidos y circulación de los restantes hasta 60 km/h."],"answer":1,"explanation":"El rasgo del negro es la intransitabilidad para cualquier vehículo, acompañada de riesgo de inmovilización prolongada o de bloqueo ya producido. La circulación difícil pero practicable con equipamiento corresponde al rojo, no basta para definir el negro.","source":{"page":147,"section":"8.3. Fase de emergencia: nivel negro","document":"Temario original"},"question":"¿Qué situación describe específicamente el nivel negro de circulación por nieve?","origin":"original","conceptIds":["T212","S021"]},{"id":"n11","topic":"Nevadas y coordinación","type":"correcta","options":["La ATGC acuerda el corte y el titular confirma después la disponibilidad de medios, manteniéndolo hasta el cambio de turno.","El CGT acuerda el corte con Protección Civil y el titular de la vía realiza el tratamiento cuando finalice la nevada.","Se consensúa entre titular de la vía, CGT y ATGC, con medios disponibles para reducir la duración al tiempo necesario.","El titular comunica el corte al CGT cuando termine el tratamiento y la ATGC mantiene después la restricción por prevención."],"answer":2,"explanation":"El supuesto de negro para tratar la carretera exige consenso del titular, CGT y ATGC. El titular garantiza medios disponibles para reducir el corte al tiempo estrictamente necesario; no se trata de un cierre de duración fija ni de una comunicación posterior al tratamiento.","source":{"page":162,"section":"Anexo VII. MOV 2025/10: 11. Procedimientos específicos sobre restricciones al tráfico","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Se considera establecer temporalmente nivel negro para tratar la carretera. Según las pautas de la campaña de vialidad invernal:","origin":"original","conceptIds":[]},{"id":"n12","topic":"Nevadas y coordinación","type":"incorrecta","options":["Los convoyes específicos de pesados se organizan en momentos de baja intensidad circulatoria después de limpiar la calzada.","La precedencia de quitanieves se contempla tanto para ligeros como para pesados si continúa nevando intensamente o el tramo es largo.","Se prevé dar paso sin demora a vehículos ligeros una vez limpia la calzada, con quitanieves si sigue nevando intensamente o el tramo es largo.","Los convoyes de pesados han de ir precedidos de quitanieves aunque haya dejado de nevar y el tramo limpio sea corto."],"answer":3,"explanation":"La precedencia de quitanieves no se formula como exigencia incondicional: se vincula a que continúe nevando intensamente o a que el tramo sea largo. Para los pesados también se exige elegir momentos de baja circulación. No hay que convertir una condición operativa en una obligación universal.","source":{"page":154,"section":"Anexo V. Principios de actuación básicos: puntos 2 y 3","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Tras limpiar la calzada durante un episodio de nevadas, los principios básicos prevén aperturas a intervalos mediante convoyes. Respecto a estas aperturas:","origin":"original","conceptIds":["S103","S104"]},{"id":"n13","topic":"Nevadas y coordinación","type":"convencional","options":["Ocupar desde los más próximos al tramo; levantar conforme al CGT, priorizando el mayor tiempo de estacionamiento.","Ocupar primero los más alejados y dar salida prioritariamente a los vehículos que hayan llegado más recientemente.","Ocupar primero los más próximos y dar salida prioritariamente a los vehículos de mayor masa, con independencia de su espera.","Ocupar primero los más alejados y dar salida prioritariamente a quienes lleven más tiempo, sin atender a directrices del CGT."],"answer":0,"explanation":"El llenado es progresivo y escalonado, empezando por los estacionamientos más próximos al tramo restringido y coordinando con el Subsector limítrofe. El levantamiento sigue las directrices del CGT y prioriza por tiempo de espera, no por masa ni por orden de llegada inverso.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"question":"En preemergencia se dispone de varios estacionamientos sucesivos antes de un tramo restringido. ¿Qué combinación respeta la pauta para ocuparlos y para levantar posteriormente las restricciones?","origin":"original","conceptIds":["S010","S102"]},{"id":"n14","topic":"Nevadas y coordinación","type":"correcta","options":["Los medios de la AGE se dedican a despejar la calzada; la atención a ocupantes se limita a su traslado a un alojamiento.","Se ponen a disposición del órgano autonómico competente sin desatender casos urgentes mientras se activa el plan.","Los medios se ponen a disposición del titular de la carretera y el traslado hospitalario se realiza solo después de reabrir el tramo.","La asistencia se aplaza hasta la activación formal del plan territorial, aunque ya se hayan identificado casos urgentes."],"answer":1,"explanation":"La AGE pone los medios de asistencia a disposición del órgano autonómico competente en protección civil, pero ello no impide atender casos urgentes mientras se activa el plan territorial. La atención puede incluir bebidas, alimentos, abrigo, alojamiento y hospital si hay enfermedad.","source":{"page":146,"section":"8.3. Fase de emergencia","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Se ha alcanzado la emergencia por personas bloqueadas en sus vehículos. Respecto a los medios de la Administración General del Estado y las primeras atenciones:","origin":"original","conceptIds":["S011"]},{"id":"n15","topic":"Nevadas y coordinación","type":"incorrecta","options":["Su ubicación se contempla en los protocolos de la Delegación o Subdelegación y se asocia a tramos potencialmente conflictivos.","El protocolo determina quienes han de integrarlos por razón del cargo y los recursos de comunicaciones de que han de disponer.","La representación de la ATGC debe corresponder a un oficial; la categoría de suboficial no reúne el requisito previsto.","Se integran con personal con capacidad de decisión de los organismos implicados en la respuesta al episodio."],"answer":2,"explanation":"La ATGC puede estar representada por personal de categoría de oficial o suboficial. Exigir exclusivamente oficial restringe indebidamente el requisito. El resto reproduce las previsiones sobre composición, ubicación y dotación de estos puestos.","source":{"page":140,"section":"6.3. Puestos de Mando Avanzado","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre los Puestos de Mando Avanzado previstos para episodios de nevadas:","origin":"original","conceptIds":["T227","S031"]},{"id":"n16","topic":"Nevadas y coordinación","type":"convencional","options":["La persona titular de la Delegación del Gobierno más afectada, con participación del Jefe Provincial de Tráfico.","La persona titular de la ATGC, con participación de las Jefaturas Provinciales y de los Centros de Gestión de Tráfico.","La persona titular de la Dirección General de Tráfico, con representación de las Delegaciones afectadas.","La persona titular de la Subsecretaría del Interior, con participación, entre otras, de la persona titular de la ATGC."],"answer":3,"explanation":"El comité estatal descrito está presidido por la Subsecretaría del Interior e incluye a la persona titular de la ATGC. La presidencia de la Delegación o Subdelegación corresponde al Comité Ejecutivo territorial; no debe trasladarse al órgano estatal.","source":{"page":139,"section":"5.1. Centro de Coordinación de Dirección (CECOD)","document":"Temario original"},"question":"En la coordinación estatal de un episodio de nevadas, ¿quién preside el Comité Estatal de Coordinación descrito en el apartado del CECOD?","origin":"original","conceptIds":["T219","S027"]},{"id":"n17","topic":"Nevadas y coordinación","type":"correcta","options":["La DGT la constituye si el episodio afecta a varias comunidades y existe un riesgo relevante para la movilidad.","Se constituye al iniciarse cualquier alerta provincial y se integra exclusivamente por DGT y los titulares de las carreteras.","Se constituye al quedar personas bloqueadas en una sola provincia y sustituye al órgano autonómico de protección civil.","La constituye la Delegación del Gobierno cuando hay aviso rojo y se integra por representantes provinciales de AEMET y ATGC."],"answer":0,"explanation":"El criterio combina afección a varias comunidades y riesgo relevante para la movilidad. La célula incluye DGT y ATGC; pueden incorporarse Carreteras y Protección Civil cuando proceda, sin sustituir las competencias propias de protección civil.","source":{"page":139,"section":"5.2. Centro de Coordinación DGT/ATGC","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Sobre la célula permanente de coordinación y seguimiento DGT/ATGC en un episodio de nevadas:","origin":"original","conceptIds":["T221","S028"]},{"id":"n18","topic":"Nevadas y coordinación","type":"incorrecta","options":["Mantiene comunicaciones con el Centro Nacional de Seguimiento y Coordinación de Emergencias mientras dura la emergencia.","Está dirigido por la Jefatura Provincial de Tráfico y la Delegación del Gobierno ejerce su asistencia técnica.","La Unidad de Protección Civil asiste a la persona titular de la Delegación o Subdelegación del Gobierno en su dirección.","Mantiene las comunicaciones con los Puestos de Mando Avanzado y, cuando proceda, con las unidades de intervención."],"answer":1,"explanation":"El CECOP lo dirige la persona titular de la Delegación o Subdelegación del Gobierno, asistida por la Unidad de Protección Civil. La Jefatura Provincial de Tráfico no ocupa esa dirección; confundir su papel en las restricciones con la dirección del CECOP altera el reparto de funciones.","source":{"page":140,"section":"6.2. Centro de Coordinación Operativa (CECOP)","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto al Centro de Coordinación Operativa territorial durante una emergencia por nevadas:","origin":"original","conceptIds":["T226","S030"]},{"id":"n19","topic":"Nevadas y coordinación","type":"convencional","options":["Prevalece el criterio de carreteras por ser responsable de la limpieza, comunicándolo al finalizar el corte.","Se traslada la decisión al Comité Ejecutivo y se aplaza el corte hasta que este vuelva a reunirse.","El criterio de quien esté más próximo al terreno, con información inmediata a sus superiores de lo decidido.","Se mantiene el tráfico sin restricciones hasta que los tres actores formulen una decisión común por escrito."],"answer":2,"explanation":"La pauta es intentar una decisión común; si no es posible por ausencia o discrepancia, prevalece la proximidad al terreno y se informa inmediatamente a superiores. No se condiciona la actuación a una reunión ni a un acuerdo escrito previo.","source":{"page":149,"section":"10. Procedimiento específico sobre restricciones al tráfico","document":"Temario original"},"question":"Ante la necesidad de restringir el tráfico por nieve, no se logra el acuerdo entre ATGC, responsables de carreteras y CGT por discrepancia. ¿Qué criterio subsidiario recoge el plan?","origin":"original","conceptIds":["T213","T214","S032"]},{"id":"n20","topic":"Nevadas y coordinación","type":"correcta","options":["La limpieza del primer tramo obliga a levantarlo; las restricciones de otros tramos no pueden condicionar esa reapertura.","El titular reabre el tramo limpio tras avisar a la ATGC, y el CGT coordina únicamente la información al ciudadano.","La ATGC reabre el tramo limpio de forma automática y propone después al CGT medidas de apoyo al otro tramo.","Se eleva propuesta consensuada al CGT, coordinado con JPT, que puede mantener el corte por la situación del itinerario."],"answer":3,"explanation":"La desaparición del riesgo local permite proponer el levantamiento, pero debe considerarse el resto del itinerario. La propuesta de carreteras y agentes se eleva al responsable CGT coordinado con JPT; el CGT puede mantener una restricción como apoyo a otras aún necesarias.","source":{"page":161,"section":"Anexo VII. MOV 2025/10: 11. Procedimientos específicos sobre restricciones al tráfico","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Ha desaparecido el riesgo en un tramo cortado por nieve, pero otro tramo del mismo itinerario sigue restringido. Respecto al levantamiento del corte:","origin":"original","conceptIds":["T216","S033"]},{"id":"n21","topic":"Nevadas y coordinación","type":"incorrecta","options":["La grabación inicial espera a que se prevean más de treinta minutos de restricción, como la novedad por SIGO.","Deben trasladarse inmediatamente las decisiones de corte y las restricciones aplicadas, para informar a la DGT.","Se incluye la información sobre el estado de la red que aporten unidades de la Guardia Civil no encuadradas en la ATGC.","El COTA correspondiente efectúa la grabación inmediata del suceso en coordinación con su Centro de Gestión de Tráfico."],"answer":0,"explanation":"El umbral de más de treinta minutos afecta a la novedad SIGO del supuesto previsto para las vías del anexo I, no retrasa la grabación inmediata en LINCE. Son obligaciones diferentes; la información de otras unidades de Guardia Civil también debe incorporarse.","source":{"page":151,"section":"12.1. Localizador de Incidencias en las Carreteras de España (LINCE)","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Una nevada afecta a una vía cuya vigilancia corresponde a la ATGC. Sobre la información en LINCE:","origin":"original","conceptIds":["T229","S036"]},{"id":"n22","topic":"Nevadas y coordinación","type":"convencional","options":["Los COTA esperan al parte diario más próximo, porque todavía no se ha cumplido una hora de restricción.","Los COTA se coordinan para una única novedad a COTA Central y a su respectiva Comandancia.","Cada COTA remite una novedad separada a COTA Central para que este suprima después las duplicidades.","La comunicación se dirige solo al CGT, que informa a las Comandancias cuando concluye la restricción."],"answer":1,"explanation":"La duración prevista supera treinta minutos en una carretera del anexo I, por lo que procede la novedad directa a COTA Central y a la Comandancia. Si afecta a varios Subsectores, deben coordinar el envío de una única novedad; no se espera al parte periódico.","source":{"page":151,"section":"12.2. Novedades SIGO","document":"Temario original"},"question":"Una restricción por nieve en una carretera del anexo I previsiblemente durará 45 minutos y afecta a varios Subsectores. ¿Qué comunicación inicial por SIGO establece el plan?","origin":"original","conceptIds":["T231","T232","S038"]},{"id":"n23","topic":"Nevadas y coordinación","type":"correcta","options":["En el embolsamiento, ubicación y pesados; en el bloqueo, ubicación y ligeros, completando personas en el parte periódico SIGO.","En ambos casos, ubicación y personas; la tipología de vehículos se omite si ya figura el número total de afectados.","En ambos, ubicación, vehículos por tipo y personas; en embolsamientos, pesados, ligeros y personas en observaciones.","En ambos casos, ubicación y total de vehículos; el número de personas se registra únicamente cuando ya se ha solicitado auxilio."],"answer":2,"explanation":"La localización y el total de vehículos no bastan: se exige tipología y número de personas tanto para embolsados como para bloqueados. En el embolsamiento se precisa además consignar pesados, ligeros y personas en observaciones, sin esperar una solicitud de auxilio.","source":{"page":151,"section":"12.1. Localizador de Incidencias en las Carreteras de España (LINCE)","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. El COTA debe registrar en LINCE un embolsamiento causado por nieve y, en otro punto, vehículos bloqueados en calzada. ¿Qué información exige el plan?","origin":"original","conceptIds":["T230","S037"]},{"id":"n24","topic":"Nevadas y coordinación","type":"convencional","options":["El COTA afectado remite a COTA Central antes de las 22:45 y este remite a la Sala antes de las 23:00.","El COTA afectado y COTA Central remiten ambos antes de las 23:00, cada uno directamente a la Sala.","El COTA afectado informa antes de las 23:15 y COTA Central remite a la Sala antes de las 23:30.","El COTA afectado remite a COTA Central antes de las 23:00; este, a la Sala antes de las 23:15."],"answer":3,"explanation":"El COTA afectado remite antes de 07:00, 15:00 y 23:00; COTA Central remite posteriormente a la Sala de Operaciones y Servicios antes de 07:15, 15:15 y 23:15. La pregunta distingue los dos escalones, que no comparten la misma hora límite.","source":{"page":151,"section":"12.2. Novedades SIGO","document":"Temario original"},"question":"Continúa una restricción por nevadas sujeta al régimen periódico de novedades y no existe una orden distinta. ¿Cómo se encadenan las remisiones de la última franja diaria?","origin":"original","conceptIds":["T233","S039"]},{"id":"d01","topic":"Circular y Manual Operativo","type":"convencional","options":["Que existan indicios de participación en una infracción o necesidad razonable de identificarla para prevenir un delito.","Que se haya consumado un delito de especial gravedad y exista una orden judicial de identificación.","Que el dispositivo haya sido nombrado para investigar exclusivamente infracciones penales, quedando excluidas las administrativas.","Que la persona atraviese un punto elegido para el control, sin necesidad de valorar ninguna otra circunstancia."],"answer":0,"explanation":"La Circular permite la identificación por indicios de participación en una infracción o cuando resulte razonablemente necesaria para prevenir un delito. El mero paso por el dispositivo no convierte en legítima una actuación sistemática e indiscriminada.","source":{"page":45,"section":"3. Supuestos legales de establecimiento: carácter preventivo","document":"Temario original"},"question":"Conforme a la Circular 1/2015, en una situación de normalidad, ¿qué circunstancia puede justificar que se requiera la identificación de una persona en un dispositivo preventivo?","origin":"original","conceptIds":["T119","S040"]},{"id":"d02","topic":"Circular y Manual Operativo","type":"correcta","options":["Su finalidad debe limitarse a detectar infracciones penales, por ser insuficiente la prevención de infracciones administrativas.","Su objeto debe relacionarse con la misión y el dispositivo debe estar previsto específicamente en la papeleta u orden.","Puede establecerse de forma sistemática e indiscriminada cuando sus componentes dispongan de medios suficientes.","Basta con que el servicio esté nombrado, aunque el dispositivo no figure específicamente en la papeleta u orden."],"answer":1,"explanation":"La Circular exige relación directa con la misión y los cometidos, previsión específica en la papeleta u orden y finalidad de impedir o detectar infracciones penales o administrativas. La suficiencia de medios no sustituye la justificación de la actuación.","source":{"page":47,"section":"4.2. Requisitos legales de realización","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Según la Circular 1/2015, ¿qué requisito debe cumplir un dispositivo preventivo sobre vías?","origin":"original","conceptIds":["T126","T127","T128","S048"]},{"id":"d03","topic":"Circular y Manual Operativo","type":"incorrecta","options":["Pueden responder a un riesgo sobrevenido que ponga en peligro inminente a personas o bienes y exija actuar rápidamente.","Pueden perseguir el restablecimiento de la normalidad y, en su caso, la detención de partícipes y recogida de pruebas de un delito.","Los indicios racionales de una posible alteración no permiten un dispositivo reactivo hasta que esa alteración se consume.","En caso de necesidad o urgencia, el mando competente puede ordenar su establecimiento verbalmente, sin perjuicio de formalizarlo después."],"answer":2,"explanation":"La ficha de la Circular relativa a la alteración del orden, seguridad ciudadana o pacífica convivencia incluye también la existencia de indicios racionales de que pueda producirse. Por tanto, «reactivo» no significa necesariamente esperar a que la alteración se consume. Los requisitos generales y la orden verbal urgente se desarrollan en las páginas 49 y 50.","source":{"page":45,"section":"3. Supuestos legales de establecimiento: alteración o indicios racionales de alteración","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a los dispositivos reactivos regulados por la Circular 1/2015:","origin":"original","conceptIds":["T129","T130","T131","S042","S049"]},{"id":"d04","topic":"Circular y Manual Operativo","type":"convencional","options":["Localizar exclusivamente a los partícipes de un delito ya cometido que haya provocado alarma social.","Evacuar necesariamente todos los inmuebles de la zona antes de realizar cualquier comprobación.","Comprobar únicamente la documentación personal, sin examinar los efectos que puedan constituir el riesgo.","Impedir que se porten o utilicen ilegalmente esos elementos en los espacios públicos."],"answer":3,"explanation":"La finalidad preventiva específica es impedir el porte o uso ilegal de armas, explosivos, sustancias peligrosas u otros objetos susceptibles de emplearse para delinquir o alterar la seguridad ciudadana. La Circular contempla facultades de comprobación y ocupación, no solo comprobación documental.","source":{"page":45,"section":"3. Supuestos legales de establecimiento: armas y objetos peligrosos","document":"Temario original"},"question":"Según la Circular 1/2015, se establece un dispositivo preventivo ante un riesgo potencialmente grave relacionado con armas, explosivos u objetos peligrosos. ¿Cuál es su finalidad específica?","origin":"original","conceptIds":["T121","S041"]},{"id":"d05","topic":"Circular y Manual Operativo","type":"correcta","options":["El resultado del dispositivo debe ponerse posteriormente en conocimiento inmediato del Ministerio Fiscal.","La revisión de efectos personales queda excluida, aunque resulte indispensable para recoger pruebas del hecho.","La finalidad de detener a los partícipes impide utilizar el dispositivo para recoger instrumentos o pruebas del mismo delito.","Los efectos buscados deben fijarse sin atender a la naturaleza del delito que motiva el dispositivo."],"answer":0,"explanation":"La Circular exige dar conocimiento posterior inmediato del resultado al Ministerio Fiscal. También vincula los efectos buscados a la naturaleza del delito y permite las actuaciones previstas para detener a los partícipes y recoger efectos, instrumentos y pruebas.","source":{"page":51,"section":"5.4.b. Delito que provoca grave alarma social","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Conforme a la Circular 1/2015, en un dispositivo reactivo establecido para detener a los partícipes de un delito que provoca grave alarma social:","origin":"original","conceptIds":["T123","S043"]},{"id":"d06","topic":"Circular y Manual Operativo","type":"incorrecta","options":["La urgencia imprescindible puede justificar que las medidas se adopten mediante órdenes verbales.","Las medidas pueden mantenerse hasta agotar el plazo inicialmente previsto, aunque antes hayan dejado de ser necesarias.","Entre las medidas previstas se encuentran el cierre o desalojo de establecimientos y la evacuación de espacios públicos.","Pueden establecerse prohibiciones de paso si resultan imprescindibles."],"answer":1,"explanation":"Las medidas extraordinarias solo se pueden adoptar si son imprescindibles y durante el tiempo estrictamente necesario. Un plazo inicial no permite mantener una medida que ya ha dejado de ser necesaria.","source":{"page":52,"section":"5.4.c. Medidas ante una situación de riesgo sobrevenida","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Según la Circular 1/2015, ante una emergencia sobrevenida con peligro inminente que exige una actuación rápida:","origin":"original","conceptIds":["T124","S044"]},{"id":"d07","topic":"Circular y Manual Operativo","type":"convencional","options":["Que se realice de noche, aunque no se añada señalización ni se coloquen elementos sobre la vía.","Que la vía ya tenga una limitación previa de 50 km/h, sin añadir señalización, canalización ni bloqueo.","Que suponga una señalización más restrictiva que la de la vía o requiera elementos de canalización o bloqueo.","Que el dispositivo cuente con un mínimo de cuatro componentes, aunque no modifique la circulación."],"answer":2,"explanation":"En tramos donde se pueda circular a más de 40 km/h, basta con una de esas dos circunstancias: señalización más restrictiva o necesidad de canalización o bloqueo. Este umbral de inclusión en la Circular no debe confundirse con el de 50 km/h empleado para diferenciar despliegues.","source":{"page":44,"section":"2.2. Condiciones","document":"Temario original"},"question":"La Circular 1/2015 exige una condición adicional para incluir un dispositivo en un tramo donde pueda circularse a más de 40 km/h. ¿Cuál de estas circunstancias satisface esa condición?","origin":"original","conceptIds":["T116","S046"]},{"id":"d08","topic":"Circular y Manual Operativo","type":"correcta","options":["Los dispositivos en tramos de más de 50 km/h tienen necesariamente carácter reactivo.","La diferencia entre preventivo y reactivo depende de que la carretera tenga uno o varios carriles por sentido.","Los dispositivos en puntos de circulación detenida quedan fuera del Manual y solo se rigen por el procedimiento de la Agrupación de Tráfico.","Los dos tipos definidos por la velocidad de la vía admiten empleo preventivo o reactivo, según el supuesto que los justifique."],"answer":3,"explanation":"El Manual general distingue tipos según las características y velocidad de la vía, pero aclara que ambos pueden emplearse con carácter preventivo o reactivo. La finalidad y el supuesto legal, no el número de carriles, determinan ese carácter.","source":{"page":57,"section":"2. Tipos de dispositivos","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En la clasificación del Manual Operativo general sobre dispositivos en vías:","origin":"original","conceptIds":["S066"]},{"id":"d09","topic":"Circular y Manual Operativo","type":"incorrecta","options":["Los dispositivos para el cumplimiento de funciones de seguridad del tráfico quedan excluidos por no formar parte de la seguridad ciudadana.","Los dispositivos motivados por transportes especiales o accidentes figuran entre las exclusiones.","La indicación desde un vehículo en marcha a otro también en marcha para detenerlo en un lugar idóneo sin riesgo para el tráfico está excluida.","Los dispositivos motivados por obras quedan excluidos en los términos que establece la Circular."],"answer":0,"explanation":"La Circular incluye los dispositivos relacionados con funciones de prevención y mantenimiento de la seguridad del tráfico, considerada una especificidad de la seguridad ciudadana. Las demás opciones corresponden a exclusiones expresas de la página 44.","source":{"page":43,"section":"2.1. Definición e inclusión de la seguridad del tráfico","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre las inclusiones y exclusiones de la Circular 1/2015:","origin":"original","conceptIds":["T115","T117","T118","S045","S047"]},{"id":"d10","topic":"Circular y Manual Operativo","type":"convencional","options":["Instalar señalización y barreamiento antes de canalizar; retirar la canalización antes de abrir el paso.","Instalar señalización, canalización y barreamiento; retirar primero el barreamiento, después la canalización y al final la señalización.","Instalar primero la canalización y luego la señalización; retirar los elementos en el mismo orden de instalación.","Instalar primero el barreamiento para proteger la colocación de señales y retirarlo después de la señalización."],"answer":1,"explanation":"El montaje sigue el orden señalización, canalización y barreamiento. La recogida invierte ese orden, quedando la señalización para el final. El Manual también prohíbe colocar barreamientos antes de instalar todas las señales.","source":{"page":65,"section":"5.2. Establecimiento y 5.3. Recogida","document":"Temario original"},"question":"Según el Manual Operativo general, ¿cuál es el orden correcto para instalar y retirar los elementos de un dispositivo?","origin":"original","conceptIds":["T138","S067"]},{"id":"d11","topic":"Dispositivos ATGC","type":"correcta","options":["Exige comunicar a COTA su inicio, pero la finalización solo debe comunicarse si se produce una incidencia.","Solo exige chaleco antibalas al componente dedicado a la protección.","Exige luz artificial suficiente, cobertura, aviso a COTA del inicio, fin y ubicación, y antibalas para todos.","Puede realizarse con iluminación suficiente aunque no exista cobertura para las transmisiones."],"answer":2,"explanation":"El reducido se realiza de forma general de día, pero el procedimiento permite hacerlo de noche con condiciones específicas acumuladas. Se limitan, de forma general, a alcohol y drogas o inspecciones de transportes, respetando especialmente las funciones de protección.","source":{"page":88,"section":"5.1.1. Dispositivo ordinario reducido: horario nocturno","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Según el procedimiento específico de la Agrupación de Tráfico, un dispositivo ordinario reducido en horario nocturno:","origin":"original","conceptIds":["T141","T142","T143","S051"]},{"id":"d12","topic":"Dispositivos ATGC","type":"incorrecta","options":["Un componente asume la selección y protección, y el otro las verificaciones de tráfico.","El jefe del servicio es el componente de mayor antigüedad.","La selección debe evitar aglomeraciones y atender a los movimientos sospechosos de los vehículos que se aproximan.","El encargado de selección y protección puede atender a otro vehículo mientras su compañero verifica el anterior."],"answer":3,"explanation":"El componente de selección y protección no debe introducir nuevos vehículos mientras su compañero actúa con uno ni intervenir con vehículos simultáneamente, porque debe atender a su protección. La distribución y la jefatura por antigüedad figuran en la página 88.","source":{"page":89,"section":"5.1.3.a. Selección y protección en dispositivos de dos componentes","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. En un dispositivo reducido de dos componentes del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["T139","T144","T145","S050","S052","S053"]},{"id":"d13","topic":"Dispositivos ATGC","type":"convencional","options":["Se asigna un componente a selección, otro a verificaciones y otro a proteger a ambos.","Se crea necesariamente un escalón de bloqueo y seguimiento independiente.","El tercer componente refuerza verificaciones y la selección y protección siguen reunidas en otro.","Se elimina la función de protección para dedicar dos componentes a verificaciones."],"answer":0,"explanation":"Con tres componentes se separan selección, verificaciones y protección. Las misiones son las de los dispositivos de dos, salvo que la protección la asume el componente dedicado a ella y cubre al resto.","source":{"page":90,"section":"5.1.4. Misiones en dispositivos de tres componentes","document":"Temario original"},"question":"En el procedimiento específico de la Agrupación de Tráfico, un dispositivo reducido pasa de dos a tres componentes. ¿Qué cambio funcional caracteriza a la composición de tres?","origin":"original","conceptIds":["T139","S050","S054"]},{"id":"d14","topic":"Dispositivos ATGC","type":"correcta","options":["Los cuatro componentes mínimos deben pertenecer necesariamente a la misma unidad y grupo operativo.","Es idóneo de noche y permite reunir patrullas de distintas unidades o grupos para alcanzar al menos cuatro componentes.","La incorporación de una segunda patrulla permite establecerlo en cualquier tramo sin atender a la limitación específica de velocidad.","Su empleo nocturno está reservado a servicios excepcionales autorizados por el Mando de Operaciones."],"answer":1,"explanation":"El ordinario es idóneo de noche. Cuando sea necesario, los jefes de Subsector deben coordinar el nombramiento para integrar patrullas de diferentes unidades o grupos y reunir al menos cuatro componentes. Se mantienen las condiciones de emplazamiento previstas en el procedimiento.","source":{"page":90,"section":"5.2.1. Normas generales sobre nombramiento y ejecución","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Sobre el dispositivo operativo ordinario del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["T146","T147","T148","S055"]},{"id":"d15","topic":"Dispositivos ATGC","type":"incorrecta","options":["Un ordinario con más de cuatro componentes puede conservar esa modalidad.","Con un mínimo de seis efectivos puede establecerse un escalón de bloqueo y seguimiento sin constituir un dispositivo reforzado.","La incorporación de un quinto componente convierte por sí sola el dispositivo en reforzado.","Puede reforzar las funciones de verificación de tráfico."],"answer":2,"explanation":"La composición superior a cuatro no convierte automáticamente el dispositivo ordinario en reforzado. El procedimiento contempla personal adicional para verificaciones y, con seis efectivos como mínimo, para un escalón de bloqueo y seguimiento.","source":{"page":92,"section":"5.2.3. Personal adicional","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. En relación con el personal adicional de un dispositivo ordinario del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["S057"]},{"id":"d16","topic":"Dispositivos ATGC","type":"convencional","options":["Pueden admitirse más vehículos si queda espacio, aplazando sus verificaciones hasta que se libere un componente.","Puede mantenerse la admisión a un ritmo reducido, limitándola a un vehículo en espera por cada componente ocupado.","La selección puede continuar si el jefe lo autoriza y se informa a los nuevos conductores de que deberán esperar.","No deben introducirse nuevos vehículos mientras esas actuaciones impidan atenderlos."],"answer":3,"explanation":"El procedimiento impide introducir vehículos si todos los componentes de la zona de verificaciones están ocupados en actuaciones que no les permiten atenderlos. La necesidad de mantener actividad no justifica acumular usuarios sin atención ni suprimir la protección.","source":{"page":92,"section":"5.2.2. Fuerza a emplear y misiones: admisión de vehículos","document":"Temario original"},"question":"En un dispositivo ordinario de la Agrupación de Tráfico, todos los componentes de verificaciones están ocupados en denuncias, diligencias u otras actuaciones que les impiden atender a más usuarios. ¿Qué establece el procedimiento específico?","origin":"original","conceptIds":["S056"]},{"id":"d17","topic":"Dispositivos ATGC","type":"correcta","options":["Debe estar al mando de un oficial o suboficial e incluir al menos dos componentes de un EIS entre sus efectivos.","La participación de un Equipo de Investigación de Siniestros solo se exige si finalmente se detecta un resultado positivo.","Los componentes de un Equipo de Investigación de Siniestros deben permanecer ajenos a las pruebas hasta que concluya el control.","Puede quedar al mando de cualquier componente por antigüedad, sin exigencia de empleo."],"answer":0,"explanation":"La jefatura corresponde a un oficial o suboficial y se exige que al menos dos componentes pertenezcan a un EIS. El EIS puede apoyar inicialmente las pruebas y asumir después las evidenciales, confirmatorias o diligencias derivadas de positivos.","source":{"page":93,"section":"5.3.2. Normas sobre nombramiento y ejecución","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Respecto a la jefatura y la participación especializada en un dispositivo reforzado del procedimiento específico de la Agrupación de Tráfico:","origin":"original","conceptIds":["T153","T154","S061"]},{"id":"d18","topic":"Dispositivos ATGC","type":"incorrecta","options":["Cuando empiezan a detectarse positivos indiciarios, se encargan de las pruebas evidenciales o confirmatorias, o de las diligencias que procedan.","Su cometido se limita a vigilar el dispositivo y excluye la realización de pruebas evidenciales o confirmatorias.","Su intervención puede comprender la instrucción de diligencias derivadas de actuaciones en el dispositivo.","Deben apoyar en las funciones de realización de pruebas."],"answer":1,"explanation":"El procedimiento atribuye al EIS el apoyo en pruebas y, al aparecer positivos indiciarios, la realización de pruebas evidenciales, confirmatorias o las diligencias derivadas. No limita su cometido a vigilancia.","source":{"page":96,"section":"5.3.3. Funciones de los Equipos de Investigación de Siniestros","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre los Equipos de Investigación de Siniestros en los dispositivos reforzados de la Agrupación de Tráfico:","origin":"original","conceptIds":["T154"]},{"id":"d19","topic":"Dispositivos ATGC","type":"convencional","options":["Mantener el dispositivo durante tres horas en cualquier modalidad, aunque se trate de un reducido.","Eliminar el límite máximo de duración para impedir que los conductores anticipen su finalización.","Potenciar los dispositivos de corta duración para disminuir la capacidad de reacción de los conductores y aumentar su efectividad.","Prolongar el dispositivo hasta el máximo previsto, porque su eficacia aumenta necesariamente con el tiempo."],"answer":2,"explanation":"Cuando la sorpresa es esencial, el procedimiento favorece la corta duración. El mismo apartado establece un mínimo general de 15 minutos y un máximo de cuatro horas; la pauta general de tres horas se recoge específicamente para los reforzados.","source":{"page":99,"section":"8. Duración de los dispositivos operativos","document":"Temario original"},"question":"Según el apartado de duración del procedimiento específico de la Agrupación de Tráfico, ¿qué criterio debe seguirse cuando la sorpresa es el elemento esencial de la planificación?","origin":"original","conceptIds":["T157","S062","S065"]},{"id":"d20","topic":"Dispositivos ATGC","type":"correcta","options":["Pueden realizarse por decisión de la patrulla aunque esa posibilidad no esté recogida en los programas preventivos de las reuniones mensuales.","Exigen seleccionar únicamente a conductores con signos de consumo y excluyen la selección aleatoria.","Pueden efectuar la detención sobre la marcha exclusivamente mediante personal no uniformado.","Pueden realizarse si los programas preventivos de las reuniones mensuales entre Tráfico y Subsector recogen esa posibilidad."],"answer":3,"explanation":"El procedimiento vincula estos dispositivos a lo establecido en las actas de las reuniones mensuales y sus programas preventivos. Prevé que personal uniformado detenga sobre la marcha vehículos de forma aleatoria o por indicios, para realizar después las pruebas y comprobaciones oportunas.","source":{"page":97,"section":"5.4. Dispositivos dinámicos","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. Según el procedimiento específico de la Agrupación de Tráfico, los dispositivos dinámicos de verificación de alcohol o drogas:","origin":"original","conceptIds":[]},{"id":"d21","topic":"Dispositivos ATGC","type":"incorrecta","options":["Debe utilizarla también en los controles reducidos con el mismo carácter obligatorio que en los ordinarios y reforzados.","En un reforzado puede utilizarla el escalón de vigilancia.","Si la utiliza vigilancia en un reforzado, debe mantener enlace permanente con selección para comunicar vehículos con incidencias.","Debe utilizarla en controles ordinarios o reforzados."],"answer":0,"explanation":"El procedimiento distingue entre el uso debido en controles ordinarios o reforzados y el uso posible en reducidos. No atribuye al reducido el mismo carácter obligatorio. En reforzados, vigilancia puede usar el sistema manteniendo enlace con selección.","source":{"page":100,"section":"11. Utilización de dispositivos OCR","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Una unidad de la Agrupación de Tráfico dispone de lectura de matrículas OCR conectada con las bases de datos para el reporte de incidencias. Según el procedimiento específico:","origin":"original","conceptIds":[]},{"id":"d22","topic":"Dispositivos ATGC","type":"convencional","options":["Desviar únicamente hacia una vía que impida regresar a la autovía, para evitar nuevas retenciones.","Desviar hacia la alternativa para reducir la acumulación, manteniendo flujo constante de vehículos en verificaciones.","Suspender necesariamente todas las verificaciones en cuanto se produzca cualquier acumulación, sin valorar el desvío previsto.","Conservar toda la circulación en la calzada principal hasta que finalicen las verificaciones de todos los vehículos retenidos."],"answer":1,"explanation":"El procedimiento prevé el desvío para reducir la acumulación y el riesgo por alcances, manteniendo actividad en la zona del control. Los vehículos desviados deben poder reincorporarse a la calzada principal una vez rebasado el dispositivo.","source":{"page":98,"section":"6.3. Dispositivos en la plataforma de la calzada principal","document":"Temario original"},"question":"En un dispositivo de la Agrupación de Tráfico situado en la calzada principal de una autovía, la acumulación de vehículos genera riesgo por alcances. Existe una vía alternativa que permite reincorporarse después del control. ¿Qué prevé el procedimiento específico?","origin":"original","conceptIds":[]},{"id":"d23","topic":"Dispositivos ATGC","type":"correcta","options":["Los notificadores quedan fuera del dispositivo, que se considera formado únicamente por sus operadores.","El enlace entre operador y notificadores solo es necesario cuando ya se ha producido una incidencia.","El de superior empleo o más caracterizado presente en la zona de notificación asume la responsabilidad del escalón.","El operador conserva necesariamente la responsabilidad directa de notificación, aunque otro de superior empleo esté en esa zona."],"answer":2,"explanation":"El dispositivo incluye operadores y notificadores. Cuando el más caracterizado del grupo es operador, la responsabilidad del escalón de notificación la asume el de superior empleo o más caracterizado que esté allí. El operador debe permanecer enlazado con los notificadores.","source":{"page":99,"section":"7. Dispositivos para notificación de infracciones","document":"Temario original"},"question":"ELIGE LA OPCIÓN CORRECTA. En un dispositivo de notificación por cinemómetro o RPAS de la Agrupación de Tráfico, el componente más caracterizado del grupo actúa como operador. Según el procedimiento específico:","origin":"original","conceptIds":[]},{"id":"d24","topic":"Dispositivos ATGC","type":"incorrecta","options":["El procedimiento contempla su colocación ante indicios de que el conductor pueda reemprender la marcha para eludir el control.","Antes de colocarlo debe ordenarse que se pare el motor y, en su caso, retirar la llave del interruptor.","Tras las actuaciones debe retirarse antes de ordenar que se reemprenda la marcha.","Se instala rutinariamente en cualquier vehículo, aunque no haya indicios de que el conductor vaya a eludir el control."],"answer":3,"explanation":"La colocación se vincula a indicios de posible reanudación de la marcha para eludir el control, no a una instalación rutinaria e indiscriminada. Se ordena parar el motor antes, se informa al conductor una vez colocado y se retira antes de ordenar la marcha.","source":{"page":100,"section":"10.1. Equipo de barreamiento individual","document":"Temario original"},"question":"ELIGE LA OPCIÓN INCORRECTA. Sobre el equipo de barreamiento individual en dispositivos reducidos u ordinarios de la Agrupación de Tráfico:","origin":"original","conceptIds":[]},{"id":"s01","topic":"Detenciones en carretera","type":"convencional","options":["Cuando tenga clara la zona segura y se aproxime al lugar elegido para detenerlo.","Solo después de que el turismo se haya detenido voluntariamente fuera de la vía.","Al observar la infracción, aunque deba acompañar al turismo durante un largo trayecto hasta una salida.","Después de adelantar al turismo y situarse delante de él, con independencia del lugar disponible."],"answer":0,"explanation":"Primero debe estar clara la zona segura. Anticipar mucho las señales puede generar nerviosismo y una parada o maniobra peligrosa del conductor.","source":{"page":106,"section":"2.1. Detención de vehículo circulando para notificar una infracción","document":"Temario original"},"question":"Una patrulla en un vehículo oficial de cuatro ruedas circula por una autovía y decide detener a un turismo para notificar una infracción. Todavía está lejos de una zona segura. ¿Cuándo debe comenzar a utilizar la señalización para ordenar la detención?","origin":"original","conceptIds":["S070"]},{"id":"s02","topic":"Detenciones en carretera","type":"incorrecta","options":["Si se detiene en un lugar seguro sin el mismo riesgo del tráfico cercano, un agente puede identificar y notificar mientras el otro protege su intervención.","La necesidad de notificar permite elegir el arcén como lugar ordinario de parada si se mantiene una separación de 20 metros.","Debe procurarse una zona segura fuera de la vía, como un área de descanso o una explanada adyacente.","Los arcenes y los carriles de aceleración o deceleración son lugares que deben evitarse salvo fuerza mayor."],"answer":1,"explanation":"Los 20 metros no convierten el arcén en un lugar ordinario de notificación. El manual prioriza zonas seguras fuera de la vía y reserva los lugares no seguros para supuestos excepcionales de fuerza mayor.","source":{"page":110,"section":"2.1.1.1. Vehículo de cuatro ruedas con colores oficiales en autopistas/autovías","document":"Temario original"},"question":"Una patrulla en vehículo oficial de cuatro ruedas va a detener un turismo en una autopista para notificar una infracción. ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":["T174","S069"]},{"id":"s03","topic":"Detenciones en carretera","type":"correcta","options":["La patrulla debe circular en paralelo hasta que el conductor comprenda las indicaciones.","La ausencia de agresividad permite adelantar sin comprobar antes la información y las condiciones de seguridad.","Puede intentar la detención desde delante, salvo que las circunstancias aconsejen no hacerlo.","La patrulla debe mantener exclusivamente el intento desde atrás, aunque sea posible una maniobra segura por delante."],"answer":2,"explanation":"El manual distingue esta situación de la conducción agresiva o con sospecha delictiva. En la conducción no agresiva pero peligrosa contempla intentar la detención desde delante, con las comprobaciones y precauciones previstas.","source":{"page":108,"section":"2.1.1.1. Vehículo de cuatro ruedas con colores oficiales: falta de atención a las señales","document":"Temario original"},"question":"En una autopista, un turismo no atiende las señales de detención de una patrulla en vehículo oficial de cuatro ruedas. Su conducción no es agresiva, pero sí peligrosa, y no hay sospechas delictivas. ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":["T170","S081"]},{"id":"s04","topic":"Detenciones en carretera","type":"convencional","options":["Agresiva y peligrosa necesariamente, por tratarse de una detención policial.","Ninguna de las dos, mientras no llegue a producirse un accidente.","Agresiva, porque cualquier riesgo para otro usuario implica agresividad.","Peligrosa; los hechos descritos no permiten calificarla también como agresiva."],"answer":3,"explanation":"La conducción peligrosa pone en riesgo a otros usuarios o al propio conductor. La agresiva se define por intentar huir de la patrulla o atropellar a sus miembros; no son conceptos equivalentes.","source":{"page":108,"section":"2.1.1.1. Definiciones de conducción agresiva y peligrosa","document":"Temario original"},"question":"Durante un intento de detención en carretera, un conductor pone en riesgo a otros usuarios, pero no intenta huir de la patrulla ni atropellar a sus componentes. Según las definiciones del protocolo, ¿cómo se califica esa conducta?","origin":"original","conceptIds":["T173","S083"]},{"id":"s05","topic":"Detenciones en carretera","type":"incorrecta","options":["Si el conductor no comprende las señales, un motorista debe mantenerse a su lado en paralelo mientras el otro conserva la posición trasera.","El agente notificador debe esperar a su compañero antes de acercarse al vehículo detenido para recibir protección.","Ambos componentes deben identificar el vehículo y coordinarse por transmisiones.","Pueden colocarse momentáneamente en la parte posterior izquierda del vehículo para que el conductor los detecte, sin circular en paralelo."],"answer":0,"explanation":"El protocolo prohíbe circular en paralelo con el vehículo que se pretende detener. La aproximación momentánea a su parte posterior izquierda no autoriza a situarse a su lado.","source":{"page":112,"section":"2.1.1.3. Vehículo de dos ruedas en autopistas/autovías; continuación en p.113","document":"Temario original"},"question":"Dos motoristas de la Agrupación van a detener un vehículo en una autovía para notificar una infracción. ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":["S084"]},{"id":"s06","topic":"Detenciones en carretera","type":"correcta","options":["Debe esperar al apoyo uniformado, incluso cuando dispone de medios de identificación y lugar seguro.","Puede detenerlo sin riesgo propio o ajeno, en un lugar seguro y sin maniobras arriesgadas.","Puede adelantar aunque esté prohibido si lo necesita para mostrar el panel trasero de detención.","Debe finalizar en el arcén las gestiones iniciadas allí para no exigir otro desplazamiento al infractor."],"answer":1,"explanation":"El apoyo uniformado se procura siempre que sea posible, pero su ausencia no impide toda actuación. La detención queda condicionada a la seguridad y no autoriza maniobras de riesgo ni adelantamientos indebidos.","source":{"page":111,"section":"2.1.1.2. Vehículo de cuatro ruedas con colores comerciales en autopistas/autovías","document":"Temario original"},"question":"Una patrulla en un vehículo policial de cuatro ruedas con colores comerciales necesita detener a un infractor en una autopista. No dispone de apoyo inmediato de una patrulla uniformada. ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":["S089"]},{"id":"s07","topic":"Detenciones en carretera","type":"convencional","options":["En la calzada, eligiendo un tramo recto con visibilidad y separando el oficial al menos 20 metros.","En el carril derecho durante la identificación, trasladando la notificación a una zona exterior segura.","Fuera de la calzada, aprovechando lugares adecuados como explanadas, caminos o estaciones de servicio.","En el carril derecho, con el oficial oblicuo y a más de 20 metros y el auxiliar señalizando por detrás."],"answer":2,"explanation":"Si no existe arcén o resulta impracticable, el manual ordena detener fuera de la calzada y prohíbe hacerlo sobre ella por el peligro que supone.","source":{"page":114,"section":"2.1.2.1. Vehículo de cuatro ruedas con colores oficiales en carreteras convencionales","document":"Temario original"},"question":"Una patrulla en vehículo oficial de cuatro ruedas va a detener un turismo en una carretera convencional que carece de arcén practicable. ¿Dónde debe realizar la detención?","origin":"original","conceptIds":["T167","T168","S087"]},{"id":"s08","topic":"Detenciones en carretera","type":"incorrecta","options":["Sin otros equipos y ante una infracción muy grave, puede cambiar de sentido con las medidas de seguridad necesarias para intentar alcanzarlo de forma segura.","Debe abstenerse de realizar seguimientos a altas velocidades.","Debe solicitar apoyo a otros equipos de la especialidad que puedan encontrar al infractor, indicando sus características y la infracción.","Si no hay otros equipos, basta con que la infracción sea grave para cambiar de sentido e intentar darle alcance."],"answer":3,"explanation":"El supuesto que permite intentar darle alcance sin otros equipos se refiere a una infracción muy grave, con todas las precauciones. Sustituir «muy grave» por «grave» altera la condición del manual.","source":{"page":113,"section":"2.1.2.1. Vehículo de cuatro ruedas con colores oficiales en carreteras convencionales","document":"Temario original"},"question":"En una carretera convencional de un carril por sentido, una patrulla en vehículo oficial de cuatro ruedas observa una infracción cometida por un vehículo que circula en sentido contrario. ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":[]},{"id":"s09","topic":"Detenciones en carretera","type":"correcta","options":["El jefe puede avanzar con seguridad a un lugar seguro y dar el alto a pie, o dejarse sobrepasar para actuar ambos desde atrás.","El auxiliar asume la detención desde atrás y el jefe conserva su marcha, sin intervenir hasta que el infractor ya esté parado.","El jefe permanece delante y el auxiliar detrás, manteniendo al infractor entre ambos hasta localizar una salida segura.","El auxiliar debe rebasar al infractor y mantenerse a su lado hasta que el jefe pueda ordenarle la detención desde delante."],"answer":0,"explanation":"El protocolo ofrece ambas alternativas: adelantarse lo suficiente hasta un lugar seguro para ordenar a pie la detención, o dejar que el infractor sobrepase al jefe para quedar ambos detrás. No autoriza maniobras peligrosas.","source":{"page":115,"section":"2.1.2.3. Vehículo de dos ruedas en carreteras convencionales","document":"Temario original"},"question":"En una carretera convencional, el motorista auxiliar observa una infracción de un vehículo situado entre él y el jefe de pareja. Ha comunicado e identificado el vehículo por radio. ELIGE LA OPCIÓN CORRECTA.","origin":"original","conceptIds":[]},{"id":"s10","topic":"Detenciones en carretera","type":"convencional","options":["Circular por su calzada correcta y mantener seguimiento visual, sin usar señales hasta situarse delante del infractor.","Continuar por la calzada correcta e intentar advertirle a través de la mediana, sin seguirlo por la calzada equivocada.","Acceder por el siguiente enlace a la calzada del infractor y seguirlo con señales de emergencia para que se detenga.","Circular por el arcén de la calzada equivocada a su altura, evitando ocupar los carriles mientras se le dan indicaciones."],"answer":1,"explanation":"La patrulla nunca debe cometer la misma infracción para seguirlo. Debe circular por los carriles habilitados e intentar advertir al conductor; si ello no es posible, el protocolo contempla adelantarse hasta la siguiente salida.","source":{"page":127,"section":"4.2.1. Vehículo oficial en el mismo sentido físico del infractor, por los carriles habilitados","document":"Temario original"},"question":"En una vía desdoblada, una patrulla en vehículo oficial de cuatro ruedas circula correctamente y observa al otro lado de la mediana a un vehículo que avanza en el mismo sentido físico, pero por la calzada equivocada. ¿Qué actuación es conforme al protocolo?","origin":"original","conceptIds":["S092","S093"]},{"id":"s11","topic":"Detenciones en carretera","type":"incorrecta","options":["No debe utilizarse el arma reglamentaria para lograr que el infractor se detenga.","Si se dispone de tiempo y medios, los conos y las luces pueden encauzar al infractor hacia el equipo de bloqueo.","El vehículo oficial debe ocupar el carril izquierdo de la vía para cerrar la trayectoria del infractor.","El vehículo oficial debe permanecer en el sentido correcto de la marcha."],"answer":2,"explanation":"Las normas generales ordenan que el vehículo oficial no cruce ni invada el carril izquierdo. No debe confundirse la ubicación del vehículo oficial con la del equipo de bloqueo no letal.","source":{"page":126,"section":"4. Detención de vehículos en sentido contrario en vías desdobladas: normas generales","document":"Temario original"},"question":"Una patrulla en vehículo oficial de cuatro ruedas actúa ante un vehículo que circula en sentido contrario en una vía desdoblada. ELIGE LA OPCIÓN INCORRECTA.","origin":"original","conceptIds":["T179","T180","T181","S092"]},{"id":"s12","topic":"Detenciones en carretera","type":"convencional","options":["Una en el carril izquierdo y otra en el central para formar un cierre escalonado.","Detrás de la primera fila de vehículos detenidos, con independencia de la posición de los agentes.","En el centro de la calzada, igual que el vehículo oficial de cuatro ruedas.","En el arcén del sentido correcto de la marcha, con la señalización en funcionamiento."],"answer":3,"explanation":"El protocolo diferencia motocicletas y vehículos de cuatro ruedas: las motocicletas no se dejan en el centro de la calzada, sino en el arcén del sentido de la marcha.","source":{"page":129,"section":"4.2.3.2. Motocicletas oficiales de frente al vehículo que circula en sentido contrario","document":"Temario original"},"question":"Una pareja de motoristas interviene de frente ante un vehículo que circula en sentido contrario en una vía desdoblada. Después de detener el tráfico, ¿dónde se dejan las motocicletas durante la actuación descrita por el protocolo?","origin":"original","conceptIds":["S096","S097"]},{"id":"s13","topic":"Detenciones en carretera","type":"correcta","options":["Se sitúa unos 200 metros delante de los detenidos para repetir el alto si el infractor supera al otro agente.","Se sitúa unos 100 metros delante de los vehículos detenidos, mientras el conductor protege la cola con el oficial.","Debe continuar hacia la cola de retención para relevar a la patrulla que ya protege a los vehículos detenidos.","Debe adelantarse unos 400 metros respecto de los vehículos detenidos y dar allí las señales de alto al infractor."],"answer":0,"explanation":"Cuando otra patrulla ya cubre la cola, el ocupante se sitúa unos 200 metros delante de los vehículos detenidos. Los aproximadamente 400 metros corresponden al conductor con el vehículo oficial.","source":{"page":128,"section":"4.2.2.1. Intervención del ocupante del vehículo oficial","document":"Temario original"},"question":"Una patrulla en vehículo oficial de cuatro ruedas detiene el tráfico de una vía desdoblada ante un vehículo que se aproxima en sentido contrario. Otra patrulla ya cubre la cola de retención. ELIGE LA OPCIÓN CORRECTA sobre el ocupante del vehículo oficial.","origin":"original","conceptIds":["T183","S094"]},{"id":"s14","topic":"Detenciones en carretera","type":"convencional","options":["Unos 100 metros detrás, por el arcén y dejando el carril derecho al vehículo auxiliado.","Unos 20 o 25 metros detrás, por el carril derecho y próximos al borde del arcén.","Unos 50 metros detrás, por el carril derecho y próximos al borde del arcén.","Unos 20 o 25 metros delante, por el carril derecho y regulando la marcha del auxiliado."],"answer":1,"explanation":"Para cuatro ruedas se indican aproximadamente 20–25 metros detrás, por el carril derecho y próximos al arcén. Los 50 metros corresponden al jefe de pareja cuando el acompañamiento se realiza con motocicletas.","source":{"page":125,"section":"3.1. Acompañamiento de vehículo con velocidad anormalmente reducida: cuatro ruedas","document":"Temario original"},"question":"Una patrulla en vehículo oficial de cuatro ruedas acompaña hasta una salida segura a un vehículo que circula a velocidad anormalmente reducida por una circunstancia imprevista. No es un transporte especial. ¿Qué posición establece el protocolo?","origin":"original","conceptIds":["T175","S098"]},{"id":"s15","topic":"Detenciones en carretera","type":"incorrecta","options":["El auxiliar utiliza las señales de emergencia y advierte al jefe si un conductor no parece haber percibido las señales.","El jefe de pareja circula por el arcén cuando puede o lo más próximo al borde derecho del carril.","El auxiliar se coloca a unos 100 metros por detrás del vehículo auxiliado.","El jefe de pareja se coloca a unos 50 metros por detrás del vehículo auxiliado."],"answer":2,"explanation":"La referencia de los 100 metros del auxiliar es el jefe de pareja, no el vehículo auxiliado. El jefe, a su vez, circula a unos 50 metros del vehículo lento.","source":{"page":125,"section":"3.2.1 y 3.2.2. Acompañamiento en motocicletas: jefe y auxiliar de pareja","document":"Temario original"},"question":"Una pareja de motoristas acompaña a un vehículo que circula a velocidad anormalmente reducida hasta un lugar seguro, sin tratarse de un transporte especial. ELIGE LA OPCIÓN INCORRECTA sobre el procedimiento de acompañamiento continuo.","origin":"original","conceptIds":["T176","S099"]},{"id":"s16","topic":"Detenciones en carretera","type":"correcta","options":
