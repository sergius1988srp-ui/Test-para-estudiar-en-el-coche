bian o la restringen.","source":{"page":93,"section":"5.3. Dispositivo reforzado ATGC: escalones y funciones","document":"Temario original"},"origin":"complementario","conceptIds":["T154","S061"]},{"id":"c178","topic":"Dispositivos ATGC","type":"convencional","question":"Los dispositivos DINÁMICOS se pueden hacer cuando lo prevean las actas de las reuniones mensuales entre:","options":["Los Jefes de Sector y los Oficiales Jefes de los Subsectores de Tráfico","Jefes Provinciales de Tráfico y Oficiales Jefes de Subsector","El Delegado del Gobierno y el Jefe de la Comandancia","La DGT y el Área de Operaciones de la Agrupación"],"answer":1,"explanation":"Literal: «Los Jefes Provinciales de Tráfico y los Oficiales Jefes de los Subsectores». 5.4.","source":{"page":97,"section":"5.3.4-5.4. Señalización, tráfico calmado y dispositivos dinámicos","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c179","topic":"Dispositivos ATGC","type":"convencional","question":"¿Cuál es la duración mínima y máxima de los dispositivos operativos?","options":["15 minutos y 3 horas","1 hora y 4 horas","15 minutos y 4 horas","30 minutos y 3 horas"],"answer":2,"explanation":"El temario establece esta regla: 15 minutos y 4 horas. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":99,"section":"7-9. Notificación, duración y señalización de dispositivos","document":"Temario original"},"origin":"complementario","conceptIds":["T159","S065"]},{"id":"c180","topic":"Dispositivos ATGC","type":"convencional","question":"Cuando la sorpresa es el elemento esencial de la planificación, se deben potenciar dispositivos:","options":["De larga duración","Reforzados","Dinámicos nocturnos","De corta duración"],"answer":3,"explanation":"El temario establece esta regla: De corta duración. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":99,"section":"7-9. Notificación, duración y señalización de dispositivos","document":"Temario original"},"origin":"complementario","conceptIds":["T157"]},{"id":"c181","topic":"Dispositivos ATGC","type":"correcta","question":"ELIGE LA OPCIÓN CORRECTA. Respecto al ámbito del procedimiento específico de dispositivos ATGC:","options":["Incluye controles de tráfico y transporte y, en su caso, de seguridad ciudadana establecidos por la ATGC.","Excluye todos los dispositivos de seguridad ciudadana sin excepción.","Se aplica solo si no presta apoyo ninguna otra unidad.","Se aplica únicamente a controles de alcohol y drogas."],"answer":0,"explanation":"El apartado de finalidades admite expresamente otros dispositivos de seguridad ciudadana. El QUIZ compartido lo presentaba como una exclusión, pero la enumeración del manual no sustenta esa conclusión.","source":{"page":87,"section":"Procedimiento ATGC: principios y finalidades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c182","topic":"Dispositivos ATGC","type":"convencional","question":"El procedimiento de dispositivos de la ATGC se aplica a los dispositivos establecidos por la Agrupación:","options":["Solo para verificaciones de alcohol y drogas","Con independencia del apoyo de otras unidades","Solo si no participan en ellos otras unidades","Solo en autopistas, autovías y vías multicarril"],"answer":1,"explanation":"4. Tipos según su finalidad.","source":{"page":87,"section":"Procedimiento ATGC: principios y finalidades","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c183","topic":"Dispositivos ATGC","type":"convencional","question":"Los dispositivos para la notificación de infracciones captadas por medios de imagen incluyen:","options":["Las cámaras de los túneles y de los accesos","Los controles de transporte de mercancías","El control de velocidad y la vigilancia con medios aéreos","Solo los radares fijos y de tramo instalados por la DGT en la vía"],"answer":2,"explanation":"Literal: «El control de velocidad y la vigilancia del tráfico mediante medios aéreos». 4.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c184","topic":"Dispositivos ATGC","type":"convencional","question":"¿Dónde, además de vías convencionales de velocidad reducida, puede hacerse un dispositivo reducido?","options":["En la calzada principal de autovía, por el arcén","En túneles con límite específico de 80 km/h","En cualquier arcén de autovía, siempre que haya buena visibilidad","En vías de servicio, cambios de sentido o carriles de 50 km/h"],"answer":3,"explanation":"Literal: «En vías de servicio, cambios de sentido y carriles de aceleración/deceleración con límite específico de 50 km/h». 5.1.1.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T140","S050"]},{"id":"c185","topic":"Dispositivos ATGC","type":"convencional","question":"En las playas de peaje, el dispositivo reducido puede efectuarse:","options":["Tras las cabinas de pago/control","Antes de las cabinas de pago","En las propias cabinas de peaje","No puede efectuarse en peajes"],"answer":0,"explanation":"Literal: «En la zona posterior a las cabinas de pago/control». 5.1.1.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["S050"]},{"id":"c186","topic":"Dispositivos ATGC","type":"convencional","question":"De noche, en un dispositivo reducido, la COTA debe conocer de forma fehaciente:","options":["El número total de vehículos controlados","El inicio, el fin y la geoposición exacta del vehículo","Solo el resultado de las pruebas de alcohol y drogas","El nombre de los conductores que se controlen"],"answer":1,"explanation":"Literal: «El inicio y fin del dispositivo y la geoposición exacta del vehículo». 5.1.1.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T141","S051"]},{"id":"c187","topic":"Dispositivos ATGC","type":"convencional","question":"En el reducido nocturno, deben observarse escrupulosamente las misiones, especialmente las del componente dedicado a:","options":["Las verificaciones","El bloqueo","La protección","La selección"],"answer":2,"explanation":"El temario establece esta regla: La protección. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":88,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["S051"]},{"id":"c188","topic":"Dispositivos ATGC","type":"convencional","question":"¿Qué cambio funcional se produce al pasar de dos a tres integrantes en un dispositivo reducido de la ATGC?","options":["Se elimina la selección de vehículos.","Los tres realizan verificaciones simultáneas y la protección desaparece.","Se crea obligatoriamente un escalón completo de bloqueo y seguimiento.","La protección se asigna específicamente al tercer integrante."],"answer":3,"explanation":"La distribución se corresponde con el número de integrantes de la modalidad indicada. La selección, las verificaciones y la protección conservan funciones diferenciadas; no se suprime la protección para aumentar el ritmo del control.","source":{"page":89,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["S054"]},{"id":"c189","topic":"Dispositivos ATGC","type":"convencional","question":"En un dispositivo reducido de tres integrantes de la ATGC, ¿cómo se reparten las funciones?","options":["Selección, verificaciones y protección a cargo de integrantes distintos.","Selección y protección en uno; los otros dos solo verifican.","Tres verificadores sin selección ni protección específicas.","Un jefe, un bloqueador y un vigilante, sin verificaciones."],"answer":0,"explanation":"La distribución se corresponde con el número de integrantes de la modalidad indicada. La selección, las verificaciones y la protección conservan funciones diferenciadas; no se suprime la protección para aumentar el ritmo del control.","source":{"page":89,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["S054"]},{"id":"c190","topic":"Dispositivos ATGC","type":"convencional","question":"¿Puede el jefe del servicio de un dispositivo reducido intercambiar los cometidos?","options":["Solo si el dispositivo tiene más de tres componentes","Sí, asegurándose de que todos conocen sus funciones","No, los cometidos de cada componente son fijos","Solo con autorización previa de la COTA"],"answer":1,"explanation":"Literal: «Sí, asegurándose de que todos conocen las funciones asignadas». 5.1.2.","source":{"page":89,"section":"5.1. Dispositivo ordinario reducido ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c191","topic":"Dispositivos ATGC","type":"convencional","question":"En el dispositivo ordinario de cuatro integrantes, ¿qué tarea precede al acceso del vehículo a la zona de comprobaciones?","options":["Seguimiento de todo vehículo que atraviese la zona sin resultar seleccionado.","Desmontaje de las señales para evitar aglomeraciones.","Selección y dirección del vehículo mediante las señales reglamentarias de parada.","Instrucción de diligencias de todos los seleccionados antes de detenerlos."],"answer":2,"explanation":"La distribución se corresponde con el número de integrantes de la modalidad indicada. La selección, las verificaciones y la protección conservan funciones diferenciadas; no se suprime la protección para aumentar el ritmo del control.","source":{"page":90,"section":"5.2. Dispositivo operativo ordinario ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T149","S056"]},{"id":"c192","topic":"Dispositivos ATGC","type":"convencional","question":"En el dispositivo ordinario de cuatro integrantes, ¿a quién debe proteger especialmente el integrante dedicado a protección?","options":["Solo a los operadores situados fuera del dispositivo.","Solo al jefe cuando se encuentra dentro del vehículo.","Únicamente a los vehículos que aún no han sido seleccionados.","A quienes interactúan con el ciudadano, sin desatender al resto del dispositivo."],"answer":3,"explanation":"La distribución se corresponde con el número de integrantes de la modalidad indicada. La selección, las verificaciones y la protección conservan funciones diferenciadas; no se suprime la protección para aumentar el ritmo del control.","source":{"page":90,"section":"5.2. Dispositivo operativo ordinario ATGC","document":"Temario original"},"origin":"complementario","conceptIds":["T149","S056"]},{"id":"c193","topic":"Dispositivos ATGC","type":"convencional","question":"¿En qué vías es el dispositivo reforzado el idóneo?","options":["En vías con calzadas separadas (autopistas, autovías, multicarril)","En vías convencionales de un carril por sentido","En travesías urbanas y vías convencionales con límite de 50 km/h o inferior","En caminos rurales y pistas forestales asfaltadas"],"answer":0,"explanation":"Literal: «En vías con calzadas separadas para cada sentido (autopistas, autovías, multicarril) o sus vías de servicio». 5.3.1.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c194","topic":"Dispositivos ATGC","type":"convencional","question":"En los dispositivos reforzados, la máxima que debe primar es:","options":["La rapidez en el montaje y desmontaje","La seguridad vial, de los agentes y de los usuarios","La sorpresa, para lograr la máxima eficacia en los controles","El mayor número posible de controles realizados"],"answer":1,"explanation":"Literal: «La seguridad vial, de los agentes y del resto de usuarios». 5.3.1.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c195","topic":"Dispositivos ATGC","type":"convencional","question":"¿Por qué hay riesgo de alcances en los reforzados en autopista?","options":["Por los cambios de rasante y las curvas de radio reducido del trazado","Por el estrechamiento de los carriles","Por la aglomeración de vehículos y la alta velocidad","Por la falta de iluminación en la calzada"],"answer":2,"explanation":"Literal: «Por la aglomeración de vehículos unida a la velocidad máxima a la que se circula». 5.3.1.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c196","topic":"Dispositivos ATGC","type":"convencional","question":"Antes de comenzar un dispositivo reforzado con apoyo de una empresa de señalización, ¿qué coordinación requiere el responsable?","options":["Esperar a que la empresa monte sin contacto previo y revisar solo al terminar.","Limitar el apoyo al desmontaje porque el montaje corresponde exclusivamente a la empresa.","Sustituir siempre la señalización profesional por el puente de luces de un solo vehículo.","Acordar un punto de reunión para tratar el montaje y desmontaje y prestar el apoyo necesario."],"answer":3,"explanation":"La señalización requiere coordinación previa, incluido un punto de reunión, y apoyo durante montaje, control y desmontaje.","source":{"page":97,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c197","topic":"Dispositivos ATGC","type":"convencional","question":"El dispositivo reforzado debe dedicarse preferentemente a:","options":["Alcohol y drogas, transporte terrestre o velocidad","Controles preventivos de seguridad ciudadana y de documentación","Notificación de infracciones captadas por RPAS","Inspección de la ITV y la documentación"],"answer":0,"explanation":"Literal: «Verificaciones de alcohol y drogas, transporte terrestre o control de velocidad, aislada o combinadamente». 5.3.2.","source":{"page":92,"section":"5.2.3. Personal adicional y 5.3. Dispositivo reforzado ATGC","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c198","topic":"Dispositivos ATGC","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA. Al programar controles combinados en un dispositivo reforzado ATGC:","options":["Puede combinarse alcohol, drogas y transporte con velocidad.","La combinación de acciones permite eliminar los escalones de vigilancia, selección y bloqueo.","Puede combinarse alcohol y drogas con velocidad.","Puede combinarse transporte terrestre con velocidad."],"answer":1,"explanation":"Las combinaciones buscan eficiencia, pero no suprimen la estructura y las funciones de los escalones. Se evita presentar como prohibida una combinación solo por no figurar entre los ejemplos.","source":{"page":93,"section":"5.3. Dispositivo reforzado ATGC: escalones y funciones","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c199","topic":"Dispositivos ATGC","type":"convencional","question":"En los dispositivos dinámicos, el personal uniformado detiene sobre la marcha:","options":["Solo vehículos que cometan excesos de velocidad captados por radar","Todos los vehículos que pasen por el punto","Vehículos al azar o con indicios de alcohol o drogas","Solo vehículos pesados y de transporte"],"answer":2,"explanation":"Literal: «Vehículos de forma aleatoria o con indicios de conducción bajo alcohol o drogas». 5.4.","source":{"page":97,"section":"5.3.4-5.4. Señalización, tráfico calmado y dispositivos dinámicos","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c200","topic":"Dispositivos ATGC","type":"convencional","question":"En los reforzados, la duración se establece:","options":["Siempre en 15 minutos como mínimo, para mantener la sorpresa","Siempre en 4 horas, como duración fija","Según lo que en cada caso indique la COTA","Según los objetivos (dentro del máximo de 4 horas)"],"answer":3,"explanation":"Literal: «De acuerdo con los objetivos perseguidos (siempre dentro del máximo de 4 horas)». 8.","source":{"page":99,"section":"7-9. Notificación, duración y señalización de dispositivos","document":"Temario original"},"origin":"complementario","conceptIds":["T158","S065"]},{"id":"c201","topic":"Detenciones en carretera","type":"convencional","question":"Como criterio general de seguridad, ¿qué debe reunir el lugar elegido para una detención en carretera?","options":["En lugares seguros y visibles, con un agente vigilando el tráfico","En el arcén, lo más cerca posible del vehículo detenido y del tráfico","En el punto que en cada caso indique la COTA","En el carril derecho, con el puente de luces encendido"],"answer":0,"explanation":"Se eligen lugares seguros y con visibilidad y se mantiene vigilancia sobre el tráfico. El protocolo desarrolla además supuestos excepcionales de detención en lugares no seguros; por eso no se formula aquí como una regla sin excepciones.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["S069","S072"]},{"id":"c202","topic":"Detenciones en carretera","type":"convencional","question":"Con carácter general, el vehículo oficial se sitúa respecto de la incidencia:","options":["Junto a la incidencia, en paralelo a ella","En una ubicación previa, en el sentido de la marcha","Delante de la incidencia, para señalizar la salida","En el arcén contrario, frente a la incidencia"],"answer":1,"explanation":"Literal: «En una ubicación previa, siguiendo el sentido de la marcha». 1.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["T160","S074"]},{"id":"c203","topic":"Detenciones en carretera","type":"convencional","question":"¿A qué velocidad se advierte a los conductores que deben ralentizar la marcha al aproximarse a una incidencia?","options":["A no más de 60/70 km/h según la vía","A no más de 20 km/h en todo caso","A no más de 40/50 km/h según las circunstancias","A no más de 30 km/h según las circunstancias"],"answer":2,"explanation":"El temario establece esta regla: A no más de 40/50 km/h según las circunstancias. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["T163"]},{"id":"c204","topic":"Detenciones en carretera","type":"convencional","question":"Según las consideraciones generales de colocación ante una incidencia, ¿qué separación mínima permite mantener el vehículo oficial respecto a ella?","options":["No inferior a 10 metros","No inferior a 50 metros","No inferior a 100 metros","No inferior a 20 metros"],"answer":3,"explanation":"El temario establece esta regla: No inferior a 20 metros. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["T161","T165","S076"]},{"id":"c205","topic":"Detenciones en carretera","type":"convencional","question":"¿Cómo se coloca el vehículo oficial respecto de la calzada?","options":["Semioblicuo, con las ruedas directrices hacia la vía de escape","En paralelo al arcén, con las ruedas totalmente rectas","Perpendicular a la calzada, cortando la circulación","Oblicuo, con las ruedas orientadas hacia el vehículo detenido"],"answer":0,"explanation":"Literal: «De forma semioblicua, con las ruedas del eje directriz orientadas hacia la trayectoria de escape». 1.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["T162","S076"]},{"id":"c206","topic":"Detenciones en carretera","type":"convencional","question":"¿Qué razón operativa explica la separación de seguridad entre el vehículo oficial y la incidencia?","options":["El agente que auxilia debe permanecer en todo caso dentro de la trayectoria de escape del vehículo oficial.","El vehículo oficial puede desplazarse si lo golpea un tercero, pese a su función de protección.","La distancia solo pretende reservar espacio para que una grúa se coloque siempre entre ambos vehículos.","La protección se considera eficaz únicamente si el vehículo oficial queda por delante de la incidencia."],"answer":1,"explanation":"El vehículo oficial protege, pero no está anclado a la vía y puede ser desplazado por una colisión. Por eso se mantiene separación suficiente y los agentes y usuarios permanecen fuera de su trayectoria de escape.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["S074"]},{"id":"c207","topic":"Detenciones en carretera","type":"convencional","question":"El componente que protege debe ser visible y advertir del riesgo desde al menos:","options":["200 metros","20 metros","100 metros","50 metros"],"answer":2,"explanation":"El temario establece esta regla: 100 metros. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":106,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["T166","S078"]},{"id":"c208","topic":"Detenciones en carretera","type":"convencional","question":"En la aproximación general a una incidencia, ¿a qué distancia mínima se detiene inicialmente el vehículo oficial para que descienda el auxiliar?","options":["20 metros","100 metros","30 metros","50 metros"],"answer":3,"explanation":"1. Luego el conductor sigue hasta estacionar a no menos de 20 m.","source":{"page":106,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["T164","S077"]},{"id":"c209","topic":"Detenciones en carretera","type":"convencional","question":"Para detener un vehículo y notificar una infracción, ¿cuándo se activan las señales luminosas y acústicas?","options":["Cuando esté claro el lugar seguro donde detenerlo","Nada más observar la infracción cometida","Justo después de adelantar al vehículo","Solo cuando lo autorice expresamente la COTA tras comunicar la matrícula"],"answer":0,"explanation":"Literal: «Cuando se tenga claro el lugar seguro donde se va a detener». 2.1.","source":{"page":106,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["S070"]},{"id":"c210","topic":"Detenciones en carretera","type":"convencional","question":"¿Dónde se procurará realizar la detención para notificar una infracción?","options":["En los refugios habilitados sobre la calzada","Preferentemente fuera de la vía (explanadas, zonas de descanso…)","En el arcén, que es siempre el lugar más seguro para ambos vehículos","En el carril de deceleración más próximo"],"answer":1,"explanation":"Literal: «Preferentemente fuera de la vía (explanadas, zonas de descanso, de servicio…)». 2.1. Arcenes, carriles de aceleración/deceleración y refugios solo por fuerza mayor.","source":{"page":107,"section":"2.1. Detención para notificar: señales, lugar y protección","document":"Temario original"},"origin":"complementario","conceptIds":["T167","S069"]},{"id":"c211","topic":"Detenciones en carretera","type":"convencional","question":"¿Cuál se considera un lugar NO seguro para detener un vehículo?","options":["Una explanada adyacente","Una zona de servicio","Un carril de aceleración","Un área de descanso"],"answer":2,"explanation":"El temario establece esta regla: Un carril de aceleración. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":107,"section":"2.1. Detención para notificar: señales, lugar y protección","document":"Temario original"},"origin":"complementario","conceptIds":["T168","S069"]},{"id":"c212","topic":"Detenciones en carretera","type":"convencional","question":"Un vehículo policial emite hacia delante una luz roja o amarilla intermitente para ordenar la detención. ¿Dónde debe detenerse el conductor al que se dirige?","options":["Detenerse detrás del vehículo policial, en el arcén","Seguir al vehículo policial hasta un lugar seguro","Ceder el paso al vehículo policial y continuar","Detenerse a la derecha, delante del vehículo policial"],"answer":3,"explanation":"Literal: «Detenerse en el lado derecho, delante del vehículo policial». 2.1.","source":{"page":107,"section":"2.1. Detención para notificar: señales, lugar y protección","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c213","topic":"Detenciones en carretera","type":"convencional","question":"En la detención para notificar, ¿cuál es el momento de mayor riesgo frente a agresiones?","options":["La identificación del conductor","La incorporación del vehículo a la vía","La redacción de la denuncia","El momento de encender las luces"],"answer":0,"explanation":"El temario establece esta regla: La identificación del conductor. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":107,"section":"2.1. Detención para notificar: señales, lugar y protección","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c214","topic":"Detenciones en carretera","type":"convencional","question":"Una patrulla de cuatro ruedas intenta detener a un conductor que no obedece, con conducción agresiva y peligrosa o sospechas delictivas. ¿Cómo procede?","options":["Circular en paralelo para indicarle que pare","Autoprotección, pedir apoyo y seguir desde atrás","Intentar la detención adelantándole desde delante","Abandonar el seguimiento y comunicarlo a la COTA"],"answer":1,"explanation":"Literal: «Extremar la autoprotección, pedir apoyo a otra patrulla y continuar desde atrás». 2.1.1.1, caso 1.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":["T169","S080"]},{"id":"c215","topic":"Detenciones en carretera","type":"convencional","question":"Una patrulla de cuatro ruedas intenta detener a un conductor que no obedece, con conducción peligrosa pero no agresiva. ¿Qué maniobra contempla el protocolo?","options":["Abandonar el seguimiento e informar a la COTA","Circular en paralelo para indicarle que se detenga","Intentar detenerle desde delante, salvo circunstancias en contra","Continuar desde atrás, extremar la autoprotección y solicitar apoyo de otra patrulla"],"answer":2,"explanation":"Literal: «Intentar la detención desde delante, salvo que las circunstancias aconsejen no hacerlo». 2.1.1.1, caso 2.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":["T170","S081"]},{"id":"c216","topic":"Detenciones en carretera","type":"convencional","question":"Una patrulla de cuatro ruedas intenta detener a un conductor que no obedece, sin conducción agresiva ni peligrosa. ¿Desde qué posición sigue intentándolo?","options":["Adelantarle y detenerle desde la posición delantera","Solicitar el apoyo de un helicóptero de tráfico","Desistir del seguimiento y comunicarlo a la COTA","Seguir intentándolo solo desde la posición trasera"],"answer":3,"explanation":"Literal: «Continuar intentando la detención solo desde la posición trasera». 2.1.1.1, caso 3.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":["T171","S082"]},{"id":"c217","topic":"Detenciones en carretera","type":"convencional","question":"En la terminología del protocolo de detenciones, ¿qué formulación define la conducción AGRESIVA?","options":["Intenta huir de la patrulla o atropellar a sus miembros","Pone en riesgo al resto de usuarios o a sí mismo","Supera ampliamente el límite de velocidad de la vía por la que circula","Circula bajo los efectos del alcohol"],"answer":0,"explanation":"2.1.1.1. Peligrosa = pone en riesgo al resto o a sí mismo.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":["T172","S083"]},{"id":"c218","topic":"Detenciones en carretera","type":"convencional","question":"Al intentar detener un vehículo mediante patrulla de cuatro ruedas, ¿cuándo puede mantenerse una posición en paralelo a él?","options":["Permitida solo cuando se patrulla en motocicleta","Prohibida, salvo el tiempo estrictamente necesario para adelantar","Permitida durante el tiempo necesario para dar instrucciones por la ventanilla","Obligatoria antes de iniciar el adelantamiento"],"answer":1,"explanation":"Literal: «No está permitida en ningún caso, salvo el tiempo estrictamente necesario para adelantar». 2.1.1.1.","source":{"page":109,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":["T174","S084"]},{"id":"c219","topic":"Detenciones en carretera","type":"convencional","question":"En el acompañamiento a un vehículo con velocidad anormalmente reducida, el vehículo oficial (4 ruedas) se coloca:","options":["Delante del vehículo lento, abriendo paso","A unos 100 m detrás, por el carril izquierdo","A unos 20–25 m detrás, por el carril derecho","A unos 50 m detrás, circulando por el arcén"],"answer":2,"explanation":"Literal: «A unos 20 o 25 metros detrás, por el carril derecho». 3.1.","source":{"page":125,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":["T175","S098"]},{"id":"c220","topic":"Detenciones en carretera","type":"convencional","question":"Las normas de acompañamiento a vehículos con velocidad anormalmente reducida NO se aplican a:","options":["Los vehículos agrícolas autopropulsados y sus remolques","Los vehículos averiados en la calzada","Los ciclomotores y vehículos de movilidad","Los transportes especiales (protocolo propio)"],"answer":3,"explanation":"Literal: «Los transportes especiales, que tienen su propio protocolo». 3. Normas de general aplicación.","source":{"page":124,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":["T178","S101"]},{"id":"c221","topic":"Detenciones en carretera","type":"convencional","question":"Ante un vehículo en sentido contrario en vía desdoblada, ¿qué está prohibido?","options":["Usar el arma reglamentaria para conseguir la detención","Colocar conos para canalizarlo al carril izquierdo","Detener la circulación en el propio sentido de la marcha","Pedir apoyo a helicópteros"],"answer":0,"explanation":"4. Normas de general aplicación.","source":{"page":126,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":["T180","T181","S092"]},{"id":"c222","topic":"Detenciones en carretera","type":"convencional","question":"Si se dispone de conos y luces, ante un vehículo en sentido contrario se le obliga a circular por:","options":["La mediana, para detenerlo fuera de la calzada y lejos del tráfico","El carril izquierdo, para que pase por el Equipo de Bloqueo","El carril derecho, para alejarlo de la mediana","El arcén, para separarlo de los demás vehículos"],"answer":1,"explanation":"El temario establece esta regla: El carril izquierdo, para que pase por el Equipo de Bloqueo. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":126,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":["T179"]},{"id":"c223","topic":"Detenciones en carretera","type":"convencional","question":"Patrulla circulando frente al vehículo que viene en sentido contrario: el conductor sitúa el vehículo oficial a unos:","options":["100 metros delante de la línea de vehículos detenidos","50 metros delante de la línea de vehículos detenidos","400 metros delante de la línea de vehículos detenidos","200 metros delante de la línea de vehículos detenidos"],"answer":2,"explanation":"4.2.2.2. En el carril central si hay 3 carriles; en el derecho si hay 2.","source":{"page":128,"section":"4. Vehículo en sentido contrario: normas y proceder de la fuerza","document":"Temario original"},"origin":"complementario","conceptIds":["T182","S095"]},{"id":"c224","topic":"Detenciones en carretera","type":"convencional","question":"En una vía desdoblada, una patrulla de cuatro ruedas circula frente a un vehículo que viene en sentido contrario. Otra patrulla ya protege la cola de retención. ¿A qué distancia de la línea detenida se sitúa el ocupante de la primera patrulla?","options":["400 metros delante de los vehículos detenidos","100 metros delante de los vehículos detenidos","50 metros delante de los vehículos detenidos","200 metros delante de los vehículos detenidos"],"answer":3,"explanation":"El temario establece esta regla: 200 metros delante de los vehículos detenidos. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":128,"section":"4. Vehículo en sentido contrario: normas y proceder de la fuerza","document":"Temario original"},"origin":"complementario","conceptIds":["T183","S094"]},{"id":"c225","topic":"Detenciones en carretera","type":"convencional","question":"Una patrulla de cuatro ruedas actúa frente a un vehículo en sentido contrario. Ha desplegado el equipo de bloqueo no letal en el carril izquierdo. ¿A qué distancia por delante del bloqueo hace el conductor las señales de alto?","options":["100 metros delante del equipo de bloqueo","50 metros delante del equipo de bloqueo","200 metros delante del equipo de bloqueo","Justo al lado del equipo de bloqueo"],"answer":0,"explanation":"El temario establece esta regla: 100 metros delante del equipo de bloqueo. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":128,"section":"4. Vehículo en sentido contrario: normas y proceder de la fuerza","document":"Temario original"},"origin":"complementario","conceptIds":["S095"]},{"id":"c226","topic":"Detenciones en carretera","type":"convencional","question":"Un infractor va en sentido contrario por la otra calzada de una vía desdoblada. La patrulla avanza en su mismo sentido geográfico, pero por los carriles correctos. ¿Qué debe hacer?","options":["Se detiene en el arcén y espera instrucciones de la COTA","Nunca le sigue por contrario; intenta avisarle por la mediana","Le sigue por su mismo carril, con las señales prioritarias activadas","Cruza la mediana para cortarle el paso cuanto antes"],"answer":1,"explanation":"Literal: «Nunca le sigue por los carriles contrarios; intenta advertirle a través de la mediana». 4.2.1.","source":{"page":127,"section":"4. Vehículo en sentido contrario: normas y proceder de la fuerza","document":"Temario original"},"origin":"complementario","conceptIds":["S092","S093"]},{"id":"c227","topic":"Detenciones en carretera","type":"convencional","question":"Al realizar una detención en carretera, ¿qué es de máxima importancia?","options":["No retener la circulación","Identificar a todos los ocupantes","Preservar nuestra seguridad personal","Notificar la infracción cuanto antes"],"answer":2,"explanation":"1. Consideraciones generales.","source":{"page":104,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["S068"]},{"id":"c228","topic":"Detenciones en carretera","type":"convencional","question":"En detenciones, al menos un componente de la patrulla debe:","options":["Permanecer dentro del vehículo oficial atendiendo la radio","Mantener una comunicación por radio constante con la COTA durante toda la detención","Regular el tráfico del sentido contrario de circulación","Vigilar siempre los vehículos que se aproximan y ver que le han visto"],"answer":3,"explanation":"Literal: «Observar permanentemente a los vehículos que se aproximan y cerciorarse de que le han visto». 1.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["S072"]},{"id":"c229","topic":"Detenciones en carretera","type":"convencional","question":"Los vehículos oficiales se sitúan preferentemente:","options":["Fuera de la plataforma si se interviene fuera; dentro solo si es seguro","Siempre dentro de la plataforma, para ser más visibles a los conductores que se aproximan","Siempre en el arcén contrario, frente a la incidencia","Siempre delante de la incidencia, señalizando la salida"],"answer":0,"explanation":"Literal: «Fuera de la plataforma si la intervención es fuera; dentro solo cuando ofrezca seguridad». 1.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c230","topic":"Detenciones en carretera","type":"convencional","question":"El vehículo oficial se considera una protección para:","options":["Los vehículos que circulan detrás de la incidencia","Los agentes ya fuera del vehículo y el usuario intervenido","Solo el vehículo detenido y sus ocupantes","Solo los agentes mientras siguen dentro del vehículo oficial con el cinturón"],"answer":1,"explanation":"Literal: «Los agentes una vez fuera del vehículo y para el usuario sobre el que se interviene». 1.","source":{"page":105,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c231","topic":"Detenciones en carretera","type":"convencional","question":"Puesto que los primeros instantes son los de mayor riesgo, al aproximarse a la incidencia el vehículo oficial:","options":["Apaga las luces para no alarmar a los usuarios","Se detiene a 100 m y espera refuerzos","Ralentiza la velocidad de la circulación","Acelera para llegar cuanto antes al lugar"],"answer":2,"explanation":"El temario establece esta regla: Ralentiza la velocidad de la circulación. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":106,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["T164"]},{"id":"c232","topic":"Detenciones en carretera","type":"convencional","question":"¿Por qué la patrulla espera a tener clara la zona segura de detención antes de activar las señales al vehículo al que va a detener?","options":["Para reservar todas las señales al instante en que ambos vehículos ya están detenidos.","Para obligar a circular por el arcén durante todo el trayecto hasta la zona de parada.","Para advertir solo al vehículo identificado, evitando que las señales alerten a quienes circulan detrás.","Para reducir el tiempo de circulación bajo la orden y evitar nerviosismo, una parada inapropiada o maniobras peligrosas."],"answer":3,"explanation":"Si la zona queda lejos, mantener mucho tiempo al vehículo circulando con señales policiales detrás puede poner nervioso al conductor y provocar una detención insegura o una maniobra peligrosa. Las señales también advierten al resto del tráfico.","source":{"page":106,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["S070"]},{"id":"c233","topic":"Detenciones en carretera","type":"convencional","question":"El vehículo a detener deberá estar situado, salvo excepciones:","options":["Delante del vehículo oficial y a la vista","Detrás del vehículo oficial, en el arcén","En paralelo al vehículo oficial","En el arcén contrario, fuera de la vía"],"answer":0,"explanation":"Literal: «Delante del vehículo oficial y a la vista de los agentes». 2.1.","source":{"page":106,"section":"Protocolo de detenciones: consideraciones operativas generales","document":"Temario original"},"origin":"complementario","conceptIds":["S070"]},{"id":"c234","topic":"Detenciones en carretera","type":"convencional","question":"En la detención, el agente que no identifica debe proteger al compañero frente a:","options":["Las quejas de otros conductores","Agresiones de los ocupantes y el tráfico","Solo frente al tráfico que circula por la vía","Solo frente a posibles agresiones"],"answer":1,"explanation":"Literal: «Posibles agresiones de los ocupantes y frente al tráfico». 2.1.","source":{"page":107,"section":"2.1. Detención para notificar: señales, lugar y protección","document":"Temario original"},"origin":"complementario","conceptIds":["S073"]},{"id":"c235","topic":"Detenciones en carretera","type":"convencional","question":"En autopistas y autovías, la detención para notificar se hará en una zona segura porque:","options":["Está prohibido parar en el arcén de esas vías","Lo exige expresamente el RGC","Los vehículos circulan a mayor velocidad","Tienen más carriles por sentido"],"answer":2,"explanation":"El temario establece esta regla: Los vehículos circulan a mayor velocidad. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c236","topic":"Detenciones en carretera","type":"convencional","question":"Según el Protocolo, un conductor puede no detenerse porque:","options":["Siempre porque pretende huir de la patrulla para evitar una sanción","Solo porque no llega a ver las señales luminosas","Solo porque circula bajo los efectos del alcohol","No entiende las señales, no sabe dónde parar o no quiere"],"answer":3,"explanation":"Literal: «No entiende las señales, no sabe dónde detenerse o no quiere hacerlo». 2.1.1.1.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c237","topic":"Detenciones en carretera","type":"convencional","question":"Los tres supuestos de actuación ante un conductor que no se detiene se aplican:","options":["En autovías/autopistas y en convencionales","Solo en autovías y autopistas","Solo en carreteras convencionales","Solo a las patrullas que actúan en motocicleta"],"answer":0,"explanation":"Literal: «Tanto en autovías/autopistas como en carreteras convencionales». 2.1.1.1.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c238","topic":"Detenciones en carretera","type":"convencional","question":"En la terminología del protocolo de detenciones, ¿qué formulación define la conducción PELIGROSA?","options":["Supera la tasa de alcohol permitida","Pone en riesgo al resto de usuarios y/o a sí mismo","Intenta huir de la patrulla circulando a gran velocidad","Intenta atropellar a los agentes actuantes"],"answer":1,"explanation":"Literal: «Pone en riesgo al resto de usuarios de la vía y/o a sí mismo». 2.1.1.1.","source":{"page":108,"section":"2.1.1. Detenciones en autopistas/autovías","document":"Temario original"},"origin":"complementario","conceptIds":["T173","S083"]},{"id":"c239","topic":"Detenciones en carretera","type":"convencional","question":"El acompañamiento a un vehículo con velocidad anormalmente reducida tiene como objetivo:","options":["Denunciarlo por circular demasiado despacio","Inmovilizarlo en el arcén hasta la grúa","Llevarlo a un punto seguro fuera de la vía","Escoltarlo hasta su destino final"],"answer":2,"explanation":"3. Proceder de la fuerza.","source":{"page":124,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c240","topic":"Detenciones en carretera","type":"convencional","question":"En el acompañamiento con vehículo de cuatro ruedas, el vehículo oficial circula:","options":["Por el carril izquierdo, para ser más visible","Por el arcén, detrás del vehículo lento","En paralelo al vehículo lento, por la izquierda","Por el carril derecho, pegado al borde del arcén"],"answer":3,"explanation":"Literal: «Por el carril derecho, lo más cerca posible del borde del arcén». 3.1.","source":{"page":125,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":["T175","S098"]},{"id":"c241","topic":"Detenciones en carretera","type":"convencional","question":"En el acompañamiento, la señal acústica se orienta, cuando sea posible:","options":["Hacia atrás, para advertir a los que se aproximan","Hacia delante, para abrir paso al vehículo lento","Hacia el vehículo acompañado, para guiarlo","No se usa señal acústica en el acompañamiento"],"answer":0,"explanation":"El temario establece esta regla: Hacia atrás, para advertir a los que se aproximan. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":125,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":["T175"]},{"id":"c242","topic":"Detenciones en carretera","type":"convencional","question":"Ante un vehículo en sentido contrario, ¿a quién avisa la COTA si existen indicios racionales de delito?","options":["Al SEPRONA","Al equipo de atestados o al GIAT","Al Juzgado de guardia","A la Policía Judicial de la Comandancia"],"answer":1,"explanation":"El temario establece esta regla: Al equipo de atestados o al GIAT. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":126,"section":"3. Acompañamientos / 4. Vehículo en sentido contrario","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c243","topic":"Detenciones en carretera","type":"convencional","question":"Un vehículo circula en sentido contrario por la otra calzada de una vía desdoblada. La patrulla va en su mismo sentido geográfico por la calzada correcta y no puede advertirle por la mediana. ¿Cómo anticipa la intervención?","options":["Le sigue por el sentido contrario","Abandona la actuación","Se adelanta a la siguiente salida","Cruza la mediana"],"answer":2,"explanation":"El temario establece esta regla: Se adelanta a la siguiente salida. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":127,"section":"4. Vehículo en sentido contrario: normas y proceder de la fuerza","document":"Temario original"},"origin":"complementario","conceptIds":["S093"]},{"id":"c244","topic":"Detenciones en carretera","type":"convencional","question":"Patrulla frente al vehículo en sentido contrario: a los ocupantes de los vehículos detenidos en primera línea se les indica que:","options":["Permanezcan dentro con el cinturón abrochado y las luces de emergencia","Muevan los vehículos hacia el arcén izquierdo, junto a la mediana","Enciendan las luces largas para alertar al infractor que se acerca","Bajen con cruce y emergencia y se aparten fuera de la calzada"],"answer":3,"explanation":"Literal: «Los abandonen con luces de cruce y emergencia encendidas y se coloquen fuera de la calzada o tras las filas siguientes». 4.2.2.","source":{"page":128,"section":"4. Vehículo en sentido contrario: normas y proceder de la fuerza","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c245","topic":"Detenciones en carretera","type":"convencional","question":"Ante un vehículo en sentido contrario, una patrulla de cuatro ruedas se aproxima de frente por el sentido correcto. Ninguna otra patrulla protege la cola de retención. ¿Qué hace el ocupante?","options":["Corta la circulación y pasa a la cola de retención","Se queda junto al vehículo oficial regulando el tráfico","Se coloca unos 400 m delante de los vehículos detenidos","Va al encuentro del infractor por el carril contrario"],"answer":0,"explanation":"Literal: «Detiene la circulación y después pasa a la cola de retención para evitar alcances». 4.2.2.1.","source":{"page":128,"section":"4. Vehículo en sentido contrario: normas y proceder de la fuerza","document":"Temario original"},"origin":"complementario","conceptIds":["T183","S094"]},{"id":"c246","topic":"Nevadas y coordinación","type":"convencional","question":"¿Cuántas fases establece el Protocolo de coordinación AGE?","options":["Cinco, una por cada nivel de circulación","Tres: alerta, preemergencia y emergencia","Cuatro: prealerta, alerta, preemergencia y emergencia","Dos: alerta y emergencia"],"answer":1,"explanation":"El temario establece esta regla: Tres: alerta, preemergencia y emergencia. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":142,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T185","S001"]},{"id":"c247","topic":"Nevadas y coordinación","type":"convencional","question":"¿Quién declara las fases del Protocolo de nevadas?","options":["El Jefe del Subsector de Tráfico de la provincia","La Comunidad Autónoma, a través de protección civil","Las Delegaciones o Subdelegaciones del Gobierno","La Jefatura Provincial de Tráfico correspondiente"],"answer":2,"explanation":"Literal: «Las Delegaciones o, en su caso, Subdelegaciones del Gobierno». 8.","source":{"page":142,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T187","S002"]},{"id":"c248","topic":"Nevadas y coordinación","type":"convencional","question":"Las fases del Protocolo AGE son:","options":["Vinculantes para los planes de las Comunidades Autónomas","Equivalentes a los niveles de los Planes de Protección Civil autonómicos","Declaradas por AEMET según el nivel de aviso emitido","De orden interno, sin predeterminar los Planes de Protección Civil"],"answer":3,"explanation":"Literal: «De exclusivo orden interno y no predeterminan la declaración de los Planes de Protección Civil». 8.","source":{"page":142,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T186","S001"]},{"id":"c249","topic":"Nevadas y coordinación","type":"convencional","question":"La fase de ALERTA se inicia cuando AEMET emite aviso por nevadas de nivel:","options":["Rojo o naranja, o amarillo en áreas metropolitanas","Amarillo, naranja o rojo, en cualquier zona del territorio","Solo rojo, en cualquier zona del territorio","Naranja o rojo, pero nunca amarillo"],"answer":0,"explanation":"Literal: «Rojo o naranja, o amarillo en áreas metropolitanas con grandes núcleos de población». 8.1.","source":{"page":142,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T188","S003"]},{"id":"c250","topic":"Nevadas y coordinación","type":"convencional","question":"La fase de PREEMERGENCIA se produce cuando:","options":["Se acumulan más de 5 cm de nieve en la calzada","Se prevén dificultades para circular o ya las hay en algún tramo","AEMET emite un aviso rojo por nevadas que afecta a la provincia","Hay personas bloqueadas que no pueden seguir viaje"],"answer":1,"explanation":"Literal: «La intensidad de la nevada hace prever dificultades para circular o la nieve/hielo ya dificulta la circulación en algún tramo de la RCE». 8.2.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"origin":"complementario","conceptIds":["T191","S005"]},{"id":"c251","topic":"Nevadas y coordinación","type":"convencional","question":"La fase de EMERGENCIA se alcanza cuando:","options":["Se declara el nivel rojo de circulación en algún tramo de la red estatal","AEMET emite aviso rojo en una zona metropolitana","Hay que atender a personas bloqueadas que no pueden seguir viaje","La carretera supera los 10 cm de nieve acumulada"],"answer":2,"explanation":"Literal: «Es necesario atender a personas bloqueadas o retenidas que no pueden continuar viaje por sus medios». 8.3.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T194","S007"]},{"id":"c252","topic":"Nevadas y coordinación","type":"convencional","question":"¿Qué niveles de circulación corresponden a la fase de ALERTA?","options":["Solo verde","Amarillo y rojo","Blanco y verde","Verde y amarillo"],"answer":3,"explanation":"8.5 Cuadro-resumen.","source":{"page":147,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T190","S012"]},{"id":"c253","topic":"Nevadas y coordinación","type":"convencional","question":"¿Qué nivel de circulación corresponde a la fase de PREEMERGENCIA?","options":["Rojo","Amarillo","Negro","Naranja"],"answer":0,"explanation":"El temario establece esta regla: Rojo. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":147,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T193","S012"]},{"id":"c254","topic":"Nevadas y coordinación","type":"convencional","question":"¿Qué nivel de circulación corresponde a la fase de EMERGENCIA?","options":["Blanco","Negro","Rojo","Naranja"],"answer":1,"explanation":"El temario establece esta regla: Negro. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":147,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T196","S012"]},{"id":"c255","topic":"Nevadas y coordinación","type":"incorrecta","question":"ELIGE LA OPCIÓN INCORRECTA. Respecto a la distinción entre avisos meteorológicos y niveles de circulación del plan de nevadas:","options":["Rojo se asocia a preemergencia en el cuadro.","Negro se asocia a emergencia en el cuadro.","Naranja es uno de los cuatro niveles de circulación que se asocian a las fases en el cuadro del plan.","Verde y amarillo se asocian a la fase de alerta en el cuadro."],"answer":2,"explanation":"El naranja es un nivel de aviso AEMET. El cuadro relaciona verde, amarillo, rojo y negro con las fases; no debe confundirse un aviso con el estado de circulación.","source":{"page":147,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c256","topic":"Nevadas y coordinación","type":"convencional","question":"En nivel VERDE se recomienda una velocidad máxima de:","options":["80 km/h en autovías y 60 km/h en el resto","60 km/h en todo tipo de vías por igual","90 km/h en autovías y 70 km/h en el resto","100 km/h en autovías y 80 km/h en el resto"],"answer":3,"explanation":"Literal: «100 km/h en autopistas y autovías y 80 km/h en el resto». 8.1.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T198","S014"]},{"id":"c257","topic":"Nevadas y coordinación","type":"convencional","question":"En nivel VERDE se valorará restringir la circulación de:","options":["Los vehículos articulados (inestables con poca adherencia)","Todos los vehículos pesados de más de 3.500 kg de masa máxima autorizada","Los autobuses de transporte de viajeros","Las motocicletas y los ciclomotores"],"answer":0,"explanation":"Literal: «Los vehículos articulados, por su inestabilidad con baja adherencia». 8.1.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T199","S014"]},{"id":"c258","topic":"Nevadas y coordinación","type":"convencional","question":"El nivel AMARILLO se da con una acumulación aproximada en calzada de:","options":["Menos de 1 cm, si empieza a nevar","Entre 2 y 5 cm, o menos si ya está deslizante","Entre 5 y 10 cm, o menos si ya hay placas de hielo","Más de 5 cm, aunque no esté deslizante"],"answer":1,"explanation":"Literal: «Entre 2 y 5 cm, o menor si empieza a estar deslizante». 8.1.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T200","S015"]},{"id":"c259","topic":"Nevadas y coordinación","type":"convencional","question":"En nivel AMARILLO se prohíbe circular a una velocidad superior a:","options":["80 km/h","50 km/h","60 km/h","30 km/h"],"answer":2,"explanation":"El temario establece esta regla: 60 km/h. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T202","S016"]},{"id":"c260","topic":"Nevadas y coordinación","type":"convencional","question":"En nivel AMARILLO se prohíbe la circulación de:","options":["Camiones, vehículos articulados y autobuses","Todos los vehículos sin cadenas","Turismos sin neumáticos de invierno","Camiones y vehículos articulados"],"answer":3,"explanation":"8.1. En rojo se añaden los autobuses.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["T201","S016"]},{"id":"c261","topic":"Nevadas y coordinación","type":"convencional","question":"El nivel ROJO se da cuando continúa nevando y se alcanza un espesor en calzada de:","options":["5 cm o más, o menos si nieva intensamente o en tramos largos","Entre 2 y 5 cm, aunque haya dejado de nevar","10 cm o más, con independencia de la intensidad con que esté nevando","1 cm, siempre que haya placas de hielo"],"answer":0,"explanation":"Literal: «5 cm o más, o menor si nieva con intensidad, o la nevada afecta a largos tramos». 8.2.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T205","S018"]},{"id":"c262","topic":"Nevadas y coordinación","type":"convencional","question":"En nivel ROJO se prohíbe circular a una velocidad superior a:","options":["20 km/h","30 km/h","60 km/h","40 km/h"],"answer":1,"explanation":"El temario establece esta regla: 30 km/h. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T208","S019"]},{"id":"c263","topic":"Nevadas y coordinación","type":"convencional","question":"En nivel ROJO, ¿qué es obligatorio para todo tipo de vehículos?","options":["Circular siempre por el carril izquierdo de la calzada","Llevar encendidas las luces antiniebla delanteras","Cadenas o neumáticos de nieve, salvo que se prohíba circular","Circular en convoy detrás de las máquinas quitanieves a velocidad reducida"],"answer":2,"explanation":"Literal: «Cadenas o neumáticos especiales para nieve o hielo, salvo que proceda prohibir directamente la circulación». 8.2.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T206","S019"]},{"id":"c264","topic":"Nevadas y coordinación","type":"convencional","question":"¿Qué medida es propia del nivel ROJO y no del amarillo?","options":["Prohibición de camiones y articulados","Embolsamientos de pesados en zonas acondicionadas","Circulación en convoyes tras quitanieves","Habilitación de un carril libre de emergencia"],"answer":3,"explanation":"El temario establece esta regla: Habilitación de un carril libre de emergencia. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T207","S020"]},{"id":"c265","topic":"Nevadas y coordinación","type":"convencional","question":"El nivel NEGRO significa que la carretera:","options":["Está intransitable, con riesgo de quedar inmovilizado","Solo admite vehículos que lleven las cadenas ya montadas","Está cortada únicamente a vehículos pesados","Tiene más de 10 cm de nieve acumulada"],"answer":0,"explanation":"Literal: «Está intransitable para cualquier tipo de vehículo, con riesgo claro de quedar inmovilizado». 8.3.","source":{"page":147,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["T212","S021"]},{"id":"c266","topic":"Nevadas y coordinación","type":"convencional","question":"Con nieve o hielo, ¿qué obligación recoge el plan para camiones de MMA superior a 3.500 kg, autobuses, autobuses articulados y conjuntos de vehículos?","options":["Elegir entre arcén y carril derecho con adelantamiento permitido.","Circular por el carril derecho sin adelantar ni rebasar.","Circular por cualquier carril sin rebasar 60 km/h.","Usar el carril izquierdo para no impedir el trabajo de las quitanieves."],"answer":1,"explanation":"La regla transversal impone carril derecho y prohíbe adelantamientos y rebasamientos. También contempla baja visibilidad por niebla o viento fuerte; no sustituye otras restricciones.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["S022"]},{"id":"c267","topic":"Nevadas y coordinación","type":"convencional","question":"En la fase de alerta, ¿con quién contacta el Mando del Subsector para que se establezcan controles, cadenas o desvíos?","options":["Con el CECOD de la Comunidad Autónoma","Con la delegación territorial de AEMET","Con el titular de la Jefatura Provincial de Tráfico","Con el titular de la Delegación o Subdelegación del Gobierno"],"answer":2,"explanation":"El temario establece esta regla: Con el titular de la Jefatura Provincial de Tráfico. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":143,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["S009"]},{"id":"c268","topic":"Nevadas y coordinación","type":"convencional","question":"Las restricciones a la circulación se levantarán conforme a las directrices de:","options":["La COTA Central de la Agrupación de Tráfico","El Delegado del Gobierno, según su protocolo","El Jefe del Subsector, dando salida a los vehículos por orden de llegada","El CGT, dando salida primero a quien más tiempo lleva parado"],"answer":3,"explanation":"Literal: «El Centro de Gestión de Tráfico, priorizando la salida escalonada de los vehículos que lleven más tiempo estacionados». 8.2.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"origin":"complementario","conceptIds":["T216","S102"]},{"id":"c269","topic":"Nevadas y coordinación","type":"convencional","question":"¿Cuáles son los dos órganos de coordinación a nivel ESTATAL?","options":["El CECOD y el Centro de Coordinación DGT/ATGC","El CECOP y el Comité Ejecutivo","El CECOD y el CECOP","El CENEM y el Centro Nacional de Gestión de Tráfico"],"answer":0,"explanation":"El temario establece esta regla: El CECOD y el Centro de Coordinación DGT/ATGC. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":139,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T218","S027"]},{"id":"c270","topic":"Nevadas y coordinación","type":"convencional","question":"¿Quién preside el Comité Estatal de Coordinación (CECOD)?","options":["El General Jefe de la Agrupación de Tráfico","El titular de la Subsecretaría del Interior","El Director General de Tráfico","El Ministro del Interior"],"answer":1,"explanation":"5.1. Lo integra, entre otros, el titular de la ATGC.","source":{"page":139,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T219","S027"]},{"id":"c271","topic":"Nevadas y coordinación","type":"convencional","question":"El Centro de Coordinación DGT/ATGC (célula permanente) se constituye cuando:","options":["Lo solicita expresamente la Delegación del Gobierno","Hay vehículos bloqueados durante más de 12 horas","Las nevadas afectan a varias CC. AA. con riesgo relevante","Se declara la fase de alerta en cualquier provincia de la red estatal"],"answer":2,"explanation":"Literal: «Las nevadas alcanzan a varias comunidades autónomas y el riesgo en la movilidad es relevante». 5.2.","source":{"page":139,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T221","S028"]},{"id":"c272","topic":"Nevadas y coordinación","type":"convencional","question":"¿Dónde se reúne la célula permanente DGT/ATGC?","options":["En la Jefatura de la Agrupación de Tráfico","En el CENEM de Protección Civil","En la Delegación del Gobierno","En la Sala de Crisis de la DGT"],"answer":3,"explanation":"Literal: «En la Sala de Crisis de la DGT, apoyada por el Centro Nacional de Gestión de Tráfico». 5.2.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T223"]},{"id":"c273","topic":"Nevadas y coordinación","type":"convencional","question":"¿Cuáles son los órganos de coordinación a nivel TERRITORIAL?","options":["Comité Ejecutivo, CECOP y PMA","CECOD, CECOP y PMA","Comité Ejecutivo y Centro DGT/ATGC","CENEM, CECOP y COTA"],"answer":0,"explanation":"Literal: «Comité Ejecutivo, CECOP y Puestos de Mando Avanzado». 6.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["S029"]},{"id":"c274","topic":"Nevadas y coordinación","type":"convencional","question":"¿Quién preside el Comité Ejecutivo?","options":["El Jefe del Sector de Tráfico de la Agrupación","El titular de la Delegación o Subdelegación del Gobierno","El titular de la Jefatura Provincial de Tráfico de la provincia afectada","El Jefe de la Comandancia de la Guardia Civil"],"answer":1,"explanation":"Literal: «El titular de la Delegación o, en su caso, Subdelegación del Gobierno». 6.1.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T224","S029"]},{"id":"c275","topic":"Nevadas y coordinación","type":"convencional","question":"El Comité Ejecutivo debe convocarse o mantener contacto permanente desde:","options":["La declaración de la fase de emergencia","El primer aviso amarillo emitido por AEMET","La declaración efectiva de la fase de preemergencia","La declaración de la fase de alerta en la provincia"],"answer":2,"explanation":"El temario establece esta regla: La declaración efectiva de la fase de preemergencia. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T225","S029"]},{"id":"c276","topic":"Nevadas y coordinación","type":"convencional","question":"Durante una emergencia por nevadas, ¿qué red de comunicaciones mantiene el CECOP?","options":["Exclusivamente con la COTA, sin comunicación con otros centros.","Solo con AEMET mientras dure el aviso meteorológico.","Únicamente con los servicios de conservación de la provincia.","Con los puestos avanzados, unidades de intervención cuando proceda y el Centro Nacional de Seguimiento y Coordinación de Emergencias."],"answer":3,"explanation":"La dirección territorial mantiene la comunicación operativa con PMA, unidades de intervención y CENEM durante la emergencia.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T226","S030"]},{"id":"c277","topic":"Nevadas y coordinación","type":"convencional","question":"El personal de la ATGC que se integra en los Puestos de Mando Avanzado ostenta la categoría de:","options":["Oficial o Suboficial","Oficial únicamente","Suboficial o cabo","Cualquier empleo con mando de patrulla"],"answer":0,"explanation":"El temario establece esta regla: Oficial o Suboficial. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":140,"section":"5-6. Órganos estatales y territoriales de coordinación por nevadas","document":"Temario original"},"origin":"complementario","conceptIds":["T227","S031"]},{"id":"c278","topic":"Nevadas y coordinación","type":"convencional","question":"¿Quién graba en LINCE las incidencias por nevadas?","options":["La Delegación o Subdelegación del Gobierno","La COTA, en coordinación con el Centro de Gestión","La patrulla actuante desde el lugar de la incidencia","El Centro de Gestión de Tráfico en solitario"],"answer":1,"explanation":"Literal: «La COTA correspondiente, en coordinación con el Centro de Gestión de Tráfico». 12.1.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":["T229","S036"]},{"id":"c279","topic":"Nevadas y coordinación","type":"convencional","question":"¿Qué significan las siglas LINCE?","options":["Localizador Informático de Nevadas y Cortes Estatales","Línea de Incidencias Nacionales de Circulación Española","Localizador de Incidencias en las Carreteras de España","Listado Integrado de Novedades de Carreteras del Estado"],"answer":2,"explanation":"El temario establece esta regla: Localizador de Incidencias en las Carreteras de España. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":["T228","S035"]},{"id":"c280","topic":"Nevadas y coordinación","type":"convencional","question":"En los embolsamientos, en el apartado «observaciones» de LINCE se consigna:","options":["La hora prevista de reapertura","El nombre del responsable del embolsamiento","La matrícula de los vehículos","El número de pesados, ligeros y personas"],"answer":3,"explanation":"El temario establece esta regla: El número de pesados, ligeros y personas. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":["T230","S037"]},{"id":"c281","topic":"Nevadas y coordinación","type":"convencional","question":"Una restricción por nevada se comunica por SIGO al COTA Central cuando su duración prevista sea superior a:","options":["30 minutos","1 hora","15 minutos","2 horas"],"answer":0,"explanation":"El temario establece esta regla: 30 minutos. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":151,"section":"12.1. LINCE / 12.2. Novedades SIGO","document":"Temario original"},"origin":"complementario","conceptIds":["T231","S038"]},{"id":"c282","topic":"Nevadas y coordinación","type":"convencional","question":"En la fase de alerta, ¿qué acción NO corresponde a las unidades de la ATGC?","options":["Contactar con conservación de carreteras e iniciar la apertura de los bypass","Constituir y presidir el CECOP","Analizar con antelación la evolución del fenómeno","Prever el despliegue de la Fuerza y los medios"],"answer":1,"explanation":"8.1. El CECOP lo dirige el Delegado/Subdelegado.","source":{"page":142,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":[]},{"id":"c283","topic":"Nevadas y coordinación","type":"convencional","question":"En zonas de estacionamiento de vialidad invernal sin servicios básicos, en fase de alerta se valorará:","options":["Prohibir su uso mientras dure la fase de alerta en la provincia","Solicitar el apoyo de la UME para atenderlas","Avisar a Protección Civil para asistir a los usuarios","Desalojarlas de inmediato con apoyo de la ATGC"],"answer":2,"explanation":"Literal: «Avisar a los servicios de Protección Civil para asistir a los usuarios». 8.1.","source":{"page":143,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["S009"]},{"id":"c284","topic":"Nevadas y coordinación","type":"convencional","question":"En fase de alerta se prevé restringir los pesados especialmente:","options":["Solo en puertos de montaña de más de 1.000 metros de altitud","Solo en horario nocturno, por la formación de placas de hielo","Solo en autopistas de peaje que dispongan de zonas de embolsamiento para pesados","Antes de pendientes, con tráfico denso, muchos accesos o en áreas metropolitanas"],"answer":3,"explanation":"Literal: «Antes de tramos en pendiente, con circulación densa, múltiples accesos o en áreas metropolitanas». 8.1.","source":{"page":143,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["S009"]},{"id":"c285","topic":"Nevadas y coordinación","type":"convencional","question":"Con nieve que dificulta circular en una autovía con paneles variables, ¿qué mensaje de uso de carriles prevé el plan?","options":["Prohibir adelantar y obligar a circular por el derecho; con tres o más carriles puede usarse también el contiguo, dejando libres los restantes de la izquierda.","Prohibir tanto adelantar como circular por el carril derecho.","Permitir adelantamientos a ligeros por cualquier carril izquierdo.","Reservar el carril derecho exclusivamente a emergencias y quitanieves."],"answer":0,"explanation":"Se señaliza prohibición de adelantar y obligación de circular por el derecho, con el matiz del contiguo cuando hay tres o más. Los restantes carriles izquierdos quedan para emergencias y quitanieves.","source":{"page":144,"section":"8-8.1. Fases del protocolo AGE y fase de alerta","document":"Temario original"},"origin":"complementario","conceptIds":["S023"]},{"id":"c286","topic":"Nevadas y coordinación","type":"convencional","question":"En preemergencia, ¿qué se establece por las unidades de la ATGC?","options":["La declaración formal de la fase de preemergencia","Controles en puntos preestablecidos para las restricciones del JPT","Los Puestos de Mando Avanzado, presididos por el oficial de la ATGC de mayor empleo","El CECOD, junto con la Delegación del Gobierno"],"answer":1,"explanation":"Literal: «Controles en puntos preestablecidos para las restricciones que determine el Jefe Provincial de Tráfico». 8.2.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"origin":"complementario","conceptIds":["S010"]},{"id":"c287","topic":"Nevadas y coordinación","type":"convencional","question":"En preemergencia, la ocupación de los estacionamientos de pesados se planifica:","options":["Por orden de llegada de los vehículos pesados, sin escalonar la ocupación","Solo en las áreas de servicio de las autopistas","Progresiva y escalonada, desde los más próximos al tramo","Empezando por los más alejados del tramo restringido"],"answer":2,"explanation":"Literal: «De forma progresiva y escalonada, empezando por los más próximos al tramo restringido». 8.2.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"origin":"complementario","conceptIds":["S010","S102"]},{"id":"c288","topic":"Nevadas y coordinación","type":"convencional","question":"En preemergencia, en autovías se restringe la circulación por el carril:","options":["El derecho, reservado a las quitanieves","El central, en las vías que tengan tres o más carriles","Todos los carriles de forma inmediata","El de más a la izquierda (prohibido adelantar)"],"answer":3,"explanation":"Literal: «Situado más a la izquierda (prohibición de adelantar)». 8.2.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"origin":"complementario","conceptIds":["S010","S024"]},{"id":"c289","topic":"Nevadas y coordinación","type":"convencional","question":"En preemergencia se valorará solicitar el apoyo de unidades de:","options":["La Agrupación de Reserva y Seguridad","La Unidad Militar de Emergencias","El SEPRONA de la Comandancia","La Policía Nacional de la provincia"],"answer":0,"explanation":"El temario establece esta regla: La Agrupación de Reserva y Seguridad. Esta es la condición del supuesto descrito; las otras alternativas la cambian o la restringen.","source":{"page":145,"section":"8.2. Fase de preemergencia","document":"Temario original"},"origin":"complementario","conceptIds":["S010"]},{"id":"c290","topic":"Nevadas y coordinación","type":"convencional","question":"En la fase de emergencia, los medios de la AGE se ponen a disposición de:","options":["El Jefe del Sector de Tráfico afectado","El órgano de protección civil de la Comunidad Autónoma","La Delegación o Subdelegación del Gobierno","La Dirección General de Tráfico y sus Jefaturas Provinciales"],"answer":1,"explanation":"Literal: «El órgano competente en protección civil de la Comunidad Autónoma». 8.3.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["S011"]},{"id":"c291","topic":"Nevadas y coordinación","type":"convencional","question":"En emergencia, las medidas de atención a los ocupantes comprenden, en general:","options":["Combustible, cadenas y asistencia mecánica en ruta para seguir viaje","Solo información por radio y paneles de mensaje variable","Bebida, comida, ropa de abrigo o traslado a alojamiento u hospital","Solo el traslado a hospitales de los heridos"],"answer":2,"explanation":"Literal: «Bebidas, alimentos y ropa de abrigo, o traslado a alojamiento u hospital». 8.3.","source":{"page":146,"section":"8.3-8.5. Emergencia, código de colores y cuadro de fases","document":"Temario original"},"origin":"complementario","conceptIds":["S011"]},{"id":"c292","topic":"Nevadas y coordinación","type":"convencional","question":"En emergencia, ¿qué equipos pueden usar R
